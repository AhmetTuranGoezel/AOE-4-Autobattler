        // ── Auckland ─────────────────────────────────────────────────────
        {
          // "When building a city, you can count through water spaces, and the
          // terrain difficulty of all spaces adjacent to water is 1."
          const setUp = (s2) => {
            activate(s2, "1,0", { terrain: "water" });
            activate(s2, "2,0", { terrain: "mountain" });   // difficulty 5, beside water
          };
          const plain = csBoard({ setUp });
          plain.me.focusRow = ["industry", "science", "growth", "economy", "military", "culture"];
          assert("a mountain across water is not a legal city space",
            !Game.validCityHexes(plain.st, plain.me.id, Infinity,
              Game.getCityRange(plain.me, plain.st)).has("2,0"));
          const auck = csBoard({ setUp });
          auck.me.focusRow = ["industry", "science", "growth", "economy", "military", "culture"];
          envoy(auck.me, "Auckland");
          assert("Auckland counts through the water and flattens the coast",
            Game.validCityHexes(auck.st, auck.me.id, Infinity,
              Game.getCityRange(auck.me, auck.st)).has("2,0"),
            [...Game.validCityHexes(auck.st, auck.me.id, Infinity,
              Game.getCityRange(auck.me, auck.st))].sort().join(" "));
          const out = Game.tryApplyAction(auck.st, { type: "PLAY_INDUSTRY_CITY",
            payload: { playerId: auck.me.id, hexKey: "2,0" } },
            { actorId: auck.me.id, role: "player" });
          assert("so the city is built there", out.accepted, out.code);
          assert("and it exists", !!out.state.map.hexes["2,0"].city);
          proves("citystate.auckland");
        }

        // ── Akkad ────────────────────────────────────────────────────────
        {
          // "Your armies can move through spaces containing rival control
          // tokens." A corridor, so through means through.
          const setUp = (s2, p2) => {
            const foe = s2.players[1];
            for (let q = -3; q <= 8; q++) {
              [q + ",1", q + ",-1"].forEach((k) => {
                if (s2.map.hexes[k]) s2.map.hexes[k].active = false;
              });
            }
            s2.map.hexes["1,0"].control = { ownerId: foe.id, fortified: false, district: null };
            p2.armies = [{ id: "a1", position: "0,0" }];
          };
          const plain = csBoard({ setUp });
          assert("a rival token stops an ordinary army",
            !Game.getReachable(plain.st, "0,0",
              Game.getMilitaryMove(plain.me, plain.st), "army", plain.me.id).has("2,0"),
            [...Game.getReachable(plain.st, "0,0", 3, "army", plain.me.id)].sort().join(" "));
          const akk = csBoard({ setUp });
          envoy(akk.me, "Akkad");
          assert("Akkad lets it march straight through",
            Game.getReachable(akk.st, "0,0",
              Game.getMilitaryMove(akk.me, akk.st), "army", akk.me.id).has("2,0"),
            [...Game.getReachable(akk.st, "0,0", 3, "army", akk.me.id)].sort().join(" "));
          proves("citystate.akkad");
        }

        // ── Antananarivo ─────────────────────────────────────────────────
        {
          // "During your turn, Antananarivo is treated as one of your cities
          // and not as a city-state. Your armies cannot end their movement in
          // Antananarivo's space."
          const setUp = (s2, p2) => {
            activate(s2, "2,0", { terrain: "grass",
              cityState: { name: "Antananarivo", type: "culture", diplomacyCards: 2 } });
            p2.armies = [{ id: "a1", position: "0,0" }];
            p2.caravans = [{ id: "c1", position: "0,0" }];
          };
          const ant = csBoard({ setUp });
          envoy(ant.me, "Antananarivo");
          assert("it counts as one of my cities, so a control token may sit beside it",
            Game.validControlHexes(ant.st, ant.me.id, 5).has("2,1") ||
            Game.validControlHexes(ant.st, ant.me.id, 5).has("3,0"),
            [...Game.validControlHexes(ant.st, ant.me.id, 5)].sort().join(" "));
          assert("but an army may not end its move there",
            !Game.getReachable(ant.st, "0,0",
              Game.getMilitaryMove(ant.me, ant.st), "army", ant.me.id).has("2,0"),
            [...Game.getReachable(ant.st, "0,0", 3, "army", ant.me.id)].sort().join(" "));
          const plain = csBoard({ setUp });
          assert("without the card it is an ordinary city-state, not my city",
            !Game.validControlHexes(plain.st, plain.me.id, 5).has("3,0"),
            [...Game.validControlHexes(plain.st, plain.me.id, 5)].sort().join(" "));
          proves("citystate.antananarivo");
        }

        // ── Seoul ────────────────────────────────────────────────────────
        {
          // "At the start of your turn, you may move 1 barbarian to an adjacent
          // non-water empty space."
          const setUp = (s2) => {
            activate(s2, "3,0", { terrain: "grass", barbarian: true,
              barbarianId: "S", barbarianToken: "3,0", barbarianHome: "S" });
          };
          const seo = csBoard({ setUp });
          envoy(seo.me, "Seoul");
          Game.syncBarbarianRegistry(seo.st);
          // Play round the table until my turn begins again; the offer belongs
          // to the Seoul holder and arrives at the start of their turn.
          let s2 = seo.st;
          for (let i = 0; i < 4 && !(s2.pendingChoices || [])
            .some((c) => c.kind === "seoul_move_barbarian"); i++) {
            s2 = takeTurn(s2, "seoul_move_barbarian");
          }
          const move = (s2.pendingChoices || [])
            .find((c) => c.kind === "seoul_move_barbarian");
          assert("Seoul offers to move a barbarian at the start of my turn", !!move,
            JSON.stringify((s2.pendingChoices || []).map((c) => c.kind)));
          assert("and the offer is optional, because the card says you may",
            !!move && move.optional === true);
          // The figure marches on its own during the turns played to get here,
          // so pick the option that starts where it actually IS rather than
          // whichever one happens to be first.
          const before = Object.entries(s2.map.hexes)
            .filter(([, h]) => h.barbarian && h.barbarianToken === "3,0").map(([k]) => k)[0];
          const option = (move.options || []).find((o) => o.fromKey === before);
          assert("an offered move starts from where the figure stands", !!option,
            JSON.stringify({ at: before, options: (move.options || []).map((o) => o.label) }));
          const moved = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: seo.me.id, choiceId: move.id, optionId: option.id } });
          const after = Object.entries(moved.map.hexes)
            .filter(([, h]) => h.barbarian && h.barbarianToken === "3,0").map(([k]) => k)[0];
          assert("taking it moves that barbarian one space, to the named space",
            after === option.toKey && after !== before,
            `${before} -> ${after} (wanted ${option.toKey})`);
          assert("and the figure keeps its identity and its home",
            moved.map.hexes[after].barbarianId === "S" &&
            moved.map.hexes[after].barbarianToken === "3,0");
          assert("with the space it left now empty",
            moved.map.hexes[before].barbarian === false);
          proves("citystate.seoul");
        }

        // ── Geneva ───────────────────────────────────────────────────────
        {
          // "At the start of your turn, you may return 1 diplomacy card you
          // have taken from another player. If you do, choose and take a
          // different diplomacy card from that player."
          const gen = csBoard();
          const foe = gen.foe;
          envoy(gen.me, "Geneva");
          gen.me.diplomacy.push({ fromId: foe.id, cardId: "joint_war", name: "Joint War" });
          const options = Game.getPlayer(gen.st, gen.me.id).diplomacy;
          assert("(fixture) I hold a card taken from the rival",
            options.some((d) => d.fromId === foe.id), JSON.stringify(options));
          let s2 = gen.st;
          for (let i = 0; i < 4 && !(s2.pendingChoices || [])
            .some((c) => c.kind === "geneva_return"); i++) {
            s2 = takeTurn(s2, "geneva_return");
          }
          const swap = (s2.pendingChoices || []).find((c) => c.kind === "geneva_return");
          assert("Geneva offers the exchange at the start of my turn", !!swap,
            JSON.stringify((s2.pendingChoices || []).map((c) => c.kind)));
          assert("and it is optional", !!swap && swap.optional === true);
          const returned = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: gen.me.id, choiceId: swap.id,
              optionId: (swap.options || [])[0].id } });
          assert("returning it hands the card back",
            !returned.players[0].diplomacy.some((d) =>
              d.fromId === foe.id && d.cardId === "joint_war"),
            JSON.stringify(returned.players[0].diplomacy));
          // "If you do, CHOOSE and take a different diplomacy card from that
          // player" — a second decision, not an automatic draw.
          const pick = (returned.pendingChoices || [])
            .find((c) => c.kind === "take_diplomacy" && c.playerId === gen.me.id);
          assert("and then asks which different card to take", !!pick,
            JSON.stringify((returned.pendingChoices || []).map((c) => c.kind)));
          assert("without offering the one just handed back",
            !(pick.options || []).some((o) => o.id === "joint_war"),
            JSON.stringify((pick.options || []).map((o) => o.id)));
          const took = Game.applyAction(returned, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: gen.me.id, choiceId: pick.id,
              optionId: (pick.options || [])[0].id } });
          const held = took.players[0].diplomacy.filter((d) => d.fromId === foe.id);
          assert("leaving exactly one card from that rival, a different one",
            held.length === 1 && held[0].cardId !== "joint_war",
            JSON.stringify(held));
          proves("citystate.geneva");
        }

        // ── Brussels / Buenos Aires / Palenque ───────────────────────────
        // These three are driven in the wonder-cost and Palenque blocks above;
        // the assertions there are what these ids stand for. Re-stating them
        // here would be the same test twice, so each is claimed where it runs.
      }

      {
        // The five player-diplomacy cards. Each of them turns on WHO gave it to
        // you, so every one is driven both ways: against the giver and against
        // somebody else.
        const dipBoard = (opts) => {
          const o = opts || {};
          const st = Game.createState(players(3));
          st.phase = "playing"; st.setup.phase = "done";
          st.turn.order = st.players.map((p) => p.id);
          st.turn.index = 0;
          const me = st.players[0];
          me.cardPlayed = false;
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          Game.RESOURCES.forEach((r) => { me.resources[r] = 0; });
          st.players.forEach((p) => { p.diplomacy = []; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.barbarianHome = null; h.control = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 8; q++) {
            activate(st, q + ",0", { terrain: "grass" });
            activate(st, q + ",1", { terrain: "grass" });
            activate(st, q + ",-1", { terrain: "grass" });
          }
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          if (o.setUp) o.setUp(st, me);
          return { st, me, giver: st.players[1], third: st.players[2] };
        };
        const give = (player, cardId, fromId) => {
          player.diplomacy = (player.diplomacy || [])
            .concat([{ fromId, cardId, name: cardId }]);
        };

        // ── Joint War ────────────────────────────────────────────────────
        {
          // "When attacking, increase your combat value by 2 UNLESS you are
          // attacking the player who gave you this card."
          const board = (targetIsGiver) => {
            const { st, me, giver, third } = dipBoard();
            const target = targetIsGiver ? giver : third;
            st.map.hexes["1,0"].control =
              { ownerId: target.id, fortified: false, district: null };
            me.armies = [{ id: "a1", position: "0,0" }];
            return { st, me, target };
          };
          const fight = (st, me) => Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK",
            payload: { playerId: me.id, unitId: "a1", fromKey: "0,0",
              toKey: "1,0", targetType: "control" } });

          const plain = board(false);
          const plainOut = fight(plain.st, plain.me);
          assert("a plain attack opens", !!plainOut.combat);
          const base = plainOut.combat.atkBase;

          const armed = board(false);
          give(armed.me, "joint_war", armed.st.players[1].id);
          const armedOut = fight(armed.st, armed.me);
          assert("Joint War adds 2 when attacking a third player",
            armedOut.combat.atkBase === base + 2,
            `${base} -> ${armedOut.combat.atkBase}`);
          assert("and the breakdown names it",
            (armedOut.combat.atkParts || []).some((p) => /joint war/i.test(p.label)),
            JSON.stringify(armedOut.combat.atkParts));

          const vsGiver = board(true);
          give(vsGiver.me, "joint_war", vsGiver.st.players[1].id);
          const giverOut = fight(vsGiver.st, vsGiver.me);
          assert("but not when attacking the player who gave it",
            giverOut.combat.atkBase === base,
            `${base} -> ${giverOut.combat.atkBase}`);
          proves("diplomacy.joint_war");
        }

        // ── Defensive Pact ───────────────────────────────────────────────
        {
          // "When defending, increase your combat value by 2 UNLESS the player
          // who gave you this card is attacking."
          const { st, me, giver, third } = dipBoard();
          give(me, "defensive_pact", giver.id);
          assert("Defensive Pact adds 2 against a third player",
            Game.getDiplomacyDefenseBonus(st, me.id, third.id) === 2,
            String(Game.getDiplomacyDefenseBonus(st, me.id, third.id)));
          assert("and nothing against the player who gave it",
            Game.getDiplomacyDefenseBonus(st, me.id, giver.id) === 0,
            String(Game.getDiplomacyDefenseBonus(st, me.id, giver.id)));
          // And it reaches a real fight: the third player attacks my token.
          const board = dipBoard();
          give(board.me, "defensive_pact", board.giver.id);
          board.st.map.hexes["1,0"].control =
            { ownerId: board.me.id, fortified: false, district: null };
          board.third.armies = [{ id: "t1", position: "2,0" }];
          board.third.cardPlayed = false;
          board.st.turn.index = board.st.turn.order.indexOf(board.third.id);
          const out = Game.applyAction(board.st, { type: "PLAY_MILITARY_ATTACK",
            payload: { playerId: board.third.id, unitId: "t1", fromKey: "2,0",
              toKey: "1,0", targetType: "control" } });
          assert("the attack on the defended token opens", !!out.combat);
          assert("and the defence includes the pact",
            (out.combat.defParts || []).some((p) => /defensive pact/i.test(p.label)),
            JSON.stringify(out.combat.defParts));
          proves("diplomacy.defensive_pact");
        }

        // ── Non-Aggression Pact ──────────────────────────────────────────
        {
          // The restriction and the return are both driven in the Mass Media /
          // Nuclear Power block; this covers the attack half, which is what the
          // card names first.
          const { st, me, giver, third } = dipBoard();
          give(me, "non_aggression", giver.id);
          assert("a pact forbids attacking the giver's pieces",
            !Game.nonAggressionWith(st, me.id, third.id) &&
            Game.nonAggressionWith(st, me.id, giver.id));
          const board = dipBoard();
          give(board.me, "non_aggression", board.giver.id);
          board.st.map.hexes["1,0"].control =
            { ownerId: board.giver.id, fortified: false, district: null };
          board.me.armies = [{ id: "a1", position: "0,0" }];
          const blocked = Game.tryApplyAction(board.st, { type: "PLAY_MILITARY_ATTACK",
            payload: { playerId: board.me.id, unitId: "a1", fromKey: "0,0",
              toKey: "1,0", targetType: "control" } },
            { actorId: board.me.id, role: "player" });
          assert("so the attack itself is refused", !blocked.accepted, blocked.code);
          assert("and no fight was opened", !blocked.state.combat);

          const other = dipBoard();
          give(other.me, "non_aggression", other.giver.id);
          other.st.map.hexes["1,0"].control =
            { ownerId: other.third.id, fortified: false, district: null };
          other.me.armies = [{ id: "a1", position: "0,0" }];
          const allowed = Game.tryApplyAction(other.st, { type: "PLAY_MILITARY_ATTACK",
            payload: { playerId: other.me.id, unitId: "a1", fromKey: "0,0",
              toKey: "1,0", targetType: "control" } },
            { actorId: other.me.id, role: "player" });
          assert("while a third player may still be attacked",
            allowed.accepted, allowed.code);
          assert("and that fight did open", !!allowed.state.combat);
          proves("diplomacy.non_aggression");
        }

        // ── Embassy ──────────────────────────────────────────────────────
        {
          // "When you move a caravan to the capital of the player who gave you
          // this card ... place 1 trade token on a card in THAT PLAYER'S focus
          // row. Then, gain 1 resource of your choice."
          const { st, me, giver } = dipBoard({ setUp: (s2, p2) => {
            p2.caravans = [{ id: "c1", position: "0,0" }];
            p2.focusRow = ["economy", "science", "growth", "culture", "military", "industry"];
          } });
          give(me, "embassy", giver.id);
          activate(st, "2,0", { city: { ownerId: giver.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          const out = Game.tryApplyAction(st, { type: "PLAY_ECONOMY",
            payload: { playerId: me.id, unitId: "c1", toKey: "2,0", tradeSpent: 0 } },
            { actorId: me.id, role: "player" });
          assert("the caravan reaches the giver's capital", out.accepted, out.code);
          const grant = (out.state.pendingChoices || [])
            .find((c) => /embassy/i.test(c.source || ""));
          assert("Embassy queues its trade grant", !!grant,
            JSON.stringify((out.state.pendingChoices || [])
              .map((c) => c.kind + "/" + c.source)));
          assert("and the token is placed by the GIVER, on their own row",
            grant.playerId === giver.id, `${grant.playerId} vs giver ${giver.id}`);
          const placed = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: giver.id, choiceId: grant.id,
              optionId: (grant.options || [])[0].id } });
          const givenTo = (grant.options || [])[0].id;
          assert("the giver's card really gains it",
            placed.players[1].trade[givenTo] >= 1,
            JSON.stringify(placed.players[1].trade));
          const gain = (placed.pendingChoices || [])
            .find((c) => c.kind === "gain_resource" && c.playerId === me.id);
          assert("then the visitor is offered a resource", !!gain,
            JSON.stringify((placed.pendingChoices || [])
              .map((c) => c.kind + ":" + c.playerId)));
          const took = Game.applyAction(placed, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: me.id, choiceId: gain.id,
              optionId: (gain.options || [])[0].id } });
          const res = (gain.options || [])[0].id;
          assert("and gains it", took.players[0].resources[res] === 1,
            JSON.stringify(took.players[0].resources));
          proves("diplomacy.embassy");
        }

        // ── Open Borders ─────────────────────────────────────────────────
        {
          // "The cities and control tokens of the player who gave you this card
          // are friendly to you for the purposes of your districts' effects and
          // your cities' maturity."
          const { st, me, giver, third } = dipBoard();
          give(me, "open_borders", giver.id);
          // A campus with the giver's control token on a mountain beside it.
          st.map.hexes["1,0"].control =
            { ownerId: me.id, fortified: false, district: "campus" };
          activate(st, "2,0", { terrain: "mountain",
            control: { ownerId: giver.id, fortified: false, district: null } });
          activate(st, "1,1", { terrain: "mountain",
            control: { ownerId: third.id, fortified: false, district: null } });
          Game.resolveEvent(st, "district_event");
          assert("the giver's mountain counts for my campus, a third player's does not",
            st.players[0].trade.science === 1,
            String(st.players[0].trade.science));

          // Maturity: the giver's token on a ring space counts.
          const board = dipBoard();
          give(board.me, "open_borders", board.giver.id);
          Game.hexNeighborKeys(0, 0).forEach((k) => {
            if (board.st.map.hexes[k]) activate(board.st, k, { terrain: "grass",
              control: { ownerId: board.me.id, fortified: false, district: null } });
          });
          board.st.map.hexes["1,0"].control =
            { ownerId: board.giver.id, fortified: false, district: null };
          const settled = Game.applyAction(board.st, { type: "NO_SUCH_ACTION", payload: {} });
          assert("and the giver's ring token keeps my city mature",
            Game.countDeveloped(settled, board.me.id) === 1,
            String(Game.countDeveloped(settled, board.me.id)));
          settled.players[0].diplomacy = [];
          const without = Game.applyAction(settled, { type: "NO_SUCH_ACTION", payload: {} });
          assert("without the card the same token does not",
            Game.countDeveloped(without, board.me.id) === 0,
            String(Game.countDeveloped(without, board.me.id)));
          proves("diplomacy.open_borders");
        }
      }

      {
        // The six government markers. A marker on a focus type makes THAT card
        // resolve a printed number of places further right, and the number is
        // not the same for all six: Communism and Democracy print one arrow,
        // the other four print two.
        //
        // The shift is only worth anything because a card resolving further
        // right actually does more, so each government is driven to a real
        // consequence rather than to getSlotValue: how far the tech dial moves,
        // how much production a wonder gets, what an army's combat value is,
        // and which terrain a placement or a caravan can reach.
        const govBoard = (opts) => {
          const o = opts || {};
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.government = null;
          st.turn.index = st.turn.order.indexOf(me.id);
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          Game.RESOURCES.forEach((r) => { me.resources[r] = 0; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.barbarianHome = null; h.control = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 8; q++) {
            activate(st, q + ",0", { terrain: "grass" });
            activate(st, q + ",1", { terrain: "grass" });
            activate(st, q + ",-1", { terrain: "grass" });
          }
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          if (o.setUp) o.setUp(st, me);
          return { st, me };
        };
        // Adopt a government the way the dial does it: the real event, then the
        // real choice. The card has to be in one of the two "1" places to be
        // eligible, which is itself part of the rule.
        const adopt = (st, me, type) => {
          const row = me.focusRow.filter((t) => t !== type);
          me.focusRow = [type].concat(row);          // into the first "1" place
          Game.resolveEvent(st, "gov_change");
          const choice = (st.pendingChoices || [])
            .find((c) => c.kind === "choose_government" && c.playerId === me.id);
          if (!choice) return { st, choice: null };
          let out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: me.id, choiceId: choice.id, optionId: type } });
          // The dial asks EVERY player, and an unanswered decision blocks the
          // board for everyone. The rivals are not what these tests are about,
          // so answer theirs too rather than leaving the turn jammed.
          for (let i = 0; i < 8; i++) {
            const other = (out.pendingChoices || [])
              .find((c) => c.kind === "choose_government");
            if (!other) break;
            out = Game.applyAction(out, { type: "RESOLVE_PENDING_CHOICE",
              payload: { playerId: other.playerId, choiceId: other.id,
                optionId: (other.options || [])[0].id } });
          }
          return { st: out, choice };
        };
        // Put a card at a chosen place in the row afterwards, so the shift has
        // somewhere to move it to.
        const placeAt = (player, type, index) => {
          const row = player.focusRow.filter((t) => t !== type);
          row.splice(index, 0, type);
          player.focusRow = row;
        };

        // ── The shared mechanics, asserted once ──────────────────────────
        {
          const { st, me } = govBoard();
          me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
          Game.resolveEvent(st, "gov_change");
          const choice = (st.pendingChoices || [])
            .find((c) => c.kind === "choose_government");
          assert("the dial offers a government", !!choice,
            JSON.stringify((st.pendingChoices || []).map((c) => c.kind)));
          const offered = (choice.options || []).map((o) => o.id);
          assert("only the two cards in the '1' places are eligible",
            offered.sort().join(",") === "culture,growth", offered.join(","));
          let taken = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: me.id, choiceId: choice.id, optionId: "culture" } });
          assert("adopting one records it", taken.players[0].government === "culture");
          for (let i = 0; i < 8; i++) {
            const other = (taken.pendingChoices || [])
              .find((c) => c.kind === "choose_government");
            if (!other) break;
            taken = Game.applyAction(taken, { type: "RESOLVE_PENDING_CHOICE",
              payload: { playerId: other.playerId, choiceId: other.id,
                optionId: (other.options || [])[0].id } });
          }
          // One marker at a time.
          taken.players[0].cardPlayed = false;
          placeAt(taken.players[0], "growth", 0);
          Game.resolveEvent(taken, "gov_change");
          const second = (taken.pendingChoices || [])
            .find((c) => c.kind === "choose_government");
          assert("a later dial turn offers a change", !!second);
          assert("and offers to keep the current one",
            (second.options || []).some((o) => o.id === "keep"),
            JSON.stringify((second.options || []).map((o) => o.id)));
          let moved = Game.applyAction(taken, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: me.id, choiceId: second.id, optionId: "growth" } });
          for (let i = 0; i < 8; i++) {
            const other = (moved.pendingChoices || [])
              .find((c) => c.kind === "choose_government");
            if (!other) break;
            moved = Game.applyAction(moved, { type: "RESOLVE_PENDING_CHOICE",
              payload: { playerId: other.playerId, choiceId: other.id,
                optionId: (other.options || [])[0].id } });
          }
          assert("choosing again moves the one marker rather than adding a second",
            moved.players[0].government === "growth",
            String(moved.players[0].government));
          assert("so the old card is no longer shifted",
            Game.getSlotValue(moved.players[0], "culture", moved) ===
            Game.FOCUS_SLOTS[moved.players[0].focusRow.indexOf("culture")],
            String(Game.getSlotValue(moved.players[0], "culture", moved)));
        }
        {
          // Terra p13: the shift is capped at the "5" place.
          const { st, me } = govBoard();
          const { st: gov } = adopt(st, me, "culture");
          placeAt(gov.players[0], "culture", 5);
          assert("a card already in the last place cannot be shifted past it",
            Game.getSlotValue(gov.players[0], "culture", gov) === 5,
            String(Game.getSlotValue(gov.players[0], "culture", gov)));
        }

        // ── Democracy: science, one arrow ────────────────────────────────
        {
          // The dial moves by the slot's number, so a shifted science card
          // moves it further. Two runs from the same starting place.
          const plain = govBoard();
          placeAt(plain.me, "science", 2);
          const beforeSlot = Game.getSlotValue(plain.me, "science", plain.st);
          const plainOut = Game.tryApplyAction(plain.st, { type: "PLAY_SCIENCE",
            payload: { playerId: plain.me.id, tradeSpent: 0 } },
            { actorId: plain.me.id, role: "player" });
          assert("science resolves with no government", plainOut.accepted, plainOut.code);
          const plainMoved = plainOut.state.players[0].tech;

          const demo = govBoard();
          const { st: gov } = adopt(demo.st, demo.me, "science");
          placeAt(gov.players[0], "science", 2);
          gov.players[0].cardPlayed = false;
          const shiftedSlot = Game.getSlotValue(gov.players[0], "science", gov);
          assert("Democracy shifts the science card one place right",
            shiftedSlot === Game.FOCUS_SLOTS[3] && beforeSlot === Game.FOCUS_SLOTS[2],
            `${beforeSlot} -> ${shiftedSlot}`);
          const demoOut = Game.tryApplyAction(gov, { type: "PLAY_SCIENCE",
            payload: { playerId: demo.me.id, tradeSpent: 0 } },
            { actorId: demo.me.id, role: "player" });
          assert("science resolves under Democracy", demoOut.accepted, demoOut.code);
          assert("and the tech dial moves further than it did without it",
            demoOut.state.players[0].tech > plainMoved,
            `${plainMoved} vs ${demoOut.state.players[0].tech}`);
          assert("by exactly the difference between the two slots",
            demoOut.state.players[0].tech - plainMoved === shiftedSlot - beforeSlot,
            `${plainMoved} -> ${demoOut.state.players[0].tech}`);
          proves("government.science");
        }

        // ── Communism: industry, one arrow ───────────────────────────────
        {
          // Wonder production equals the slot's number.
          const plain = govBoard();
          placeAt(plain.me, "industry", 2);
          const name = plain.st.wonderDecks.culture.revealed || "Stonehenge";
          const plainProd = Game.calculateWonderProduction(plain.st, plain.me, name,
            { tradeSpent: 0, resources: {}, naturalWonders: [] });

          const comm = govBoard();
          const { st: gov } = adopt(comm.st, comm.me, "industry");
          placeAt(gov.players[0], "industry", 2);
          const govProd = Game.calculateWonderProduction(gov, gov.players[0], name,
            { tradeSpent: 0, resources: {}, naturalWonders: [] });
          assert("Communism raises the industry card's production",
            govProd.production.base > plainProd.production.base,
            `${plainProd.production.base} -> ${govProd.production.base}`);
          assert("by exactly one place on the row",
            govProd.production.base === Game.FOCUS_SLOTS[3] &&
            plainProd.production.base === Game.FOCUS_SLOTS[2],
            JSON.stringify({ plain: plainProd.production.base, gov: govProd.production.base }));
          proves("government.industry");
        }

        // ── Autocracy: military, two arrows ──────────────────────────────
        {
          // An army's combat value is the slot's number plus the card's bonus,
          // so the shift shows up in a real fight's breakdown.
          const setUpFoe = (s2, p2) => {
            const foe = s2.players[1];
            s2.map.hexes["1,0"].control =
              { ownerId: foe.id, fortified: false, district: null };
            p2.armies = [{ id: "a1", position: "0,0" }];
          };
          const fight = (st, me) => Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK",
            payload: { playerId: me.id, unitId: "a1", fromKey: "0,0",
              toKey: "1,0", targetType: "control" } });

          const plain = govBoard({ setUp: setUpFoe });
          placeAt(plain.me, "military", 2);
          const plainFight = fight(plain.st, plain.me);
          assert("the plain attack opened", !!plainFight.combat);
          const plainBase = plainFight.combat.atkBase;

          const auto = govBoard({ setUp: setUpFoe });
          const { st: gov } = adopt(auto.st, auto.me, "military");
          placeAt(gov.players[0], "military", 2);
          gov.players[0].cardPlayed = false;
          const govFight = fight(gov, auto.me);
          assert("the Autocracy attack opened", !!govFight.combat);
          assert("Autocracy raises the army's combat value",
            govFight.combat.atkBase > plainBase,
            `${plainBase} -> ${govFight.combat.atkBase}`);
          assert("by two places on the row",
            govFight.combat.atkBase - plainBase ===
            Game.FOCUS_SLOTS[4] - Game.FOCUS_SLOTS[2],
            `${plainBase} -> ${govFight.combat.atkBase}`);
          proves("government.military");
        }

        // ── Republic: culture, two arrows ────────────────────────────────
        {
          // A control marker may only go on terrain up to the slot's number, so
          // the shift is what reaches a harder space.
          const hard = (s2) => {
            activate(s2, "1,0", { terrain: "forest" });   // difficulty 3
          };
          const plain = govBoard({ setUp: hard });
          placeAt(plain.me, "culture", 2);
          const plainSlot = Game.getSlotValue(plain.me, "culture", plain.st);
          assert("without a government the forest is out of reach",
            !Game.validControlHexes(plain.st, plain.me.id, plainSlot).has("1,0"),
            String(plainSlot));

          const rep = govBoard({ setUp: hard });
          const { st: gov } = adopt(rep.st, rep.me, "culture");
          placeAt(gov.players[0], "culture", 2);
          gov.players[0].cardPlayed = false;
          const govSlot = Game.getSlotValue(gov.players[0], "culture", gov);
          assert("Republic shifts the culture card two places right",
            govSlot === Game.FOCUS_SLOTS[4], `${plainSlot} -> ${govSlot}`);
          assert("which brings the forest into reach",
            Game.validControlHexes(gov, rep.me.id, govSlot).has("1,0"));
          const out = Game.tryApplyAction(gov, { type: "PLAY_CULTURE",
            payload: { playerId: rep.me.id, hexKeys: ["1,0"], tradeSpent: 0 } },
            { actorId: rep.me.id, role: "player" });
          assert("and the token really goes down on it", out.accepted, out.code);
          assert("on the forest space itself",
            out.state.map.hexes["1,0"].control.ownerId === rep.me.id);
          proves("government.culture");
        }

        // ── Monarchy: growth, two arrows ─────────────────────────────────
        {
          const hard = (s2) => {
            activate(s2, "1,0", { terrain: "forest" });
          };
          const plain = govBoard({ setUp: hard });
          placeAt(plain.me, "growth", 2);
          const plainSlot = Game.getSlotValue(plain.me, "growth", plain.st);
          assert("without a government a district cannot reach the forest",
            !Game.validDistrictHexes(plain.st, plain.me.id, plainSlot).has("1,0"),
            String(plainSlot));

          const mon = govBoard({ setUp: hard });
          const { st: gov } = adopt(mon.st, mon.me, "growth");
          placeAt(gov.players[0], "growth", 2);
          gov.players[0].cardPlayed = false;
          const govSlot = Game.getSlotValue(gov.players[0], "growth", gov);
          assert("Monarchy shifts the growth card two places right",
            govSlot === Game.FOCUS_SLOTS[4], `${plainSlot} -> ${govSlot}`);
          const out = Game.tryApplyAction(gov, { type: "PLAY_GROWTH_DISTRICT",
            payload: { playerId: mon.me.id, district: "campus",
              hexKey: "1,0", tradeSpent: 0 } },
            { actorId: mon.me.id, role: "player" });
          assert("so the district can be placed on the forest", out.accepted, out.code);
          assert("and it is there",
            out.state.map.hexes["1,0"].control.district === "campus");
          proves("government.growth");
        }

        // ── Oligarchy: economy, two arrows ───────────────────────────────
        {
          // A caravan may cross terrain up to the economy card's slot number.
          const hard = (s2, p2) => {
            activate(s2, "1,0", { terrain: "forest" });
            p2.caravans = [{ id: "c1", position: "0,0" }];
          };
          const plain = govBoard({ setUp: hard });
          placeAt(plain.me, "economy", 2);
          assert("without a government the caravan cannot enter the forest",
            !Game.getReachable(plain.st, "0,0",
              Game.getEconomyMove(plain.me, plain.st), "caravan", plain.me.id).has("1,0"),
            String(Game.getSlotValue(plain.me, "economy", plain.st)));

          const olig = govBoard({ setUp: hard });
          const { st: gov } = adopt(olig.st, olig.me, "economy");
          placeAt(gov.players[0], "economy", 2);
          gov.players[0].cardPlayed = false;
          assert("Oligarchy shifts the economy card two places right",
            Game.getSlotValue(gov.players[0], "economy", gov) === Game.FOCUS_SLOTS[4],
            String(Game.getSlotValue(gov.players[0], "economy", gov)));
          assert("which lets the caravan into the forest",
            Game.getReachable(gov, "0,0",
              Game.getEconomyMove(gov.players[0], gov), "caravan", olig.me.id).has("1,0"));
          const out = Game.tryApplyAction(gov, { type: "PLAY_ECONOMY",
            payload: { playerId: olig.me.id, unitId: "c1",
              toKey: "1,0", tradeSpent: 0 } },
            { actorId: olig.me.id, role: "player" });
          assert("and it really moves there", out.accepted, out.code);
          assert("standing on the forest",
            out.state.players[0].caravans[0].position === "1,0",
            String(out.state.players[0].caravans[0].position));
          proves("government.economy");
        }
      }

      {
        // The four printed industry cards. Each is "build a wonder with this
        // much production, OR build a city within this far of a friendly
        // space", and the reach, the production and the extra clauses differ.
        const indBoard = (tier, opts) => {
          const o = opts || {};
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.cardTiers.industry = tier;
          me.cardLevels.industry = tier;
          me.focusRow = ["industry", "science", "growth", "economy", "military", "culture"];
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          Game.RESOURCES.forEach((r) => { me.resources[r] = 0; });
          st.turn.index = st.turn.order.indexOf(me.id);
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.barbarianHome = null; h.control = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 10; q++) {
            activate(st, q + ",0", { terrain: "grass" });
            activate(st, q + ",1", { terrain: "grass" });
            activate(st, q + ",-1", { terrain: "grass" });
          }
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          if (o.setUp) o.setUp(st, me);
          return { st, me };
        };
        const buildCity = (st, me, hexKey, extra) => Game.tryApplyAction(st,
          { type: "PLAY_INDUSTRY_CITY",
            payload: Object.assign({ playerId: me.id, hexKey }, extra || {}) },
          { actorId: me.id, role: "player" });
        // How far a city may be founded from a friendly space, measured by
        // asking the engine which spaces it will accept.
        const cityReach = (st, me) => {
          const spots = [...Game.validCityHexes(st, me.id, Infinity, Game.getCityRange(me, st))];
          return spots.reduce((max, k) => Math.max(max,
            Game.hexDist(st.map.hexes[k], st.map.hexes["0,0"])), 0);
        };

        // ── Pottery ──────────────────────────────────────────────────────
        {
          // "Build 1 world wonder. Your production equals this slot's number.
          // Or, build 1 city ... within 2 spaces of a friendly space."
          const { st, me } = indBoard(1);
          assert("Pottery is the level-I industry card",
            Game.getCardName(me, "industry") === "Pottery", Game.getCardName(me, "industry"));
          const slot = Game.getSlotValue(me, "industry", st);
          assert("a city may be founded two spaces from a friendly space",
            Game.getCityRange(me, st) === 2, String(Game.getCityRange(me, st)));
          assert("and no further", cityReach(st, me) <= 2, String(cityReach(st, me)));
          const out = buildCity(st, me, "2,0");
          assert("so a city two spaces out is built", out.accepted, out.code);
          assert("and it is there",
            !!out.state.map.hexes["2,0"].city &&
            out.state.map.hexes["2,0"].city.ownerId === me.id);
          const far = buildCity(indBoard(1).st, me, "4,0");
          assert("one four spaces out is refused", !far.accepted, far.code);
          // The wonder half: production is the slot's number.
          const wonderSt = indBoard(1).st;
          const wonderMe = wonderSt.players[0];
          const preview = Game.calculateWonderProduction(wonderSt, wonderMe,
            wonderSt.wonderDecks.culture.revealed || "Stonehenge",
            { tradeSpent: 0, resources: {}, naturalWonders: [] });
          assert("wonder production starts from the slot's number",
            preview.production && preview.production.base === slot,
            JSON.stringify(preview.production));
        }
        proves("standard.industry.pottery");

        // ── Animal Husbandry ─────────────────────────────────────────────
        {
          // "...Or, build 1 city on a legal space containing a friendly caravan
          // or army, then return that figure to its focus card."
          const { st, me } = indBoard(2, { setUp: (s2, p2) => {
            p2.armies = [{ id: "a1", position: "6,0" }];
          } });
          assert("Animal Husbandry reaches three spaces",
            Game.getCityRange(me, st) === 3, String(Game.getCityRange(me, st)));
          assert("6,0 is out of ordinary reach",
            !Game.validCityHexes(st, me.id, Infinity, Game.getCityRange(me, st)).has("6,0"));
          const out = buildCity(st, me, "6,0", { useFigure: true, figureId: "a1" });
          assert("but a city may be founded on a friendly figure however far out",
            out.accepted, out.code);
          assert("the city is built there",
            !!out.state.map.hexes["6,0"].city &&
            out.state.map.hexes["6,0"].city.ownerId === me.id);
          assert("and the figure goes back to its focus card",
            out.state.players[0].armies[0].position === null,
            String(out.state.players[0].armies[0].position));
        }
        {
          const { st, me } = indBoard(2);
          const out = buildCity(st, me, "6,0", { useFigure: true, figureId: "a1" });
          assert("with no figure there the option is refused",
            !out.accepted, out.code);
        }
        proves("standard.industry.animal_husbandry");

        // ── Nationalism ──────────────────────────────────────────────────
        {
          // "...your production equals this slot's number, OR, IF THIS CARD IS
          // IN THE FIFTH SLOT, your production equals 7." And the city half
          // reaches four spaces, counting through water.
          const { st, me } = indBoard(3);
          assert("Nationalism reaches four spaces",
            Game.getCityRange(me, st) === 4, String(Game.getCityRange(me, st)));
          const slot = Game.getSlotValue(me, "industry", st);
          const name = st.wonderDecks.culture.revealed || "Stonehenge";
          const low = Game.calculateWonderProduction(st, me, name,
            { tradeSpent: 0, resources: {}, naturalWonders: [] });
          assert("from an ordinary slot production is that slot's number",
            low.production && low.production.base === slot,
            JSON.stringify(low.production));
        }
        {
          const { st, me } = indBoard(3);
          me.focusRow = ["science", "growth", "economy", "military", "culture", "industry"];
          assert("(fixture) industry is now the fifth slot",
            Game.getSlotValue(me, "industry", st) === 5,
            String(Game.getSlotValue(me, "industry", st)));
          const name = st.wonderDecks.culture.revealed || "Stonehenge";
          const high = Game.calculateWonderProduction(st, me, name,
            { tradeSpent: 0, resources: {}, naturalWonders: [] });
          assert("but from the fifth slot it is 7, not 5",
            high.production && high.production.base === 7 && high.production.slot === 5,
            JSON.stringify(high.production));
        }
        {
          // "You can count through water."
          const { st, me } = indBoard(3, { setUp: (s2) => {
            for (let q = 1; q <= 3; q++) activate(s2, q + ",0", { terrain: "water" });
          } });
          assert("a city can still be founded past water",
            Game.validCityHexes(st, me.id, Infinity, Game.getCityRange(me, st)).has("4,0"),
            [...Game.validCityHexes(st, me.id, Infinity, Game.getCityRange(me, st))].sort().join(" "));
        }
        proves("standard.industry.nationalism");

        // ── Urbanization ─────────────────────────────────────────────────
        {
          // "...within 5 spaces ... you can count through water. THEN, if you
          // built a city, place UP TO 2 control tokens adjacent to that city."
          const { st, me } = indBoard(4);
          assert("Urbanization reaches five spaces",
            Game.getCityRange(me, st) === 5, String(Game.getCityRange(me, st)));
          const out = buildCity(st, me, "5,0");
          assert("a city five spaces out is built", out.accepted, out.code);
          const place = (out.state.pendingChoices || [])
            .find((c) => c.kind === "place_control" && c.source === "Urbanization");
          assert("then it offers control tokens beside the new city", !!place,
            JSON.stringify((out.state.pendingChoices || []).map((c) => c.source)));
          assert("the offer is optional, because the card says up to 2",
            place.optional === true);
          assert("and every space offered touches the new city",
            place.hexKeys.every((k) => Game.hexNeighborKeys(5, 0).includes(k)),
            place.hexKeys.join(" "));
          const first = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: me.id, choiceId: place.id, hexKey: place.hexKeys[0] } });
          const second = (first.pendingChoices || [])
            .find((c) => c.kind === "place_control" && c.source === "Urbanization");
          assert("taking one offers the second", !!second);
          // Take the copy for the other branch NOW: applyAction edits in place,
          // so cloning after `both` would clone a state that already has two.
          const beforeSecond = JSON.parse(JSON.stringify(first));
          const both = Game.applyAction(first, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: me.id, choiceId: second.id, hexKey: second.hexKeys[0] } });
          assert("taking both gives exactly two tokens and no third offer",
            Game.countControl(both, me.id) === 2 &&
            !(both.pendingChoices || []).some((c) => c.source === "Urbanization"),
            String(Game.countControl(both, me.id)));
          const stopped = Game.applyAction(beforeSecond,
            { type: "RESOLVE_PENDING_CHOICE", payload: {
              playerId: me.id, choiceId: second.id, dismiss: true } });
          assert("or stopping after one leaves exactly one",
            Game.countControl(stopped, me.id) === 1,
            String(Game.countControl(stopped, me.id)));
        }
        proves("standard.industry.urbanization");
      }

      {
        // The four printed military cards. All four move every army and set a
        // combat value; the distance, the terrain, what they may pass through
        // and the bonus are what differ. The combat values are read off a real
        // fight's breakdown rather than from a getter.
        const milBoard = (tier, opts) => {
          const o = opts || {};
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.cardTiers.military = tier;
          me.cardLevels.military = tier;
          me.focusRow = ["military", "science", "growth", "economy", "industry", "culture"];
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          st.turn.index = st.turn.order.indexOf(me.id);
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.barbarianHome = null; h.control = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 9; q++) {
            activate(st, q + ",0", { terrain: "grass" });
            // A corridor board leaves the flanks off the map, so a space

      {

        {

      {
        // Petra: "When defending, +2 combat value. Barbarians cannot move into

        //

        // implemented; these drive it, so the record can say so on evidence
        // rather than on a reading of the code.
        const petraBoard = (withPetra) => {
          const st = rulesState();
          const me = st.players[0];
          for (let q = -2; q <= 8; q++) {
            activate(st, q + ",0", { terrain: "grass" });
            activate(st, q + ",1", { terrain: "grass" });
            activate(st, q + ",-1", { terrain: "grass" });
          }
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null;
            h.barbarianToken = null; h.barbarianHome = null;

          st.barbarians = {};
          // The wonder lives in a city far from the lane, so what is being
          // tested is the protection, not the city that happens to hold it.
          activate(st, "0,1", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: !!withPetra,
            wonder: withPetra ? { name: "Petra" } : null } });
          activate(st, "3,0", { terrain: "grass", barbarian: true,
            barbarianId: "P", barbarianToken: "3,0", barbarianHome: "P" });
          Game.syncBarbarianRegistry(st);
          return { st, me };

        // The march is one die for every barbarian, so roll until it goes east.
        const marchEast = (base) => {
          for (let i = 0; i < 500; i++) {
            const attempt = JSON.parse(JSON.stringify(base));
            Game.resolveEvent(attempt, "barbarian_move");
            if (attempt.barbarianMove && attempt.barbarianMove.roll === 2) return attempt;
          }
          return null;

            developed: false, hasWonder: false, wonder: null } });
          const out = marchEast(st);
          assert("the march rolled east", !!out);
          if (out) {
            assert("the barbarian did not enter the protected city",
              out.map.hexes["4,0"].barbarian === false &&
              !!out.map.hexes["4,0"].city, JSON.stringify(out.map.hexes["4,0"].city));
            assert("it went the opposite way instead",
              out.map.hexes["2,0"].barbarian === true,
              JSON.stringify(Object.entries(out.map.hexes)
                .filter(([, h]) => h.barbarian).map(([k]) => k)));
            assert("and it is still the same figure",
              out.map.hexes["2,0"].barbarianId === "P" &&
              out.map.hexes["2,0"].barbarianToken === "3,0");
            assert("the log says Petra turned it away",
              out.log.some((line) => /Petra turned a barbarian away/.test(line)),

          const out = marchEast(st);
          assert("(reinforced) the march rolled east", !!out);
          if (out) {
            assert("the barbarian did not reach the reinforced token",
              out.map.hexes["4,0"].barbarian === false);
            assert("and the token was not even battered - it was never entered",
              !!out.map.hexes["4,0"].control &&
              out.map.hexes["4,0"].control.fortified === true,

            assert("the barbarian turned back instead",
              out.map.hexes["2,0"].barbarian === true);
          }
        }
        {
          // An UNREINFORCED token is not protected: Petra names cities and
          // reinforced tokens, and this is neither.
          const { st, me } = petraBoard(true);
          activate(st, "4,0", { terrain: "grass",
            control: { ownerId: me.id, fortified: false, district: null } });
          const out = marchEast(st);
          assert("(unreinforced) the march rolled east", !!out);
          if (out) {
            assert("the barbarian advances onto it as normal",
              out.map.hexes["4,0"].barbarian === true,
              JSON.stringify(Object.entries(out.map.hexes)
                .filter(([, h]) => h.barbarian).map(([k]) => k)));

              out.map.hexes["4,0"].control === null);

        }

            assert("and razes the city", out.map.hexes["4,0"].city === null);

        {

          const st = rulesState();
          const me = st.players[0];

            developed: false, hasWonder: true, wonder: { name: "Petra" } } });
          // The bonus is asked for a space, because several defence wonders

      {

      {

        // sits there it pays for that card like a trade token on it. Spending
        // does not consume it - natural wonder tokens are exhausted for the

        const cardChoice = (st) => (st.pendingChoices || [])

          // is where the later science tests want the row anyway.

            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;

            if (h.resource === "wonder") h.resource = null;

            naturalWonder: "Mt Kilimanjaro", naturalWonderSpace: "Mt Kilimanjaro" });

            playerId: me.id, hexKeys: ["1,0"], tradeSpent: 0 } },
            { actorId: me.id, role: "player" });

          if (!claimed.accepted) return { state: st, ask: null };
          const ask = cardChoice(claimed.state);

          const placed = Game.applyAction(claimed.state, { type: "RESOLVE_PENDING_CHOICE",

          assert("it names the token being placed",

          assert("the card was not driven negative",

          const player = state.players[0];
          player.cardPlayed = false;

          deck.revealed = "Jebel Barkal";

          const { st, me } = americaBoard();

          state.map.hexes["1,0"].control =
            { ownerId: state.players[1].id, fortified: false, district: null };

      {

        // the engine now spends from it through one function rather than seven

        // The NUMBER is blocked: how many control tokens an English base set
        // gives a player, and how many Terra adds, is a component count and not
        // something the rules text or the tile data can settle. CFG.controlTokens
        // is therefore Infinity, which is the behaviour this engine has always
        // had. Everything else about the supply is implemented, so these drive
        // it with the limit set explicitly - which is also how a fixture would
        // have to work even once the real number is known.
        const withLimit = (n) => {
          const st = rulesState();
          const me = st.players[0];
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.barbarianHome = null; h.control = null;

          for (let q = 0; q <= 6; q++) {

            activate(st, q + ",1", { terrain: "grass" });
          }
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          Game.CFG.controlTokens = n;
          return { st, me };
        };
        const restore = () => { Game.CFG.controlTokens = Infinity; };
        const controlAt = (st, k) => st.map.hexes[k].control;
        const placeChoice = (st, me, hexKeys) => {
          st.pendingChoices.push({ id: "pc", kind: "place_control", playerId: me.id,

            const { st, me } = withLimit(2);

            const first = Game.applyAction(placeChoice(st, me, ["1,0"]),
              { type: "RESOLVE_PENDING_CHOICE", payload: {
                playerId: me.id, choiceId: "pc", hexKey: "1,0" } });
            assert("placing one spends one",
              !!controlAt(first, "1,0") &&
              Game.controlTokensInSupply(first, me.id) === 1,
              String(Game.controlTokensInSupply(first, me.id)));
            const second = Game.applyAction(placeChoice(first, me, ["2,0"]),
              { type: "RESOLVE_PENDING_CHOICE", payload: {
                playerId: me.id, choiceId: "pc", hexKey: "2,0" } });
            assert("placing the second empties the supply",
              Game.controlTokensInSupply(second, me.id) === 0);
            assert("and both are on the board",
              !!controlAt(second, "1,0") && !!controlAt(second, "2,0"));
          }
          {
            // The rule that makes an empty supply a cost rather than a wall:
            // you take one of your own back off the map and place that one.
            const { st, me } = withLimit(2);
            let s2 = Game.applyAction(placeChoice(st, me, ["1,0"]),
              { type: "RESOLVE_PENDING_CHOICE", payload: {
                playerId: me.id, choiceId: "pc", hexKey: "1,0" } });
            s2 = Game.applyAction(placeChoice(s2, me, ["2,0"]),
              { type: "RESOLVE_PENDING_CHOICE", payload: {
                playerId: me.id, choiceId: "pc", hexKey: "2,0" } });
            assert("the supply is empty before the third placement",
              Game.controlTokensInSupply(s2, me.id) === 0);
            assert("but two of their tokens are on the map to take back",
              Game.reclaimableControlHexes(s2, me.id).sort().join(",") === "1,0,2,0",

            const third = Game.applyAction(placeChoice(s2, me, ["3,0"]),
              { type: "RESOLVE_PENDING_CHOICE", payload: {
                playerId: me.id, choiceId: "pc", hexKey: "3,0" } });
            assert("an empty supply does NOT make the placement illegal",
              !!controlAt(third, "3,0"), JSON.stringify(controlAt(third, "3,0")));
            const onMap = Game.controlTokensOnMap(third, me.id);
            assert("the player still has exactly their two tokens on the board",
              onMap === 2, String(onMap));
            assert("because one was taken back off the map to pay for it",
              [controlAt(third, "1,0"), controlAt(third, "2,0")].filter(Boolean).length === 1,
              JSON.stringify([controlAt(third, "1,0"), controlAt(third, "2,0")]));
            assert("and the supply is still empty, not negative",
              Game.controlTokensInSupply(third, me.id) === 0);
          }

            // a control token - and the token it replaces comes back.
            const { st, me } = withLimit(3);
            me.focusRow = ["growth", "science", "culture", "economy", "military", "industry"];
            me.cardPlayed = false;
            const seeded = Game.applyAction(placeChoice(st, me, ["1,0"]),

                playerId: me.id, choiceId: "pc", hexKey: "1,0" } });
            assert("one plain token is out", Game.controlTokensInSupply(seeded, me.id) === 2);
            const built = Game.tryApplyAction(seeded, { type: "PLAY_GROWTH_DISTRICT",
              payload: { playerId: me.id, district: "campus", hexKey: "1,0", tradeSpent: 0 } },
              { actorId: me.id, role: "player" });
            assert("a district can be built over that token", built.accepted, built.code);
            assert("the space now holds the district piece",
              built.state.map.hexes["1,0"].control.district === "campus");
            assert("and the control token it replaced is back in supply",
              Game.controlTokensInSupply(built.state, me.id) === 3,
              String(Game.controlTokensInSupply(built.state, me.id)));
            assert("a district is not counted as a control token in hand",
              Game.controlTokensOnMap(built.state, me.id) === 0);

          {

            const { st, me } = withLimit(2);
            const s2 = Game.applyAction(placeChoice(st, me, ["1,0"]),
              { type: "RESOLVE_PENDING_CHOICE", payload: {
                playerId: me.id, choiceId: "pc", hexKey: "1,0" } });
            assert("one is spent", Game.controlTokensInSupply(s2, me.id) === 1);
            s2.map.hexes["1,0"].control = null;                 // destroyed
            const after = Game.applyAction(s2, { type: "NO_SUCH_ACTION", payload: {} });
            assert("a destroyed token returns to its owner's supply",
              Game.controlTokensInSupply(after, me.id) === 2);

              { ownerId: foe.id, fortified: false, district: null };

            const taken = Game.applyAction(placeChoice(st, me, ["1,0"]),
