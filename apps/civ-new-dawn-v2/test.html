          // which is what marks the token as still standing there.
          const nwKeys = Object.entries(st.map.hexes)
            .filter(([, h]) => h.active && h.naturalWonderSpace && h.naturalWonder)
            .map(([k]) => k);
          assert("an unclaimed natural wonder space advertises its token",
            nwKeys.every((k) => st.map.hexes[k].resource === "wonder"),
            JSON.stringify(nwKeys.slice(0, 4).map((k) => [k, st.map.hexes[k].resource])));
          assert("and every natural wonder on the board has a known resource",
            nwKeys.every((k) =>
              !!Game.NATURAL_WONDER_RESOURCES[st.map.hexes[k].naturalWonderSpace]),
            JSON.stringify(nwKeys.map((k) => st.map.hexes[k].naturalWonderSpace)));
        }

        // ── The world wonder deck, including the removal step ────────────
        {
          const st = rulesState();
          assert("the pool is the full 36 printed wonders",
            Game.ALL_WONDERS.length === 36, String(Game.ALL_WONDERS.length));
          const byType = {};
          Game.ALL_WONDERS.forEach((w) => { byType[w.type] = (byType[w.type] || 0) + 1; });
          assert("nine of each of the four types",
            Object.keys(byType).length === 4 &&
            Object.values(byType).every((n) => n === 9), JSON.stringify(byType));
          Object.entries(st.wonderDecks).forEach(([type, deck]) => {
            // `revealed` is the TOP of the deck, not a card beside it, so the
            // deck itself is the whole set in play.
            const all = deck.deck;
            assert(`the ${type} deck's face-up card is its top card`,
              deck.revealed === deck.deck[0], `${type}: ${deck.revealed} vs ${deck.deck[0]}`);
            assert(`the ${type} deck in play is seven cards`, all.length === 7,
              `${type}: ${all.length}`);
            const eras = { ancient: 0, medieval: 0, modern: 0 };
            all.forEach((name) => {
              const w = Game.ALL_WONDERS.find((x) => x.name === name);
              if (w) eras[w.era]++;
            });
            assert(`and it is 2 ancient, 2 medieval, 3 modern for ${type}`,
              eras.ancient === 2 && eras.medieval === 2 && eras.modern === 3,
              `${type}: ${JSON.stringify(eras)}`);
            // The removal step: the two cards of each type left out are named,
            // not merely counted.
            const printed = Game.ALL_WONDERS.filter((w) => w.type === type).map((w) => w.name);
            const removed = printed.filter((n) => !all.includes(n));
            assert(`exactly two ${type} wonders were removed`, removed.length === 2,
              `${type}: ${removed.join(", ")}`);
            assert(`and every ${type} card in play is a printed one of that type`,
              all.every((n) => printed.includes(n)), `${type}: ${all.join(", ")}`);
          });
          const inPlay = Object.values(st.wonderDecks)
            .reduce((n, d) => n + d.deck.length, 0);
          assert("so twenty-eight wonders are in play across the four decks",
            inPlay === 28, String(inPlay));
          assert("and eight were removed from the thirty-six printed",
            Game.ALL_WONDERS.length - inPlay === 8,
            String(Game.ALL_WONDERS.length - inPlay));
        }
      }
      {
        // MAP GENERATION, FORTRESS LEGALITY AND THE TRADE-TOKEN CAP. Three
        // small systems the checklist still called partial.

        // ── The core, and how many tiles it is ───────────────────────────
        {
          const coreFor = (n) => {
            const seats = Array.from({ length: n }, (_, i) =>
              Game.createPlayer("c" + i, "C" + i,
                ["#e63946", "#457b9d", "#2a9d8f", "#e9c46a", "#9b5de5"][i]));
            const st = Game.createState(seats);
            const tiles = new Set();
            Object.values(st.map.hexes).forEach((h) => {
              if (h.active && h.tileId) tiles.add(h.tileId);
            });
            return { st, tiles: [...tiles] };
          };
          [2, 3].forEach((n) => {
            const c = coreFor(n);
            assert(`a ${n}-player core is two tiles`, c.tiles.length === 2,
              `${n}: ${c.tiles.join(" ")}`);
            assert(`and ${n} players get ${n * 10} core spaces on the board`,
              Object.values(c.st.map.hexes).filter((h) => h.active).length === 20,
              String(Object.values(c.st.map.hexes).filter((h) => h.active).length));
          });
          [4, 5].forEach((n) => {
            const c = coreFor(n);
            assert(`a ${n}-player core is four tiles`, c.tiles.length === 4,
              `${n}: ${c.tiles.join(" ")}`);
            assert(`laying forty core spaces for ${n} players`,
              Object.values(c.st.map.hexes).filter((h) => h.active).length === 40,
              String(Object.values(c.st.map.hexes).filter((h) => h.active).length));
          });
          assert("the anchor table says the same thing",
            Game.getCoreAnchors(2).length === 2 && Game.getCoreAnchors(3).length === 2 &&
            Game.getCoreAnchors(4).length === 4 && Game.getCoreAnchors(5).length === 4);
          const c5 = coreFor(5);
          assert("no core tile is laid twice",
            new Set(c5.tiles).size === c5.tiles.length, c5.tiles.join(" "));
          assert("and every core tile is a non-capital tile",
            c5.tiles.every((id) => {
              const def = Game.getTileDef(id);
              return def && def.kind !== "capital";
            }), c5.tiles.join(" "));
        }

        // ── Fortress placement legality ──────────────────────────────────
        {
          // "An inactive space bordering at least two active spaces", and not
          // beside a fort already placed or a city-state.
          const st = rulesState();
          const valid = Game.getValidFortressHexes(st);
          assert("there are legal fortress spaces on a fresh board",
            valid.size > 0, String(valid.size));
          const activeCount = (key) => Game.hexNeighborKeys(Game.parseQ(key), Game.parseR(key))
            .filter((nk) => st.map.hexes[nk] && st.map.hexes[nk].active).length;
          assert("every legal space is INACTIVE",
            [...valid].every((k) => !st.map.hexes[k].active));
          assert("and borders at least two active spaces",
            [...valid].every((k) => activeCount(k) >= 2),
            JSON.stringify([...valid].slice(0, 4).map((k) => [k, activeCount(k)])));
          const oneNeighbour = Object.keys(st.map.hexes).find((k) =>
            !st.map.hexes[k].active && activeCount(k) === 1);
          assert("a space touching only ONE active space is not legal",
            !oneNeighbour || !valid.has(oneNeighbour), String(oneNeighbour));

          // Placing one closes its neighbours to a second. PLACE_FORTRESS is a
          // setup action, so this half runs on a state still IN setup rather
          // than on the playing fixture above.
          const setupState = Game.createState(players(2));
          const setupValid = Game.getValidFortressHexes(setupState);
          const first = [...setupValid][0];
          assert("the fortress step is open at setup",
            setupState.setup.phase === "fortress", setupState.setup.phase);
          const placed = Game.applyAction(setupState, { type: "PLACE_FORTRESS", payload: {
            playerId: setupState.setup.order[setupState.setup.turnIndex], hexKey: first } });
          assert("placing a fortress puts it on the board",
            placed.map.hexes[first].fortress === true);
          const after = Game.getValidFortressHexes(placed);
          assert("and no space beside it is legal any more",
            Game.hexNeighborKeys(Game.parseQ(first), Game.parseR(first))
              .every((nk) => !after.has(nk)),
            Game.hexNeighborKeys(Game.parseQ(first), Game.parseR(first))
              .filter((nk) => after.has(nk)).join(" "));
          assert("nor is the space it now occupies",
            !after.has(first));

          // A city-state next door closes a space too.
          const csBoard = rulesState();
          const spot = [...Game.getValidFortressHexes(csBoard)][0];
          const neighbour = Game.hexNeighborKeys(Game.parseQ(spot), Game.parseR(spot))
            .find((nk) => csBoard.map.hexes[nk] && csBoard.map.hexes[nk].active);
          csBoard.map.hexes[neighbour].cityState =
            { name: "Test State", type: "science", diplomacyCards: 2 };
          assert("a space beside a city-state is not a legal fortress space",
            !Game.getValidFortressHexes(csBoard).has(spot), spot);
        }

        // ── The three-token cap on a focus card ──────────────────────────
        {
          // Base p13: a focus card holds at most three trade tokens. The cap is
          // per CARD, so filling one leaves the others untouched.
          const st = rulesState();
          const me = st.players[0];
          st.turn.index = st.turn.order.indexOf(me.id);
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          const addOne = (s, type) => {
            s.pendingBarbReward = { playerId: me.id, cardResolutionId: null };
            return Game.applyAction(s, { type: "ADD_TRADE",
              payload: { playerId: me.id, cardType: type } });
          };
          let s = st;
          for (let i = 0; i < 3; i++) s = addOne(s, "military");
          assert("three tokens go onto a card",
            Game.getPlayer(s, me.id).trade.military === 3,
            String(Game.getPlayer(s, me.id).trade.military));
          s = addOne(s, "military");
          assert("and a fourth does not: the card is full",
            Game.getPlayer(s, me.id).trade.military === 3,
            String(Game.getPlayer(s, me.id).trade.military));
          assert("the cap is per card, so the others are untouched",
            Game.FOCUS_TYPES.filter((t) => t !== "military")
              .every((t) => Game.getPlayer(s, me.id).trade[t] === 0),
            JSON.stringify(Game.getPlayer(s, me.id).trade));
          s = addOne(s, "culture");
          assert("and a different card still takes one",
            Game.getPlayer(s, me.id).trade.culture === 1,
            String(Game.getPlayer(s, me.id).trade.culture));
          assert("each type keeps its own track",
            Game.getPlayer(s, me.id).trade.military === 3 &&
            Game.getPlayer(s, me.id).trade.culture === 1,
            JSON.stringify(Game.getPlayer(s, me.id).trade));
        }

        // ── Resources: gained from the map, spent on a wonder ────────────
        {
          // A control token placed on a resource space COLLECTS that token and
          // clears the space; spending it on a wonder consumes it.
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          Game.RESOURCES.forEach((r) => { me.resources[r] = 0; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.control = null; h.city = null;
            h.cityState = null; h.resource = null;
            h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 4; q++) {
            for (let r = -2; r <= 2; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          st.map.hexes["0,0"].city = { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null };
          activate(st, "1,0", { terrain: "grass", resource: "marble" });
          me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          const out = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
            playerId: me.id, hexKeys: ["1,0"], tradeSpent: 0 } },
            { actorId: me.id, role: "player" });
          assert("a control token can be placed on a resource space", out.accepted, out.code);
          assert("placing it collects the resource",
            out.state.players[0].resources.marble === 1,
            String(out.state.players[0].resources.marble));
          assert("and the space no longer carries one",
            out.state.map.hexes["1,0"].resource === null,
            String(out.state.map.hexes["1,0"].resource));
          assert("the token is on the board",
            out.state.map.hexes["1,0"].control.ownerId === me.id);

          // Spending it: a wonder that prints marble consumes the token.
          const s2 = out.state;
          const player = s2.players[0];
          player.cardPlayed = false;
          Game.RESOURCES.forEach((r) => { player.resources[r] = 0; });
          player.resources.marble = 9;
          const deck = s2.wonderDecks.culture;
          deck.deck = ["Cristo Redentor"].concat(
            deck.deck.filter((n) => n !== "Cristo Redentor"));
          deck.revealed = "Cristo Redentor";
          const before = player.resources.marble;
          const built = Game.tryApplyAction(s2, { type: "PLAY_INDUSTRY_WONDER", payload: {
            hexKey: "0,0", wonderName: "Cristo Redentor", tradeSpent: 0,
            resources: { marble: 9 }, naturalWonders: [] } },
            { actorId: player.id, role: "player" });
          assert("the wonder is bought with them", built.accepted, built.code);
          assert("and the tokens are really spent",
            built.accepted && built.state.players[0].resources.marble < before,
            built.accepted && `${before} -> ${built.state.players[0].resources.marble}`);
          const ineligible = Game.calculateWonderProduction(s2, player, "Cristo Redentor",
            { tradeSpent: 0, resources: { oil: 1 }, naturalWonders: [] });
          assert("a resource the wonder does not print is refused",
            !ineligible.ok, JSON.stringify(ineligible));
        }
      }
      {
        // THE EVENT DIAL, as a system. The wheel turns once per ROUND, not
        // once per turn; it turns after the last seat has played, in printed
        // order, and it resolves the icons of the space it lands on, in the
        // order that space lists them.
        const dialBoard = () => {
          const st = rulesState();
          st.turn.order = st.players.map((p) => p.id);
          st.turn.index = 0;
          st.players.forEach((p) => { p.cardPlayed = false; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
          });
          return st;
        };
        // A whole round: every seat plays a card and ends, answering only its
        // own decisions, because an unanswered one blocks the board for all.
        const playRound = (st) => {
          let s = st;
          for (let seat = 0; seat < s.turn.order.length; seat++) {
            const cur = Game.currentPlayer(s).id;
            s = Game.applyAction(s, { type: "PLAY_SCIENCE",
              payload: { playerId: cur, tradeSpent: 0 } });
            for (let i = 0; i < 30; i++) {
              const open = (s.pendingChoices || [])[0];
              if (!open) break;
              const payload = { playerId: open.playerId, choiceId: open.id };
              if (open.options && open.options.length) payload.optionId = open.options[0].id;
              else if (open.hexKeys && open.hexKeys.length) payload.hexKey = open.hexKeys[0];
              else if (open.optional) payload.dismiss = true;
              else break;
              const next = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE", payload });
              if (next === s) break;
              s = next;
            }
            s = Game.applyAction(s, { type: "END_TURN", payload: { playerId: cur } });
          }
          return s;
        };

        {
          const st = dialBoard();
          assert("the dial starts on its first space",
            st.eventWheel.position === 0, String(st.eventWheel.position));
          assert("and carries the printed sequence of spaces",
            st.eventWheel.events.length === Game.EVENTS.length &&
            JSON.stringify(st.eventWheel.events) === JSON.stringify(Game.EVENTS),
            JSON.stringify(st.eventWheel.events));

          const roundBefore = st.turn.round;
          // One seat ending its turn is not a round.
          const cur = Game.currentPlayer(st).id;
          let s = Game.applyAction(st, { type: "PLAY_SCIENCE",
            payload: { playerId: cur, tradeSpent: 0 } });
          for (let i = 0; i < 30; i++) {
            const open = (s.pendingChoices || [])[0];
            if (!open) break;
            const payload = { playerId: open.playerId, choiceId: open.id };
            if (open.options && open.options.length) payload.optionId = open.options[0].id;
            else if (open.hexKeys && open.hexKeys.length) payload.hexKey = open.hexKeys[0];
            else if (open.optional) payload.dismiss = true;
            else break;
            const next = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE", payload });
            if (next === s) break;
            s = next;
          }
          s = Game.applyAction(s, { type: "END_TURN", payload: { playerId: cur } });
          assert("one seat ending its turn does not turn the dial",
            s.eventWheel.position === 0 && s.turn.round === roundBefore,
            JSON.stringify({ pos: s.eventWheel.position, round: s.turn.round }));
        }

        {
          // A full round turns it exactly one space, and the round counter
          // moves with it.
          let s = dialBoard();
          const before = { pos: s.eventWheel.position, round: s.turn.round };
          s = playRound(s);
          assert("a full round turns the dial exactly one space",
            s.eventWheel.position === before.pos + 1,
            JSON.stringify({ before, after: s.eventWheel.position }));
          assert("and advances the round counter with it",
            s.turn.round === before.round + 1,
            JSON.stringify({ before, after: s.turn.round }));
          assert("the seat to move is the first one again",
            s.turn.index === 0, String(s.turn.index));
        }

        {
          // It walks the printed spaces in order and wraps back to the start.
          let s = dialBoard();
          const seen = [];
          for (let round = 0; round < Game.EVENTS.length + 1; round++) {
            s = playRound(s);
            seen.push(s.eventWheel.position);
            if (s.phase === "gameover") break;
          }
          const expected = [];
          for (let i = 0; i < seen.length; i++) expected.push((i + 1) % Game.EVENTS.length);
          assert("the dial walks its spaces in printed order and wraps round",
            JSON.stringify(seen) === JSON.stringify(expected),
            JSON.stringify({ seen, expected }));
        }

        {
          // Landing on a space resolves that space's icons. The dial's second
          // space is the barbarian march, so a round taken with a barbarian on
          // the board must record a march.
          let s = dialBoard();
          const target = Game.EVENTS.findIndex((sec) => sec.includes("barbarian_move"));
          assert("the printed dial has a barbarian march on it", target > 0, String(target));
          // Put one barbarian somewhere it can walk.
          for (let q = -3; q <= 3; q++) {
            for (let r = -3; r <= 3; r++) activate(s, q + "," + r, { terrain: "grass" });
          }
          activate(s, "0,0", { terrain: "grass", barbarian: true, barbarianId: "Z" });
          for (let i = 0; i < target; i++) s = playRound(s);
          assert("the dial reached the barbarian space",
            s.eventWheel.position === target, String(s.eventWheel.position));
          assert("and landing on it marched the barbarians",
            !!s.barbarianMove && Number.isInteger(s.barbarianMove.roll),
            JSON.stringify(s.barbarianMove));
          assert("recording the die that steered them, so every seat sees the cause",
            s.barbarianMove.roll >= 1 && s.barbarianMove.roll <= 6,
            String(s.barbarianMove.roll));
        }

        {
          // A space that lists two icons resolves BOTH, in the order printed —
          // Terra p14 puts the wonder icon last in its space.
          const multi = Game.EVENTS.filter((sec) => sec.length > 1);
          assert("the printed dial has spaces carrying two icons",
            multi.length > 0, JSON.stringify(Game.EVENTS));
          assert("and the wonder icon is last wherever it shares a space",
            multi.every((sec) => !sec.includes("wonder_tokens") ||
              sec[sec.length - 1] === "wonder_tokens"),
            JSON.stringify(multi));
        }
      }
      {
        // VICTORY AND AGENDAS, as a generic system. An agenda is claimed by
        // reaching a board state, kept once claimed unless it is a fortress
        // agenda, counted per victory CARD rather than per agenda, and four
        // cards end the game.
        const vBoard = (setUp) => {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          st.turn.index = st.turn.order.indexOf(me.id);
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.control = null; h.city = null; h.cityState = null; h.fortress = false;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          st.claimedAgendas = {};
          // The victory cards are dealt at random, so a fixture that hopes the
          // agenda it drives was dealt is a flake. Name them here instead.
          st.agendaCards = [
            { id: "vc-a", agendas: ["industrious", "populous"] },
            { id: "vc-b", agendas: ["aesthetic", "scholarly"] },
            { id: "vc-c", agendas: ["paranoid", "money_grubber"] },
            { id: "vc-d", agendas: ["diversified", "progressive"] },
            { id: "vc-e", agendas: ["technophile", "diplomatic"] }
          ];
          for (let q = -4; q <= 9; q++) {
            for (let r = -3; r <= 3; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          if (setUp) setUp(st, me, foe);
          return { st, me, foe };
        };
        // CHECK_AGENDAS is the action that evaluates claims against the board.
        // Driving it, rather than calling the scorer, is what makes these
        // assertions about the game rather than about a helper.
        const settle = (st) => Game.applyAction(st, { type: "CHECK_AGENDAS", payload: {} });
        const claimsOf = (st, id) =>
          (st.claimedAgendas && st.claimedAgendas[id]) || {};

        {
          // "Industrious": five districts on the map. Terra p16 says five
          // districts, not one of each kind — and a player only has five kinds,
          // so this is the whole supply out at once.
          const kinds = Game.DISTRICTS.slice(0, 5);
          const four = vBoard((st, me) => {
            kinds.slice(0, 4).forEach((kind, i) => activate(st, (i + 1) + ",0", {
              control: { ownerId: me.id, fortified: false, district: kind } }));
          });
          const s4 = settle(four.st);
          assert("four districts do not claim the industrious agenda",
            !claimsOf(s4, four.me.id).industrious,
            JSON.stringify(claimsOf(s4, four.me.id)));
          const five = vBoard((st, me) => {
            kinds.forEach((kind, i) => activate(st, (i + 1) + ",0", {
              control: { ownerId: me.id, fortified: false, district: kind } }));
          });
          const s5 = settle(five.st);
          assert("the fifth claims it", !!claimsOf(s5, five.me.id).industrious,
            JSON.stringify(claimsOf(s5, five.me.id)));
          assert("and it is a consequence of the board, not of who asked",
            !claimsOf(s5, five.foe.id).industrious);
        }

        {
          // "Populous": five MATURE cities. This is the agenda that used to
          // over-report when maturity was cached, so it is driven both ways.
          const ringed = (st, ownerId, centres) => centres.forEach((c) => {
            const [q, r] = c.split(",").map(Number);
            st.map.hexes[c].city = { ownerId, isCapital: false, developed: false,
              hasWonder: false, wonder: null };
            Game.hexNeighborKeys(q, r).forEach((nk) => {
              const h = st.map.hexes[nk];
              if (h && h.active && !h.city) {
                h.control = { ownerId, fortified: false, district: null };
              }
            });
          });
          // Five cities two apart so their rings do not overlap onto a city.
          const centres = ["0,0", "3,0", "6,0", "0,3", "3,3"];
          const b = vBoard((st, me) => ringed(st, me.id, centres));
          const s = settle(b.st);
          assert("the fixture really has five mature cities",
            Game.countDeveloped(s, b.me.id) === 5,
            String(Game.countDeveloped(s, b.me.id)));
          assert("which claims the populous agenda",
            !!claimsOf(s, b.me.id).populous, JSON.stringify(claimsOf(s, b.me.id)));

          const broken = vBoard((st, me) => ringed(st, me.id, centres));
          // Break one ring: a barbarian raid on a single token is enough.
          const anyRing = Game.hexNeighborKeys(0, 0)
            .find((k) => broken.st.map.hexes[k] && broken.st.map.hexes[k].control);
          broken.st.map.hexes[anyRing].control = null;
          const s2 = settle(broken.st);
          assert("losing one ring token drops it to four mature cities",
            Game.countDeveloped(s2, broken.me.id) === 4,
            String(Game.countDeveloped(s2, broken.me.id)));
          assert("so the agenda is not claimed",
            !claimsOf(s2, broken.me.id).populous,
            JSON.stringify(claimsOf(s2, broken.me.id)));
        }

        {
          // A claim is KEPT once made, even if the board later stops meeting
          // it — except a fortress agenda, which the code tracks live.
          const kinds = Game.DISTRICTS.slice(0, 5);
          const b = vBoard((st, me) => {
            kinds.forEach((kind, i) => activate(st, (i + 1) + ",0", {
              control: { ownerId: me.id, fortified: false, district: kind } }));
          });
          const claimed = settle(b.st);
          assert("the agenda is claimed", !!claimsOf(claimed, b.me.id).industrious);
          claimed.map.hexes["1,0"].control = null;   // a district is destroyed
          const later = settle(claimed);
          assert("and losing a district afterwards does not take the claim back",
            !!claimsOf(later, b.me.id).industrious,
            JSON.stringify(claimsOf(later, b.me.id)));
        }

        {
          // The game ends when a player has claimed FOUR victory cards. The
          // count is per CARD, and each card carries two agendas, so meeting
          // both halves of one card is still one card.
          const b = vBoard(() => {});
          const s = settle(b.st);
          // The cards have to come from THIS state: victoryCards deals from the
          // board, so a set read off a second fixture would carry other ids.
          const cards = Game.victoryCards(s);
          assert("the board deals victory cards", cards.length >= 4, String(cards.length));
          assert("nobody has claimed anything on an empty board",
            Game.getClaimedAgendaCount(s, b.me.id) === 0,
            String(Game.getClaimedAgendaCount(s, b.me.id)));
          // Claim the halves of ONE card and check the count is one, not two.
          const card = cards[0];
          s.claimedAgendas[b.me.id] = {};
          card.agendas.forEach((id) => { s.claimedAgendas[b.me.id][id] = true; });
          s.claimedAgendas[b.me.id][card.id] = true;
          assert("both halves of one card still count as one card",
            Game.getClaimedAgendaCount(s, b.me.id) === 1,
            String(Game.getClaimedAgendaCount(s, b.me.id)));
          cards.slice(1, 4).forEach((c) => { s.claimedAgendas[b.me.id][c.id] = true; });
          assert("four cards is four", Game.getClaimedAgendaCount(s, b.me.id) === 4,
            String(Game.getClaimedAgendaCount(s, b.me.id)));
        }
      }

      {
        // CITY CONSTRUCTION, as a generic system: the legality rule is one
        // function, and every source that builds a city goes through it.
        const cBoard = (setUp) => {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.control = null; h.city = null; h.cityState = null; h.fortress = false;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 8; q++) {
            for (let r = -2; r <= 2; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          st.map.hexes["0,0"].city = { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null };
          me.focusRow = ["industry", "economy", "science", "growth", "culture", "military"];
          if (setUp) setUp(st, me, foe);
          return { st, me, foe };
        };
        const legal = (b, key) => Game.validCityHexes(b.me
          ? b.st : b, b.me.id, Infinity, 2).has(key);

        {
          const b = cBoard();
          assert("a space two away from the capital is legal", legal(b, "2,0"));
          assert("a space ADJACENT to a city is not: cities may not touch",
            !legal(b, "1,0"));
          assert("and one out of range of any friendly space is not",
            !legal(b, "8,0"));
        }
        {
          const b = cBoard((st) => {
            activate(st, "2,0", { cityState: { name: "S", type: "science", diplomacyCards: 2 } });
          });
          assert("a space holding a city-state is not legal", !legal(b, "2,0"));
          assert("nor is one adjacent to it", !legal(b, "2,1"));
        }
        {
          const b = cBoard((st) => { activate(st, "2,0", { resource: "marble" }); });
          assert("a space with a resource token on it is not legal", !legal(b, "2,0"));
        }
        {
          const b = cBoard((st) => {
            activate(st, "2,0", { naturalWonder: "Mt Kilimanjaro",
              naturalWonderSpace: "Mt Kilimanjaro", resource: "wonder" });
          });
          assert("nor is a natural wonder space while its token is on it",
            !legal(b, "2,0"));
        }
        {
          const b = cBoard((st) => { activate(st, "2,0", { barbarian: true }); });
          assert("nor one holding a barbarian", !legal(b, "2,0"));
        }
        {
          const b = cBoard((st) => { activate(st, "2,0", { fortress: true }); });
          assert("nor a fort", !legal(b, "2,0"));
        }
        {
          const b = cBoard((st, me, foe) => {
            activate(st, "2,0", { control: { ownerId: foe.id, fortified: false, district: null } });
          });
          assert("nor a space held by a rival's control token", !legal(b, "2,0"));
        }
        {
          const b = cBoard((st, me) => {
            activate(st, "2,0", { control: { ownerId: me.id, fortified: false, district: null } });
          });
          assert("but your OWN control token does not block a city", legal(b, "2,0"));
        }
        {
          const b = cBoard((st, me, foe) => { foe.armies = [{ id: "f1", position: "2,0" }]; });
          assert("a rival ARMY in the space blocks it", !legal(b, "2,0"));
          const mine = cBoard((st, me) => { me.armies = [{ id: "a1", position: "2,0" }]; });
          assert("your own army does not", legal(mine, "2,0"));
        }
        {
          const b = cBoard((st, me, foe) => { foe.caravans = [{ id: "f1", position: "2,0" }]; });
          assert("and a caravan never blocks, whoever owns it", legal(b, "2,0"));
        }
        {
          // Every source that builds a city ends up on the same rule. The
          // industry card is one; the Industrial Zone's option is another; both
          // are refused on an illegal space and accepted on a legal one.
          const b = cBoard();
          const bad = Game.tryApplyAction(b.st, { type: "PLAY_INDUSTRY_CITY",
            payload: { playerId: b.me.id, hexKey: "1,0" } },
            { actorId: b.me.id, role: "player" });
          assert("the industry card refuses a space adjacent to a city",
            !bad.accepted, bad.code);
          const good = Game.tryApplyAction(b.st, { type: "PLAY_INDUSTRY_CITY",
            payload: { playerId: b.me.id, hexKey: "2,0" } },
            { actorId: b.me.id, role: "player" });
          assert("and builds on a legal one", good.accepted, good.code);
          assert("with the city really there",
            good.accepted && good.state.map.hexes["2,0"].city.ownerId === b.me.id);
          assert("as a plain city, not a capital",
            good.accepted && good.state.map.hexes["2,0"].city.isCapital === false);
          // And the space it took is no longer legal for the next one.
          assert("the new city then blocks its own neighbours",
            good.accepted && !Game.validCityHexes(good.state, b.me.id, Infinity, 2).has("2,1"));
        }
      }
      {
        // MOVEMENT, as a generic system rather than through any one card.
        // Four separate rules govern where a figure may go: how far the card
        // carries it, what terrain the card's slot lets it enter, water, and
        // the pieces that stop it dead. Each is driven on its own here, and
        // then a real move is dispatched so the limits are shown refusing and
        // allowing actual actions rather than only shaping a reachable set.
        const moveBoard = (setUp) => {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.control = null; h.city = null; h.cityState = null; h.fortress = false;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -1; q <= 9; q++) activate(st, q + ",0", { terrain: "grass" });
          for (let q = -1; q <= 9; q++) {
            activate(st, q + ",1", { terrain: "grass" });
            activate(st, q + ",-1", { terrain: "grass" });
          }
          st.map.hexes["0,0"].city = { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null };
          me.focusRow = ["military", "economy", "science", "growth", "culture", "industry"];
          if (setUp) setUp(st, me, foe);
          return { st, me, foe };
        };

        // ── How far the card carries a figure ────────────────────────────
        {
          const b = moveBoard();
          const limit = Game.getMilitaryMove(b.me, b.st);
          const reach = Game.getReachable(b.st, "0,0", limit, "army", b.me.id);
          assert("an army reaches exactly as far as its card allows",
            reach.has(limit + ",0") && !reach.has((limit + 1) + ",0"),
            `limit ${limit}; ${[...reach].sort().join(" ")}`);
          b.me.armies = [{ id: "a1", position: "0,0" }];
          const tooFar = Game.tryApplyAction(b.st, { type: "PLAY_MILITARY_MOVE", payload: {
            playerId: b.me.id, unitId: "a1", fromKey: "0,0", toKey: (limit + 1) + ",0" } },
            { actorId: b.me.id, role: "player" });
          assert("and a move one space beyond it is refused by the engine",
            !tooFar.accepted, tooFar.code);
          const ok = Game.tryApplyAction(b.st, { type: "PLAY_MILITARY_MOVE", payload: {
            playerId: b.me.id, unitId: "a1", fromKey: "0,0", toKey: limit + ",0" } },
            { actorId: b.me.id, role: "player" });
          assert("while a move to the limit is accepted", ok.accepted, ok.code);
          assert("and the figure is really there",
            ok.accepted && ok.state.players[0].armies[0].position === limit + ",0");
        }

        // ── The terrain the card's slot opens ────────────────────────────
        {
          // movementTerrainLimit is the card's SLOT number, and terrain runs
          // grass 1, hill 2, forest 3, desert 4, mountain 5.
          const b = moveBoard((st) => {
            activate(st, "1,0", { terrain: "hill" });
            activate(st, "2,0", { terrain: "mountain" });
          });
          const slot = Game.getSlotValue(b.me, "military", b.st);
          assert("the fixture's military card sits in a low slot", slot < 5, String(slot));
          const reach = Game.getReachable(b.st, "0,0", 6, "army", b.me.id);
          assert("terrain at or below the slot is open",
            reach.has("1,0") === (Game.TERRAIN.hill <= slot),
            JSON.stringify({ slot, hill: Game.TERRAIN.hill, has: reach.has("1,0") }));
          assert("a mountain above the slot is closed",
            !reach.has("2,0"), [...reach].sort().join(" "));
          // Raising the slot opens it, which is what makes this the card's
          // number and not a property of the space.
          const high = moveBoard((st, me) => {
            activate(st, "1,0", { terrain: "hill" });
            activate(st, "2,0", { terrain: "mountain" });
            me.focusRow = ["culture", "economy", "science", "growth", "industry", "military"];
          });
          assert("the same mountain opens when the card resolves further right",
            Game.getSlotValue(high.me, "military", high.st) === 5 &&
            Game.getReachable(high.st, "0,0", 6, "army", high.me.id).has("2,0"),
            String(Game.getSlotValue(high.me, "military", high.st)));
        }

        // ── Water ────────────────────────────────────────────────────────
        {
          const b = moveBoard((st) => activate(st, "1,0", { terrain: "water" }));
          assert("a low-tier army cannot enter water",
            !Game.canCrossWater(b.me, "army") &&
            !Game.getReachable(b.st, "0,0", 6, "army", b.me.id).has("1,0"));
          const sailor = moveBoard((st, me) => {
            activate(st, "1,0", { terrain: "water" });
            me.cardTiers.military = 3;
            me.cardLevels.military = 3;
          });
          assert("a card at the printed water tier can",
            Game.canCrossWater(sailor.me, "army") &&
            Game.getReachable(sailor.st, "0,0", 6, "army", sailor.me.id).has("1,0"),
            String(Game.getCardTier(sailor.me, "military")));
        }

        // ── The pieces that stop a figure dead ───────────────────────────
        {
          // "When an army enters a space containing a barbarian, city-state or
          // rival piece, it must end its movement." Each of those is driven as
          // a separate board: the space itself stays reachable, the space
          // BEYOND it does not.
          // A single-file corridor. With the parallel lanes open the army
          // simply walks around a blocker, which would make every one of these
          // assertions pass for the wrong reason.
          const corridor = (st) => {
            for (let q = -1; q <= 9; q++) {
              st.map.hexes[q + ",1"].active = false;
              st.map.hexes[q + ",-1"].active = false;
            }
          };
          const stoppedBy = (place) => {
            const b = moveBoard((st, me, foe) => { corridor(st); place(st, me, foe); });
            const reach = Game.getReachable(b.st, "0,0", 6, "army", b.me.id);
            return { entersIt: reach.has("2,0"), passesIt: reach.has("3,0") };
          };
          const open = stoppedBy(() => {});
          assert("with nothing in the way the army passes straight through",
            open.entersIt && open.passesIt);

          const barb = stoppedBy((st) => {
            st.map.hexes["2,0"].barbarian = true;
            st.map.hexes["2,0"].barbarianId = "X";
          });
          assert("a barbarian stops it: the space is reachable, beyond it is not",
            barb.entersIt && !barb.passesIt, JSON.stringify(barb));

          const cs = stoppedBy((st) => {
            st.map.hexes["2,0"].cityState = { name: "Test State", type: "science", diplomacyCards: 2 };
          });
          assert("so does a city-state", cs.entersIt && !cs.passesIt, JSON.stringify(cs));

          const rivalArmy = stoppedBy((st, me, foe) => {
            foe.armies = [{ id: "f1", position: "2,0" }];
          });
          assert("so does a rival army", rivalArmy.entersIt && !rivalArmy.passesIt,
            JSON.stringify(rivalArmy));

          const rivalCity = stoppedBy((st, me, foe) => {
            st.map.hexes["2,0"].city = { ownerId: foe.id, isCapital: false,
              developed: false, hasWonder: false, wonder: null };
          });
          assert("so does a rival city", rivalCity.entersIt && !rivalCity.passesIt,
            JSON.stringify(rivalCity));

          const fort = stoppedBy((st) => { st.map.hexes["2,0"].fortress = true; });
          assert("so does an uncontrolled fort", fort.entersIt && !fort.passesIt,
            JSON.stringify(fort));

          const rivalToken = stoppedBy((st, me, foe) => {
            st.map.hexes["2,0"].control = { ownerId: foe.id, fortified: false, district: null };
          });
          assert("and so does a rival control token", rivalToken.entersIt && !rivalToken.passesIt,
            JSON.stringify(rivalToken));

          const ownToken = stoppedBy((st, me) => {
            st.map.hexes["2,0"].control = { ownerId: me.id, fortified: true, district: null };
          });
          assert("but your OWN token does not stop you, however it is standing",
            ownToken.entersIt && ownToken.passesIt, JSON.stringify(ownToken));

          // A stop is not the same as a wall: the engine must refuse ENDING on
          // a defended space with a plain move, because that is an attack.
          const b = moveBoard((st, me, foe) => {
            corridor(st);
            st.map.hexes["2,0"].control = { ownerId: foe.id, fortified: false, district: null };
          });
          b.me.armies = [{ id: "a1", position: "0,0" }];
          const walkOn = Game.tryApplyAction(b.st, { type: "PLAY_MILITARY_MOVE", payload: {
            playerId: b.me.id, unitId: "a1", fromKey: "0,0", toKey: "2,0" } },
            { actorId: b.me.id, role: "player" });
          assert("moving onto a defended space is refused: that is an attack",
            !walkOn.accepted, walkOn.code);
          const attack = Game.tryApplyAction(b.st, { type: "PLAY_MILITARY_ATTACK", payload: {
            playerId: b.me.id, unitId: "a1", fromKey: "0,0", toKey: "2,0",
            targetType: "control" } }, { actorId: b.me.id, role: "player" });
          assert("and the attack action is the one that reaches it",
            attack.accepted && !!attack.state.combat, attack.code);
        }

        // ── A caravan is governed by its own card ────────────────────────
        {
          const b = moveBoard((st, me) => {
            me.caravans = [{ id: "c1", position: "0,0" }];
          });
          const limit = Game.getEconomyMove(b.me, b.st);
          const reach = Game.getReachable(b.st, "0,0", limit, "caravan", b.me.id);
          assert("a caravan reaches exactly its economy card's distance",
            reach.has(limit + ",0") && !reach.has((limit + 1) + ",0"),
            `limit ${limit}; ${[...reach].sort().join(" ")}`);
          const tooFar = Game.tryApplyAction(b.st, { type: "PLAY_ECONOMY", payload: {
            playerId: b.me.id, unitId: "c1", toKey: (limit + 1) + ",0", tradeSpent: 0 } },
            { actorId: b.me.id, role: "player" });
          assert("and a longer move is refused", !tooFar.accepted, tooFar.code);
          const ok = Game.tryApplyAction(b.st, { type: "PLAY_ECONOMY", payload: {
            playerId: b.me.id, unitId: "c1", toKey: limit + ",0", tradeSpent: 0 } },
            { actorId: b.me.id, role: "player" });
          assert("while the exact distance is allowed and moves the figure",
            ok.accepted && ok.state.players[0].caravans[0].position === limit + ",0",
            ok.code);
          // Trade tokens buy distance, which is the printed way to go further.
          const paid = moveBoard((st, me) => {
            me.caravans = [{ id: "c1", position: "0,0" }];
            me.trade.economy = 2;
          });
          const boughtLimit = Game.getEconomyMove(paid.me, paid.st) + 2;
          const far = Game.tryApplyAction(paid.st, { type: "PLAY_ECONOMY", payload: {
            playerId: paid.me.id, unitId: "c1", toKey: boughtLimit + ",0", tradeSpent: 2 } },
            { actorId: paid.me.id, role: "player" });
          assert("spending two trade tokens buys exactly two more spaces",
            far.accepted && far.state.players[0].caravans[0].position === boughtLimit + ",0",
            far.code);
          assert("and the tokens are really spent",
            far.accepted && far.state.players[0].trade.economy === 0,
            far.accepted && String(far.state.players[0].trade.economy));
        }
      }

      summary.textContent = `${passed} passed, ${failed} failed`;
    } catch (err) {
      failed++;
      const li = document.createElement("li");
      li.className = "fail";
      li.textContent = `ERROR: ${err.stack || err.message}`;
      results.appendChild(li);
      summary.textContent = `${passed} passed, ${failed} failed`;
    }
    // Handed to tools/coverage-matrix.js. A proof declared while the suite was
    // already red is dropped here rather than at declaration time, because a
    // later failure invalidates an earlier claim just as much.
    window.__CIV_PROOFS__ = {
      passed, failed,
      proofErrors,
      proofs: failed ? [] : PROOFS
    };
  </script>
</body>
</html>
