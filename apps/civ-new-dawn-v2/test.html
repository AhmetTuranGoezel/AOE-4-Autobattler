            // the way an effect that replaces one does.
            if (!taken.map.hexes["1,0"].control ||
                taken.map.hexes["1,0"].control.ownerId !== me.id) {
              Game.placeControlToken(taken, "1,0", me.id, { fortified: false });
            }
            assert("the space is mine", taken.map.hexes["1,0"].control.ownerId === me.id);
            const settled = Game.applyAction(taken, { type: "NO_SUCH_ACTION", payload: {} });
            assert("it came out of my supply",
              Game.controlTokensInSupply(settled, me.id) === 1,
              String(Game.controlTokensInSupply(settled, me.id)));
            assert("and went back into theirs",
              Game.controlTokensInSupply(settled, foe.id) === 2,
              String(Game.controlTokensInSupply(settled, foe.id)));
          }
          {
            // The shipped default is unbounded, which is the behaviour the
            // engine has always had and what it keeps until the count is known.
            restore();
            const { st, me } = withLimit(Infinity);
            assert("with no configured limit the supply is unbounded",
              Game.controlTokensInSupply(st, me.id) === Infinity);
            assert("and Game.CFG says so by default", Game.CFG.controlTokens === Infinity);
          }
        } finally {
          restore();
        }
      }

      {
        // Barbarian lifecycle: identity, permanent printed home, defeat,
        // respawn, and the two different things that happen when a barbarian
        // and an army meet.
        //
        // A barbarian figure belongs to the printed icon it came from, for the
        // whole game. It may march anywhere and be defeated anywhere; when the
        // event dial reaches barbarian spawning it goes back to ITS OWN printed
        // space, never to where it died, never to a free icon, never to a new
        // identity. The letter is what the figure shows; the printed space is
        // what it IS, because a letter is not unique on a board - E is printed
        // on four different tiles - and two figures showing the same letter can
        // be in play at once.
        const spawnBoard = () => {
          const st = rulesState();
          const me = st.players[0];
          // A clean lane. rulesState() deals real tiles, so clear whatever
          // barbarians they brought and place the ones under test by hand.
          for (let q = -1; q <= 8; q++) activate(st, q + ",0", { terrain: "grass" });
          for (let q = -1; q <= 8; q++) {
            activate(st, q + ",-1", { terrain: "grass" });
            activate(st, q + ",1", { terrain: "grass" });
          }
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null;
            h.barbarianToken = null; h.barbarianHome = null;
          });
          st.barbarians = {};
          return { st, me };
        };
        // Put figure `letter` on its printed home at `key`.
        const printSpawn = (st, key, letter) => {
          const h = st.map.hexes[key];
          h.barbarianHome = letter;
          h.barbarian = true;
          h.barbarianId = letter;
          h.barbarianToken = key;
          Game.syncBarbarianRegistry(st);
        };
        const offMap = (st) => Game.offMapBarbarians(st)
          .map((b) => b.letter + "@" + b.homeKey);
        const whereIs = (st, token) => {
          const found = Object.entries(st.map.hexes)
            .find(([, h]) => h.barbarian && h.barbarianToken === token);
          return found ? found[0] : null;
        };
        // The real event dial, not a helper: this is the action a player takes.
        const spawnEvent = (st) => Game.resolveEvent(st, "barbarian_return");

        {
          // Setup reads the printed cell, so a dealt board's figures agree with
          // the tiles it was dealt from. This is the one population path that
          // both setup and Terra exploration use.
          const st = rulesState();
          Game.syncBarbarianRegistry(st);
          // Compare EVERY placed cell against its printed face, in both
          // directions: a cell that prints a letter must carry it, and a cell
          // that prints none must carry none. Counting dealt spawns instead
          // would depend on which core tiles the shuffle handed out - a 2-player
          // core is two tiles, and not every tile prints a barbarian.
          const cells = Object.entries(st.map.hexes)
            .filter(([, h]) => h.tileId && Number.isInteger(h.tileCell))
            .map(([k, h]) => {
              const def = Game.getTileDef(h.tileId);
              const face = def && def.sides && def.sides[h.tileSide || "A"];
              const printedCell = face && face.cells && face.cells[h.tileCell];
              return { k, home: h.barbarianHome || null,
                printed: (printedCell && printedCell.barbarian) || null };
            });
          assert("the dealt board has cells to check", cells.length > 0, cells.length);
          const wrong = cells.filter((c) => c.home !== c.printed);
          assert("every spawn matches its exact printed tile/side/cell, both ways",
            wrong.length === 0, JSON.stringify(wrong.slice(0, 3)));
          const printed = cells.filter((c) => c.printed);
          const standing = Object.entries(st.map.hexes)
            .filter(([, h]) => h.barbarian);
          assert("and a figure stands on each of them, showing that letter",
            standing.every(([k, h]) => h.barbarianId === h.barbarianHome &&
              h.barbarianToken === k), JSON.stringify(standing.slice(0, 3).map(([k]) => k)));
        }

        {
          // Identity survives marching, and a figure defeated far from home
          // still returns home.
          const { st, me } = spawnBoard();
          printSpawn(st, "1,0", "F");
          assert("F starts on its printed space", whereIs(st, "1,0") === "1,0");
          // March it away by hand - where it walked is not the point, only that
          // it is no longer at home when it dies.
          st.map.hexes["1,0"].barbarian = false;
          st.map.hexes["1,0"].barbarianId = null;
          st.map.hexes["1,0"].barbarianToken = null;
          activate(st, "6,0", { terrain: "grass" });
          st.map.hexes["6,0"].barbarian = true;
          st.map.hexes["6,0"].barbarianId = "F";
          st.map.hexes["6,0"].barbarianToken = "1,0";
          Game.syncBarbarianRegistry(st);
          assert("moving F does not erase the printed spawn F",
            st.map.hexes["1,0"].barbarianHome === "F");
          assert("and F is still F, five spaces from home",
            whereIs(st, "1,0") === "6,0" && st.map.hexes["6,0"].barbarianId === "F");

          // Defeat it there, through the ordinary combat route's own helper -
          // the same centralised defeat every route uses.
          const beaten = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {} });
          beaten.pendingChoices.push({ id: "rb", kind: "remove_barbarian", playerId: me.id,
            hexKeys: ["6,0"], title: "Remove", source: "test" });
          const dead = Game.applyAction(beaten, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: "rb", hexKey: "6,0" } });
          assert("F is off the map after being defeated",
            dead.map.hexes["6,0"].barbarian === false);
          assert("but it is still F, and still belongs to spawn F",
            offMap(dead).join(",") === "F@1,0", JSON.stringify(offMap(dead)));
          assert("the space it died on is not a spawn",
            !dead.map.hexes["6,0"].barbarianHome);

          spawnEvent(dead);
          assert("the spawning event returns F to its OWN printed space",
            dead.map.hexes["1,0"].barbarian === true &&
            dead.map.hexes["1,0"].barbarianId === "F" &&
            dead.map.hexes["1,0"].barbarianToken === "1,0",
            JSON.stringify({ home: dead.map.hexes["1,0"].barbarian,
              died: dead.map.hexes["6,0"].barbarian }));
          assert("and never where it died", dead.map.hexes["6,0"].barbarian === false);
          assert("nothing is left waiting", offMap(dead).length === 0);
        }

        {
          // A caravan on the spawn does not stop it: the caravan is destroyed
          // and goes back to its economy card.
          const { st, me } = spawnBoard();
          printSpawn(st, "2,0", "F");
          st.map.hexes["2,0"].barbarian = false;
          st.map.hexes["2,0"].barbarianId = null;
          st.map.hexes["2,0"].barbarianToken = null;
          Game.syncBarbarianRegistry(st);
          me.caravans = [{ id: "c1", position: "2,0" }];
          assert("F is waiting off the map", offMap(st).join(",") === "F@2,0");
          spawnEvent(st);
          assert("a caravan does not block the spawn",
            st.map.hexes["2,0"].barbarian === true &&
            st.map.hexes["2,0"].barbarianId === "F");
          assert("and the caravan is destroyed back onto its card",
            st.players[0].caravans[0].position === null);
        }

        {
          // Terra's additional army rules: an army on the icon does NOT block
          // the spawn either. It is defeated and returns to its military card.
          const { st, me } = spawnBoard();
          printSpawn(st, "2,0", "F");
          st.map.hexes["2,0"].barbarian = false;
          st.map.hexes["2,0"].barbarianId = null;
          st.map.hexes["2,0"].barbarianToken = null;
          Game.syncBarbarianRegistry(st);
          me.armies = [{ id: "a1", position: "2,0" }];
          spawnEvent(st);
          assert("an army does NOT prevent a barbarian from spawning",
            st.map.hexes["2,0"].barbarian === true &&
            st.map.hexes["2,0"].barbarianId === "F",
            JSON.stringify(st.map.hexes["2,0"]));
          assert("the army is defeated and returns to its military focus card",
            st.players[0].armies[0].position === null);
          assert("and F occupies its spawn", whereIs(st, "2,0") === "2,0");
        }

        {
          // A real blocker leaves the figure off the map - not reassigned, not
          // deleted - and the NEXT event tries again once it is cleared.
          const { st, me } = spawnBoard();
          printSpawn(st, "3,0", "F");
          st.map.hexes["3,0"].barbarian = false;
          st.map.hexes["3,0"].barbarianId = null;
          st.map.hexes["3,0"].barbarianToken = null;
          st.map.hexes["3,0"].control =
            { ownerId: me.id, fortified: false, district: null };
          Game.syncBarbarianRegistry(st);
          spawnEvent(st);
          assert("a control token on the spawn does prevent it",
            st.map.hexes["3,0"].barbarian === false);
          assert("F stays off the map, still F, still bound to spawn F",
            offMap(st).join(",") === "F@3,0", JSON.stringify(offMap(st)));
          assert("and it did not take some other icon instead",
            Object.values(st.map.hexes).filter((h) => h.barbarian).length === 0);
          // Clear the blocker; the next event is a fresh attempt.
          st.map.hexes["3,0"].control = null;
          spawnEvent(st);
          assert("the next spawning event returns F to spawn F",
            st.map.hexes["3,0"].barbarian === true &&
            st.map.hexes["3,0"].barbarianId === "F");
          assert("with no permanent failure flag left behind", offMap(st).length === 0);
        }

        {
          // Two letters at once: one can return, the other cannot, and neither
          // borrows the other's space.
          const { st, me } = spawnBoard();
          printSpawn(st, "2,0", "F");
          printSpawn(st, "5,0", "B");
          ["2,0", "5,0"].forEach((k) => {
            st.map.hexes[k].barbarian = false;
            st.map.hexes[k].barbarianId = null;
            st.map.hexes[k].barbarianToken = null;
          });
          st.map.hexes["2,0"].control = { ownerId: me.id, fortified: false, district: null };
          Game.syncBarbarianRegistry(st);
          assert("both are waiting", offMap(st).sort().join(",") === "B@5,0,F@2,0",
            JSON.stringify(offMap(st)));
          spawnEvent(st);
          assert("B returned to B", st.map.hexes["5,0"].barbarianId === "B" &&
            st.map.hexes["5,0"].barbarianToken === "5,0");
          assert("F did not return to B's space", whereIs(st, "2,0") === null);
          assert("F is still waiting as F", offMap(st).join(",") === "F@2,0");
          st.map.hexes["2,0"].control = null;
          spawnEvent(st);
          assert("and later F returns to F, not to any other icon",
            st.map.hexes["2,0"].barbarianId === "F" &&
            st.map.hexes["2,0"].barbarianToken === "2,0");
          assert("both figures are now on their own printed spaces",
            whereIs(st, "2,0") === "2,0" && whereIs(st, "5,0") === "5,0");
        }

        {
          // Two figures printed with the SAME letter on different tiles. The
          // letter cannot tell them apart, so a letter-keyed respawn stranded
          // one of them permanently.
          const { st, me } = spawnBoard();
          printSpawn(st, "1,0", "E");
          printSpawn(st, "6,0", "E");
          st.map.hexes["6,0"].barbarian = false;
          st.map.hexes["6,0"].barbarianId = null;
          st.map.hexes["6,0"].barbarianToken = null;
          Game.syncBarbarianRegistry(st);
          assert("one E is on the board and one is off it",
            whereIs(st, "1,0") === "1,0" && offMap(st).join(",") === "E@6,0");
          spawnEvent(st);
          assert("the absent E returns even though another E is in play",
            st.map.hexes["6,0"].barbarian === true &&
            st.map.hexes["6,0"].barbarianToken === "6,0",
            JSON.stringify(offMap(st)));
          assert("and the one already standing did not move",
            whereIs(st, "1,0") === "1,0");
        }

        {
          // The other two defeat routes go through the same centralised event,
          // so a figure killed by a caravan or a district keeps its identity
          // and its home exactly as one killed in a fight does.
          const currencyKill = () => {
            const { st, me } = spawnBoard();
            printSpawn(st, "1,0", "F");
            // The figure has marched away from home before it is met.
            st.map.hexes["1,0"].barbarian = false;
            st.map.hexes["1,0"].barbarianId = null;
            st.map.hexes["1,0"].barbarianToken = null;
            st.map.hexes["2,0"].barbarian = true;
            st.map.hexes["2,0"].barbarianId = "F";
            st.map.hexes["2,0"].barbarianToken = "1,0";
            Game.syncBarbarianRegistry(st);
            me.cardPlayed = false;
            me.focusRow = ["economy", "science", "growth", "culture", "military", "industry"];
            me.cardTiers.economy = 2;                  // Currency
            me.cardLevels.economy = 2;
            activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
              developed: false, hasWonder: false, wonder: null } });
            st.map.hexes["0,0"].barbarianHome = null;
            me.caravans = [{ id: "c1", position: "0,0" }];
            return { st, me };
          };
          const { st, me } = currencyKill();
          const out = Game.tryApplyAction(st, { type: "PLAY_ECONOMY", payload: {
            playerId: me.id, unitId: "c1", toKey: "2,0", tradeSpent: 0 } },
            { actorId: me.id, role: "player" });
          assert("a Currency caravan clears the barbarian", out.accepted, out.code);
          assert("the figure is off the map", out.state.map.hexes["2,0"].barbarian === false);
          assert("but it is still F, still bound to its printed spawn",
            offMap(out.state).join(",") === "F@1,0", JSON.stringify(offMap(out.state)));
          spawnEvent(out.state);
          assert("and Currency's kill returns to spawn F like any other",
            out.state.map.hexes["1,0"].barbarianId === "F" &&
            out.state.map.hexes["1,0"].barbarianToken === "1,0");
        }
        {
          // An encampment strike, the third route.
          const { st, me } = spawnBoard();
          printSpawn(st, "4,0", "F");
          st.map.hexes["4,0"].barbarian = false;
          st.map.hexes["4,0"].barbarianId = null;
          st.map.hexes["4,0"].barbarianToken = null;
          st.map.hexes["2,0"].barbarian = true;
          st.map.hexes["2,0"].barbarianId = "F";
          st.map.hexes["2,0"].barbarianToken = "4,0";
          Game.syncBarbarianRegistry(st);
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          st.map.hexes["1,0"].control =
            { ownerId: me.id, fortified: false, district: "encampment" };
          Game.resolveEvent(st, "district_event");
          const strike = (st.pendingChoices || []).find((c) => c.kind === "encampment_strike");
          assert("the encampment can reach the barbarian",
            !!strike && strike.hexKeys.includes("2,0"),
            strike && strike.hexKeys.join(" "));
          const hit = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: strike.id, hexKey: "2,0" } });
          assert("the encampment defeats it", hit.map.hexes["2,0"].barbarian === false);
          assert("and it waits as F, bound to spawn F",
            offMap(hit).join(",") === "F@4,0", JSON.stringify(offMap(hit)));
          spawnEvent(hit);
          assert("returning to spawn F, not to the encampment's space",
            hit.map.hexes["4,0"].barbarianId === "F" &&
            hit.map.hexes["2,0"].barbarian === false);
        }
        {
          // The figures are authoritative state, so every seat is told the same
          // thing about them - identity included, not just "a barbarian here".
          const { st } = spawnBoard();
          printSpawn(st, "2,0", "F");
          printSpawn(st, "5,0", "B");
          st.map.hexes["5,0"].barbarian = false;
          st.map.hexes["5,0"].barbarianId = null;
          st.map.hexes["5,0"].barbarianToken = null;
          Game.syncBarbarianRegistry(st);
          const seen = Game.projectState(st, st.players[1].id);
          assert("a rival's view carries the figure on the board with its identity",
            seen.map.hexes["2,0"].barbarian === true &&
            seen.map.hexes["2,0"].barbarianId === "F" &&
            seen.map.hexes["2,0"].barbarianToken === "2,0",
            JSON.stringify(seen.map.hexes["2,0"]));
          assert("and the printed spawns, which are public",
            seen.map.hexes["5,0"].barbarianHome === "B");
          assert("so both seats agree which figures are off the map",
            JSON.stringify(Game.offMapBarbarians(seen).map((b) => b.letter + "@" + b.homeKey)) ===
            JSON.stringify(offMap(st)), JSON.stringify(Game.offMapBarbarians(seen)));
        }
        {
          // MOVEMENT into an army is a different case from SPAWNING onto one.
          // Terra p11: the army is defeated, but it shields its space - the
          // barbarian stays on the last non-water space it occupied, and the
          // city or control token in the army's space is untouched.
          const base = spawnBoard().st;
          const me = base.players[0];
          printSpawn(base, "2,0", "F");
          me.armies = [{ id: "a1", position: "3,0" }];
          base.map.hexes["3,0"].control =
            { ownerId: me.id, fortified: false, district: null };
          let out = null;
          for (let i = 0; i < 500 && !out; i++) {
            const attempt = JSON.parse(JSON.stringify(base));
            Game.resolveEvent(attempt, "barbarian_move");
            if (attempt.barbarianMove && attempt.barbarianMove.roll === 2) out = attempt;
          }
          assert("the march rolled east at least once", !!out);
          if (out) {
            assert("the army in the way is defeated onto its military card",
              out.players[0].armies[0].position === null);
            assert("the barbarian stays on the last space it occupied, not the army's",
              out.map.hexes["2,0"].barbarian === true &&
              out.map.hexes["3,0"].barbarian === false,
              JSON.stringify({ at2: out.map.hexes["2,0"].barbarian,
                at3: out.map.hexes["3,0"].barbarian }));
            assert("and it is still F, still bound to spawn F",
              out.map.hexes["2,0"].barbarianId === "F" &&
              out.map.hexes["2,0"].barbarianToken === "2,0");
            assert("the control token sharing the army's space is protected",
              !!out.map.hexes["3,0"].control &&
              out.map.hexes["3,0"].control.ownerId === me.id,
              JSON.stringify(out.map.hexes["3,0"].control));
          }
        }
      }

      {
        // Barbarians, p12. One roll steers all of them, and a reinforced marker
        // turns the raid back without the barbarian disappearing.
        let lost = 0;
        for (let i = 0; i < 30; i++) {
          const st0 = rulesState();
          Object.values(st0.map.hexes).forEach((h) => { h.barbarian = false; h.barbarianId = null; });
          activate(st0, "0,0", { barbarian: true });
          st0.map.hexes["0,0"].barbarianId = "X";
          Game.hexNeighborKeys(0, 0).forEach((k) => {
            if (st0.map.hexes[k]) activate(st0, k, { control: { ownerId: st0.players[1].id, fortified: true, district: null } });
          });
          Game.resolveEvent(st0, "barbarian_move");
          if (Object.values(st0.map.hexes).filter((h) => h.barbarian).length !== 1) lost++;
        }
        assert("a barbarian is never lost to a reinforced marker", lost === 0);

        const st1 = rulesState();
        Object.values(st1.map.hexes).forEach((h) => {
          h.barbarian = false; h.barbarianId = null; h.barbarianHome = null;
        });
        activate(st1, "2,0");
        st1.map.hexes["2,0"].barbarianHome = "K";
        Game.resolveEvent(st1, "barbarian_return");
        assert("a defeated barbarian returns to its printed space",
          st1.map.hexes["2,0"].barbarian === true && st1.map.hexes["2,0"].barbarianId === "K");
      }

      // ── Reported from a real game: industry trade, the Sanitation sequence,
      //    and the undo that could not escape it ──────────────────────────────
      //
      // All three had one shape: a value the player could see disagreed with
      // the value a subsystem acted on. The engine assertions below pin the
      // arithmetic and the sequencing so the wizard has one thing to render.
      {
        // FOCUS_SLOTS is [1,1,2,3,4,5]: six positions, printed slots 1..5. A
        // card in the fifth ARRAY position is printed slot 4.
        const industryAt = (trade) => {
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.focusRow = ["growth", "science", "economy", "culture", "industry", "military"];
          me.trade.industry = trade;
          Object.keys(st.map.hexes).forEach((k) => activate(st, k));
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          const deck = st.wonderDecks.military;
          deck.deck = ["Terracotta Army"].concat(deck.deck.filter((n) => n !== "Terracotta Army"));
          deck.revealed = "Terracotta Army";
          deck.token = 0;
          return { st, me };
        };
        const { st: iSt, me: iMe } = industryAt(3);
        assert("industry sits in printed slot 4", Game.getSlotValue(iMe, "industry", iSt) === 4,
          Game.getSlotValue(iMe, "industry", iSt));
        assert("the card really holds 3 trade tokens (the storage cap)",
          iMe.trade.industry === 3 && Game.CFG.maxTrade === 3);
        // Each industry trade token spent on a wonder is +1 production. The
        // wizard once previewed slot + a STALE selection carried over from the
        // previously clicked card, so a card holding 3 read as though 2 were
        // already committed.
        [0, 1, 2, 3].forEach((spend) => {
          const preview = Game.calculateWonderProduction(iSt, iMe, "Terracotta Army", { tradeSpent: spend });
          assert(`industry slot 4 + ${spend} trade = ${4 + spend} production`,
            preview.ok && preview.production.total === 4 + spend,
            preview.ok ? preview.production.total : preview.message);
          assert(`and the breakdown attributes ${spend} of it to trade`,
            preview.ok && preview.production.base === 4 && preview.production.trade === spend);
        });
        // Affordability is derived from whatever the card actually costs, not
        // from a number written here: the printed costs are audited separately
        // and this test is about the production ARITHMETIC. Hard-coding 7 made
        // these fail the moment Terracotta Army was corrected to 8.
        // Pick a wonder that slot 4 plus at most 3 trade can actually reach, so
        // the affordability boundary is testable whatever the printed costs are.
        const reachable = Game.ALL_WONDERS
          .map((w) => ({ name: w.name, cost: Game.calculateWonderCost(w.name, iMe, iSt).finalCost }))
          .filter((w) => w.cost > 4 && w.cost <= 7)
          .sort((a, b) => a.cost - b.cost)[0];
        assert("a wonder exists that 4 + up to 3 trade can buy", !!reachable,

      {

        const sanitation = (trade, spareTokens) => {
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.cardTiers.growth = 3;

          ["0,1", "-1,1"].forEach((k) => activate(st, k, { control: { ownerId: p.id, fortified: false, district: null } }));

          Game.getActionPermission(mid, { type: "PLAY_SCIENCE", payload: {} }, ctx).code === "card_resolution_pending");
        assert("but UNDO_TURN is not refused by that guard",

          const joint = begun.state.combat.atkParts.find((part) => part.label === "joint war pacts");

          const rolled = Game.tryApplyAction(restarted.state,
            { type: "COMBAT_ROLL", payload: { side: "attacker" } },

        {
          const st = interactionState();

            targets.some((target) => target.type === "caravan" && target.ownerId === caravanOwner.id),
            JSON.stringify(targets));

          const begun = Game.tryApplyAction(st, action,
            { actorId: attacker.id, role: "player" });

            begun.accepted && begun.state.combat.defenderOwnerId === caravanOwner.id &&
            begun.state.combat.defenderUnitId === caravanOwner.caravans[0].id);
          const forged = Game.tryApplyAction(st, {
            ...action,
            payload: { ...action.payload, targetUnitId: "missing-unit" }

        {

          // "non_aggression" is the CARD id; the refusal reason is

          assert("the pact holder can return it and swap Military with a chosen card",

        {

          activate(st, "1,0", { terrain: "mountain",

          activate(mature, "1,0", { control: { ownerId: borderGiver.id, fortified: false, district: null } });
          assert("Open Borders applies to city maturity",

          owner.diplomacy = [];

        }

        {
          const st = interactionState();
          const [attacker, defender, outsider] = st.players;
          defender.trade.culture = 1;
          defender.trade.science = 1;
          const action = prepareArmyAttack(st, attacker, defender, {
            unit: false,
            targetType: "city",
            hex: { city: { ownerId: defender.id, isCapital: true, developed: true,
              hasWonder: false, wonder: null } }
          });
          const begun = Game.tryApplyAction(st, action,
            { actorId: attacker.id, role: "player" });
          const won = forceAttackerWin(begun.state, begun.state.players[0]);
          const take = won.pendingChoices.find((choice) => choice.kind === "capital_loot_take");
          assert("capital loot waits for the attacker to choose an existing rival token",
            !!take && take.playerId === attacker.id && take.options.length === 2 &&
            won.players[0].trade.culture === 0 && won.players[0].trade.science === 0);
          const theft = Game.tryApplyAction(won, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: take.id, optionId: "science" }
          }, { actorId: attacker.id, role: "player" });
          const place = theft.state.pendingChoices.find((choice) => choice.kind === "capital_loot_place");
          assert("the stolen token is removed only after the attacker chooses it",

          const hijack = Game.tryApplyAction(theft.state, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: place.id, optionId: "economy" }
          }, { actorId: outsider.id, role: "player" });
          assert("another player cannot choose where captured-capital loot goes",
            !hijack.accepted && hijack.code === "choice_owner_mismatch");
          const placed = Game.tryApplyAction(theft.state, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: place.id, optionId: "economy" }
          }, { actorId: attacker.id, role: "player" });
          assert("the attacker chooses their own destination card for capital loot",
            placed.accepted && placed.state.players[0].trade.economy === 1 &&
            placed.state.pendingChoices.some((choice) => choice.kind === "capital_loot_take"));
        }

        {
          const st = interactionState();
          const [attacker, defender, outsider] = st.players;
          defender.cityStateTokens = ["Geneva"];
          const action = prepareArmyAttack(st, attacker, defender, {
            unit: false,
            targetType: "city",
            hex: { city: { ownerId: defender.id, isCapital: false, developed: true,
              hasWonder: true, wonder: { name: "Cristo Redentor", era: "modern", type: "culture" },
              conqueredCityState: { name: "Geneva", type: "science" } } }
          });
          const begun = Game.tryApplyAction(st, action,
            { actorId: attacker.id, role: "player" });
          const won = forceAttackerWin(begun.state, begun.state.players[0]);
          const fate = won.pendingChoices.find((choice) => choice.kind === "city_state_fate");
          assert("captured city-state cities create an attacker-owned conquer/liberate choice",
            !!fate && fate.playerId === attacker.id && fate.options.length === 2);
          const denied = Game.tryApplyAction(won, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: fate.id, optionId: "liberate" }
          }, { actorId: outsider.id, role: "player" });
          assert("an unrelated seat cannot decide a conquered city-state's fate",
            !denied.accepted && denied.code === "choice_owner_mismatch");
          const liberated = Game.tryApplyAction(won, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: fate.id, optionId: "liberate" }
          }, { actorId: attacker.id, role: "player" });
          assert("liberation restores the city-state and grants its diplomacy",
            liberated.accepted && liberated.state.map.hexes["1,0"].city === null &&
            liberated.state.map.hexes["1,0"].cityState.name === "Geneva" &&
            liberated.state.players[0].diplomacy.some((card) => card.fromCityState === "Geneva") &&
            !liberated.state.players[1].cityStateTokens.includes("Geneva"));
          assert("a liberated city-state keeps its world wonder physically present but unowned",
            liberated.state.map.hexes["1,0"].unownedWonder.name === "Cristo Redentor" &&
            !Game.hasWonder(liberated.state, attacker.id, "Cristo Redentor") &&
            !Game.hasWonder(liberated.state, defender.id, "Cristo Redentor"));
        }


        {
          const st = interactionState();
          const [attacker] = st.players;
          activate(st, "0,0", {
            city: { ownerId: attacker.id, isCapital: true, developed: true,
              hasWonder: false, wonder: null }
          });
          activate(st, "1,0", {
            cityState: { name: "Geneva", type: "science", diplomacyCards: 2 },
            unownedWonder: { name: "Apadana", era: "ancient", type: "culture" }
          });
          attacker.armies[0].position = "0,0";
          const begun = Game.tryApplyAction(st, {
            type: "PLAY_MILITARY_ATTACK",
            payload: { unitId: attacker.armies[0].id, fromKey: "0,0", toKey: "1,0",
              targetType: "citystate", tradeSpent: 0 }
          }, { actorId: attacker.id, role: "player" });
          const won = forceAttackerWin(begun.state, begun.state.players[0]);
          assert("the next city-state conqueror captures its previously unowned wonder",
            won.map.hexes["1,0"].city.wonder.name === "Apadana" &&
            !won.map.hexes["1,0"].unownedWonder && Game.hasWonder(won, attacker.id, "Apadana"));
        }

        {
          // Dutch water is friendly as every terrain only for district effects.
          const st = interactionState();
          const dutch = st.players[0];
          dutch.leaderId = "netherlands";
          activate(st, "0,0", { terrain: "grass",
            control: { ownerId: dutch.id, fortified: false, district: "campus" } });
          activate(st, "1,0", { terrain: "water" });
          Game.resolveEvent(st, "district_event");
          assert("Netherlands treats water beside a district as friendly mountain for Campus",
            dutch.trade.science >= 1 && st.districtReport[0].paid.includes("1,0"), JSON.stringify({ trade: dutch.trade.science,
              report: st.districtReport, log: st.log.slice(-4) }));
          assert("Dutch district water does not become an ordinary friendly Culture anchor",
            !Game.validControlHexes(st, dutch.id, 5).has("0,1"));
          // The ability is driven through the real district event and the trade
          // it produced is asserted, together with its printed limit: the water
          // counts only while a district ability resolves, not as ordinary
          // friendly ground.
          proves("civ.netherlands");
        }
      }

      // ── Setup gives information before it asks for decisions ────────────
      //
      // Civilization, colour, focus row and the player's own capital tile are
      // all dealt BEFORE fortress placement, so the fortress is an informed
      // choice. The tile's FACE is a separate decision made later, when the
      // tile is actually laid: knowing both possibilities is not the same as
      // having committed to one. tools/browser-smoke.js asserts that the panel
      // actually shows all of this and leaks none of the undrawn stack.
      {
        const twoPlayerSetup = () => {
          let st = Game.createLobbyState([Game.createPlayer("s1", "A", "#169eae")], {});
          st = Game.applyAction(st, { type: "ADD_PLAYER", payload: Game.createPlayer("s2", "B", "#d94747") });
          return Game.applyAction(st, { type: "START_GAME", payload: {} });
        };
        const st = twoPlayerSetup();
        assert("setup opens on fortress placement", st.setup.phase === "fortress", st.setup.phase);
        assert("every player already holds exactly one capital tile, and it is a capital tile",
          st.players.every((p) => {
            const hand = st.setup.playerTiles[p.id] || [];
            const def = hand.length === 1 && Game.getTileDef(hand[0]);
            return def && def.kind === "capital";
          }));
        assert("no two players were dealt the same capital tile",
          new Set(st.players.map((p) => (st.setup.playerTiles[p.id] || [])[0])).size === st.players.length);
        assert("every player already has a colour and a six-card focus row",
          st.players.every((p) => !!p.color && (p.focusRow || []).length === 6));
        assert("the core is already on the board to read",
          Object.values(st.map.hexes).filter((h) => h.active).length > 0);
        assert("and the undrawn tiles are still in the stack, not on the board",
          (st.setup.tileStack || []).length > 0);
        const dealt = (st.setup.playerTiles["s1"] || [])[0];
        assert("the dealt capital tile is not placed and has no side committed",
          st.setup.tiles[dealt].placed === false && st.setup.tiles[dealt].anchorKey === null);
        const def = Game.getTileDef(dealt);
        assert("both of its faces are real and different",
          def.sides.A.cells.length === 10 && def.sides.B.cells.length === 10 &&
          JSON.stringify(def.sides.A.cells) !== JSON.stringify(def.sides.B.cells));

        // Place the fortresses, then lay the capital tile - the face is chosen
        // here, and the capital lands on the star printed on THAT face.
        let run = twoPlayerSetup();
        for (let i = 0; i < 4 && run.setup.phase === "fortress"; i++) {
          const who = run.setup.order[run.setup.turnIndex];
          run = Game.applyAction(run, { type: "PLACE_FORTRESS",
            payload: { playerId: who, hexKey: [...Game.getValidFortressHexes(run)][0] } });
        }
        assert("after the fortresses, setup asks for the capital tile",
          run.setup.phase === "capital_tile", run.setup.phase);
        const actor = run.setup.order[run.setup.turnIndex];
        const tileId = (run.setup.playerTiles[actor] || [])[0];
        const layOn = (side) => {
          for (let rot = 0; rot < 6; rot++) {
            for (const anchorKey of [...(Game.getValidTileAnchors(run, tileId, rot) || [])]) {
              const out = Game.applyAction(JSON.parse(JSON.stringify(run)), { type: "PLACE_TILE",
                payload: { playerId: actor, tileId, anchorKey, rotation: rot, side } });
              if (out.setup.tiles[tileId].placed) return out;
            }
          }
          return null;
        };
        const onA = layOn("A");
        const onB = layOn("B");
        assert("the capital tile can be laid either face up", !!onA && !!onB);
        assert("and the chosen face is what gets recorded",
          onA.setup.tiles[tileId].side === "A" && onB.setup.tiles[tileId].side === "B");
        const capitalOn = (out, side) => {
          const cells = Object.values(out.map.hexes).filter((h) => h.tileId === tileId);
          const capital = cells.find((h) => h.city && h.city.isCapital);
          const printed = Game.getTileDef(tileId).sides[side].cells
            .findIndex((cell) => cell.feature === "capital");
          return { cells: cells.length, ok: !!capital && capital.tileCell === printed, printed };
        };
        const a = capitalOn(onA, "A"), b = capitalOn(onB, "B");
        assert("each face puts the capital on the star printed on that face",
          a.cells === 10 && b.cells === 10 && a.ok && b.ok, JSON.stringify({ a, b }));
      }

      // ── The host administers the lobby ──────────────────────────────────
      //
      // Removing a seat is only safe BEFORE the board exists. Once setup has
      // dealt tiles and figures, deleting a civilization would orphan its
      // cities, control tokens, districts, diplomacy and turn slot, and there
      // is no printed rule for an abandoned civilization - so this refuses
      // rather than inventing one.
      {
        const PURPLE = "#8b62b5";
        const room = () => {
          let st = Game.createLobbyState([Game.createPlayer("host", "Host", "#169eae")], {});
          st = Game.applyAction(st, { type: "ADD_PLAYER", payload: Game.createPlayer("g1", "Guest1", "#d94747") });
          st = Game.applyAction(st, { type: "ADD_PLAYER", payload: Game.createPlayer("g2", "Guest2", PURPLE) });
          return Game.applyAction(st, { type: "SET_LEADER", payload: { playerId: "g1", leaderId: "rome" } });
        };
        const may = (st, target, ctx) =>
          Game.getActionPermission(st, { type: "KICK_PLAYER", payload: { targetId: target } }, ctx);

        const st = room();
        assert("host may remove another lobby player",
          may(st, "g1", { actorId: "host", role: "host" }).ok);
        assert("a guest may not remove anyone",
          may(st, "g2", { actorId: "g1", role: "player" }).code === "host_only");
        assert("a guest may not remove the host",
          !may(st, "host", { actorId: "g1", role: "player" }).ok);
        assert("a caller claiming host without a seat is refused",
          may(st, "g1", { actorId: "nobody", role: "host" }).code === "unknown_actor");
        assert("the host may not remove itself",
          may(st, "host", { actorId: "host", role: "host" }).code === "kick_self");
        assert("an unknown target is refused",
          may(st, "ghost", { actorId: "host", role: "host" }).code === "kick_target_unknown");

        // A guest cannot smuggle a victim through playerId: host actions have
        // that field stripped, and the target travels as targetId.
        const smuggle = Game.tryApplyAction(room(),
          { type: "KICK_PLAYER", payload: { playerId: "g2", targetId: "g2" } },
          { actorId: "g1", role: "player" });
        assert("a guest's forged kick changes nothing",
          smuggle.accepted === false && smuggle.state.players.length === 3, smuggle.code);

        const kicked = Game.tryApplyAction(room(), { type: "KICK_PLAYER", payload: { targetId: "g2" } },
          { actorId: "host", role: "host" });
        assert("the host's kick is accepted", kicked.accepted === true, JSON.stringify(kicked.code));
        assert("the seat leaves the authoritative state and the turn order",
          kicked.state.players.length === 2 && !Game.getPlayer(kicked.state, "g2") &&
          !kicked.state.turn.order.includes("g2"));
        assert("the removed seat's colour is free again",
          Game.colorIsFree(kicked.state, PURPLE), JSON.stringify(Game.availableColors(kicked.state)));
        assert("the removal is recorded so the client can be told",
          Array.isArray(kicked.state.kicked) && kicked.state.kicked.includes("g2"));
        assert("the removed seat can no longer act",
          Game.getActionPermission(kicked.state,
            { type: "SET_LEADER", payload: { leaderId: "aztec" } }, { actorId: "g2" }).code === "unknown_actor");

        // The civilization the kicked player held becomes available again.
        const freed = Game.tryApplyAction(room(), { type: "KICK_PLAYER", payload: { targetId: "g1" } },
          { actorId: "host", role: "host" });
        const retaken = Game.applyAction(freed.state,
          { type: "SET_LEADER", payload: { playerId: "g2", leaderId: "rome" } });
        assert("the removed player's civilization can be taken by someone else",
          Game.getPlayer(retaken, "g2").leaderId === "rome");

        const started = Game.applyAction(room(), { type: "START_GAME", payload: {} });
        assert("a seat cannot be deleted once the game has started",
          may(started, "g1", { actorId: "host", role: "host" }).code === "kick_requires_lobby");
        assert("and that seat is still on the board", !!Game.getPlayer(started, "g1"));
      }

      // ── Terra seats five, and the fifth is purple ───────────────────────
      //
      // Purple was present in the engine, in SEAT_COLORS and as a complete set
      // of printed assets while the lobby markup listed four colours, so the
      // fifth player could not be chosen at all. These assert the seating
      // rules; tools/browser-smoke.js asserts the picker itself.
      {
        const PURPLE = "#8b62b5";
        const FIVE = ["#169eae", "#d94747", "#e88b24", "#76a94f", PURPLE];
        assert("five printed component colours are seatable",
          Game.SEAT_COLORS.length === 5 && FIVE.every((c) => Game.SEAT_COLORS.includes(c)),
          JSON.stringify(Game.SEAT_COLORS));
        assert("the table seats five", Game.CFG.maxPlayers === 5, Game.CFG.maxPlayers);

        const fill = (wanted) => {
          let lob = Game.createLobbyState([Game.createPlayer("p1", "Host", wanted[0] || "")], {});
          for (let i = 2; i <= wanted.length; i++) {
            lob = Game.applyAction(lob, { type: "ADD_PLAYER",
              payload: Game.createPlayer("p" + i, "P" + i, wanted[i - 1] || "") });
          }
          return lob;
        };

        const auto = fill(["", "", "", "", ""]);
        const autoColors = auto.players.map((p) => p.color);
        assert("five players who choose nothing all get a distinct colour",
          auto.players.length === 5 && new Set(autoColors).size === 5, JSON.stringify(autoColors));
        assert("and the set is exactly the five printed colours, purple included",
          FIVE.every((c) => autoColors.includes(c)), JSON.stringify(autoColors));

        const picked = fill(["#169eae", PURPLE]);
        assert("a player who asks for purple receives purple",
          picked.players[1].color === PURPLE, picked.players[1].color);

        // A component colour already in use is REFUSED. Seating the newcomer in
        // a different colour would mean a stale client silently plays a seat it
        // never chose, which is the behaviour this replaced.
        const clash = fill([PURPLE, PURPLE]);
        assert("a component colour already in use is refused, not shared or swapped",
          clash.players.length === 1 && clash.players[0].color === PURPLE,
          JSON.stringify(clash.players.map((p) => p.color)));

        // Changing seats in the lobby releases the colour being left behind.
        let swap = fill(["#169eae", "#d94747"]);
        const taken = Game.getActionPermission(swap,
          { type: "SET_COLOR", payload: { color: "#169eae" } }, { actorId: "p2" });
        assert("a seat cannot move onto an occupied colour",
          !taken.ok && taken.code === "color_taken", JSON.stringify(taken));
        swap = Game.applyAction(swap, { type: "SET_COLOR", payload: { playerId: "p2", color: PURPLE } });
        assert("a seat can move to a free colour",
          swap.players[1].color === PURPLE, swap.players[1].color);
        assert("and the colour it left is free again",
          Game.colorIsFree(swap, "#d94747"), Game.availableColors(swap));
        const nowFree = Game.applyAction(swap,
          { type: "SET_COLOR", payload: { playerId: "p1", color: "#d94747" } });
        assert("another seat can then take the released colour",
          nowFree.players[0].color === "#d94747", nowFree.players[0].color);
        assert("no two seats ever share a colour",
          new Set(nowFree.players.map((p) => p.color)).size === nowFree.players.length);

        const sixth = fill(["", "", "", "", "", ""]);
        assert("a sixth seat is refused", sixth.players.length === 5, sixth.players.length);

        const started = Game.applyAction(fill(["", "", "", "", ""]),
          { type: "START_GAME", payload: {} });
        assert("a five-player game leaves the lobby",
          started.phase !== "lobby" && started.players.length === 5,
          JSON.stringify({ phase: started.phase, n: started.players.length }));
        assert("turn order contains all five seats",
          new Set(started.turn.order).size === 5, JSON.stringify(started.turn.order));
        const violet = started.players.find((p) => p.color === PURPLE);
        assert("the purple seat exists, is in the turn order and has its own pieces",
          violet && started.turn.order.includes(violet.id) &&
          violet.focusRow.length === 6 && Array.isArray(violet.armies) &&
          Array.isArray(violet.caravans));
      }

      // ── Amundsen-Scott is all-or-nothing ────────────────────────────────
      //
      // The printed card does not put this wonder in a city you already hold:
      // "build a city on any legal space on the edge of the map and place this
      // wonder in that city". A board with no legal rim space therefore cannot
      // resolve it at all - which makes a legal site a precondition of BUYING
      // it, not a follow-up that may quietly fizzle. It used to fizzle: the
      // production was spent, the deck advanced to the next card, and the
      // station stayed in the ordinary city it was bought from, a board state
      // the printed card cannot produce.
      {
        const AM = "Amundsen-Scott Research Station";
        const amundsenBoard = (rimAvailable) => {
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.focusRow = ["growth", "science", "economy", "culture", "industry", "military"];
          me.trade.industry = 3;
          Object.keys(st.map.hexes).forEach((k) => activate(st, k));
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          const deck = st.wonderDecks.science;
          deck.deck = [AM].concat(deck.deck.filter((n) => n !== AM));
          deck.revealed = AM;
          deck.token = 0;
          if (!rimAvailable) {
            // A rival token on every other space leaves no legal city site.
            Object.entries(st.map.hexes).forEach(([k, h]) => {
              if (k === "0,0") return;
              h.control = { ownerId: st.players[1].id, fortified: false, district: null };
            });
          }
          // Afford it whatever the printed cost, using its own printed icons.
          me.resources.mercury = 9;
          me.resources.diamonds = 9;
          return { st, me };
        };
        const pay = { wonderName: AM, tradeSpent: 3, resources: { mercury: 2, diamonds: 2 } };

        const openBoard = amundsenBoard(true);
        assert("Amundsen: a rim site exists on an open board",
          Game.amundsenSites(openBoard.st, openBoard.me.id).length > 0);
        assert("Amundsen: the build is permitted when it can be resolved",
          Game.getActionPermission(openBoard.st,
            { type: "PLAY_INDUSTRY_WONDER", payload: { hexKey: "0,0", ...pay } },
            { actorId: openBoard.me.id }).ok);

        const closedBoard = amundsenBoard(false);
        assert("Amundsen: no rim site means no rim site",
          Game.amundsenSites(closedBoard.st, closedBoard.me.id).length === 0);
        const refusal = Game.getActionPermission(closedBoard.st,
          { type: "PLAY_INDUSTRY_WONDER", payload: { hexKey: "0,0", ...pay } },
          { actorId: closedBoard.me.id });
        assert("Amundsen: the build is REFUSED when it cannot be resolved",
          !refusal.ok && refusal.code === "amundsen_no_rim_city", JSON.stringify(refusal));

        // Nothing irreversible may happen on the impossible board.
        const before = {
          trade: closedBoard.me.trade.industry,
          mercury: closedBoard.me.resources.mercury,
          revealed: closedBoard.st.wonderDecks.science.revealed,
          deckLen: closedBoard.st.wonderDecks.science.deck.length
        };
        const tried = Game.tryApplyAction(closedBoard.st,
          { type: "PLAY_INDUSTRY_WONDER", payload: { hexKey: "0,0", ...pay } },
          { actorId: closedBoard.me.id, role: "player" });
        assert("Amundsen: the transaction is refused rather than half-applied",
          tried.accepted === false && tried.code === "amundsen_no_rim_city", JSON.stringify(tried.code));
        assert("Amundsen: no production, no reveal, no placement",
          Game.getPlayer(tried.state, closedBoard.me.id).trade.industry === before.trade &&
          Game.getPlayer(tried.state, closedBoard.me.id).resources.mercury === before.mercury &&
          tried.state.wonderDecks.science.revealed === before.revealed &&
          tried.state.wonderDecks.science.deck.length === before.deckLen &&
          !tried.state.map.hexes["0,0"].city.hasWonder);

        // And the resolvable board still works all the way through.
        const built = Game.applyAction(openBoard.st, { type: "PLAY_INDUSTRY_WONDER",
          payload: { playerId: openBoard.me.id, hexKey: "0,0", ...pay } });
        const site = (built.pendingChoices || []).find((c) => c.kind === "amundsen_site");
        assert("Amundsen: building it asks where its own city goes", !!site);
        if (site) {
          const target = site.hexKeys[0];
          const done = Game.applyAction(built, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: openBoard.me.id, choiceId: site.id, hexKey: target } });
          assert("Amundsen: a city is founded on the rim and holds the wonder",
            done.map.hexes[target].city && done.map.hexes[target].city.wonder &&
            done.map.hexes[target].city.wonder.name === AM, target);
          assert("Amundsen: it no longer sits in the city it was bought from",
            !done.map.hexes["0,0"].city.wonder && !done.map.hexes["0,0"].city.hasWonder);
          assert("Amundsen: the 2 control tokens follow it",
            (done.pendingChoices || []).some((c) => c.source === AM && c.kind === "place_control"));
        }
        // The whole card: it founds its own rim city, the wonder ends up in
        // THAT city and not the one it was bought from, the follow-up tokens
        // are offered, and a board that cannot host it refuses the purchase
        // outright rather than half-applying it.
        proves("wonder.science.amundsen_scott_research_station");
      }

      {
        // The combat wonders, each driven through a REAL attack action and
        // read off the combat state that action produced, against the same
        // board without the wonder. A getter returning the right number is not
        // the claim; the claim is that a fight on this board is worth more.
        const combatBoard = (opts) => {
          const o = opts || {};
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.control = null; h.city = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 5; q++) {
            for (let r = -2; r <= 2; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          activate(st, "2,0", { terrain: "grass",
            control: { ownerId: foe.id, fortified: false, district: null } });
          me.armies = [{ id: "a1", position: "1,0" }];
          if (o.setUp) o.setUp(st, me, foe);
          return { st, me, foe };
        };
        // Give a player a wonder by putting it in a city they own. `city` lets
        // a defender's wonder sit somewhere other than the attacker's capital.
        const giveWonder = (st, playerId, name, type, cityKey) => {
          const key = cityKey || "0,0";
          const hex = st.map.hexes[key];
          hex.city = { ownerId: playerId, isCapital: !cityKey, developed: false,
            hasWonder: true, wonder: { name, type: type || "military", era: "ancient" } };
        };
        // Drive the attack and hand back the authoritative combat numbers.
        const fight = (b) => {
          const out = Game.tryApplyAction(b.st, { type: "PLAY_MILITARY_ATTACK", payload: {
            playerId: b.me.id, unitId: "a1", fromKey: "1,0", toKey: "2,0",
            targetType: "control" } }, { actorId: b.me.id, role: "player" });
          if (!out.accepted || !out.state.combat) return { ok: false, code: out.code };
          const c = out.state.combat;
          return { ok: true, state: out.state, combat: c,
            atk: c.atkBase, def: c.defBase, parts: c.atkParts || [] };
        };

        // ── Terracotta Army: "When attacking, +2 combat value." ──────────
        {
          const plain = fight(combatBoard());
          const withIt = fight(combatBoard({ setUp: (s2, me2) =>
            giveWonder(s2, me2.id, "Terracotta Army") }));
          assert("a plain attack resolves", plain.ok, plain.code);
          assert("Terracotta Army is worth exactly +2 on the attack",
            withIt.ok && withIt.atk === plain.atk + 2, `${plain.atk} -> ${withIt.atk}`);
          assert("and the breakdown carries it as a wonder line worth 2",
            withIt.parts.some((p) => /wonder/i.test(p.label) && p.value === 2),
            JSON.stringify(withIt.parts));
          const defending = fight(combatBoard({ setUp: (s2, me2, foe2) =>
            giveWonder(s2, foe2.id, "Terracotta Army", "military", "4,0") }));
          assert("it does nothing for the defender: the card says when ATTACKING",
            defending.ok && defending.def === plain.def, `${plain.def} -> ${defending.def}`);
          proves("wonder.military.terracotta_army");
        }

        // ── Alhambra: "attacking OR defending, +2." ──────────────────────
        {
          const plain = fight(combatBoard());
          const attacking = fight(combatBoard({ setUp: (s2, me2) =>
            giveWonder(s2, me2.id, "Alhambra") }));
          assert("Alhambra adds 2 when attacking",
            attacking.ok && attacking.atk === plain.atk + 2,
            `${plain.atk} -> ${attacking.atk}`);
          const defending = fight(combatBoard({ setUp: (s2, me2, foe2) =>
            giveWonder(s2, foe2.id, "Alhambra", "military", "4,0") }));
          assert("and 2 when defending, which Terracotta does not",
            defending.ok && defending.def === plain.def + 2,
            `${plain.def} -> ${defending.def}`);
          proves("wonder.military.alhambra");
        }

        // ── Ruhr Valley: "When defending, +5." ───────────────────────────
        {
          const plain = fight(combatBoard());
          const defending = fight(combatBoard({ setUp: (s2, me2, foe2) =>
            giveWonder(s2, foe2.id, "Ruhr Valley", "military", "4,0") }));
          assert("Ruhr Valley is worth 5 to the defender",
            defending.ok && defending.def === plain.def + 5,
            `${plain.def} -> ${defending.def}`);
          const attacking = fight(combatBoard({ setUp: (s2, me2) =>
            giveWonder(s2, me2.id, "Ruhr Valley") }));
          assert("and nothing to the attacker",
            attacking.ok && attacking.atk === plain.atk,
            `${plain.atk} -> ${attacking.atk}`);
          proves("wonder.military.ruhr_valley");
        }

        // ── Huey Teocalli: "+1 per WATER SPACE ADJACENT TO THE DEFENDING
        //    SPACE, when defending." ────────────────────────────────────
        {
          const plain = fight(combatBoard());
          const dry = fight(combatBoard({ setUp: (s2, me2, foe2) =>
            giveWonder(s2, foe2.id, "Huey Teocalli", "military", "4,0") }));
          assert("with no water beside the defending space it is worth nothing",
            dry.ok && dry.def === plain.def, `${plain.def} -> ${dry.def}`);
          const wet = fight(combatBoard({ setUp: (s2, me2, foe2) => {
            giveWonder(s2, foe2.id, "Huey Teocalli", "military", "4,0");
            // Two of the defending space's six neighbours are water.
            activate(s2, "2,1", { terrain: "water" });
            activate(s2, "2,-1", { terrain: "water" });
          } }));
          assert("two adjacent water spaces are worth exactly 2",
            wet.ok && wet.def === plain.def + 2, `${plain.def} -> ${wet.def}`);
          const oneWet = fight(combatBoard({ setUp: (s2, me2, foe2) => {
            giveWonder(s2, foe2.id, "Huey Teocalli", "military", "4,0");
            activate(s2, "2,1", { terrain: "water" });
          } }));
          assert("and one is worth exactly 1, so it counts spaces rather than a flat bonus",
            oneWet.ok && oneWet.def === plain.def + 1, `${plain.def} -> ${oneWet.def}`);
          proves("wonder.military.huey_teocalli");
        }

        // ── Big Ben: "+2 for each of your CARAVANS ADJACENT TO THE
        //    DEFENDING SPACE, attacking or defending." ──────────────────
        {
          const plain = fight(combatBoard());
          const none = fight(combatBoard({ setUp: (s2, me2) =>
            giveWonder(s2, me2.id, "Big Ben", "economy") }));
          assert("with no caravan near the fight Big Ben is worth nothing",
            none.ok && none.atk === plain.atk, `${plain.atk} -> ${none.atk}`);
          const one = fight(combatBoard({ setUp: (s2, me2) => {
            giveWonder(s2, me2.id, "Big Ben", "economy");
            me2.caravans = [{ id: "c1", position: "2,1" }];   // beside 2,0
          } }));
          assert("one adjacent caravan is worth 2",
            one.ok && one.atk === plain.atk + 2, `${plain.atk} -> ${one.atk}`);
          const two = fight(combatBoard({ setUp: (s2, me2) => {
            giveWonder(s2, me2.id, "Big Ben", "economy");
            me2.caravans = [{ id: "c1", position: "2,1" }, { id: "c2", position: "2,-1" }];
          } }));
          assert("two are worth 4, so it counts caravans",
            two.ok && two.atk === plain.atk + 4, `${plain.atk} -> ${two.atk}`);
          const far = fight(combatBoard({ setUp: (s2, me2) => {
            giveWonder(s2, me2.id, "Big Ben", "economy");
            me2.caravans = [{ id: "c1", position: "5,0" }];   // nowhere near
          } }));
          assert("a caravan away from the defending space counts for nothing",
            far.ok && far.atk === plain.atk, `${plain.atk} -> ${far.atk}`);
          proves("wonder.economy.big_ben");
        }

        // ── Kremlin: "+4 when attacking a rival space (NOT CITY-STATE) if you
        //    have MORE reinforced control tokens on the map than the
        //    defending player." ────────────────────────────────────────
        {
          const plain = fight(combatBoard());
          const behind = fight(combatBoard({ setUp: (s2, me2, foe2) => {
            giveWonder(s2, me2.id, "Kremlin");
            activate(s2, "3,0", { control: { ownerId: foe2.id, fortified: true, district: null } });
          } }));
          assert("with fewer reinforced tokens than the defender it adds nothing",
            behind.ok && behind.atk === plain.atk, `${plain.atk} -> ${behind.atk}`);
          const level = fight(combatBoard({ setUp: (s2, me2, foe2) => {
            giveWonder(s2, me2.id, "Kremlin");
            activate(s2, "3,0", { control: { ownerId: foe2.id, fortified: true, district: null } });
            activate(s2, "0,1", { control: { ownerId: me2.id, fortified: true, district: null } });
          } }));
          assert("level pegging is not MORE, so it still adds nothing",
            level.ok && level.atk === plain.atk, `${plain.atk} -> ${level.atk}`);
          const ahead = fight(combatBoard({ setUp: (s2, me2, foe2) => {
            giveWonder(s2, me2.id, "Kremlin");
            activate(s2, "3,0", { control: { ownerId: foe2.id, fortified: true, district: null } });
            activate(s2, "0,1", { control: { ownerId: me2.id, fortified: true, district: null } });
            activate(s2, "0,-1", { control: { ownerId: me2.id, fortified: true, district: null } });
          } }));
          assert("being ahead on reinforced tokens is worth 4",
            ahead.ok && ahead.atk === plain.atk + 4, `${plain.atk} -> ${ahead.atk}`);
          proves("wonder.science.kremlin");
        }

        // ── Pentagon: "+2 attacking. Your armies can move ANY NUMBER of
        //    spaces (still obeying all other movement rules)." ──────────
        {
          const plain = fight(combatBoard());
          const withIt = fight(combatBoard({ setUp: (s2, me2) =>
            giveWonder(s2, me2.id, "Pentagon") }));
          assert("Pentagon adds 2 to an attack",
            withIt.ok && withIt.atk === plain.atk + 2, `${plain.atk} -> ${withIt.atk}`);

          // The movement half: the same army, the same board, one wonder apart.
          const reach = (hasPentagon) => {
            const b = combatBoard({ setUp: (s2, me2) => {
              // Lay the lane FIRST: activate() resets a hex, and clearing the
              // capital would take the wonder with it.
              for (let q = -2; q <= 5; q++) activate(s2, q + ",0", { terrain: "grass" });
              activate(s2, "3,1", { terrain: "water" });
              if (hasPentagon) giveWonder(s2, me2.id, "Pentagon");
            } });
            b.me.armies = [{ id: "a1", position: "-2,0" }];
            return Game.getReachable(b.st, "-2,0", Game.getMilitaryMove(b.me, b.st),
              "army", b.me.id);
          };
          const without = reach(false);
          const withP = reach(true);
          assert("without Pentagon the far end of the lane is out of reach",
            !without.has("5,0"), [...without].sort().join(" "));
          assert("with it the army can cross the whole lane",
            withP.has("5,0"), [...withP].sort().join(" "));
          assert("but the other movement rules still hold: water is still closed",
            !withP.has("3,1"), [...withP].sort().join(" "));
          proves("wonder.military.pentagon");
        }

        // ── Jebel Barkal: "you can spend RESOURCE tokens (NOT NATURAL WONDER
        //    tokens) to increase your combat value by +2 for each." ─────
        {
          const b = combatBoard({ setUp: (s2, me2) => {
            giveWonder(s2, me2.id, "Jebel Barkal");
            Game.RESOURCES.forEach((r) => { me2.resources[r] = 2; });
            // A natural wonder token of the player's own, which must NOT be
            // spendable here even though it is a resource icon.
            activate(s2, "0,1", { terrain: "grass",
              naturalWonderSpace: "Mt Kilimanjaro",
              control: { ownerId: me2.id, fortified: false, district: null } });
            s2.naturalWonders = { "Mt Kilimanjaro": { name: "Mt Kilimanjaro",
              resource: "oil", homeKey: "0,1", ownerId: me2.id,
              spaceControllerId: me2.id, focusCard: null } };
          } });
          const started = fight(b);
          assert("the fight starts", started.ok, started.code);
          let s = Game.applyAction(started.state, { type: "COMBAT_ROLL",
            payload: { playerId: b.me.id, side: "attacker" } });
          s = Game.applyAction(s, { type: "COMBAT_ROLL",
            payload: { playerId: b.me.id, side: "defender", hostOverride: true } });
          const burnable = Game.combatResources(s, s.combat, "attacker");
          assert("Jebel Barkal offers ordinary resources to burn",
            burnable.length > 0, JSON.stringify(burnable));
          const totalBefore = s.combat.atkRoll + s.combat.atkBase +
            s.combat.atkTrade + (s.combat.atkResource || 0);
          const resBefore = s.players[0].resources[burnable[0]];
          const burned = Game.applyAction(s, { type: "COMBAT_SPEND", payload: {
            playerId: b.me.id, side: "attacker", mode: "resource", resource: burnable[0] } });
          const totalAfter = burned.combat.atkRoll + burned.combat.atkBase +
            burned.combat.atkTrade + (burned.combat.atkResource || 0);
          assert("burning one resource is worth exactly +2",
            totalAfter === totalBefore + 2, `${totalBefore} -> ${totalAfter}`);
          assert("and the token is really gone",
            burned.players[0].resources[burnable[0]] === resBefore - 1,
            `${resBefore} -> ${burned.players[0].resources[burnable[0]]}`);
          assert("a natural wonder token is NOT among the things it may burn",
            !Game.combatResources(s, s.combat, "attacker")
              .some((r) => r === "Mt Kilimanjaro"),
            JSON.stringify(Game.combatResources(s, s.combat, "attacker")));
          assert("and the player still holds it afterwards",
            Game.getControlledNaturalWonders(burned, b.me.id)
              .some((e) => e.name === "Mt Kilimanjaro"),
            JSON.stringify(Game.getControlledNaturalWonders(burned, b.me.id)));
          proves("wonder.military.jebel_barkal");
        }
      }

      {
        // The "at the start of your turn" wonders. Each is reached by ENDING
        // the previous player's turn, so the offer arrives the way it does in
        // play rather than by calling the queue directly — and each is checked
        // to be optional, because every one of them prints "you may".
        const turnBoard = (setUp) => {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          // players[1] moves first, so ending their turn starts ours.
          st.turn.order = [foe.id, me.id];
          st.turn.index = 0;
          st.players.forEach((p) => {
            p.cardPlayed = false;
            Game.FOCUS_TYPES.forEach((t) => { p.trade[t] = 0; });
          });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.control = null; h.city = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 5; q++) {
            for (let r = -2; r <= 2; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          if (setUp) setUp(st, me, foe);
          return { st, me, foe };
        };
        const giveCityWonder = (st, playerId, key, name, type) => {
          st.map.hexes[key].city = { ownerId: playerId, isCapital: key === "0,0",
            developed: false, hasWonder: true,
            wonder: { name, type: type || "culture", era: "ancient" } };
        };
        // End the FIRST player's turn so the wonder owner's turn begins, and
        // hand back whatever the start of that turn queued for them.
        const beginOwnersTurn = (b) => {
          let s = Game.applyAction(b.st, { type: "PLAY_SCIENCE",
            payload: { playerId: b.foe.id, tradeSpent: 0 } });
          for (let i = 0; i < 12; i++) {
            const open = (s.pendingChoices || []).find((c) => c.playerId === b.foe.id);
            if (!open) break;
            const payload = { playerId: open.playerId, choiceId: open.id };
            if (open.options && open.options.length) payload.optionId = open.options[0].id;
            else if (open.hexKeys && open.hexKeys.length) payload.hexKey = open.hexKeys[0];
            else if (open.optional) payload.dismiss = true;
            else break;
            const next = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE", payload });
            if (next === s) break;
            s = next;
          }
          return Game.applyAction(s, { type: "END_TURN", payload: { playerId: b.foe.id } });
        };
        const offerFrom = (s, source) => (s.pendingChoices || [])
          .find((c) => c.source === source);

        // ── Hanging Gardens ──────────────────────────────────────────────
        {
          // "At the start of your turn, you MAY place 1 control token on a
          // space of terrain difficulty 4 (DESERT) OR LESS that is ADJACENT TO
          // A FRIENDLY CITY."
          const b = turnBoard((st, me) => {
            giveCityWonder(st, me.id, "0,0", "Hanging Gardens");
            activate(st, "1,0", { terrain: "desert" });     // difficulty 4: allowed
            activate(st, "0,1", { terrain: "mountain" });   // difficulty 5: not
            activate(st, "4,0", { terrain: "grass" });      // no friendly city near
          });
          const s = beginOwnersTurn(b);
          assert("it is now the wonder owner's turn",
            Game.currentPlayer(s).id === b.me.id);
          const offer = offerFrom(s, "Hanging Gardens");
          assert("Hanging Gardens offers a control token at the start of the turn",
            !!offer, JSON.stringify((s.pendingChoices || []).map((c) => c.source)));
          assert("and it is optional", !!offer && offer.optional === true);
          assert("a desert beside the city is offered",
            offer.hexKeys.includes("1,0"), offer.hexKeys.join(" "));
          assert("a mountain is not: the card stops at difficulty 4",
            !offer.hexKeys.includes("0,1"), offer.hexKeys.join(" "));
          assert("and a space away from any friendly city is not offered",
            !offer.hexKeys.includes("4,0"), offer.hexKeys.join(" "));
          const placed = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: b.me.id, choiceId: offer.id, hexKey: "1,0" } });
          assert("taking it puts a token on the board",
            !!placed.map.hexes["1,0"].control &&
            placed.map.hexes["1,0"].control.ownerId === b.me.id,
            JSON.stringify(placed.map.hexes["1,0"].control));
          proves("wonder.culture.hanging_gardens");
        }

        // ── Colosseum ────────────────────────────────────────────────────
        {
          // "At the start of your turn, you MAY reinforce 1 of your control
          // tokens that is ADJACENT TO A FRIENDLY CITY."
          const b = turnBoard((st, me) => {
            giveCityWonder(st, me.id, "0,0", "Colosseum");
            activate(st, "1,0", { control: { ownerId: me.id, fortified: false, district: null } });
            activate(st, "4,0", { control: { ownerId: me.id, fortified: false, district: null } });
            activate(st, "0,1", { control: { ownerId: me.id, fortified: true, district: null } });
          });
          const s = beginOwnersTurn(b);
          const offer = offerFrom(s, "Colosseum");
          assert("Colosseum offers a reinforcement", !!offer,
            JSON.stringify((s.pendingChoices || []).map((c) => c.source)));
          assert("which is optional", !!offer && offer.optional === true);
          assert("the token beside the city is offered",
            offer.hexKeys.includes("1,0"), offer.hexKeys.join(" "));
          assert("one far from any city is not",
            !offer.hexKeys.includes("4,0"), offer.hexKeys.join(" "));
          assert("and one already reinforced is not offered again",
            !offer.hexKeys.includes("0,1"), offer.hexKeys.join(" "));
          const done = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: b.me.id, choiceId: offer.id, hexKey: "1,0" } });
          assert("taking it flips the token",
            done.map.hexes["1,0"].control.fortified === true);
          proves("wonder.culture.colosseum");
        }

        // ── Forbidden City ───────────────────────────────────────────────
        {
          // "At the start of your turn, you MAY remove 1 RIVAL control token
          // that is adjacent to a friendly space."
          const b = turnBoard((st, me, foe) => {
            giveCityWonder(st, me.id, "0,0", "Forbidden City");
            activate(st, "1,0", { control: { ownerId: foe.id, fortified: false, district: null } });
            activate(st, "4,0", { control: { ownerId: foe.id, fortified: false, district: null } });
            activate(st, "0,1", { control: { ownerId: me.id, fortified: false, district: null } });
          });
          const s = beginOwnersTurn(b);
          const offer = offerFrom(s, "Forbidden City");
          assert("Forbidden City offers a removal", !!offer,
            JSON.stringify((s.pendingChoices || []).map((c) => c.source)));
          assert("which is optional", !!offer && offer.optional === true);
          assert("the rival token beside a friendly space is offered",
            offer.hexKeys.includes("1,0"), offer.hexKeys.join(" "));
          assert("a rival token nowhere near one is not",
            !offer.hexKeys.includes("4,0"), offer.hexKeys.join(" "));
          assert("and your OWN token is never offered",
            !offer.hexKeys.includes("0,1"), offer.hexKeys.join(" "));
          const done = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: b.me.id, choiceId: offer.id, hexKey: "1,0" } });
          assert("taking it removes the token from the board",
            done.map.hexes["1,0"].control === null,
            JSON.stringify(done.map.hexes["1,0"].control));
          assert("and it is removed, not captured",
            !done.map.hexes["1,0"].control);
          proves("wonder.culture.forbidden_city");
        }

        // ── Eiffel Tower ─────────────────────────────────────────────────
        {
          // "At the start of your turn, you may choose 2 rival control tokens
          // ON THE MAP BELONGING TO THE SAME PLAYER. THAT PLAYER replaces 1 of
          // those tokens with 1 of your unused, unreinforced control tokens."
          // The choice of which of the two goes is the victim's, not yours.
          const b = turnBoard((st, me, foe) => {
            giveCityWonder(st, me.id, "0,0", "Eiffel Tower");
            activate(st, "3,0", { control: { ownerId: foe.id, fortified: false, district: null } });
            activate(st, "3,1", { control: { ownerId: foe.id, fortified: true, district: null } });
          });
          const s = beginOwnersTurn(b);
          const pickRival = offerFrom(s, "Eiffel Tower");
          assert("Eiffel Tower asks which rival to name", !!pickRival &&
            pickRival.kind === "eiffel_target",
            JSON.stringify((s.pendingChoices || []).map((c) => c.kind)));
          assert("which is optional", !!pickRival && pickRival.optional === true);
          const s1 = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: pickRival.id, optionId: b.foe.id } });
          const first = offerFrom(s1, "Eiffel Tower");
          assert("then two of that rival's tokens are named", !!first &&
            first.hexKeys.length >= 2, first && first.hexKeys.join(" "));
          const s2 = Game.applyAction(s1, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: first.id, hexKey: "3,0" } });
          const second = offerFrom(s2, "Eiffel Tower");
          const s3 = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: second.id, hexKey: "3,1" } });
          const give = offerFrom(s3, "Eiffel Tower");
          assert("and the VICTIM chooses which of the two to give up",
            !!give && give.playerId === b.foe.id,
            give && JSON.stringify({ owner: give.playerId, me: b.me.id, foe: b.foe.id }));
          assert("from exactly the two that were named",
            !!give && give.hexKeys.slice().sort().join(" ") === "3,0 3,1",
            give && give.hexKeys.join(" "));
          const done = Game.applyAction(s3, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.foe.id, choiceId: give.id, hexKey: "3,1" } });
          assert("the named token changes hands",
            done.map.hexes["3,1"].control.ownerId === b.me.id,
            JSON.stringify(done.map.hexes["3,1"].control));
          assert("and arrives UNREINFORCED, however it was standing before",
            done.map.hexes["3,1"].control.fortified === false,
            JSON.stringify(done.map.hexes["3,1"].control));
          assert("while the other one stays with its owner",
            done.map.hexes["3,0"].control.ownerId === b.foe.id);
          proves("wonder.culture.eiffel_tower");
        }

        // ── Oracle ───────────────────────────────────────────────────────
        {
          // "At the start of your turn, you may swap 2 ADJACENT cards in your
          // focus row."
          const b = turnBoard((st, me) => {
            giveCityWonder(st, me.id, "0,0", "Oracle", "science");
            me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
          });
          const s = beginOwnersTurn(b);
          const offer = offerFrom(s, "Oracle");
