<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Civ New Dawn v2 Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #111827; color: #e5e7eb; }
    h1 { font-size: 20px; }
    .pass { color: #86efac; }
    .fail { color: #fca5a5; }
    li { margin: 6px 0; }
    pre { background: #020617; padding: 12px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Civ New Dawn v2 Rule Smoke Tests</h1>
  <ol id="results"></ol>
  <pre id="summary"></pre>

  <script src="rules-data.js"></script>
  <script src="tile-art.js"></script>
  <script src="game.js"></script>
  <script>
    const results = document.getElementById("results");
    const summary = document.getElementById("summary");
    let passed = 0;
    let failed = 0;

    const seenOnce = new Set();
    function assertOnce(name, condition) {
      if (seenOnce.has(name)) return;
      seenOnce.add(name);
      assert(name, condition);
    }

    // The optional third argument is shown only on failure. Several assertions
    // already passed one and it was silently dropped, so a red line said what
    // was expected but never what actually happened.
    function assert(name, condition, detail) {
      const li = document.createElement("li");
      li.className = condition ? "pass" : "fail";
      li.textContent = `${condition ? "PASS" : "FAIL"}: ${name}` +
        (!condition && detail !== undefined ? `  [${detail}]` : "");
      results.appendChild(li);
      if (condition) { passed++; assertionsSinceProof++; } else failed++;
    }

    // ── Behavioural proof ────────────────────────────────────────────────
    //
    // proves("<effect id>") claims that the assertions just made actually
    // exercised a printed effect and checked the board afterwards. It is the
    // ONLY thing tools/coverage-matrix.js counts - a card's name appearing in
    // this file proves nothing and is not looked at.
    //
    // Two rules keep the claim honest, both enforced here rather than by
    // convention:
    //   * a proof must be backed by assertions made since the previous proof,
    //     so proves() cannot stand in for testing;
    //   * a proof made while anything has failed is not recorded, because a red
    //     suite has not demonstrated anything.
    // The same id may be declared by several tests when one card needs more
    // than one scenario to cover its paragraphs; that is recorded, not an error.
    const PROOFS = [];
    let assertionsSinceProof = 0;
    let proofErrors = [];
    function proves(effectId) {
      if (typeof effectId !== "string" || !effectId) {
        proofErrors.push(`proves() called with a non-id: ${String(effectId)}`);
        return;
      }
      if (assertionsSinceProof === 0) {
        proofErrors.push(`${effectId}: proves() with no assertions since the previous proof`);
        return;
      }
      PROOFS.push({ id: effectId, assertions: assertionsSinceProof, failedSoFar: failed });
      assertionsSinceProof = 0;
    }

    function players(n) {
      return Array.from({ length: n }, (_, i) => Game.createPlayer(`p${i + 1}`, `P${i + 1}`, ["#e63946", "#457b9d", "#2a9d8f", "#e9c46a", "#9b5de5"][i]));
    }

    try {
      const data = window.CivRulesData;
      assert("rules data is loaded", !!data);
      assert("21 physical tile entries", data.TILES.length === 21);
      assert("every tile has two 10-cell sides", data.TILES.every((t) => t.sides && t.sides.A.cells.length === 10 && t.sides.B.cells.length === 10));
      assert("five capital tiles", data.TILES.filter((t) => t.kind === "capital").length === 5);
      // Two cells were transcribed wrong off the printed faces and both reached
      // the table as bugs: 9A cell 9 is the bay next to the capital, read as
      // "hill", so control tokens and districts could be placed on open water;
      // 11A cell 8 is grass beside the capital, read as "hill", so a growth
      // card resolving from a grass slot refused a space that is printed for
      // it. tools/audit-tile-terrain.py measures every cell against its
      // photograph and is what should catch the next one — these two are
      // pinned here so a re-transcription cannot quietly put them back.
      const cellTerrain = (id, side, i) =>
        (data.TILES.find((t) => t.id === id) || { sides: { A: { cells: [] }, B: { cells: [] } } })
          .sides[side].cells[i].terrain;
      assert("printed 9A cell 9 is the bay, not a hill", cellTerrain("02", "A", 9) === "water");
      assert("printed 11A cell 8 is grass, not a hill", cellTerrain("03", "A", 8) === "grass");
      // A third, reported from a real game: printed 16B cell 9 is the hill
      // between the capital (cell 6) and the mountain (cell 7), read as grass.
      // Grass is difficulty 1 and hill is 3, so the wrong reading let cards
      // place there that should not reach it. It measures 45.7 from the grass
      // signature and 7.3 from hill, and matches cell 4 on the same face, which
      // was always transcribed as hill.
      assert("printed 16B cell 9 is the hill by the capital, not grass",
        cellTerrain("04", "B", 9) === "hill", cellTerrain("04", "B", 9));
      assert("and its neighbours on that face are unchanged",
        cellTerrain("04", "B", 6) === "forest" && cellTerrain("04", "B", 7) === "mountain" &&
        cellTerrain("04", "B", 8) === "grass" && cellTerrain("04", "B", 4) === "hill");
      // Terra removes the two BASE cards by name, but its replacement Pentagon
      // and Machu Picchu cards reuse the original tokens and remain playable.
      assert("the printed Terra wonder pool contains 36 replacement-aware cards",
        Object.values(data.WONDER_DECKS).reduce((n, d) => n + d.length, 0) === 36);

      const s2 = Game.createState(players(2));
      // Terra setup 3d: four core tiles, but only two at 2-3 players, drawn off
      // the bottom of the shuffled stack with no forced composition.
      assert("a 2-player core is two tiles", s2.setup.coreTiles.length === 2);
      assert("a 3-player core is two tiles", Game.createState(players(3)).setup.coreTiles.length === 2);
      assert("a 4-player core is four tiles", Game.createState(players(4)).setup.coreTiles.length === 4);
      assert("core tiles share one side", new Set(s2.setup.coreTiles.map((id) => s2.setup.tiles[id].side)).size === 1);
      assert("2-player setup starts with fortress placement", s2.setup.phase === "fortress");
      assert("setup has five agenda cards", s2.agendaCards.length === 5);
      assert("visible wonder tops equal deck types", Game.getVisibleWonders(s2).length === Object.keys(data.WONDER_DECKS).length);

      const s4 = Game.createState(players(4));
      assert("4-player setup places four core tiles", s4.setup.coreTiles.length === 4);

      // ── Advanced tile draft (Terra p14's optional variant) ──
      // Not the standard flow this file otherwise checks: instead of the core
      // revealing automatically, each player is dealt 2 tiles and places them
      // in turn order. Opt-in only — everything above must keep passing with
      // no opts argument at all, which is what "4-player setup places four
      // core tiles" just did.
      const sAdv = Game.createState(players(4), { advancedDraft: true });
      assert("advanced draft starts in its own draft_tile phase", sAdv.setup.phase === "draft_tile");
      assert("advanced draft skips the automatic core", sAdv.setup.coreTiles.length === 0);
      assert("advanced draft deals exactly 2 tiles to every player",
        sAdv.setup.order.every((id) => (sAdv.setup.draftTiles[id] || []).length === 2));
      assert("drafted tiles are marked core, same as the standard core would be",
        sAdv.setup.order.every((id) => (sAdv.setup.draftTiles[id] || [])
          .every((tid) => sAdv.setup.tiles[tid].isCore)));

      let draftState = sAdv;
      let draftPlacements = 0;
      while (draftState.setup.phase === "draft_tile" && draftPlacements < 20) {
        const activeId = draftState.setup.order[draftState.setup.turnIndex];
        const hand = draftState.setup.draftTiles[activeId] || [];
        if (!hand.length) break;
        const tileId = hand[0];
        const anchorKey = Game.getTileAnchorsAnyRotation(draftState, tileId).values().next().value;
        if (!anchorKey) break;
        const placement = Game.tilePlacementFor(draftState, tileId, anchorKey, 0);
        if (!placement) break;
        draftState = Game.applyAction(draftState, { type: "PLACE_TILE",
          payload: { playerId: activeId, tileId, anchorKey, rotation: placement.rotation, side: "A" } });
        draftPlacements++;
      }
      assert("all 8 drafted tiles (4 players × 2) find a home", draftPlacements === 8);
      assert("finishing the draft hands off to fortress placement", draftState.setup.phase === "fortress");
      assert("the drafted tiles' own cells are marked core (some fill hexes may not be)",
        Object.values(draftState.map.hexes).filter((h) => h.core).length === 80);
      assert("fortress placement on a drafted core sees it as core",
        Game.getValidFortressHexes(draftState).size > 0);

      // ── Online lobby flow ──
      let lob = Game.createLobbyState([players(1)[0]]);
      assert("lobby state starts in lobby phase", lob.phase === "lobby");
      lob = Game.applyAction(lob, { type: "START_GAME", payload: { playerId: lob.players[0].id } });
      assert("cannot start a lobby with one player", lob.phase === "lobby");
      const joiners = players(5).slice(1);
      joiners.forEach((p) => { lob = Game.applyAction(lob, { type: "ADD_PLAYER", payload: p }); });
      assert("Terra lobby fills to five players", lob.players.length === 5 && lob.phase === "lobby");
      lob = Game.applyAction(lob, { type: "ADD_PLAYER", payload: Game.createPlayer("p6", "P6", "#f77f00") });
      assert("lobby rejects a sixth player", lob.players.length === 5);
      // Terra ships five physical player sets, including purple. Seats are
      // dealt rather than chosen and may never share a component colour.
      assert("five seats, five different printed colours",
        new Set(lob.players.map((p) => p.color)).size === 5 &&
        lob.players.every((p) => Game.SEAT_COLORS.includes(p.color)));
      let dup = Game.createLobbyState([Game.createPlayer("d1", "D1", "#169eae")]);
      dup = Game.applyAction(dup, { type: "ADD_PLAYER", payload: Game.createPlayer("d2", "D2", "#169eae") });
      assert("asking for a taken colour gets the next free one",
        dup.players[0].color === "#169eae" && dup.players[1].color !== "#169eae");
      assert("new multiplayer seats begin with a false legacy ready flag", lob.players.every((player) => !player.ready));
      lob = Game.applyAction(lob, { type: "START_GAME", payload: { playerId: lob.players[0].id } });
      assert("START_GAME builds a five-player setup without a ready ceremony", lob.phase === "setup" && lob.setup.phase === "fortress" && lob.setup.order.length === 5);
      let midGame = Game.createState(players(2));
      midGame.phase = "playing";
      midGame = Game.applyAction(midGame, { type: "ADD_PLAYER", payload: Game.createPlayer("late", "Late", "#f77f00") });
      assert("no joining a game in progress", !midGame.players.find((p) => p.id === "late"));

      // ── Civilizations (Terra Incognita leader sheets) ──
      assert("eighteen civs defined", Game.LEADERS.length === 18);
      assert("leader focus orders are 6 unique types starting with growth", Game.LEADERS.every((l) => l.focusOrder.length === 6 && new Set(l.focusOrder).size === 6 && l.focusOrder[0] === "growth"));
      assert("every civ has a unique focus card", Game.LEADERS.every((l) => l.unique && l.unique.name && l.unique.type && l.unique.tier >= 1 && l.unique.tier <= 4));
      let ldr = Game.createLobbyState(players(2));
      const [ldrA, ldrB] = ldr.players.map((p) => p.id);
      ldr = Game.applyAction(ldr, { type: "SET_LEADER", payload: { playerId: ldrA, leaderId: "rome" } });
      assert("SET_LEADER applies civ and focus order", ldr.players[0].leaderId === "rome" && ldr.players[0].focusRow[5] === "industry");
      ldr = Game.applyAction(ldr, { type: "SET_LEADER", payload: { playerId: ldrB, leaderId: "rome" } });
      assert("duplicate civ pick rejected", ldr.players[1].leaderId !== "rome");
      ldr = Game.applyAction(ldr, { type: "START_GAME", payload: { playerId: ldrA } });
      assert("random civs dealt at start", ldr.players.every((p) => p.leaderId && p.leaderId !== "random"));
      const plain = Game.createPlayer("pp", "P", "#fff");
      const scy = Game.createPlayer("sc", "S", "#fff"); scy.leaderId = "scythia";
      assert("Scythia's Horseback Riding moves 6 at tier I", Game.getMilitaryMove(scy) === 6 && Game.getMilitaryMove(plain) === 3);
      const egy = Game.createPlayer("eg", "E", "#fff"); egy.leaderId = "egypt";
      assert("Egypt's Wheel moves 4 at tier I", Game.getEconomyMove(egy) === 4);
      assert("Egypt builds wonders for 1 less", Game.getWonderCost(Game.ALL_WONDERS[0].name, egy) === Game.getWonderCost(Game.ALL_WONDERS[0].name, plain) - 1);
      // ── World wonders ──
      const wonderNames = Game.ALL_WONDERS.map((w) => w.name);
      // Terra removes the base versions of Pentagon and Machu Picchu, then adds
      // replacement versions for their existing tokens. The component pool is
      // therefore 9 per type and 3 per era before game setup.
      assert("36 playable world wonders include both Terra replacements", wonderNames.length === 36 &&
        wonderNames.includes("Pentagon") && wonderNames.includes("Machu Picchu"));
      const wonderTypes = ["military", "culture", "economy", "science"];
      const definitionCounts = Object.fromEntries(wonderTypes.map((type) =>
        [type, Game.ALL_WONDERS.filter((w) => w.type === type).length]));
      assert("the component pool has exactly nine wonders of every type",
        wonderTypes.every((type) => definitionCounts[type] === 9), JSON.stringify(definitionCounts));
      const eraCount = (type) => {
        const eras = { ancient: 0, medieval: 0, modern: 0 };
        Game.ALL_WONDERS.filter((w) => w.type === type).forEach((w) => { eras[w.era]++; });
        return eras;
      };
      assert("every component pool has three Ancient, Medieval and Modern wonders",
        wonderTypes.every((t) => {
          const e = eraCount(t);
          return e.ancient === 3 && e.medieval === 3 && e.modern === 3;
        }), JSON.stringify(Object.fromEntries(wonderTypes.map((t) => [t, eraCount(t)]))));

      // Verify generated game decks, not just source definitions: setup removes
      // one random Ancient and one random Medieval card from every type.
      const wonderByName = Object.fromEntries(Game.ALL_WONDERS.map((w) => [w.name, w]));
      const modernNames = Object.fromEntries(wonderTypes.map((type) => [type,
        Game.ALL_WONDERS.filter((w) => w.type === type && w.era === "modern").map((w) => w.name)]));
      const generatedDecks = Array.from({ length: 32 }, () => Game.createState(players(2)).wonderDecks);
      const generatedDecksAreValid = generatedDecks.every((decks) => wonderTypes.every((type) => {
        const names = decks[type].deck;
        const eras = { ancient: 0, medieval: 0, modern: 0 };
        names.forEach((name) => { eras[wonderByName[name].era]++; });
        return names.length === 7 && new Set(names).size === 7 &&
          eras.ancient === 2 && eras.medieval === 2 && eras.modern === 3 &&
          modernNames[type].every((name) => names.includes(name));
      }));
      assert("every generated Wonder deck is 7 cards, split 2/2/3, with all Modern wonders",
        generatedDecksAreValid);
      assert("Pentagon and Orszaghaz remain in every generated game",
        generatedDecks.every((decks) => decks.military.deck.includes("Pentagon") &&
          decks.economy.deck.includes("Orszaghaz")));
      assert("every wonder has era, cost and printed effect text", Game.ALL_WONDERS.every((w) =>
        ["ancient", "medieval", "modern"].includes(w.era) && w.cost >= 7 && w.cost <= 12 && (w.effect || "").length > 20));
      let wst = Game.createState(players(2));
      wst.phase = "playing";
      const wa = wst.turn.order[0], wb = wst.turn.order[1];
      const setHex = (k, props) => Object.assign(wst.map.hexes[k], { active: true, terrain: "grass", city: null, control: null, barbarian: false, cityState: null, fortress: false, resource: null }, props);
      const giveWonder = (pid, k, name, type) => setHex(k, { city: { ownerId: pid, isCapital: false, developed: false, hasWonder: true, wonder: { name, era: "ancient", type: type || "military", cost: 7, effect: "" } } });
      setHex("1,0", { control: { ownerId: wb, fortified: false, district: null } });
      const atkBefore = Game.getLeaderAttackBonus(wst, wa, "1,0");
      giveWonder(wa, "0,0", "Terracotta Army");
      assert("Terracotta Army adds +2 attack", Game.getLeaderAttackBonus(wst, wa, "1,0") === atkBefore + 2);
      const defBefore = Game.findDefender(wst, "1,0", wa).power;
      giveWonder(wb, "4,0", "Ruhr Valley");
      assert("Ruhr Valley adds +5 defence", Game.findDefender(wst, "1,0", wa).power === defBefore + 5);
      const ecoP = Game.getPlayer(wst, wa);
      const ecoBefore = Game.getEconomyMove(ecoP, wst);
      giveWonder(wa, "0,-2", "Colossus", "economy");
      assert("Colossus adds 6 caravan movement", Game.getEconomyMove(ecoP, wst) === ecoBefore + 6);
      giveWonder(wa, "0,0", "Pentagon", "military");
      assert("Terra Pentagon adds +2 attack", Game.getWonderAttackBonus(wst, wa, "1,0", wb) === 2);
      assert("Terra Pentagon removes the army movement-distance limit", Game.getMilitaryMove(ecoP, wst) === 99);
      giveWonder(wa, "0,0", "Machu Picchu", "economy");
      ecoP.focusRow = ["military", "culture", "science", "economy", "industry", "growth"];
      assert("Terra Machu Picchu shifts cards in slots 1 and 2 by two",
        Game.getSlotValue(ecoP, "military", wst) === 2 && Game.getSlotValue(ecoP, "culture", wst) === 3);
      assert("Terra Machu Picchu does not shift the third slot",
        Game.getSlotValue(ecoP, "science", wst) === 2);
      // Wonders that shape where you may place, not just how hard you hit
      const autoCount = Game.ALL_WONDERS.filter((w) => w.auto).length;
      assert("all but one of the 36 wonders are engine-enforced",
        autoCount === Game.ALL_WONDERS.length - 1, String(autoCount));
      // The one left is a table reminder; naming it keeps the list honest.
      const manual = Game.ALL_WONDERS.filter((w) => !w.auto).map((w) => w.name).sort().join(", ");
      assert("and the one left is Oxford University", manual === "Oxford University");

      // Chichen Itza: forest far from any city is illegal until you own it
      let cwst = Game.createState(players(2));
      cwst.phase = "playing";
      const ca = cwst.turn.order[0];
      const cSet = (k, props) => Object.assign(cwst.map.hexes[k], { active: true, terrain: "grass", city: null, control: null, barbarian: false, cityState: null, fortress: false, resource: null }, props);
      cSet("0,0", { city: { ownerId: ca, isCapital: true, developed: false, hasWonder: false, wonder: null } });
      cSet("5,0", { terrain: "forest" });
      assert("distant forest is not placeable normally", !Game.validControlHexes(cwst, ca, 5).has("5,0"));
      cSet("0,-3", { city: { ownerId: ca, isCapital: false, developed: false, hasWonder: true, wonder: { name: "Chichen Itza", era: "medieval", type: "culture", cost: 10, effect: "" } } });
      assert("Chichen Itza opens distant forests", Game.validControlHexes(cwst, ca, 5).has("5,0"));

      // Stonehenge: a token on a hill offers a chain onto adjacent hills only
      let swst = Game.createState(players(2));
      swst.phase = "playing";
      swst.pendingChoices = [];
      const sa = swst.turn.order[0];
      const sPlayer = Game.getPlayer(swst, sa);
      sPlayer.cardPlayed = false;
      sPlayer.focusRow = ["growth", "military", "science", "economy", "industry", "culture"];
      const sSet = (k, props) => Object.assign(swst.map.hexes[k], { active: true, terrain: "grass", city: null, control: null, barbarian: false, cityState: null, fortress: false, resource: null }, props);
      sSet("0,0", { city: { ownerId: sa, isCapital: true, developed: false, hasWonder: true, wonder: { name: "Stonehenge", era: "ancient", type: "culture", cost: 7, effect: "" } } });
      sSet("1,0", { terrain: "hill" });
      sSet("2,0", { terrain: "hill" });
      swst = Game.applyAction(swst, { type: "PLAY_CULTURE", payload: { playerId: sa, hexKeys: ["1,0"], tradeSpent: 0 } });
      const chain = (swst.pendingChoices || []).find((c) => c.source === "Stonehenge");
      assert("Stonehenge chains from a hill", !!chain);
      assert("Stonehenge chain offers hills only", !chain || chain.hexKeys.every((k) => swst.map.hexes[k].terrain === "hill"));
      // ── Tiles, cards and diplomacy ──
      // A tile is one physical thing: placing it consumes the other side, so a
      // feature can never appear twice. That only holds if each feature sits on
      // exactly one tile-side to begin with.
      const seenFeat = {};
      let dupFeat = null;
      data.TILES.forEach((t) => ["A", "B"].forEach((side) => {
        t.sides[side].cells.forEach((c) => {
          [c.naturalWonder, c.cityState].filter(Boolean).forEach((f) => {
            if (seenFeat[f]) dupFeat = f + " on " + seenFeat[f] + " and " + t.id + side;
            seenFeat[f] = t.id + side;
          });
        });
      }));
      assert("no natural wonder or city-state is on two tile-sides", !dupFeat);

      const natWonders = new Set();
      const cityStatesOnTiles = new Set();
      data.TILES.forEach((t) => ["A", "B"].forEach((side) => t.sides[side].cells.forEach((c) => {
        if (c.naturalWonder) natWonders.add(c.naturalWonder);
        if (c.cityState) cityStatesOnTiles.add(c.cityState);
      })));
      assert("twelve natural wonders on the tiles", natWonders.size === 12);
      assert("Uluru is not on any tile", !natWonders.has("Uluru"));
      ["Cliffs of Dover", "Crater Lake", "Mt Kilimanjaro", "Mato Tipila", "Gobustan"].forEach((w) =>
        assert("natural wonder present: " + w, natWonders.has(w)));
      const printedNaturalFaces = [
        ["11", "A", "04A", "Grand Mesa", "diamonds", "tile-04-side-a.webp"],
        ["11", "B", "04B", "Galapagos Islands", "mercury", "tile-04-side-b.webp"],
        ["12", "A", "18A", "Dead Sea", "marble", "tile-18-side-a.webp"],
        ["12", "B", "18B", "Mato Tipila", "mercury", "tile-18-side-b.webp"],
        ["13", "A", "13A", "Mt Kilimanjaro", "oil", "tile-13-side-a.webp"],
        ["13", "B", "13B", "Pantanal", "marble", "tile-13-side-b.webp"],
        ["16", "A", "01A", "Torres del Paine", "diamonds", "tile-01-side-a.webp"],
        ["16", "B", "01B", "Cliffs of Dover", "marble", "tile-01-side-b.webp"],
        ["TI02", "A", "19A", "Ha Long Bay", "diamonds", "tile-19-side-a.webp"],
        ["TI02", "B", "19B", "Gobustan", "oil", "tile-19-side-b.webp"],
        ["TI05", "A", "02A", "Mt. Everest", "oil", "tile-02-side-a.webp"],
        ["TI05", "B", "02B", "Crater Lake", "mercury", "tile-02-side-b.webp"]
      ];
      printedNaturalFaces.forEach(([tileId, side, printedId, name, resource, image]) => {
        const face = data.TILES.find((tile) => tile.id === tileId).sides[side];
        const printed = face.cells.find((cell) => cell.naturalWonder);
        assert(`printed tile ${printedId} has ${name} (${resource})`,
          printed && printed.naturalWonder === name &&
          data.NATURAL_WONDER_RESOURCES[name] === resource,
          printed && `${printed.naturalWonder}/${data.NATURAL_WONDER_RESOURCES[printed.naturalWonder]}`);
        assert(`printed tile ${printedId} uses ${image}`,
          CivTileArt.tileImagePath(tileId, side)?.endsWith(image),
          CivTileArt.tileImagePath(tileId, side));
      });
      const naturalResourceCounts = Object.values(data.NATURAL_WONDER_RESOURCES)
        .reduce((counts, resource) => {
          counts[resource] = (counts[resource] || 0) + 1;
          return counts;
        }, {});
      assert("the twelve printed Natural Wonders contain three of each resource",
        Game.RESOURCES.every((resource) => naturalResourceCounts[resource] === 3),
        JSON.stringify(naturalResourceCounts));
      assert("twelve city-states on the tiles", cityStatesOnTiles.size === 12);
      const tile20 = data.TILES.find((t) => t.id === "10");
      const tile20AStates = tile20.sides.A.cells.map((c) => c.cityState).filter(Boolean);
      const tile20BStates = tile20.sides.B.cells.map((c) => c.cityState).filter(Boolean);
      assert("printed tile 20A contains industrial Auckland",
        tile20AStates.length === 1 && tile20AStates[0] === "Auckland" && data.CITY_STATES.Auckland.type === "industry");
      assert("printed tile 20B contains military Akkad",

        const st = rulesState();

        const outermost = () => Object.entries(st.map.hexes)

          .sort((a, b) => (Math.abs(b[1].q) + Math.abs(b[1].r) + Math.abs(b[1].q + b[1].r)) -
                          (Math.abs(a[1].q) + Math.abs(a[1].r) + Math.abs(a[1].q + a[1].r)))[0];
        const reach = (k) => {
          const q = Game.parseQ(k), r = Game.parseR(k);
          return Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r));
        };

            const hex = st.map.hexes[hexKey];
            if (!hex.active || hex.barbarian || hex.cityState || hex.fortress ||
                hex.control || hex.city || hex.terrain === "water") return false;
            return Game.hexNeighborKeys(hex.q, hex.r)
              .some((neighbor) => !st.map.hexes[neighbor] || !st.map.hexes[neighbor].active);
          });
          const hex = st.map.hexes[origin];
          hex.city = { ownerId: player.id, isCapital: true, developed: false, hasWonder: false, wonder: null };
          player.armies = [{ id: "network-explorer", position: origin }];
          return { st, player, origin };
        }

        // The whole exploration flow, driven exactly as the UI drives it: the
        // actions it sends, through the gate it sends them through. Exploration
        // was completely dead in the app for a while - authorizeAction denied
        // the one-step EXPLORE_TILE the UI was still sending, so the player
        // could neither place the tile nor abandon it - while the tests below
        // passed, because they drove the protocol directly and never asked
        // whether the UI spoke it. This test is the one that would have caught
        // that, so it uses only what ui.js actually dispatches.
        {
          const ui = explorationState();
          const seat = { actorId: ui.player.id, role: "player" };

          const begun = Game.tryApplyAction(ui.st, { type: "BEGIN_EXPLORATION", payload: {
            playerId: ui.player.id, fromKey: ui.origin,
            unitId: "network-explorer", unitType: "army",
            startKey: ui.origin, route: [], tradeSpent: 0
          }}, seat);
          assert("the UI's BEGIN_EXPLORATION is accepted", begun.accepted);
          const revealed = begun.accepted ? begun.state : ui.st;
          assert("beginning an expedition reveals a tile to place",
            !!(revealed.pendingExploration && revealed.pendingExploration.tileId));

          // ui.js reads the tile in hand from pendingExploration, not the stack.
          const inHand = revealed.pendingExploration && revealed.pendingExploration.tileId;
          assert("the revealed tile is no longer on the stack",
            !revealed.tileStack.includes(inHand));

          let spot = null;
          Object.keys(revealed.map.hexes).forEach((anchorKey) => {
            if (spot) return;
            for (let rot = 0; rot < 6; rot++) {
              if (!Game.validateExploration(revealed, inHand, anchorKey, rot).ok) continue;
              const cells = Game.getTileHexKeys(anchorKey, rot, revealed.map.hexes);
              if (cells.some((ck) => Game.hexNeighborKeys(Game.parseQ(ck), Game.parseR(ck)).includes(ui.origin))) {
                spot = { anchorKey, rot };
                return;
              }
            }
          });
          assert("a legal home for the revealed tile exists", !!spot);

          const placed = spot ? Game.tryApplyAction(revealed, { type: "PLACE_EXPLORED_TILE", payload: {
            playerId: ui.player.id, anchorKey: spot.anchorKey, rotation: spot.rot, side: "A"
          }}, seat) : { accepted: false };
          assert("the UI's PLACE_EXPLORED_TILE actually places the tile",
            placed.accepted && !placed.state.pendingExploration &&
            placed.state.map.hexes[spot.anchorKey].active);
          const continuation = placed.accepted && placed.state.movementContinuation;
          // Masonry I moves 3 (CARD_TIERS.military.move[0]), so exploring from a
          // standing start leaves 2. The point of the assertion is that exactly
          // one point is charged - so it is written against the card's real
          // allowance rather than a hard-coded number that can drift.
          const allowance = Game.getMilitaryMove(ui.player, ui.st);
          assert("exploration charges its movement point exactly once",
            allowance >= 1 && continuation && continuation.remaining === allowance - 1 &&
            continuation.fromKey === ui.origin,
            "allowance " + allowance + ", remaining " + (continuation && continuation.remaining));
          const stopped = continuation ? Game.tryApplyAction(placed.state, {
            type: "END_UNIT_MOVE", payload: { unitId: "network-explorer" }
          }, seat) : { accepted: false };
          assert("the confirmed exploration continuation can be ended explicitly",
            stopped.accepted && !stopped.state.movementContinuation &&
            stopped.state.players[0].cardPlayed,
            "placed=" + (placed && placed.accepted) + " cont=" + JSON.stringify(continuation) +
            " stopped=" + (stopped && stopped.accepted) + "/" + (stopped && stopped.code));
        }

        {
          // Terra p12 only lets a tile go back "if the tile cannot be placed".
          // So while a legal home exists the way out is correctly refused - the
          // player has to place it - and the panel must not pretend otherwise.
          const ui = explorationState();
          const seat = { actorId: ui.player.id, role: "player" };
          const begun = Game.tryApplyAction(ui.st, { type: "BEGIN_EXPLORATION", payload: {
            playerId: ui.player.id, fromKey: ui.origin, unitId: "network-explorer",
            unitType: "army", startKey: ui.origin, route: [], tradeSpent: 0
          }}, seat);
          assert("the expedition began", begun.accepted);
          const revealed = begun.accepted ? begun.state : ui.st;
          const fits = Game.hasLegalExplorationPlacement(revealed, revealed.pendingExploration);
          const gone = Game.tryApplyAction(revealed, {
            type: "ABANDON_EXPLORATION", payload: { playerId: ui.player.id, fromKey: ui.origin }
          }, seat);
          assert("putting the tile back is refused while it still fits somewhere",
            !fits || (!gone.accepted && gone.code === "tile_still_fits"));
          assert("and Game exposes that same test, so the panel can offer the button honestly",
            typeof Game.canAbandonExploration === "function" &&
            Game.canAbandonExploration(revealed, ui.player.id).ok === !fits);
        }

        const first = explorationState();
        const legacy = Game.tryApplyAction(first.st, {
          type: "EXPLORE_TILE", payload: { fromKey: first.origin }
        }, { actorId: first.player.id, role: "player" });
        assert("online exploration refuses the legacy reveal-and-place packet",
          !legacy.accepted && legacy.code === "exploration_protocol_required");

        const begun = Game.tryApplyAction(first.st, {
          type: "BEGIN_EXPLORATION", payload: { fromKey: first.origin, unitId: "network-explorer" }
        }, { actorId: first.player.id, role: "player" });
        assert("begin exploration publishes one retained tile and locks undo",
          begun.accepted && begun.state.pendingExploration &&
          begun.state.pendingExploration.kind === "map_tile" &&
          begun.state.tileStack.length === first.st.tileStack.length - 1 &&
          !Game.getUndoStatus(begun.state, first.player.id).canUndo);

        const premature = Game.tryApplyAction(begun.state, {
          type: "ABANDON_EXPLORATION", payload: {}
        }, { actorId: first.player.id, role: "player" });
        assert("nowhere-it-fits is rejected while either face fits at any rotation",
          !premature.accepted &&
          Game.canAbandonExploration(begun.state, first.player.id).code === "tile_still_fits");

        let placement = null;
        const pending = begun.state.pendingExploration;
        for (const side of ["A", "B"]) {
          for (let rotation = 0; rotation < 6 && !placement; rotation++) {
            for (const anchorKey of Object.keys(begun.state.map.hexes)) {
              if (!Game.validateExploration(begun.state, pending.tileId, anchorKey, rotation).ok) continue;
              const touches = Game.getTileHexKeys(anchorKey, rotation, begun.state.map.hexes)
                .some((cell) => Game.hexNeighborKeys(Game.parseQ(cell), Game.parseR(cell)).includes(first.origin));
              if (touches) { placement = { side, rotation, anchorKey }; break; }
            }
          }
          if (placement) break;
        }
        const placed = Game.tryApplyAction(begun.state, {
          type: "PLACE_EXPLORED_TILE", payload: placement
        }, { actorId: first.player.id, role: "player" });
        assert("a separately acknowledged explored tile can then be placed",
          !!placement && placed.accepted && !placed.state.pendingExploration &&
          placed.state.tiles[pending.tileId].placed);

        const second = explorationState();
        const secondBegun = Game.tryApplyAction(second.st, {
          type: "BEGIN_EXPLORATION", payload: { fromKey: second.origin, unitId: "network-explorer" }
        }, { actorId: second.player.id, role: "player" });
        const noFitState = secondBegun.state;
        Object.values(noFitState.map.hexes).forEach((hex) => { hex.active = true; });
        const returnedId = noFitState.pendingExploration.tileId;
        const abandoned = Game.tryApplyAction(noFitState, {
          type: "ABANDON_EXPLORATION", payload: {}
        }, { actorId: second.player.id, role: "player" });
        assert("an actually unplaceable tile returns to the top after exhaustive checking",
          abandoned.accepted && abandoned.state.tileStack[0] === returnedId && !abandoned.state.pendingExploration);

        {
          // Shipbuilding's lower paragraph is an owned decision BEFORE the
          // reveal. No tile or movement point may disappear while that prompt
          // waits, and choosing a water token must continue the same expedition
          // rather than forcing the interface to start it a second time.
          const indonesia = explorationState();
          const sailor = indonesia.player;
          sailor.leaderId = "indonesia";
          sailor.cardTiers.economy = 2;
          sailor.cardLevels.economy = 2;
          sailor.uniqueTaken = true;
          sailor.armies = [];
          sailor.caravans = [{ id: "shipbuilder", position: indonesia.origin }];
          const seat = { actorId: sailor.id, role: "player" };
          const stackBefore = indonesia.st.tileStack.slice();
          const offered = Game.tryApplyAction(indonesia.st, {
            type: "BEGIN_EXPLORATION",
            payload: {
              fromKey: indonesia.origin, unitId: "shipbuilder",
              unitType: "caravan", startKey: indonesia.origin,
              route: [], tradeSpent: 0
            }
          }, seat);
          const waterChoice = offered.accepted && offered.state.pendingChoices
            .find((choice) => choice.kind === "shipbuilding_water");
          assert("Shipbuilding asks its owner before revealing the tile",
            offered.accepted && !!waterChoice && !offered.state.pendingExploration &&
            JSON.stringify(offered.state.tileStack) === JSON.stringify(stackBefore));

          const waterKey = waterChoice && waterChoice.hexKeys[0];
          const continued = waterChoice ? Game.tryApplyAction(offered.state, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: waterChoice.id, hexKey: waterKey }
          }, seat) : { accepted: false };
          const waterHex = continued.accepted && continued.state.map.hexes[waterKey];
          assert("placing Shipbuilding's water token atomically reveals the expedition tile",
            continued.accepted && waterHex && waterHex.active &&
            waterHex.terrain === "water" && waterHex.tileId === "water-token" &&
            continued.state.pendingExploration &&
            continued.state.pendingExploration.shipbuildingWaterKey === waterKey);
          assert("Shipbuilding charges exactly one exploration movement point",
            continued.accepted &&
            continued.state.pendingExploration.movementContinuation.remaining ===
              Game.getEconomyMove(sailor, indonesia.st) - 1);
          assert("Shipbuilding records its once-per-resolution opportunity on the active card",
            continued.accepted && continued.state.activeCard &&
            continued.state.activeCard.shipbuildingWaterOffered &&
            continued.state.activeCard.shipbuildingWaterPlaced);
        }

        {
          // Skipping the optional token is not cancelling the expedition: it
          // must reveal the same bottom tile and leave the map untouched.
          const indonesia = explorationState();
          const sailor = indonesia.player;
          sailor.leaderId = "indonesia";
          sailor.cardTiers.economy = 2;
          sailor.cardLevels.economy = 2;
          sailor.uniqueTaken = true;
          sailor.armies = [];
          sailor.caravans = [{ id: "shipbuilder-skip", position: indonesia.origin }];
          const seat = { actorId: sailor.id, role: "player" };
          const offered = Game.tryApplyAction(indonesia.st, {
            type: "BEGIN_EXPLORATION",
            payload: {
              fromKey: indonesia.origin, unitId: "shipbuilder-skip",
              unitType: "caravan", startKey: indonesia.origin,
              route: [], tradeSpent: 0
            }
          }, seat);
          const choice = offered.accepted && offered.state.pendingChoices
            .find((entry) => entry.kind === "shipbuilding_water");
          const activeBefore = choice
            ? choice.hexKeys.filter((key) => offered.state.map.hexes[key].active).length : -1;
          const skipped = choice ? Game.tryApplyAction(offered.state, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: choice.id, dismiss: true }
          }, seat) : { accepted: false };
          const activeAfter = choice && skipped.accepted
            ? choice.hexKeys.filter((key) => skipped.state.map.hexes[key].active).length : -2;
          assert("skipping Shipbuilding continues exploration without placing water",
            skipped.accepted && skipped.state.pendingExploration &&
            !skipped.state.pendingChoices.some((entry) => entry.id === choice.id) &&
            activeAfter === activeBefore);
        }

        {
          // Astronomy is a full replacement science card: inspect/reorder first,
          // optionally explore with a retained tile, and only then move the dial
          // and reset the card.
          const st0 = rulesState();
          const astronomer = st0.players[0];
          astronomer.leaderId = "poland";
          astronomer.cardTiers.science = 2;
          astronomer.cardLevels.science = 2;
          astronomer.uniqueTaken = true;
          st0.tiles = st0.setup.tiles;
          st0.tileStack = st0.setup.tileStack.slice();
          st0.tileDeck = st0.tileStack.slice();
          const capitalEdge = Object.keys(st0.map.hexes).find((hexKey) => {
            const hex = st0.map.hexes[hexKey];
            return hex && hex.active && hex.terrain !== "water" &&
              Game.hexNeighborKeys(hex.q, hex.r)
                .some((neighbor) => !st0.map.hexes[neighbor] || !st0.map.hexes[neighbor].active);
          });
          activate(st0, capitalEdge, {
            tileId: st0.map.hexes[capitalEdge].tileId,
            city: { ownerId: astronomer.id, isCapital: true, developed: false,
              hasWonder: false, wonder: null }
          });
          const expectedAdvance = Game.getSlotValue(astronomer, "science", st0);
          const originalStack = st0.tileStack.slice();
          const seat = { actorId: astronomer.id, role: "player" };
          const begun = Game.tryApplyAction(st0, {
            type: "PLAY_SCIENCE", payload: { tradeSpent: 0 }
          }, seat);
          const inspect = begun.accepted && begun.state.pendingChoices
            .find((choice) => choice.kind === "astronomy_tiles");
          assert("Astronomy exposes at most the bottom two tiles before moving the dial",
            begun.accepted && inspect && inspect.tileIds.length > 0 &&
            inspect.tileIds.length <= 2 && astronomer.tech === 0 &&
            begun.state.players[0].tech === 0);
          const reordered = inspect ? Game.tryApplyAction(begun.state, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: inspect.id, optionId: "none|top|forward" }
          }, seat) : { accepted: false };
          assert("Astronomy can return both inspected tiles to the top in order",
            reordered.accepted &&
            JSON.stringify(reordered.state.tileStack.slice(0, inspect.tileIds.length)) ===
              JSON.stringify(inspect.tileIds) &&
            reordered.state.tileStack.length === originalStack.length);
          assert("Astronomy advances and resets only after the tile decision is complete",
            reordered.accepted && !reordered.state.cardResolution &&
            reordered.state.players[0].tech === expectedAdvance &&
            reordered.state.players[0].cardPlayed);
        }

        {
          const st0 = rulesState();
          const astronomer = st0.players[0];
          astronomer.leaderId = "poland";
          astronomer.cardTiers.science = 2;
          astronomer.cardLevels.science = 2;
          astronomer.uniqueTaken = true;
          st0.tiles = st0.setup.tiles;
          st0.tileStack = st0.setup.tileStack.slice();
          st0.tileDeck = st0.tileStack.slice();
          const capitalEdge = Object.keys(st0.map.hexes).find((hexKey) => {
            const hex = st0.map.hexes[hexKey];
            return hex && hex.active && hex.terrain !== "water" &&
              Game.hexNeighborKeys(hex.q, hex.r)
                .some((neighbor) => !st0.map.hexes[neighbor] || !st0.map.hexes[neighbor].active);
          });
          activate(st0, capitalEdge, {
            tileId: st0.map.hexes[capitalEdge].tileId,
            city: { ownerId: astronomer.id, isCapital: true, developed: false,
              hasWonder: false, wonder: null }
          });
          const expectedAdvance = Game.getSlotValue(astronomer, "science", st0);
          const seat = { actorId: astronomer.id, role: "player" };
          const begun = Game.tryApplyAction(st0, {
            type: "PLAY_SCIENCE", payload: { tradeSpent: 0 }
          }, seat);
          const inspect = begun.accepted && begun.state.pendingChoices
            .find((choice) => choice.kind === "astronomy_tiles");
          const placeOption = inspect && inspect.options.find((option) =>
            String(option.id).startsWith("place|"));
          const selected = placeOption ? Game.tryApplyAction(begun.state, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: inspect.id, optionId: placeOption.id }
          }, seat) : { accepted: false };
          const edge = selected.accepted && selected.state.pendingChoices
            .find((choice) => choice.kind === "astronomy_edge");
          const explored = edge ? Game.tryApplyAction(selected.state, {
            type: "RESOLVE_PENDING_CHOICE",
            payload: { choiceId: edge.id, hexKey: edge.hexKeys[0] }
          }, seat) : { accepted: false };
          const pending = explored.accepted && explored.state.pendingExploration;
          assert("Astronomy explores the chosen retained tile from a capital-tile edge",
            explored.accepted && pending && pending.freeRun &&
            pending.followUp === "astronomy_finish" &&
            pending.tileId === (placeOption && placeOption.id.split("|")[1]) &&
            !explored.state.tileStack.includes(pending.tileId));

          let finished = { accepted: false };
          if (pending) {
            const placements = Game.getLegalExplorationPlacements(explored.state, pending);
            if (placements.length) {
              const home = placements[0];
              finished = Game.tryApplyAction(explored.state, {
                type: "PLACE_EXPLORED_TILE",
                payload: {
                  anchorKey: home.anchorKey, rotation: home.rotation, side: home.side
                }
              }, seat);
            } else {
              finished = Game.tryApplyAction(explored.state, {
                type: "ABANDON_EXPLORATION", payload: {}
              }, seat);
            }
          }
          assert("placing or returning Astronomy's tile closes its science transaction",
            finished.accepted && !finished.state.pendingExploration &&
            !finished.state.cardResolution &&
            finished.state.players[0].tech === expectedAdvance &&
            finished.state.players[0].cardPlayed);
        }
      }

      {
        const st = rulesState();
        const me = st.players[0];
        const slot = Game.getSlotValue(me, "culture", st);
        const reach = (n) => Game.validControlHexes(st, me.id, n).size;
        assert("culture trade buys markers, not terrain reach",
          Game.getCultureMarkers(me, 1, st) > Game.getCultureMarkers(me, 0, st) &&
          reach(slot) === reach(slot));
        const beforeReinforce = Game.getSlotValue(me, "growth", st);
        assert("growth district reach ignores trade",
          Game.validDistrictHexes(st, me.id, beforeReinforce).size ===
          Game.validDistrictHexes(st, me.id, beforeReinforce).size);
      }

      {
        // A district is a control marker, so it picks up the resource token on
        // its space like any other. It used to leave the token sitting on the
        // map underneath itself, where nothing could ever collect it again.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["growth", "culture", "science", "economy", "military", "industry"];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { resource: "marble" });
        const before = me.resources.marble;
        Game.applyAction(st, { type: "PLAY_GROWTH_DISTRICT",
          payload: { playerId: me.id, hexKey: "1,0", district: "campus", tradeSpent: 0 } });
        assert("a district collects the resource token on its space",
          me.resources.marble === before + 1);
        assert("and the space stops carrying it",
          st.map.hexes["1,0"].resource === null && !!st.map.hexes["1,0"].control);
      }

      {
        // A fort's whole rules footprint is its defence of 6. Setup used to
        // also stamp "forest" on the space, lifting it from difficulty 1 to 3,
        // and getReachable drops an over-limit space before it ever enters the
        // reachable set — so a caravan on a slot-1 Economy card could not enter
        // a fort at all, and an army on a slot-1 Military card could not attack
        // one, though forts are legal targets and both fort victory cards must
        // be held to win. Passing THROUGH a fort is a separate rule and is
        // still refused, by isForcedStopHex.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["economy", "growth", "science", "culture", "military", "industry"];
        activate(st, "0,0");
        activate(st, "1,0", { fortress: true });
        activate(st, "2,0");
        assert("a fort is difficulty 1, not an invented forest",
          st.map.hexes["1,0"].terrain !== "forest");
        const reach = Game.getReachable(st, "0,0", 3, "caravan", me.id);
        assert("a slot-1 caravan can enter a fort", reach.has("1,0"));
        assert("but still cannot pass through it", !reach.has("2,0"));

        const st2 = rulesState();
        const me2 = st2.players[0];
        me2.focusRow = ["military", "growth", "science", "culture", "economy", "industry"];
        activate(st2, "0,0");
        activate(st2, "1,0", { fortress: true });
        assert("a slot-1 army can reach a fort to attack it",
          Game.getReachable(st2, "0,0", 3, "army", me2.id).has("1,0"));
      }

      {
        // Terra p12: "Place that tile so that it touches FOUR SPACES already on
        // the map, including the space from which the player is exploring."
        // This asserted the opposite for a while - that one touching space was
        // enough - after the four was mistaken for base p14's map-setup rule
        // being wrongly imported. It is printed for exploration in as many
        // words, so the count is four and a lone frontier space is not enough.
        const st = rulesState();
        st.tiles = st.setup.tiles;
        st.tileStack = st.setup.tileStack.slice();
        Object.values(st.map.hexes).forEach((h) => { h.active = false; h.tileId = null; });
        activate(st, "0,0");
        const tileId = st.tileStack[st.tileStack.length - 1];
        const touching = (anchor, rot) => {
          const cells = Game.getTileHexKeys(anchor, rot, st.map.hexes);
          if (cells.length !== Game.TILE_OFFSETS.length) return null;
          if (cells.some((k) => st.map.hexes[k].active)) return null;
          const set = new Set(cells);
          const nb = new Set();
          cells.forEach((k) => Game.hexNeighborKeys(Game.parseQ(k), Game.parseR(k)).forEach((nk) => {
            if (set.has(nk)) return;
            const h = st.map.hexes[nk];
            if (h && h.active) nb.add(nk);
          }));
          return nb.size;
        };
        let lonely = null;
        Object.keys(st.map.hexes).forEach((anchor) => {
          if (lonely) return;
          for (let rot = 0; rot < 6; rot++) {
            const n = touching(anchor, rot);
            if (n !== null && n > 0 && n < 4) { lonely = { anchor, rot, n }; return; }
          }
        });
        assert("a placement touching fewer than four spaces exists to test", !!lonely);
        assert("exploring refuses a tile touching fewer than four board spaces",
          !!lonely && !Game.validateExploration(st, tileId, lonely.anchor, lonely.rot).ok);

        // And it accepts one that does touch four.
        const big = rulesState();
        big.tiles = big.setup.tiles;
        big.tileStack = big.setup.tileStack.slice();
        const bigTile = big.tileStack[big.tileStack.length - 1];
        let roomy = null;
        Object.keys(big.map.hexes).forEach((anchor) => {
          if (roomy) return;
          for (let rot = 0; rot < 6; rot++) {
            if (Game.validateExploration(big, bigTile, anchor, rot).ok) { roomy = { anchor, rot }; return; }
          }
        });
        assert("exploring accepts a tile that touches four", !!roomy);
      }

      {
        // The UI used to grow the offered set outward from each token it placed,
        // with no city-adjacency test, so it invited a chain the engine refuses.
        // The engine dropped those hexes but still spent the card and the trade,
        // costing a marker that never landed. The offered set must therefore be
        // exactly the engine's own legal set, at every step.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0");
        activate(st, "2,0");   // one further out: adjacent to 1,0 but to no city
        const slot = Game.getSlotValue(me, "culture", st);
        const legal = Game.validControlHexes(st, me.id, slot);
        assert("a space beside your city is offered", legal.has("1,0"));
        assert("a space beyond it, touching no city, is not",  !legal.has("2,0"));

        // And placing on the near space must not make the far one legal.
        st.map.hexes["1,0"].control = { ownerId: me.id, fortified: false, district: null };
        assert("placing a marker does not extend the range to its neighbours",
          !Game.validControlHexes(st, me.id, slot).has("2,0"));
      }

      {
        // Early Empire's printed requirement is adjacency to a friendly CITY.
        // A friendly control token must never extend that placement range.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { control: { ownerId: me.id, fortified: false, district: null } });
        activate(st, "2,0");
        assert("Early Empire excludes spaces adjacent only to friendly control",
          !Game.validControlHexes(st, me.id, Game.getSlotValue(me, "culture", st)).has("2,0"));
        Game.applyAction(st, { type: "PLAY_CULTURE", payload: { playerId: me.id, hexKeys: ["2,0"], tradeSpent: 0 } });
        assert("Early Empire rejects forged control-token chains",
          !st.map.hexes["2,0"].control && !me.cardPlayed);

        const cityAdjacent = rulesState();
        const owner = cityAdjacent.players[0];
        owner.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        activate(cityAdjacent, "0,0", { city: { ownerId: owner.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(cityAdjacent, "1,0");
        Game.applyAction(cityAdjacent, { type: "PLAY_CULTURE", payload: { playerId: owner.id, hexKeys: ["1,0"], tradeSpent: 0 } });
        assert("Early Empire accepts adjacency to a friendly city",
          cityAdjacent.map.hexes["1,0"].control?.ownerId === owner.id);
      }

      {
        // PLAY_CULTURE used to accept a mixed list, silently skip the illegal
        // key, and still reset the card. That made two markers selected in the
        // interface resolve as one marker on the board. A multi-marker action
        // is now all-or-nothing, including its trade payment.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        me.trade.culture = 1;
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0");
        activate(st, "0,1");
        activate(st, "2,0"); // active, but not adjacent to the friendly city
        const beforeTrade = me.trade.culture;
        const rejected = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
          hexKeys: ["1,0", "2,0"], tradeSpent: 1
        }}, { actorId: me.id, role: "player" });
        assert("a partially illegal control-marker batch is rejected atomically",
          !rejected.accepted && rejected.code === "control_space_invalid" &&
          !st.map.hexes["1,0"].control && !st.map.hexes["2,0"].control &&
          !me.cardPlayed && me.trade.culture === beforeTrade);

        const accepted = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
          hexKeys: ["1,0", "0,1"], tradeSpent: 0
        }}, { actorId: me.id, role: "player" });
        assert("two legal control markers are both placed by one transaction",
          accepted.accepted && accepted.state.map.hexes["1,0"].control?.ownerId === me.id &&
          accepted.state.map.hexes["0,1"].control?.ownerId === me.id);
      }

      {
        // Base p9: "The player cannot move more than one caravan to the same
        // city or city-state during the same turn." That was checked AFTER the
        // caravan had already been moved, so the second one teleported onto the
        // city, gained nothing, and the action still reported success.
        const st = rulesState();
        const me = st.players[0], foe = st.players[1];
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass", cityState: { name: "Test State", type: "culture" } });
        me.caravans = [{ id: "c1", position: null }, { id: "c2", position: null }];

        const first = Game.tryApplyAction(st, { type: "PLAY_ECONOMY", payload: {
          unitId: "c1", toKey: "1,0", tradeSpent: 0 } }, { actorId: me.id, role: "player" });
        assert("the first caravan trades with the city-state", first.accepted, first.code);

        const second = Game.tryApplyAction(first.state, { type: "PLAY_ECONOMY", payload: {
          unitId: "c2", toKey: "1,0", tradeSpent: 0 } }, { actorId: me.id, role: "player" });
        assert("a second caravan to the same city-state is refused",
          !second.accepted && second.code === "city_already_traded", second.code);
        const stranded = second.state.players[0].caravans.find((u) => u.id === "c2");
        assert("and it did not move there anyway", stranded.position !== "1,0",
          String(stranded.position));
      }

      {
        // Terra p9, the printed district effects. Four of the five were wrong:
        // three are a CHOICE of one of two options and were fused into a single
        // always-on effect, the "friendly space" test was missing, the counts
        // left out the district's own space, and the industrial zone carried an
        // invented cap of 3.
        // `setUp` runs with the state already built, so fixtures can name the
        // owning player without referring to a binding that does not exist yet.
        const mk = (kind, setUp) => {
          const st = rulesState();
          const me = st.players[0];
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          activate(st, "1,0", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: kind } });
          if (setUp) setUp(st, me);
          return { st, me };
        };
        const mine = (id) => ({ ownerId: id, fortified: false, district: null });
        const mode = (st) => (st.pendingChoices || []).find((c) => c.kind === "district_mode");

        {
          // "...for each FRIENDLY space with a forest that is IN OR ADJACENT to
          // your industrial zone's space." Four friendly forests, one of them
          // the district's own space, and one unowned forest that must not pay.
          const { st, me } = mk("industrial", (s2, p2) => {
            activate(s2, "1,-1", { terrain: "forest", control: mine(p2.id) });
            activate(s2, "2,0",  { terrain: "forest", control: mine(p2.id) });
            activate(s2, "2,-1", { terrain: "forest", control: mine(p2.id) });
            activate(s2, "1,1",  { terrain: "forest" });          // nobody's: worth nothing
            s2.map.hexes["1,0"].terrain = "forest";               // its own space counts
          });
          Game.resolveEvent(st, "district_event");
          const m = mode(st);
          assert("the industrial zone asks which effect", !!m);
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: m.id, optionId: "forest" } });
          // Three friendly neighbours plus the district's own space is 4. The
          // count is read off the log rather than the card, because base p13
          // caps a focus card at three trade tokens - that cap is real and
          // would hide the difference between the printed count and the old
          // hard-coded Math.min(3, ...), which is the thing under test.
          assert("it counts friendly forests in AND adjacent, with no cap of 3",
            out.log.some((line) => /\+4 industry trade \(industrial zone forests\)/.test(line)),
            JSON.stringify(out.log.slice(-3)));
          assert("and the card itself still stops at three tokens (base p13)",
            out.players[0].trade.industry === 3, String(out.players[0].trade.industry));
        }

        {
          // The unowned desert must not pay either.
          const { st, me } = mk("trade", (s2) => activate(s2, "2,0", { terrain: "desert" }));
          const before = me.trade.economy;
          Game.resolveEvent(st, "district_event");
          const m = mode(st);
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: m.id, optionId: "desert" } });
          assert("a desert nobody owns pays the commercial hub nothing",
            out.players[0].trade.economy === before,
            "gained " + (out.players[0].trade.economy - before));
        }

        {
          // Terra p9: "Defeat a barbarian OR RIVAL ARMY within two spaces."
          const { st, me } = mk("encampment");
          const foe = st.players[1];
          activate(st, "2,0", { terrain: "grass" });
          foe.armies = [{ id: "e1", position: "2,0" }];
          Game.resolveEvent(st, "district_event");
          const strike = (st.pendingChoices || []).find((c) => c.kind === "encampment_strike");
          assert("an encampment can strike a rival army", !!strike && strike.hexKeys.includes("2,0"),
            JSON.stringify((st.pendingChoices || []).map((c) => c.kind)));
          const hit = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: strike.id, hexKey: "2,0" } });
          assert("and the army is defeated back onto its card",
            hit.players[1].armies[0].position === null);
          assert("a defeated ARMY pays no barbarian trade token", !hit.pendingBarbReward);
        }

        {
          // "Place one control token in a space within two spaces of a friendly
          // city that has a wonder" - the second theater option, missing entirely.
          const { st, me } = mk("theater");
          activate(st, "4,0", { terrain: "grass", city: {
            ownerId: me.id, isCapital: false, developed: false, hasWonder: true, wonder: { name: "Stonehenge" } } });
          activate(st, "5,0", { terrain: "grass" });
          Game.resolveEvent(st, "district_event");
          const m = mode(st);
          assert("the theater square offers both printed options",
            !!m && m.options.map((o) => o.id).sort().join(",") === "near,wonder",
            m && m.options.map((o) => o.id).join(","));
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: m.id, optionId: "wonder" } });
          const spots = (out.pendingChoices || []).find((c) => c.kind === "place_control");
          assert("and the wonder option reaches spaces near the wonder city",
            !!spots && spots.hexKeys.includes("5,0"),
            spots ? spots.hexKeys.join(" ") : "none");
        }
      }

      {
        // Base p16: "After barbarians move, if a space contains more than one
        // barbarian, roll a die and move one of those barbarians in the rolled
        // direction. Repeat until no space contains more than one barbarian."
        //
        // The old code refused the move instead, so a barbarian whose target
        // space was held by one that could not move just stood still. Set up
        // exactly that: a reinforced marker stops the leader, and the follower
        // must NOT simply stay put.
        const base = rulesState();
        const me = base.players[0];
        for (let q = 0; q <= 8; q++) activate(base, q + ",0", { terrain: "grass" });
        // Ring the lane with land so a pushed barbarian has somewhere to go.
        for (let q = 0; q <= 8; q++) {
          activate(base, q + ",-1", { terrain: "grass" });
          activate(base, q + ",1", { terrain: "grass" });
        }
        activate(base, "4,0", { terrain: "grass", control: { ownerId: me.id, fortified: true, district: null } });
        // Only these two on the board. rulesState() populates the map from the
        // tiles, and a stray setup barbarian marching into the same lane made
        // the outcome depend on where the shuffle had put it.
        Object.values(base.map.hexes).forEach((h) => { h.barbarian = false; h.barbarianId = null; });
        base.map.hexes["2,0"].barbarian = true; base.map.hexes["2,0"].barbarianId = "L";
        base.map.hexes["1,0"].barbarian = true; base.map.hexes["1,0"].barbarianId = "F";

        // Roll until the march goes east (face 2), so the leader at 2,0 is
        // stopped by the reinforced marker at 3,0... and the follower wants 2,0.
        activate(base, "3,0", { terrain: "grass", control: { ownerId: me.id, fortified: true, district: null } });
        let out = null;
        for (let i = 0; i < 500; i++) {
          const attempt = JSON.parse(JSON.stringify(base));
          Game.resolveEvent(attempt, "barbarian_move");
          if (attempt.barbarianMove && attempt.barbarianMove.roll === 2) { out = attempt; break; }
        }
        assert("the march rolled east at least once", !!out);
        if (out) {
          // rulesState() populates the map with setup barbarians too, so this
          // counts by id rather than by "how many are on the board".
          const at = (id) => Object.entries(out.map.hexes)
            .filter(([, h]) => h.barbarian && h.barbarianId === id).map(([k]) => k);
          assert("the leader is still on the board", at("L").length === 1, at("L").join(" "));
          assert("the follower is still on the board", at("F").length === 1, at("F").join(" "));
          assert("and they are not sharing a space", at("L")[0] !== at("F")[0],
            at("L")[0] + " vs " + at("F")[0]);
          // The rule says "move ONE of those barbarians" without saying which,
          // and the push direction is a fresh die - so where either one lands
          // is genuinely random and asserting a space would only pin the roll.
          // What must hold is the rule itself: a pile formed, a roll broke it
          // up, and no space is left holding two.
          assert("the pile was dispersed by a die roll",
            out.log.some((line) => /pushed/.test(line)),
            JSON.stringify(out.log.slice(-4)));
          assert("no space is left holding two barbarians",
            !out.log.some((line) => /stuck together/.test(line)),
            JSON.stringify(out.log.slice(-4)));
          assert("the reinforced marker stopped the advance",
            out.log.some((line) => /battered a reinforced control marker at 3,0/.test(line)),
            JSON.stringify(out.log.slice(-5)));
        }
      }

      {
        // Terra p10: "If an army attacks a space with a barbarian, the barbarian
        // must be the target." The fort was checked first, so a barbarian
        // standing on one was unattackable, the fort's 6 was used instead of the
        // space's difficulty, and the attacker could capture the fort out from
        // under a barbarian that was still standing there.
        const st = rulesState();
        const me = st.players[0];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        // Terra p11: "Fort spaces are treated as forests with a terrain
        // difficulty value of 3."
        activate(st, "1,0", { terrain: "forest", fortress: true, barbarian: true });
        const d = Game.findDefender(st, "1,0", me.id);
        assert("a barbarian on a fort is the target, not the fort", d && d.type === "barbarian", d && d.type);
        assert("and it defends with the space's difficulty, not the fort's 6",
          d && d.power === 3, d && d.power);
        assert("no choice of target is offered", Game.findDefenders(st, "1,0", me.id).length === 1);

        // The bare fort is still a 6 once the barbarian is gone.
        st.map.hexes["1,0"].barbarian = false;
        const bare = Game.findDefender(st, "1,0", me.id);
        assert("an empty fort still defends at 6", bare && bare.type === "fortress" && bare.power === 6);

        // Base p15 says the same for the other static defender.
        const cs = rulesState();
        activate(cs, "1,0", { terrain: "grass", cityState: { name: "Test State", type: "culture" }, barbarian: true });
        const csd = Game.findDefender(cs, "1,0", cs.players[0].id);
        assert("a barbarian on a city-state is the target too",
          csd && csd.type === "barbarian" && csd.power === 1, csd && (csd.type + "/" + csd.power));
      }

      {
        // The user's report was "place 2 control tokens, one lands, card spent".
        // The growth card used to place a district AND buy reinforcements in one
        // packet, silently dropping the illegal keys while charging the card.
        //
        // The card is now resolved as the printed sequence instead: the district
        // is placed and confirmed first, and the reinforcement step follows. So
        // the combined packet is refused outright rather than partly applied,
        // which is a stronger version of the same guarantee.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        me.trade.growth = 2;
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass" });                                        // the district's space
        activate(st, "0,1", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: null } });
        const play = (extra) => Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: Object.assign({ hexKey: "1,0", district: "campus", tradeSpent: 0 }, extra || {})
        }, { actorId: me.id, role: "player" });

        const legacy = play({ reinforceKeys: ["0,1"], tradeSpent: 1 });
        assert("the combined district+reinforce packet is refused",
          !legacy.accepted && legacy.code === "growth_sequence_required", legacy.code);
        assert("and nothing was placed or spent",
          !st.map.hexes["1,0"].control && !st.map.hexes["0,1"].control.fortified &&
          me.trade.growth === 2 && !me.cardPlayed);

        const forged = play({ tradeSpent: 99 });
        assert("a district cannot spend trade it does not have", !forged.accepted, forged.code);
        assert("and that refusal changed nothing either",
          !st.map.hexes["1,0"].control && me.trade.growth === 2);

        // The legal case still works, so the guard cannot pass by refusing all.
        const good = play({});
        assert("a district placement on its own is accepted", good.accepted, good.code);
        assert("the district is placed",
          good.accepted && good.state.map.hexes["1,0"].control.district === "campus");
        assert("and it goes down unreinforced (Terra p9)",
          good.accepted && good.state.map.hexes["1,0"].control.fortified === false);
        // Irrigation (tier I) prints only the placement, so it finishes here.
        assert("a tier I growth card is done once the district is down",
          good.accepted && !good.state.cardResolution);
      }

      {
        // Bug 11: Sanitation (III) and Globalization (IV) do NOT ask "reinforce
        // OR district" - they print both, so the card must keep resolving after
        // the district instead of being reset.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        me.cardTiers.growth = 3;
        assert("tier III growth is Sanitation", Game.getCardName(me, "growth") === "Sanitation");
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass" });
        activate(st, "0,1", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: null } });
        const out = Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: { hexKey: "1,0", district: "campus", tradeSpent: 0 }
        }, { actorId: me.id, role: "player" });
        assert("the district is placed", out.accepted, out.code);
        assert("and the card is still resolving its second printed effect",
          out.accepted && !!out.state.cardResolution &&
          out.state.cardResolution.cardType === "growth",
          JSON.stringify(out.state && out.state.cardResolution));
        assert("so the card is not reset yet",
          out.accepted && out.state.players[0].cardPlayed === false);
        const completed = out.accepted ? Game.tryApplyAction(out.state, {
          type: "PLAY_GROWTH_REINFORCE",
          payload: { hexKeys: ["0,1"], tradeSpent: 0 }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        assert("Sanitation finishes only after its reinforcement step",
          completed.accepted && !completed.state.cardResolution &&
          completed.state.players[0].cardPlayed &&
          completed.state.map.hexes["0,1"].control.fortified,
          completed.code);
      }

      {
        // Districts are physical tokens: one of each type per player, so a type
        // already on the map cannot be placed again by that player.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: "campus" } });
        activate(st, "0,1", { terrain: "grass" });
        const again = Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: { hexKey: "0,1", district: "campus", tradeSpent: 0 }
        }, { actorId: me.id, role: "player" });
        assert("a second district of a type you already placed is refused",
          !again.accepted && again.code === "district_token_unavailable", again.code);
        assert("and the space stays empty", !st.map.hexes["0,1"].control);

        // A type still in hand is unaffected.
        const other = Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: { hexKey: "0,1", district: "theater", tradeSpent: 0 }
        }, { actorId: me.id, role: "player" });
        assert("a district type still in hand can be placed", other.accepted, other.code);
      }

      {
        // Natural wonders are reusable physical resources controlled by their
        // map space. They are exhausted for this turn, never consumed.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["growth", "culture", "science", "economy", "military", "industry"];
        activate(st, "0,0", { city: {
          ownerId: me.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        activate(st, "1,0", {
          naturalWonder: "Mt Kilimanjaro",
          control: { ownerId: me.id, fortified: false, district: null }
        });
        const deck = st.wonderDecks.military;
        deck.deck = ["Jebel Barkal"].concat(deck.deck.filter((name) => name !== "Jebel Barkal"));
        deck.revealed = "Jebel Barkal";

        const held = Game.getControlledNaturalWonders(st, me.id);
        assert("a controlled Natural Wonder exposes its printed resource",
          held.length === 1 && held[0].hexKey === "1,0" && held[0].resource === "oil" && !held[0].usedThisTurn,
          JSON.stringify(held));
        const preview = Game.calculateWonderProduction(st, me, "Jebel Barkal", {
          tradeSpent: 0, resources: {}, naturalWonders: ["1,0"]
        });
        assert("a matching Natural Wonder contributes production",
          preview.ok && preview.production.naturalWonderResources === 1 &&
          preview.production.total === 7 && preview.affordable,
          JSON.stringify(preview));

        const built = Game.tryApplyAction(st, { type: "PLAY_INDUSTRY_WONDER", payload: {
          hexKey: "0,0", wonderName: "Jebel Barkal", tradeSpent: 0,
          resources: {}, naturalWonders: ["1,0"]
        }}, { actorId: me.id, role: "player" });
        assert("Natural Wonder production builds the eligible world wonder",
          built.accepted && built.state.map.hexes["0,0"].city.wonder.name === "Jebel Barkal",
          built.code);
        const afterUse = built.accepted
          ? Game.getControlledNaturalWonders(built.state, me.id) : [];
        assert("using a Natural Wonder keeps it on the map but exhausts it this turn",
          afterUse.length === 1 && afterUse[0].usedThisTurn &&
          built.state.map.hexes["1,0"].naturalWonder === "Mt Kilimanjaro");
        const duplicate = built.accepted ? Game.calculateWonderProduction(
          built.state, built.state.players[0], "Jebel Barkal",
          { naturalWonders: ["1,0"] }) : { ok: true };
        assert("the same Natural Wonder cannot be used twice in one turn",
          !duplicate.ok && duplicate.code === "natural_wonder_already_used", duplicate.code);

        if (built.accepted) {
          built.state.turn.round++;
          assert("a Natural Wonder refreshes on a later turn",
            !Game.getControlledNaturalWonders(built.state, me.id)[0].usedThisTurn);
          built.state.map.hexes["1,0"].control.ownerId = built.state.players[1].id;
          assert("Natural Wonder availability follows control immediately",
            Game.getControlledNaturalWonders(built.state, me.id).length === 0 &&
            Game.getControlledNaturalWonders(built.state, built.state.players[1].id).length === 1);
        }
      }

      {
        // All wonder reducers meet in one calculator, and removing the source
        // immediately restores the price.
        const st = rulesState();
        const me = st.players[0];
        activate(st, "0,0", { city: {
          ownerId: me.id, isCapital: true, developed: true,
          hasWonder: false, wonder: null
        } });
        activate(st, "2,0", { city: {
          ownerId: me.id, isCapital: false, developed: true,
          hasWonder: false, wonder: null
        } });
        me.diplomacy.push(
          { fromCityState: "Brussels", cardId: "brussels" },
          { fromCityState: "Buenos Aires", cardId: "buenos-aires" }
        );
        const reduced = Game.calculateWonderCost("Jebel Barkal", me, st);
        assert("Brussels and Buenos Aires combine in the final wonder cost",
          reduced.baseCost === 7 && reduced.finalCost === 3 &&
