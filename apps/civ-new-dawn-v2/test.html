          assert("Oracle offers a swap at the start of the turn", !!offer,
            JSON.stringify((s.pendingChoices || []).map((c) => c.source)));
          assert("which is optional", !!offer && offer.optional === true);
          assert("it offers one option per ADJACENT pair, and no others",
            offer.options.length === 5, JSON.stringify(offer.options.map((o) => o.id)));
          const rowBefore = Game.getPlayer(s, b.me.id).focusRow.slice();
          const done = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: offer.id, optionId: "0" } });
          const rowAfter = Game.getPlayer(done, b.me.id).focusRow;
          assert("taking the first option swaps exactly the first two cards",
            rowAfter[0] === rowBefore[1] && rowAfter[1] === rowBefore[0],
            JSON.stringify({ rowBefore, rowAfter }));
          assert("and leaves the rest of the row alone",
            rowAfter.slice(2).join(",") === rowBefore.slice(2).join(","),
            JSON.stringify({ rowBefore, rowAfter }));
          proves("wonder.science.oracle");
        }

        // ── Great Zimbabwe ───────────────────────────────────────────────
        {
          // "You can place trade tokens on THIS CARD instead of on your focus
          // cards, UP TO A LIMIT OF 4. At the start of your turn, you may move
          // trade tokens from this card to cards in your focus row."
          const b = turnBoard((st, me) => {
            giveCityWonder(st, me.id, "0,0", "Great Zimbabwe", "economy");
            me.zimbabwe = 2;
          });
          const s = beginOwnersTurn(b);
          const offer = (s.pendingChoices || []).find((c) => c.kind === "zimbabwe_move");
          assert("banked tokens are offered back at the start of the turn", !!offer,
            JSON.stringify((s.pendingChoices || []).map((c) => c.kind)));
          assert("which is optional", !!offer && offer.optional === true);
          const before = Game.getPlayer(s, b.me.id).trade.military;
          const moved = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: offer.id, optionId: "military" } });
          const after = Game.getPlayer(moved, b.me.id);
          assert("moving one puts it on the named focus card",
            after.trade.military === before + 1, String(after.trade.military));
          assert("and takes it off the wonder", after.zimbabwe === 1,
            String(after.zimbabwe));

          // The banking half: a gained trade token may go on the wonder.
          const bank = turnBoard((st, me) => {
            giveCityWonder(st, me.id, "0,0", "Great Zimbabwe", "economy");
            me.zimbabwe = 0;
          });
          bank.st.pendingBarbReward = { playerId: bank.me.id, cardResolutionId: null };
          bank.st.pendingChoices = [{ id: "bank1", kind: "trade_any", playerId: bank.me.id,
            amount: 1, title: "test", options: [{ id: "zimbabwe", label: "Great Zimbabwe" }] }];
          const banked = Game.applyAction(bank.st, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: bank.me.id, choiceId: "bank1", optionId: "zimbabwe" } });
          assert("a trade token can be banked on the wonder instead of the row",
            Game.getPlayer(banked, bank.me.id).zimbabwe === 1,
            String(Game.getPlayer(banked, bank.me.id).zimbabwe));

          const full = turnBoard((st, me) => {
            giveCityWonder(st, me.id, "0,0", "Great Zimbabwe", "economy");
            me.zimbabwe = 4;
          });
          full.st.pendingChoices = [{ id: "bank2", kind: "trade_any", playerId: full.me.id,
            amount: 1, title: "test", options: [{ id: "zimbabwe", label: "Great Zimbabwe" }] }];
          const refused = Game.applyAction(full.st, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: full.me.id, choiceId: "bank2", optionId: "zimbabwe" } });
          assert("and the wonder stops at its printed limit of 4",
            Game.getPlayer(refused, full.me.id).zimbabwe === 4,
            String(Game.getPlayer(refused, full.me.id).zimbabwe));
          proves("wonder.economy.great_zimbabwe");
        }
      }

      {
        // Wonders that change what a card or a placement is allowed to reach.
        // Each is measured against the identical board without the wonder.
        const wBoard = (setUp) => {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.control = null; h.city = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 6; q++) {
            for (let r = -2; r <= 2; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          st.map.hexes["0,0"].city = { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null };
          if (setUp) setUp(st, me, foe);
          return { st, me, foe };
        };
        // A wonder needs a city to sit in, and a city of its own changes what
        // the board allows. The two are therefore separate: `placeCity` is
        // called on BOTH sides of a comparison so the boards differ by the
        // wonder and by nothing else, and `attachWonder` only adds the wonder.
        const placeCity = (st, playerId, key) => {
          const hex = st.map.hexes[key];
          hex.city = hex.city || { ownerId: playerId, isCapital: key === "0,0",
            developed: false, hasWonder: false, wonder: null };
          return hex.city;
        };
        const attachWonder = (st, playerId, name, type, key) => {
          const city = placeCity(st, playerId, key || "0,0");
          city.hasWonder = true;
          city.wonder = { name, type, era: "ancient" };
        };
        const addWonder = attachWonder;

        // ── Taj Mahal ────────────────────────────────────────────────────
        {
          // "When you resolve a focus card, resolve it as though it is 1 slot
          // farther to the right FOR EACH WORLD WONDER YOU CONTROL MATCHING
          // THE FOCUS CARD'S TYPE."
          const slotOf = (b, type) => Game.getSlotValue(b.me, type, b.st);
          const plain = wBoard((st, me) => {
            // FOCUS_SLOTS is [1,1,2,3,4,5]. Places 0 and 1 both print 1, so
            // the card under test starts at place 1 where a one-place shift
            // actually changes the number.
            me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          });
          const base = slotOf(plain, "science");
          const one = wBoard((st, me) => {
            // FOCUS_SLOTS is [1,1,2,3,4,5]. Places 0 and 1 both print 1, so
            // the card under test starts at place 1 where a one-place shift
            // actually changes the number.
            me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
            addWonder(st, me.id, "Taj Mahal", "culture");
            addWonder(st, me.id, "Oracle", "science", "2,0");
          });
          assert("one science wonder shifts a science card one place",
            slotOf(one, "science") > base, `${base} -> ${slotOf(one, "science")}`);
          const two = wBoard((st, me) => {
            // FOCUS_SLOTS is [1,1,2,3,4,5]. Places 0 and 1 both print 1, so
            // the card under test starts at place 1 where a one-place shift
            // actually changes the number.
            me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
            addWonder(st, me.id, "Taj Mahal", "culture");
            addWonder(st, me.id, "Oracle", "science", "2,0");
            addWonder(st, me.id, "Great Library", "science", "3,0");
          });
          assert("two shift it further still: it counts wonders",
            slotOf(two, "science") > slotOf(one, "science"),
            `${slotOf(one, "science")} -> ${slotOf(two, "science")}`);
          const wrongType = wBoard((st, me) => {
            // FOCUS_SLOTS is [1,1,2,3,4,5]. Places 0 and 1 both print 1, so
            // the card under test starts at place 1 where a one-place shift
            // actually changes the number.
            me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
            addWonder(st, me.id, "Taj Mahal", "culture");
            addWonder(st, me.id, "Colossus", "economy", "2,0");
          });
          assert("a wonder of another type does nothing for this card",
            slotOf(wrongType, "science") === base,
            `${base} -> ${slotOf(wrongType, "science")}`);
          const noTaj = wBoard((st, me) => {
            // FOCUS_SLOTS is [1,1,2,3,4,5]. Places 0 and 1 both print 1, so
            // the card under test starts at place 1 where a one-place shift
            // actually changes the number.
            me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
            addWonder(st, me.id, "Oracle", "science", "2,0");
          });
          assert("and without Taj Mahal the same science wonder shifts nothing",
            slotOf(noTaj, "science") === base, `${base} -> ${slotOf(noTaj, "science")}`);
          proves("wonder.culture.taj_mahal");
        }

        // ── Machu Picchu ─────────────────────────────────────────────────
        {
          // "When you resolve the card in the FIRST OR SECOND slot of your
          // focus row, resolve it as though it is 2 SLOTS FARTHER TO THE
          // RIGHT."
          const row = ["science", "culture", "growth", "economy", "military", "industry"];
          const at = (idx, withWonder) => {
            const b = wBoard((st, me) => {
              me.focusRow = row.slice();
              // Move the card under test into place idx.
              const type = me.focusRow[idx];
              if (withWonder) addWonder(st, me.id, "Machu Picchu", "economy", "2,0");
              me.__type = type;
            });
            return { slot: Game.getSlotValue(b.me, b.me.focusRow[idx], b.st),
                     type: b.me.focusRow[idx] };
          };
          const first = at(0, false), firstW = at(0, true);
          const second = at(1, false), secondW = at(1, true);
          const third = at(2, false), thirdW = at(2, true);
          assert("a card in the first place resolves two slots further right",
            firstW.slot > first.slot, `${first.slot} -> ${firstW.slot}`);
          assert("so does one in the second place",
            secondW.slot > second.slot, `${second.slot} -> ${secondW.slot}`);
          assert("but a card in the third place is untouched: the card says first or second",
            thirdW.slot === third.slot, `${third.slot} -> ${thirdW.slot}`);
          // FOCUS_SLOTS is [1,1,2,3,4,5]: two places right of the first is
          // printed slot 2, which is the number that has to come out.
          assert("and the shift is by PLACES, landing on the printed number there",
            firstW.slot === Game.FOCUS_SLOTS[2] && secondW.slot === Game.FOCUS_SLOTS[3],
            JSON.stringify({ firstW: firstW.slot, secondW: secondW.slot,
              slots: Game.FOCUS_SLOTS }));
          proves("wonder.economy.machu_picchu");
        }

        // ── Chichen Itza ─────────────────────────────────────────────────
        {
          // "When placing control tokens, you can place them on EMPTY FOREST
          // spaces that are NOT ADJACENT TO A FRIENDLY CITY."
          const build = (withWonder) => wBoard((st, me) => {
            placeCity(st, me.id, "2,0");                  // on both boards
            if (withWonder) attachWonder(st, me.id, "Chichen Itza", "culture", "2,0");
            activate(st, "5,0", { terrain: "forest" });   // far from any city
            activate(st, "5,1", { terrain: "grass" });    // far, and not forest
          });
          const plain = build(false), chichen = build(true);
          assert("an ordinary culture card cannot reach a distant forest",
            !Game.validControlHexes(plain.st, plain.me.id, 5).has("5,0"));
          assert("Chichen Itza can",
            Game.validControlHexes(chichen.st, chichen.me.id, 5).has("5,0"));
          assert("but only a FOREST: a distant grass space is still out of reach",
            !Game.validControlHexes(chichen.st, chichen.me.id, 5).has("5,1"));
          const occupied = wBoard((st, me, foe) => {
            addWonder(st, me.id, "Chichen Itza", "culture", "2,0");
            activate(st, "5,0", { terrain: "forest",
              control: { ownerId: foe.id, fortified: false, district: null } });
          });
          assert("and only an EMPTY one: a forest holding a token is not offered",
            !Game.validControlHexes(occupied.st, occupied.me.id, 5).has("5,0"));
          proves("wonder.culture.chichen_itza");
        }

        // ── Sydney Opera House ───────────────────────────────────────────
        {
          // "RIVAL control tokens contribute toward YOUR cities' maturity."
          const ring = ["1,0", "-1,0", "0,1", "0,-1", "1,-1", "-1,1"];
          const build = (withWonder) => wBoard((st, me, foe) => {
            ring.forEach((k, i) => activate(st, k, { terrain: "grass",
              control: { ownerId: i === 0 ? foe.id : me.id, fortified: false, district: null } }));
            placeCity(st, me.id, "3,0");                 // on both boards
            if (withWonder) attachWonder(st, me.id, "Sydney Opera House", "culture", "3,0");
          });
          const plain = build(false);
          assert("a ring with one RIVAL token in it leaves the city immature",
            Game.countDeveloped(plain.st, plain.me.id) === 0,
            String(Game.countDeveloped(plain.st, plain.me.id)));
          const sydney = build(true);
          assert("Sydney Opera House makes that rival token count",
            Game.countDeveloped(sydney.st, sydney.me.id) === 1,
            String(Game.countDeveloped(sydney.st, sydney.me.id)));
          const gap = wBoard((st, me, foe) => {
            ring.forEach((k, i) => { if (i > 0) activate(st, k, { terrain: "grass",
              control: { ownerId: me.id, fortified: false, district: null } }); });
            addWonder(st, me.id, "Sydney Opera House", "culture", "3,0");
          });
          assert("but an EMPTY space in the ring still does not, so it is tokens it counts",
            Game.countDeveloped(gap.st, gap.me.id) === 0,
            String(Game.countDeveloped(gap.st, gap.me.id)));
          proves("wonder.culture.sydney_opera_house");
        }

        // ── Colossus ─────────────────────────────────────────────────────
        {
          // "When resolving your economy focus card, your caravans can move a
          // TOTAL OF 6 ADDITIONAL SPACES, divided as you choose."
          const build = (withWonder) => {
            const b = wBoard((st, me) => {
              placeCity(st, me.id, "2,0");                // on both boards
              if (withWonder) attachWonder(st, me.id, "Colossus", "economy", "2,0");
              me.caravans = [{ id: "c1", position: "0,0" }];
            });
            return b;
          };
          const plain = build(false), colossus = build(true);
          const plainMove = Game.getEconomyMove(plain.me, plain.st);
          const withMove = Game.getEconomyMove(colossus.me, colossus.st);
          assert("Colossus adds exactly six spaces of caravan movement",
            withMove === plainMove + 6, `${plainMove} -> ${withMove}`);
          const plainReach = Game.getReachable(plain.st, "0,0", plainMove, "caravan", plain.me.id);
          const wideReach = Game.getReachable(colossus.st, "0,0", withMove, "caravan", colossus.me.id);
          assert("so a caravan really does reach further on the board",
            wideReach.size > plainReach.size,
            `${plainReach.size} -> ${wideReach.size}`);
          const far = "6,0";
          assert("a space beyond the ordinary range is out of reach without it",
            !plainReach.has(far), [...plainReach].sort().join(" "));
          assert("and within reach with it", wideReach.has(far));
          const out = Game.tryApplyAction(colossus.st, { type: "PLAY_ECONOMY", payload: {
            playerId: colossus.me.id, unitId: "c1", toKey: far, tradeSpent: 0 } },
            { actorId: colossus.me.id, role: "player" });
          assert("and the caravan actually makes the journey", out.accepted, out.code);
          assert("arriving there", out.accepted &&
            out.state.players[0].caravans[0].position === far);
          proves("wonder.economy.colossus");
        }

        // ── Great Lighthouse ─────────────────────────────────────────────
        {
          // "When building cities, you can build in EMPTY SPACES ON THE EDGE
          // OF THE MAP as if they were within 2 spaces of a friendly space."
          const build = (withWonder) => wBoard((st, me) => {
            if (withWonder) attachWonder(st, me.id, "Great Lighthouse", "economy", "0,0");
          });
          const plain = build(false), lighthouse = build(true);
          const rim = Object.entries(plain.st.map.hexes)
            .filter(([k, h]) => h.active && h.terrain !== "water" && !h.city &&
              !h.control && !h.cityState && !h.barbarian &&
              Game.hexDist(plain.st.map.hexes["0,0"], h) > 3)
            .map(([k]) => k);
          const plainSpots = Game.validCityHexes(plain.st, plain.me.id, Infinity, 2);
          const lightSpots = Game.validCityHexes(lighthouse.st, lighthouse.me.id, Infinity, 2);
          assert("the fixture has spaces well beyond the ordinary build range",
            rim.length > 0, String(rim.length));
          assert("Great Lighthouse widens where a city may be built",
            lightSpots.size > plainSpots.size,
            `${plainSpots.size} -> ${lightSpots.size}`);
          const gained = [...lightSpots].filter((k) => !plainSpots.has(k));
          assert("it adds spaces the ordinary rule refused", gained.length > 0,
            JSON.stringify(gained.slice(0, 6)));
          // The discriminator is the rim, not the distance. 4,0 is four spaces
          // from home and surrounded on all six sides, so it is out of range
          // either way; the spaces the wonder adds are the ones on the border.
          const interiorFar = "4,0";
          assert("the fixture's interior space really is surrounded",
            Game.hexNeighborKeys(4, 0).every((nk) => {
              const h = lighthouse.st.map.hexes[nk];
              return h && h.active;
            }), Game.hexNeighborKeys(4, 0).join(" "));
          assert("a far space in the MIDDLE of the map stays out of reach",
            !plainSpots.has(interiorFar) && !lightSpots.has(interiorFar));
          assert("while a far space on the border becomes buildable",
            gained.some((k) => Game.hexNeighborKeys(Game.parseQ(k), Game.parseR(k))
              .some((nk) => !lighthouse.st.map.hexes[nk] || !lighthouse.st.map.hexes[nk].active)),
            JSON.stringify(gained.slice(0, 6)));
          proves("wonder.economy.great_lighthouse");
        }
      }

      {
        // The last of the wonders that act on a card, a caravan or a city.
        const wb = (setUp) => {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          st.players.forEach((p) => { p.diplomacy = []; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.control = null; h.city = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -2; q <= 6; q++) {
            for (let r = -2; r <= 2; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          st.map.hexes["0,0"].city = { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null };
          if (setUp) setUp(st, me, foe);
          return { st, me, foe };
        };
        const wonderIn = (st, playerId, key, name, type) => {
          const hex = st.map.hexes[key];
          hex.city = hex.city || { ownerId: playerId, isCapital: key === "0,0",
            developed: false, hasWonder: false, wonder: null };
          hex.city.hasWonder = true;
          hex.city.wonder = { name, type, era: "modern" };
        };
        const cityAt = (st, playerId, key, isCapital) => {
          st.map.hexes[key].city = { ownerId: playerId, isCapital: !!isCapital,
            developed: false, hasWonder: false, wonder: null };
        };
        const from = (s, source) => (s.pendingChoices || []).find((c) => c.source === source);

        // ── Venetian Arsenal ─────────────────────────────────────────────
        {
          // "ONCE PER TURN, after you resolve the card in the FIFTH SLOT of
          // your focus row, you MAY resolve it again, treating it as if it was
          // in the first slot."
          const build = (withWonder) => {
            const b = wb((st, me) => {
              if (withWonder) wonderIn(st, me.id, "0,0", "Venetian Arsenal", "military");
              // Science in the sixth place, which is printed slot 5.
              me.focusRow = ["culture", "growth", "economy", "military", "industry", "science"];
            });
            return b;
          };
          const b = build(true);
          assert("the card under test resolves from printed slot 5",
            Game.getSlotValue(b.me, "science", b.st) === 5,
            String(Game.getSlotValue(b.me, "science", b.st)));
          const out = Game.applyAction(b.st, { type: "PLAY_SCIENCE",
            payload: { playerId: b.me.id, tradeSpent: 0 } });
          const offer = from(out, "Venetian Arsenal");
          assert("Venetian Arsenal offers the card again", !!offer,
            JSON.stringify((out.pendingChoices || []).map((c) => c.source)));
          assert("which is optional", !!offer && offer.optional === true);
          const techAfterFirst = Game.getPlayer(out, b.me.id).tech;
          const again = Game.applyAction(out, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: offer.id, optionId: "yes" } });
          assert("accepting lets the card be resolved a second time",
            Game.getPlayer(again, b.me.id).arsenalReplay === "science",
            String(Game.getPlayer(again, b.me.id).arsenalReplay));
          const second = Game.applyAction(again, { type: "PLAY_SCIENCE",
            payload: { playerId: b.me.id, tradeSpent: 0 } });
          const techAfterSecond = Game.getPlayer(second, b.me.id).tech;
          assert("and the second resolution really happens",
            techAfterSecond > techAfterFirst, `${techAfterFirst} -> ${techAfterSecond}`);
          assert("once per turn: no third offer",
            !from(second, "Venetian Arsenal"),
            JSON.stringify((second.pendingChoices || []).map((c) => c.source)));

          const plain = build(false);
          const outPlain = Game.applyAction(plain.st, { type: "PLAY_SCIENCE",
            payload: { playerId: plain.me.id, tradeSpent: 0 } });
          assert("without the wonder there is no replay",
            !from(outPlain, "Venetian Arsenal"));

          const lowSlot = wb((st, me) => {
            wonderIn(st, me.id, "0,0", "Venetian Arsenal", "military");
            me.focusRow = ["science", "culture", "growth", "economy", "military", "industry"];
          });
          const outLow = Game.applyAction(lowSlot.st, { type: "PLAY_SCIENCE",
            payload: { playerId: lowSlot.me.id, tradeSpent: 0 } });
          assert("and a card resolved from any other slot is not offered again",
            !from(outLow, "Venetian Arsenal"));
          proves("wonder.military.venetian_arsenal");
        }

        // ── Statue of Liberty ────────────────────────────────────────────
        {
          // "BEFORE you replace a rival city with 1 of your cities, replace ALL
          // rival control tokens that are ADJACENT TO THAT RIVAL CITY with your
          // unused, UNREINFORCED control tokens."
          const build = (withWonder) => wb((st, me, foe) => {
            if (withWonder) wonderIn(st, me.id, "0,0", "Statue of Liberty", "military");
            cityAt(st, foe.id, "3,0");
            activate(st, "3,1", { control: { ownerId: foe.id, fortified: true, district: null } });
            activate(st, "4,0", { control: { ownerId: foe.id, fortified: false, district: "campus" } });
            activate(st, "6,0", { control: { ownerId: foe.id, fortified: false, district: null } });
          });
          const seize = (b) => {
            b.st.pendingChoices = [{ id: "sz", kind: "seize_city", playerId: b.me.id,
              title: "test", source: "test", hexKeys: ["3,0"] }];
            return Game.applyAction(b.st, { type: "RESOLVE_PENDING_CHOICE",
              payload: { playerId: b.me.id, choiceId: "sz", hexKey: "3,0" } });
          };
          const plain = seize(build(false));
          assert("without the wonder the city changes hands",
            plain.map.hexes["3,0"].city.ownerId === plain.players[0].id);
          assert("and the rival's neighbouring tokens are untouched",
            plain.map.hexes["3,1"].control.ownerId === plain.players[1].id &&
            plain.map.hexes["4,0"].control.ownerId === plain.players[1].id,
            JSON.stringify([plain.map.hexes["3,1"].control, plain.map.hexes["4,0"].control]));

          const liberty = seize(build(true));
          const me = liberty.players[0].id, foe = liberty.players[1].id;
          assert("with it the adjacent rival tokens are replaced",
            liberty.map.hexes["3,1"].control.ownerId === me &&
            liberty.map.hexes["4,0"].control.ownerId === me,
            JSON.stringify([liberty.map.hexes["3,1"].control, liberty.map.hexes["4,0"].control]));
          assert("they arrive UNREINFORCED, whatever they were before",
            liberty.map.hexes["3,1"].control.fortified === false,
            JSON.stringify(liberty.map.hexes["3,1"].control));
          assert("and as plain tokens, so a district is not copied",
            liberty.map.hexes["4,0"].control.district === null,
            JSON.stringify(liberty.map.hexes["4,0"].control));
          assert("a rival token NOT adjacent to that city is left alone",
            liberty.map.hexes["6,0"].control.ownerId === foe,
            JSON.stringify(liberty.map.hexes["6,0"].control));
          assert("and the city itself still changes hands",
            liberty.map.hexes["3,0"].city.ownerId === me);
          proves("wonder.military.statue_of_liberty");
        }

        // ── Cristo Redentor ──────────────────────────────────────────────
        {
          // "When you BUILD OR CAPTURE this wonder, choose a rival non-capital
          // city (WITHOUT AN ARMY IN ITS SPACE) WITHIN 3 SPACES OF THIS WONDER.
          // Replace that city with 1 of your unused cities."
          const build = (opts) => {
            const o = opts || {};
            const b = wb((st, me, foe) => {
              Game.RESOURCES.forEach((r) => { me.resources[r] = 9; });
              cityAt(st, foe.id, o.far ? "6,0" : "3,0");
              if (o.capital) st.map.hexes[o.far ? "6,0" : "3,0"].city.isCapital = true;
              if (o.guard) foe.armies = [{ id: "g1", position: o.far ? "6,0" : "3,0" }];
              const deck = st.wonderDecks.culture;
              deck.deck = ["Cristo Redentor"].concat(
                deck.deck.filter((n) => n !== "Cristo Redentor"));
              deck.revealed = "Cristo Redentor";
            });
            return Game.tryApplyAction(b.st, { type: "PLAY_INDUSTRY_WONDER", payload: {
              hexKey: "0,0", wonderName: "Cristo Redentor", tradeSpent: 0,
              resources: { mercury: 6, marble: 5 }, naturalWonders: [] } },
              { actorId: b.me.id, role: "player" });
          };
          const out = build({});
          assert("Cristo Redentor can be built", out.accepted, out.code);
          const offer = (out.state.pendingChoices || []).find((c) => c.kind === "seize_city");
          assert("building it offers a rival city to replace", !!offer,
            JSON.stringify((out.state.pendingChoices || []).map((c) => c.kind)));
          assert("the nearby rival city is the offer",
            !!offer && offer.hexKeys.includes("3,0"), offer && offer.hexKeys.join(" "));
          const taken = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: out.state.players[0].id, choiceId: offer.id, hexKey: "3,0" } });
          assert("taking it replaces the city",
            taken.map.hexes["3,0"].city.ownerId === taken.players[0].id,
            JSON.stringify(taken.map.hexes["3,0"].city));

          const far = build({ far: true });
          assert("a rival city more than 3 spaces from the wonder is not offered",
            far.accepted && !(far.state.pendingChoices || [])
              .some((c) => c.kind === "seize_city"),
            JSON.stringify((far.state.pendingChoices || []).map((c) => c.kind)));
          const capital = build({ capital: true });
          assert("a rival CAPITAL is not offered",
            capital.accepted && !(capital.state.pendingChoices || [])
              .some((c) => c.kind === "seize_city"));
          const guarded = build({ guard: true });
          assert("and a city with an army in its space is not offered",
            guarded.accepted && !(guarded.state.pendingChoices || [])
              .some((c) => c.kind === "seize_city"));
          proves("wonder.culture.cristo_redentor");
        }

        // ── Kilwa Kisiwani and Orszaghaz ─────────────────────────────────
        {
          // Kilwa: "When you move a caravan to a city-state, place 1 ADDITIONAL
          // trade token from the supply on ANY 1 of your focus cards."
          // Orszaghaz: "AFTER you move a caravan to a city-state, you MAY
          // conquer it."
          const build = (wonders) => wb((st, me) => {
            (wonders || []).forEach((w, i) =>
              wonderIn(st, me.id, i === 0 ? "0,0" : "5,0", w, "economy"));
            activate(st, "1,0", { terrain: "grass",
              cityState: { name: "Test State", type: "science", diplomacyCards: 2 } });
            me.caravans = [{ id: "c1", position: "0,0" }];
            me.focusRow = ["economy", "science", "growth", "culture", "military", "industry"];
          });
          const trade = (b) => Game.tryApplyAction(b.st, { type: "PLAY_ECONOMY", payload: {
            playerId: b.me.id, unitId: "c1", toKey: "1,0", tradeSpent: 0 } },
            { actorId: b.me.id, role: "player" });

          const plain = trade(build([]));
          assert("an ordinary caravan trades with the city-state", plain.accepted, plain.code);
          const plainExtra = (plain.state.pendingChoices || [])
            .filter((c) => c.kind === "trade_any" && /Kilwa/.test(c.title || ""));
          assert("and gets no extra token", plainExtra.length === 0);

          const kilwa = trade(build(["Kilwa Kisiwani"]));
          assert("with Kilwa Kisiwani the same run adds one more token", kilwa.accepted, kilwa.code);
          const extra = (kilwa.state.pendingChoices || [])
            .find((c) => c.kind === "trade_any" && /Kilwa/.test(c.title || ""));
          assert("offered on ANY of your focus cards", !!extra &&
            (extra.options || []).length >= 6,
            extra && JSON.stringify((extra.options || []).map((o) => o.id)));
          const before = Game.getPlayer(kilwa.state, kilwa.state.players[0].id).trade.military;
          const paid = Game.applyAction(kilwa.state, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: kilwa.state.players[0].id, choiceId: extra.id, optionId: "military" } });
          assert("and it lands where the player says",
            Game.getPlayer(paid, paid.players[0].id).trade.military === before + 1,
            String(Game.getPlayer(paid, paid.players[0].id).trade.military));
          proves("wonder.economy.kilwa_kisiwani");

          const orsz = trade(build(["Orszaghaz"]));
          assert("with Orszaghaz the trade run offers a conquest", orsz.accepted, orsz.code);
          const conquer = (orsz.state.pendingChoices || [])
            .find((c) => c.kind === "conquer_city_state");
          assert("which is offered after the trade", !!conquer,
            JSON.stringify((orsz.state.pendingChoices || []).map((c) => c.kind)));
          assert("and is optional, because the card says you may",
            !!conquer && conquer.optional === true);
          // applyAction mutates in place, so the two answers each need their
          // own copy of the state the offer was made in.
          const orszSnapshot = JSON.parse(JSON.stringify(orsz.state));
          const took = Game.applyAction(JSON.parse(JSON.stringify(orszSnapshot)),
            { type: "RESOLVE_PENDING_CHOICE", payload: {
              playerId: orsz.state.players[0].id, choiceId: conquer.id, optionId: "yes" } });
          assert("taking it turns the city-state into one of your cities",
            !!took.map.hexes["1,0"].city &&
            took.map.hexes["1,0"].city.ownerId === took.players[0].id &&
            !took.map.hexes["1,0"].cityState,
            JSON.stringify({ city: took.map.hexes["1,0"].city,
              cityState: took.map.hexes["1,0"].cityState }));
          const declined = Game.applyAction(JSON.parse(JSON.stringify(orszSnapshot)),
            { type: "RESOLVE_PENDING_CHOICE", payload: {
              playerId: orszSnapshot.players[0].id, choiceId: conquer.id, dismiss: true } });
          assert("and declining leaves the city-state standing",
            !!declined.map.hexes["1,0"].cityState && !declined.map.hexes["1,0"].city,
            JSON.stringify(declined.map.hexes["1,0"]));
          const plainRun = trade(build([]));
          assert("without the wonder no conquest is offered",
            !(plainRun.state.pendingChoices || [])
              .some((c) => c.kind === "conquer_city_state"));
          proves("wonder.economy.orszaghaz");
        }

        // ── Great Library ────────────────────────────────────────────────
        {
          // "When your caravan moves to ANOTHER PLAYER'S CITY, you MAY gain a
          // focus card of the same type and tech level as a card in THAT
          // PLAYER'S focus row, replacing your card of the same type."
          const build = (withWonder) => wb((st, me, foe) => {
            if (withWonder) wonderIn(st, me.id, "0,0", "Great Library", "science");
            cityAt(st, foe.id, "1,0");
            me.caravans = [{ id: "c1", position: "0,0" }];
            me.focusRow = ["economy", "science", "growth", "culture", "military", "industry"];

            foe.cardLevels.military = 3;
          });
          const run = (b) => Game.tryApplyAction(b.st, { type: "PLAY_ECONOMY", payload: {
            playerId: b.me.id, unitId: "c1", toKey: "1,0", tradeSpent: 0 } },
            { actorId: b.me.id, role: "player" });
          const plain = run(build(false));
          assert("a caravan can reach a rival city", plain.accepted, plain.code);
          assert("and without the wonder no card is offered",
            !(plain.state.pendingChoices || []).some((c) => /Library/.test(c.title || "")),
            JSON.stringify((plain.state.pendingChoices || []).map((c) => c.title)));

          const lib = run(build(true));
          assert("with the Great Library the run offers a card", lib.accepted, lib.code);
          const offer = (lib.state.pendingChoices || [])
            .find((c) => /Library/.test(c.title || "") || c.source === "Great Library");
          assert("the offer is made", !!offer,
            JSON.stringify((lib.state.pendingChoices || []).map((c) => c.title)));
          assert("and it is optional, because the card says you may",
            !!offer && offer.optional === true);
          const beforeTier = Game.getPlayer(lib.state, lib.state.players[0].id).cardTiers.military;
          const taken = Game.applyAction(lib.state, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: lib.state.players[0].id, choiceId: offer.id,
            optionId: (offer.options || [{}])[0].id } });
          const afterTier = Game.getPlayer(taken, taken.players[0].id).cardTiers.military;
          assert("taking it raises your card to the rival's level",
            afterTier === 3 && afterTier > beforeTier, `${beforeTier} -> ${afterTier}`);
          proves("wonder.science.great_library");
        }

        // ── University of Sankore ────────────────────────────────────────
        {
          // "At the END of your turn, IF YOU REPLACED (tech upgrade) 1 OR MORE
          // of your focus cards THIS TURN, you may swap any 2 NON-SCIENCE cards
          // in your focus row."
          const build = (withWonder, upgraded) => {
            const b = wb((st, me) => {
              if (withWonder) wonderIn(st, me.id, "0,0", "University of Sankore", "science");
              me.focusRow = ["culture", "growth", "economy", "military", "industry", "science"];
            });
            let s = Game.applyAction(b.st, { type: "PLAY_SCIENCE",
              payload: { playerId: b.me.id, tradeSpent: 0 } });
            for (let i = 0; i < 12; i++) {
              const open = (s.pendingChoices || []).find((c) => c.playerId === b.me.id);
              if (!open) break;
              const payload = { playerId: b.me.id, choiceId: open.id };
              if (open.options && open.options.length) payload.optionId = open.options[0].id;
              else if (open.hexKeys && open.hexKeys.length) payload.hexKey = open.hexKeys[0];
              else if (open.optional) payload.dismiss = true;
              else break;
              const next = Game.applyAction(s, { type: "RESOLVE_PENDING_CHOICE", payload });
              if (next === s) break;
              s = next;
            }
            Game.getPlayer(s, b.me.id).upgradedThisTurn = !!upgraded;
            return { b, end: Game.applyAction(s, { type: "END_TURN",
              payload: { playerId: b.me.id } }) };
          };
          const yes = build(true, true);
          const offer = (yes.end.pendingChoices || [])
            .find((c) => c.source === "University of Sankore");
          assert("having upgraded a card, Sankore offers a swap at the end of the turn",
            !!offer, JSON.stringify((yes.end.pendingChoices || []).map((c) => c.source)));
          assert("which is optional", !!offer && offer.optional === true);
          assert("and no pairing involves the science card",
            !!offer && (offer.options || []).every((o) => !/science/.test(o.id)),
            offer && JSON.stringify((offer.options || []).map((o) => o.id)));
          const rowBefore = Game.getPlayer(yes.end, yes.b.me.id).focusRow.slice();
          const swapped = Game.applyAction(yes.end, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: yes.b.me.id, choiceId: offer.id, optionId: offer.options[0].id } });
          const rowAfter = Game.getPlayer(swapped, yes.b.me.id).focusRow;
          assert("taking it really moves two cards",
            rowAfter.join(",") !== rowBefore.join(","),
            JSON.stringify({ rowBefore, rowAfter }));
          assert("and leaves science where it was",
            rowAfter.indexOf("science") === rowBefore.indexOf("science"),
            JSON.stringify({ rowBefore, rowAfter }));

          const noUpgrade = build(true, false);
          assert("with no upgrade this turn there is no offer",
            !(noUpgrade.end.pendingChoices || [])
              .some((c) => c.source === "University of Sankore"));
          const noWonder = build(false, true);
          assert("and without the wonder there is none either",
            !(noWonder.end.pendingChoices || [])
              .some((c) => c.source === "University of Sankore"));
          proves("wonder.science.university_of_sankore");
        }

        // ── Potala Palace ────────────────────────────────────────────────
        {
          // "You can have 4 diplomacy cards FROM EACH OTHER PLAYER. When you
          // BUILD this wonder, you may take A TOTAL OF 3 diplomacy cards of
          // your choice from other players."
          const b = wb((st, me, foe) => {
            Game.RESOURCES.forEach((r) => { me.resources[r] = 9; });
            foe.diplomacy = [];
            const deck = st.wonderDecks.science;
            deck.deck = ["Potala Palace"].concat(
              deck.deck.filter((n) => n !== "Potala Palace"));
            deck.revealed = "Potala Palace";
          });
          const out = Game.tryApplyAction(b.st, { type: "PLAY_INDUSTRY_WONDER", payload: {
            hexKey: "0,0", wonderName: "Potala Palace", tradeSpent: 0,
            resources: { mercury: 6, marble: 4 }, naturalWonders: [] } },
            { actorId: b.me.id, role: "player" });
          assert("Potala Palace can be built", out.accepted, out.code);
          const pick = (out.state.pendingChoices || []).find((c) => c.kind === "potala_pick");
          assert("building it offers diplomacy cards to take", !!pick,
            JSON.stringify((out.state.pendingChoices || []).map((c) => c.kind)));
          assert("three of them", !!pick && pick.remaining === 3, pick && String(pick.remaining));
          assert("and it is optional", !!pick && pick.optional === true);
          const declined = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE",
