          reduced.modifiers.some((m) => m.source === "Brussels") &&
          reduced.modifiers.some((m) => m.source === "Buenos Aires"),
          JSON.stringify(reduced));
        me.diplomacy = me.diplomacy.filter((card) => card.fromCityState !== "Buenos Aires");
        assert("losing Buenos Aires removes its reduction",
          Game.getWonderCost("Jebel Barkal", me, st) === 5);
        me.diplomacy = [];
        assert("losing all reducer cards restores printed cost",
          Game.getWonderCost("Jebel Barkal", me, st) === 7);
      }

      {
        // Palenque substitutes an ordinary resource for selected focus-card
        // trade. It consumes the token; Natural Wonders are explicitly excluded.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["science", "growth", "culture", "economy", "military", "industry"];
        me.trade.science = 0;
        me.resources.marble = 1;
        me.diplomacy.push({ fromCityState: "Palenque", cardId: "palenque" });
        const paid = Game.tryApplyAction(st, { type: "PLAY_SCIENCE", payload: {
          tradeSpent: 1, tradeResources: { marble: 1 }
        }}, { actorId: me.id, role: "player" });
        assert("Palenque lets an ordinary resource replace focus trade",
          paid.accepted && paid.state.players[0].tech === 2 &&
          paid.state.players[0].resources.marble === 0,
          paid.code);

        const without = rulesState();
        without.players[0].focusRow = ["science", "growth", "culture", "economy", "military", "industry"];
        without.players[0].resources.marble = 1;
        const refused = Game.tryApplyAction(without, { type: "PLAY_SCIENCE", payload: {
          tradeSpent: 1, tradeResources: { marble: 1 }
        }}, { actorId: without.players[0].id, role: "player" });
        assert("resource-as-trade is rejected without Palenque",
          !refused.accepted && refused.code === "palenque_required" &&
          without.players[0].resources.marble === 1,
          refused.code);
      }

      {
        // Drama and Poetry's lower paragraph is part of the same card
        // resolution and remains optional.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        me.cardTiers.culture = 2;
        activate(st, "0,0", { city: {
          ownerId: me.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        activate(st, "1,0");
        activate(st, "2,0");
        const main = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
          hexKeys: ["1,0"], tradeSpent: 0
        }}, { actorId: me.id, role: "player" });
        const sourceChoice = main.accepted && main.state.pendingChoices.find(
          (choice) => choice.kind === "move_control_source");
        assert("Drama and Poetry continues after its normal Culture placement",
          main.accepted && !!main.state.cardResolution && !!sourceChoice &&
          sourceChoice.optional && sourceChoice.hexKeys.includes("1,0"),
          JSON.stringify(main.state && main.state.pendingChoices));
        const pickedSource = sourceChoice ? Game.tryApplyAction(main.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: sourceChoice.id, hexKey: "1,0" }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const destinationChoice = pickedSource.accepted && pickedSource.state.pendingChoices.find(
          (choice) => choice.kind === "move_control_destination");
        assert("Drama and Poetry offers only an adjacent empty non-water destination",
          pickedSource.accepted && destinationChoice &&
          destinationChoice.hexKeys.includes("2,0") &&
          destinationChoice.hexKeys.every((key) => {
            const hex = pickedSource.state.map.hexes[key];
            return hex && hex.terrain !== "water" && !hex.city && !hex.control &&
              !hex.barbarian && !hex.cityState && !hex.resource && !hex.naturalWonder &&
              Game.getUnitsAt(pickedSource.state, key).length === 0;
          }), JSON.stringify(destinationChoice));
        const moved = destinationChoice ? Game.tryApplyAction(pickedSource.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: destinationChoice.id, hexKey: "2,0" }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        assert("Drama and Poetry moves the token and then finishes the card",
          moved.accepted && !moved.state.map.hexes["1,0"].control &&
          moved.state.map.hexes["2,0"].control.ownerId === me.id &&
          !moved.state.cardResolution && moved.state.players[0].cardPlayed,
          moved.code);

        const skipState = rulesState();
        const skipper = skipState.players[0];
        skipper.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        skipper.cardTiers.culture = 2;
        activate(skipState, "0,0", { city: {
          ownerId: skipper.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        activate(skipState, "1,0");
        activate(skipState, "2,0");
        const skipMain = Game.tryApplyAction(skipState, { type: "PLAY_CULTURE", payload: {
          hexKeys: ["1,0"], tradeSpent: 0
        }}, { actorId: skipper.id, role: "player" });
        const skipChoice = skipMain.accepted && skipMain.state.pendingChoices.find(
          (choice) => choice.kind === "move_control_source");
        const skipped = skipChoice ? Game.tryApplyAction(skipMain.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: skipChoice.id, dismiss: true }
        }, { actorId: skipper.id, role: "player" }) : { accepted: false };
        assert("the optional Drama and Poetry movement can be declined cleanly",
          skipped.accepted && !skipped.state.cardResolution && skipped.state.players[0].cardPlayed,
          skipped.code);
      }

      {
        // Apadana must retain the identity of the newly explored tile until its
        // mandatory control-token follow-up has been resolved.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["growth", "culture", "science", "economy", "military", "industry"];
        me.resources.diamonds = 2;
        activate(st, "0,0", { city: {
          ownerId: me.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        const deck = st.wonderDecks.economy;
        deck.deck = ["Apadana"].concat(deck.deck.filter((name) => name !== "Apadana"));
        deck.revealed = "Apadana";
        const built = Game.tryApplyAction(st, { type: "PLAY_INDUSTRY_WONDER", payload: {
          hexKey: "0,0", wonderName: "Apadana", tradeSpent: 0,
          resources: { diamonds: 2 }, naturalWonders: []
        }}, { actorId: me.id, role: "player" });
        const chooseOrigin = built.accepted && built.state.pendingChoices.find(
          (choice) => choice.kind === "apadana_explore");
        assert("building Apadana queues exploration from any tile edge",
          built.accepted && chooseOrigin && chooseOrigin.hexKeys.length > 0,
          JSON.stringify(built.state && built.state.pendingChoices));
        const originKey = chooseOrigin && chooseOrigin.hexKeys[0];
        const selected = chooseOrigin ? Game.tryApplyAction(built.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: chooseOrigin.id, hexKey: originKey }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const begun = selected.accepted ? Game.tryApplyAction(selected.state, {
          type: "BEGIN_EXPLORATION", payload: { fromKey: originKey }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const pending = begun.accepted && begun.state.pendingExploration;
        assert("Apadana reveals one retained tile without requiring a figure",
          begun.accepted && pending && pending.freeRun &&
          pending.followUp === "apadana_control", JSON.stringify(pending));
        const placement = pending && Game.getLegalExplorationPlacements(begun.state, pending)[0];
        const placed = placement ? Game.tryApplyAction(begun.state, {
          type: "PLACE_EXPLORED_TILE", payload: {
            anchorKey: placement.anchorKey,
            rotation: placement.rotation,
            side: placement.side
          }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const follow = placed.accepted && placed.state.pendingChoices.find(
          (choice) => choice.kind === "place_control" && choice.source === "Apadana");
        assert("Apadana preserves the newly placed tile for its second effect",
          placed.accepted && follow && follow.tileId === pending.tileId &&
          follow.hexKeys.length > 0 && follow.hexKeys.every(
            (key) => placed.state.map.hexes[key].tileId === pending.tileId),
          JSON.stringify(follow));
        const controlKey = follow && follow.hexKeys[0];
        const controlled = follow ? Game.tryApplyAction(placed.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: follow.id, hexKey: controlKey }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        assert("Apadana places the control token on that new tile",
          controlled.accepted &&
          controlled.state.map.hexes[controlKey].tileId === pending.tileId &&
          controlled.state.map.hexes[controlKey].control.ownerId === me.id,
          controlled.code);
        // Both paragraphs: the expedition runs from an edge space on ANY tile,
        // and the control token lands on the tile that was just placed. The
        // final assertion is board state, not a queued prompt.
        proves("wonder.economy.apadana");
      }

      {
        // Reinforcement is another multi-key focus action and must have the
        // same no-partial-success guarantee.
        const st = rulesState();
        const me = st.players[0];
        // Growth on slot 2, so the card allows two reinforcements and it is the
        // SPACE that is illegal. On slot 1 the limit is 1, and the length check
        // fires first with too_many_reinforcements - which passes for the wrong
        // reason and proves nothing about partial application.
        // Terra p8's extended row has TWO slots numbered "1" (FOCUS_SLOTS is
        // [1,1,2,3,4,5]), so index 1 is still slot 1 - growth has to sit at
        // index 2 to be worth two reinforcements.
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        assert("the fixture allows two reinforcements",
          Game.getSlotValue(me, "growth", st) >= 2, "slot " + Game.getSlotValue(me, "growth", st));
        activate(st, "1,0", { control: { ownerId: me.id, fortified: false, district: null } });
        activate(st, "0,1");                       // no control token: illegal
        const rejected = Game.tryApplyAction(st, { type: "PLAY_GROWTH_REINFORCE", payload: {
          hexKeys: ["1,0", "0,1"], tradeSpent: 0
        }}, { actorId: me.id, role: "player" });
        assert("a partially illegal reinforcement batch changes nothing",
          !rejected.accepted && rejected.code === "reinforce_space_invalid" &&
          !st.map.hexes["1,0"].control.fortified && !me.cardPlayed,
          rejected.code);
        // And an all-legal batch of the same size still goes through, so the
        // guard cannot pass by refusing everything.
        activate(st, "0,1", { control: { ownerId: me.id, fortified: false, district: null } });
        const ok = Game.tryApplyAction(st, { type: "PLAY_GROWTH_REINFORCE", payload: {
          hexKeys: ["1,0", "0,1"], tradeSpent: 0
        }}, { actorId: me.id, role: "player" });
        assert("two legal reinforcements are both applied",
          ok.accepted && ok.state.map.hexes["1,0"].control.fortified &&
          ok.state.map.hexes["0,1"].control.fortified, ok.code);
      }

      {
        // The printed bust is Marble; the three silver drops are Mercury.
        const tile = (id) => CivRulesData.TILES.find((entry) => entry.id === id);
        assert("tile resources keep Marble and Mercury identities",
          tile("01").sides.A.cells[0].resource === "mercury" &&
          tile("03").sides.B.cells[4].resource === "marble");
      }

      {
        // Military tokens buy combat value only — never movement.
        const st = rulesState();
        const me = st.players[0];
        const move = Game.getMilitaryMove(me);
        me.trade.military = Game.CFG.maxTrade;
        assert("military move is independent of trade held", Game.getMilitaryMove(me) === move);
      }

      {
        // Defense bonuses, rulebook p11: terrain, +1 per adjacent friendly
        // reinforced token, +1 if the defender is itself reinforced, city
        // terrain doubled, city-state flat 8.
        const defenseOf = (props) => {
          const st = rulesState();
          const atk = st.players[0].id, def = st.players[1].id;
          activate(st, "0,0", typeof props === "function" ? props(def) : props);
          return Game.findDefender(st, "0,0", atk);
        };
        const plain = defenseOf((d) => ({ terrain: "forest", control: { ownerId: d, fortified: false, district: null } }));
        const reinforced = defenseOf((d) => ({ terrain: "forest", control: { ownerId: d, fortified: true, district: null } }));
        assert("plain control marker defends at terrain difficulty", plain.power === 3);
        assert("reinforced control marker adds exactly 1", reinforced.power === plain.power + 1);
        assert("defender reports its owner", !!reinforced.ownerId);
        const city = defenseOf((d) => ({ terrain: "forest", city: { ownerId: d, isCapital: false, developed: false, hasWonder: false, wonder: null } }));
        assert("city doubles terrain difficulty", city.power === 6);
        assert("city-state defends at 8", defenseOf({ terrain: "grass", cityState: { name: "Test", type: "culture" } }).power === 8);
      }

      {
        // Terra p11's worked example has a player attack a rival army, and p16
        // lists "Army or Caravan: defending space's terrain difficulty". The
        // base game's list (p11) stops at cities and control tokens; Terra adds
        // figures to it.
        const st = rulesState();
        const atk = st.players[0].id;
        const other = st.players[1];
        activate(st, "3,0", { terrain: "grass" });
        other.armies = [{ id: "a1", position: "3,0" }];
        const lone = Game.findDefender(st, "3,0", atk);
        assert("a lone army is an attack target", !!lone && lone.type === "army");
        assert("and it defends at the space's terrain difficulty", lone.power === 1);
      }

      {
        // Army and caravan counts come off the military and economy cards.
        const st = rulesState();
        const me = st.players[0];
        // A figure you have not deployed stands on its card, not on the board.
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        Game.syncUnitCounts(st, me);
        const wantArmies = Game.CARD_TIERS.military.armies[Game.getCardTier(me, "military") - 1];
        assert("armies match the military card tier", me.armies.length === wantArmies);
        assert("caravans match the economy card tier",
          me.caravans.length === Game.CARD_TIERS.economy.wagons[Game.getCardTier(me, "economy") - 1]);
        // Base p4 starts each player with a caravan on the Foreign Trade card
        // and puts no army on the map at all. It is not just bookkeeping: a
        // figure standing in a space adds 2 to its defence (Terra p16), so
        // parking new figures on the capital quietly fortified it.
        assert("new figures start on their cards", me.armies.every((u) => u.position === null));
        assert("and so do the caravans", me.caravans.every((u) => u.position === null));
        me.cardTiers.military = 2;
        Game.syncUnitCounts(st, me);
        assert("upgrading the military card adds its army",
          me.armies.length === Game.CARD_TIERS.military.armies[1]);
        me.cardTiers.military = 1;
        Game.syncUnitCounts(st, me);
        assert("dropping back to tier I removes it again", me.armies.length === wantArmies);
        const after = Game.applyAction(st, { type: "RECRUIT_ARMY", payload: { playerId: me.id } });
        assert("there is no recruit action", after.players[0].armies.length === me.armies.length);
      }

      {
        // "combat dice results don't show all the contributing numbers." Every
        // number staked on a fight has to be readable by both players, so the
        // attack total arrives itemised rather than as a bare sum - and the
        // three reasons getLeaderAttackBonus used to add together (the civ
        // ability, the wonders, the pacts) appear as separate lines, because
        // they come and go independently.
        const st = rulesState();
        const me = st.players[0], foe = st.players[1];
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.leaderId = "scythia";                       // +3 on grass or hills
        me.cardTiers.military = 2;                     // Iron Working: +2 vs barbarians
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass", barbarian: { letter: "A" } });
        me.armies = [{ id: "a1", position: "0,0" }];
        const out = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
          playerId: me.id, unitId: "a1", fromKey: "0,0", toKey: "1,0", targetType: "barbarian"
        } });
        const parts = (out.combat && out.combat.atkParts) || [];
        const labels = parts.map((p) => p.label).join(" | ");
        assert("the attack arrives itemised, not as one number", parts.length >= 3);
        assert("the parts add up to the attack total",
          parts.reduce((n, p) => n + p.value, 0) === out.combat.atkBase);
        assert("the military card is one of the numbers",
          parts.some((p) => p.label === "military card" && p.value === Game.getSlotValue(me, "military", out)));
        assert("Iron Working's +2 says what earned it",
          parts.some((p) => /vs barbarian/.test(p.label) && p.value === 2), labels);
        assert("the civ ability is its own line",
          parts.some((p) => /Scythia/.test(p.label) && p.value === 3), labels);
        // leaderBonus must still be exactly what getLeaderAttackBonus gave, or
        // every existing reader of it silently changes meaning.
        assert("leaderBonus still totals the leader-category parts",
          out.combat.leaderBonus === parts.filter((p) => p.category === "leader")
            .reduce((n, p) => n + p.value, 0) &&
          out.combat.leaderBonus === Game.getLeaderAttackBonus(out, me.id, "1,0"));
        // And the breakdown has to reach the other seat, or only one player can
        // check the sum.
        const seen = Game.projectState(out, foe.id);
        assert("the breakdown reaches the other player",
          !!seen.combat && (seen.combat.atkParts || []).length === parts.length);

        // The numbers must outlive the fight. lastCombat is what the result
        // panel reads once combat is cleared, and it used to drop the parts -
        // so the breakdown was visible right up until you wanted to check it.
        let fin = Game.applyAction(out, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "attacker" } });
        fin = Game.applyAction(fin, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "defender", hostOverride: true } });
        fin = Game.applyAction(fin, { type: "COMBAT_PASS", payload: { playerId: me.id, side: "attacker" } });
        fin = Game.applyAction(fin, { type: "COMBAT_PASS", payload: { playerId: foe.id, side: "defender", hostOverride: true } });
        assert("the fight finished", !fin.combat && !!fin.lastCombat);
        assert("and the breakdown survived it",
          (fin.lastCombat.atkParts || []).length === parts.length &&
          fin.lastCombat.atkParts.some((p) => p.label === "military card"));
      }

      {
        // Jebel Barkal burns a resource for +2. That was added straight onto
        // atkTrade, so the breakdown reported trade tokens the player had never
        // spent and no sign of the resource they had. It is counted separately
        // now - and the total has to come out exactly the same as before.
        const st = rulesState();
        const me = st.players[0], foe = st.players[1];
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false,
          hasWonder: true, wonder: { name: "Jebel Barkal" } } });
        activate(st, "1,0", { terrain: "grass", control: { ownerId: foe.id, fortified: false, district: null } });
        me.armies = [{ id: "a1", position: "0,0" }, { id: "a2", position: null }];
        Game.RESOURCES.forEach((r) => { me.resources[r] = 2; });
        let st2 = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
          playerId: me.id, unitId: "a1", fromKey: "0,0", toKey: "1,0", targetType: "control"
        } });
        if (st2.combat) {
          st2 = Game.applyAction(st2, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "attacker" } });
          st2 = Game.applyAction(st2, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "defender", hostOverride: true } });
          const burnable = Game.combatResources(st2, st2.combat, "attacker");
          if (burnable.length) {
            // applyAction mutates in place, so every "before" reading has to be
            // taken now - reading st2 back afterwards reads the new value.
            const tradeBefore = st2.combat.atkTrade;
            const resBefore = st2.combat.atkResource || 0;
            const totalBefore = st2.combat.atkRoll + st2.combat.atkBase + tradeBefore + resBefore;
            const burned = Game.applyAction(st2, { type: "COMBAT_SPEND", payload: {
              playerId: me.id, side: "attacker", mode: "resource", resource: burnable[0] } });
            assert("burning a resource does not touch the trade line",
              burned.combat.atkTrade === tradeBefore);
            assert("it is counted as a resource instead",
              burned.combat.atkResource === resBefore + 2);
            assert("and the attack is worth exactly 2 more than before",
              burned.combat.atkRoll + burned.combat.atkBase + burned.combat.atkTrade +
              burned.combat.atkResource === totalBefore + 2);
          }
        }
      }

      {
        // Terra p9: "Each player resolves the abilities on their districts in
        // the order of their choice." The five effects used to run in a fixed
        // array order, so an encampment could never clear a barbarian off a
        // space a theater square was about to want.
        let st = rulesState();
        const me = st.players[0];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "forest", control: { ownerId: me.id, fortified: false, district: "industrial" } });
        activate(st, "2,0", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: "theater" } });
        activate(st, "3,0", { terrain: "grass" });

        Game.resolveEvent(st, "district_event");
        const order = (st.pendingChoices || []).find((c) => c.kind === "district_order");
        assert("more than one kind of district is a choice of order", !!order);
        if (order) {
          assert("and it offers exactly the kinds you hold",
            order.options.map((o) => o.id).sort().join(",") === "industrial,theater",
            order.options.map((o) => o.id).join(","));
          assert("with both still to resolve", order.remaining === 2);

          // Take the theater square first - the opposite of the old fixed order.
          const after = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: order.id, optionId: "theater" } });
          // Terra p9: a theater square is itself a choice of one of two
          // options, so resolving it in the order asks the next question.
          assert("choosing one resolves it",
            (after.pendingChoices || []).some((c) => c.kind === "district_mode" && c.districtKind === "theater"),
            JSON.stringify((after.pendingChoices || []).map((c) => c.kind)));
          const next = (after.pendingChoices || []).find((c) => c.kind === "district_order");
          assert("and the rest are asked again", !!next);
          if (next) {
            assert("without offering the one already done",
              next.options.map((o) => o.id).join(",") === "industrial", next.options.map((o) => o.id).join(","));
            const done = Game.applyAction(after, { type: "RESOLVE_PENDING_CHOICE", payload: {
              playerId: me.id, choiceId: next.id, optionId: "industrial" } });
            assert("and the last one ends the run",
              !(done.pendingChoices || []).some((c) => c.kind === "district_order"));
          }
        }
      }

      {
        // A district can be destroyed between the question and the answer - an
        // encampment strike earlier in the same run can take the space.
        // Answering must still spend the prompt, or the turn strands behind a
        // question with no answer left. applyAction mutates in place, so this
        // builds its own state rather than reusing one already driven above.
        const st = rulesState();
        const me = st.players[0];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "forest", control: { ownerId: me.id, fortified: false, district: "industrial" } });
        activate(st, "2,0", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: "theater" } });
        Game.resolveEvent(st, "district_event");
        const first = (st.pendingChoices || []).find((c) => c.kind === "district_order");
        assert("the run started", !!first);
        if (first) {
          const mid = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: first.id, optionId: "theater" } });
          const stale = (mid.pendingChoices || []).find((c) => c.kind === "district_order");
          assert("a second district is still queued", !!stale);
          if (stale) {
            mid.map.hexes["1,0"].control = null;      // the industrial zone goes
            const out = Game.applyAction(mid, { type: "RESOLVE_PENDING_CHOICE", payload: {
              playerId: me.id, choiceId: stale.id, optionId: "industrial" } });
            assert("answering for a district that has gone still clears the prompt",
              !(out.pendingChoices || []).some((c) => c.id === stale.id));
          }
        }
      }

      {
        // A single kind needs no decision - asking would be a prompt with one
        // button on it.
        const st = rulesState();
        const me = st.players[0];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "forest", control: { ownerId: me.id, fortified: false, district: "industrial" } });
        activate(st, "1,-1", { terrain: "forest" });
        activate(st, "2,-1", { terrain: "forest" });
        const before = st.players[0].trade.industry;
        Game.resolveEvent(st, "district_event");
        assert("one kind of district needs no ORDER prompt",
          !(st.pendingChoices || []).some((c) => c.kind === "district_order"));
        // It still asks which of its own two printed effects to use, and the
        // forest count only pays for FRIENDLY forest spaces (Terra p9).
        const mode = (st.pendingChoices || []).find((c) => c.kind === "district_mode");
        assert("but it does ask which effect", !!mode && mode.districtKind === "industrial",
          JSON.stringify((st.pendingChoices || []).map((c) => c.kind)));
        const paid = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
          playerId: me.id, choiceId: mode.id, optionId: "forest" } });
        assert("and taking the forest option pays out",
          paid.players[0].trade.industry > before,
          "before " + before + " after " + paid.players[0].trade.industry);
      }

      {
        // Nubia: "After you reset your growth focus card, resolve the effect of
        // any 1 of your districts." It used to hand over +1 trade of your
        // choice, which is a different and usually much weaker thing.
        let st = rulesState();
        const me = st.players[0], foe = st.players[1];
        me.leaderId = "nubia";
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        // One of hers, and one of the rival's, to check she cannot reach theirs.
        activate(st, "1,0", { terrain: "forest", control: { ownerId: me.id, fortified: false, district: "industrial" } });
        activate(st, "2,0", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: "theater" } });
        activate(st, "3,0", { terrain: "grass", control: { ownerId: foe.id, fortified: false, district: "campus" } });
        activate(st, "4,0", { terrain: "mountain", control: { ownerId: foe.id, fortified: false, district: null } });

        // Growth resolves through reinforce or district placement; either one
        // ends with the card reset, which is what Nubia's ability waits for.
        st = Game.applyAction(st, { type: "PLAY_GROWTH_REINFORCE", payload: {
          playerId: me.id, hexKeys: ["1,0"], tradeSpent: 0 } });
        const pick = (st.pendingChoices || []).find((c) => c.kind === "district_order" && c.source === "Nubia");
        assert("Nubia is asked which of her districts to resolve", !!pick, JSON.stringify((st.pendingChoices || []).map((c) => c.kind)));
        if (pick) {
          assert("and it is one district, not all of them", pick.remaining === 1);
          assert("only her own are offered",
            pick.options.map((o) => o.id).sort().join(",") === "industrial,theater",
            pick.options.map((o) => o.id).join(","));
          assert("the rival's campus is not on the list",
            !pick.options.some((o) => o.id === "campus"));

          // Taking one runs the REAL effect, and only one.
          const took = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: pick.id, optionId: "theater" } });
          const theaterMode = (took.pendingChoices || []).find((c) => c.kind === "district_mode");
          assert("the district's own effect fires",
            !!theaterMode && theaterMode.districtKind === "theater",
            JSON.stringify((took.pendingChoices || []).map((c) => c.kind)));
          const placed = Game.applyAction(took, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: theaterMode.id, optionId: "near" } });
          assert("and it reaches the real control-token placement",
            (placed.pendingChoices || []).some((c) => c.kind === "place_control" && c.source === "theater"),
            JSON.stringify((placed.pendingChoices || []).map((c) => c.kind)));
          assert("and she is not asked for a second one",
            !(took.pendingChoices || []).some((c) => c.kind === "district_order"));
        }

        // With no districts at all there is nothing to resolve and no prompt.
        let bare = rulesState();
        const n2 = bare.players[0];
        n2.leaderId = "nubia";
        bare.turn.index = bare.turn.order.indexOf(n2.id);
        n2.cardPlayed = false;
        activate(bare, "0,0", { city: { ownerId: n2.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        bare = Game.applyAction(bare, { type: "PLAY_GROWTH_REINFORCE", payload: {
          playerId: n2.id, hexKeys: [], tradeSpent: 0 } });
        assert("no districts means no Nubia prompt",
          !(bare.pendingChoices || []).some((c) => c.source === "Nubia"));
      }

      {
        // "a unit that acted shouldn't act again". unitsLeftToMove counts armies
        // still on the card, so a card was never finished while any army sat on
        // it - and nothing stopped an army that had already marched from
        // marching a second time on the same card.
        let st = rulesState();
        const me = st.players[0];
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.cardTiers.military = 2;                 // two armies
        for (let q = 0; q <= 4; q++) activate(st, q + ",0", { terrain: "grass" });
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        me.armies = [{ id: "a1", position: "0,0" }, { id: "a2", position: "0,0" }];

        st = Game.applyAction(st, { type: "PLAY_MILITARY_MOVE", payload: {
          playerId: me.id, unitId: "a1", toKey: "1,0", tradeSpent: 0 } });
        assert("the first army marched", st.players[0].armies[0].position === "1,0");
        assert("and is marked as having gone", st.players[0].armies[0].movedThisCard === true);

        const again = Game.applyAction(st, { type: "PLAY_MILITARY_MOVE", payload: {
          playerId: me.id, unitId: "a1", toKey: "2,0", tradeSpent: 0 } });
        assert("it cannot march a second time on the same card",
          again.players[0].armies.find((u) => u.id === "a1").position === "1,0");

        // The other army has not gone yet, so it still may.
        const second = Game.applyAction(again, { type: "PLAY_MILITARY_MOVE", payload: {
          playerId: me.id, unitId: "a2", toKey: "1,0", tradeSpent: 0 } });
        assert("but an army that has not gone still may",
          second.players[0].armies.find((u) => u.id === "a2").position === "1,0");
        assert("and with both spent the card is finished",
          second.players[0].cardPlayed === true);
      }

      {
        // Flight IV prints: "They can move through spaces with unreinforced
        // control tokens, caravans, barbarians, and city-states." CARD_DEFS
        // carried passThrough: true and nothing read it, so tier IV was stopped
        // by everything tier I was.
        const mk = (tier) => {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          me.cardTiers.military = tier;
          // A straight lane east of the capital, six clear spaces.
          for (let q = 0; q <= 6; q++) activate(st, q + ",0", { terrain: "grass" });
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          me.armies = [{ id: "a1", position: "0,0" }];
          return { st, me, foe };
        };
        const canPass = (setUp, tier) => {
          const { st, me, foe } = mk(tier);
          setUp(st, me, foe);
          // Move 5 or 6 either way, so reaching 3,0 is never about the allowance.
          return Game.getReachable(st, "0,0", 5, "army", me.id).has("3,0");
        };
        const barb = (st) => { st.map.hexes["2,0"].barbarian = true; };
        const cs = (st) => { st.map.hexes["2,0"].cityState = { name: "Test State", type: "culture" }; };
        const loose = (st, me, foe) => { st.map.hexes["2,0"].control = { ownerId: foe.id, fortified: false, district: null }; };
        const firm = (st, me, foe) => { st.map.hexes["2,0"].control = { ownerId: foe.id, fortified: true, district: null }; };
        const wagon = (st, me, foe) => { foe.caravans = [{ id: "c1", position: "2,0" }]; };
        const fort = (st) => { st.map.hexes["2,0"].fortress = true; };
        const rivalCity = (st, me, foe) => { st.map.hexes["2,0"].city = { ownerId: foe.id, isCapital: false, developed: false, hasWonder: false, wonder: null }; };
        const rivalArmy = (st, me, foe) => { foe.armies = [{ id: "e1", position: "2,0" }]; };

        // Masonry I stops for all of them.
        assert("a barbarian stops tier I", !canPass(barb, 1));
        assert("a city-state stops tier I", !canPass(cs, 1));
        assert("an unreinforced token stops tier I", !canPass(loose, 1));
        assert("a rival caravan stops tier I", !canPass(wagon, 1));

        // Flight IV moves through exactly the four it names.
        assert("Flight passes a barbarian", canPass(barb, 4));
        assert("Flight passes a city-state", canPass(cs, 4));
        assert("Flight passes an unreinforced token", canPass(loose, 4));
        assert("Flight passes a caravan", canPass(wagon, 4));

        // And is stopped by everything it does not name.
        assert("Flight is still stopped by a REINFORCED token", !canPass(firm, 4));
        assert("Flight is still stopped by an uncontrolled fort", !canPass(fort, 4));
        assert("Flight is still stopped by a rival city", !canPass(rivalCity, 4));
        assert("Flight is still stopped by a rival army", !canPass(rivalArmy, 4));

        // Passing through is not attacking through: a space with a defender in
        // it is still refused as a DESTINATION, whatever the card.
        const { st, me, foe } = mk(4);
        st.map.hexes["2,0"].barbarian = true;
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        const tried = Game.applyAction(st, { type: "PLAY_MILITARY_MOVE", payload: {
          playerId: me.id, unitId: "a1", toKey: "2,0", tradeSpent: 0 } });
        assert("Flight may not simply walk onto a barbarian",
          tried.players[0].armies[0].position === "0,0");
      }

      {
        // The printed direction token numbers 1-6 clockwise around the hex, so
        // consecutive faces are neighbouring directions and face n is the exact
        // opposite of face n+3. HEX_DIRS is only an enumeration (E, W, SE, NW,
        // NE, SW) - reading the die off it sent faces 1 and 2 to opposite edges
        // of the board, and made the map edge's "go back the other way" a
        // relationship the table could not even express.
        const dirs = Game.BARBARIAN_DIRS;
        assert("the direction token has six faces", dirs.length === 6);
        assert("numbered 1 to 6 in order", dirs.every((d, i) => d.face === i + 1));
        assert("three faces round the ring is always the reverse",
          dirs.every((d, i) => {
            const opp = dirs[(i + 3) % 6];
            return d.dq === -opp.dq && d.dr === -opp.dr;
          }));
        assert("and every face is a real neighbouring space",
          dirs.every((d) => Math.abs(d.dq) + Math.abs(d.dr) + Math.abs(d.dq + d.dr) === 2));
        assert("no two faces point the same way",
          new Set(dirs.map((d) => d.dq + ":" + d.dr)).size === 6);
      }

      {
        // A column of barbarians all march the same way, so the one behind
        // steps into the space the one in front is leaving. Resolving them one
        // at a time made that depend on hash order: deal the rear one first and
        // it saw an occupied space and silently forfeited its move, so a column
        // stayed put and two clients could disagree about the board.
        const st = rulesState();
        // A clear west-to-east lane, and nothing on it but barbarians.
        for (let q = 0; q <= 6; q++) {
          activate(st, q + ",0", { terrain: "grass" });
        }
        ["1,0", "2,0", "3,0"].forEach((k, i) => {
          st.map.hexes[k].barbarian = true;
          st.map.hexes[k].barbarianId = "barb-" + i;
        });
        // Face 2 is east: (dq 1, dr 0).
        const east = Game.BARBARIAN_DIRS[1];
        assert("face 2 is the eastward step", east.dq === 1 && east.dr === 0);

        // Drive the real event rather than a private helper, and keep rolling
        // until the die actually comes up east, so the assertion is about the
        // march and not about the roll.
        let out = null;
        for (let i = 0; i < 400; i++) {
          const attempt = JSON.parse(JSON.stringify(st));
          Game.resolveEvent(attempt, "barbarian_move");   // mutates in place
          if (attempt.barbarianMove && attempt.barbarianMove.roll === 2) { out = attempt; break; }
        }
        assert("the march rolled east at least once in 400 tries", !!out);
        if (out) {
          assert("the roll is recorded so every seat can see the cause",
            out.barbarianMove.dir === "E" && out.barbarianMove.label === "east");
          const now = ["1,0", "2,0", "3,0", "4,0"].map((k) => !!out.map.hexes[k].barbarian);
          assert("the whole column advanced, not just its leader",
            now.join() === [false, true, true, true].join(), now.join());
          assert("and each one is still itself",
            out.map.hexes["4,0"].barbarianId === "barb-2" &&
            out.map.hexes["2,0"].barbarianId === "barb-0");
          // Setup deals barbarians of its own, so this looks for the lane's
          // three steps rather than counting every step on the map.
          const lane = out.barbarianMove.steps
            .filter((s) => /^barb-/.test(String(s.id)))
            .map((s) => s.id + " " + s.from + ">" + s.to).sort().join(" | ");
          assert("every step is recorded for the board to animate",
            lane === "barb-0 1,0>2,0 | barb-1 2,0>3,0 | barb-2 3,0>4,0", lane);
        }
      }

      {
        // Mass Production III: "You may move (and attack with) 1 of your armies
        // that was defeated this turn a second time after returning it to this
        // card." The card def carried redeployDefeated: 1 and nothing read it.
        let st = rulesState();
        const me = st.players[0], foe = st.players[1];
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.cardTiers.military = 3;
        // Military on slot 1. Mass Production attacks at slot + 2, so the
        // attacker stakes 3 and cannot pass 9 on one die, while a city-state
        // defends at 8 and cannot fall below 9 - and the defender takes ties.
        // The loss has to be arithmetically certain or the test flakes: at the
        // default slot the attacker stakes 6 and wins this roughly one run in
        // eight, which is exactly often enough to look like a real bug later.
        me.focusRow = ["military", "growth", "science", "economy", "culture", "industry"];
        assert("tier III is the card that grants it", Game.getCardName(me, "military") === "Mass Production");
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass", cityState: { name: "Test State", type: "culture" } });
        me.armies = [{ id: "a1", position: "0,0" }, { id: "a2", position: null }];
        st = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
          playerId: me.id, unitId: "a1", fromKey: "0,0", toKey: "1,0", targetType: "citystate"
        } });
        assert("the attack opened", !!st.combat);
        st = Game.applyAction(st, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "attacker" } });
        st = Game.applyAction(st, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "defender", hostOverride: true } });
        st = Game.applyAction(st, { type: "COMBAT_PASS", payload: { playerId: me.id, side: "attacker" } });
        st = Game.applyAction(st, { type: "COMBAT_PASS", payload: { playerId: foe.id, side: "defender", hostOverride: true } });
        const beaten = st.players[0].armies.find((u) => u.id === "a1");
        assert("the losing army went back to its card", !st.combat && beaten.position === null);
        assert("and it may go again, which is the whole point of the card",
          beaten.movedThisCard === false);
        assert("the card is still open for it", !st.players[0].cardPlayed);

        // Taking the offer spends it: one army, once. The army is on the card,
        // so it re-enters from a city it may launch from, like any army leaving
        // the card - "after returning it to this card" is not a free teleport.
        const again = Game.applyAction(st, { type: "PLAY_MILITARY_MOVE", payload: {
          playerId: me.id, unitId: "a1", startKey: "0,0", toKey: "0,0", tradeSpent: 0
        } });
        const back = again.players[0].armies.find((u) => u.id === "a1");
        assert("redeploying puts it back on the board", back.position === "0,0");
        assert("and the allowance is spent", again.activeCard && again.activeCard.redeployDefeatedUsed === true);
        assert("a second defeated army cannot also go again",
          again.players[0].armies.every((u) => u.movedThisCard !== false || u.id === "a2"));

        // A tier that does not print the clause gets no second chance.
        let plain = rulesState();
        const p2 = plain.players[0];
        plain.turn.index = plain.turn.order.indexOf(p2.id);
        p2.cardPlayed = false;
        p2.cardTiers.military = 2;
        p2.focusRow = ["military", "growth", "science", "economy", "culture", "industry"];
        activate(plain, "0,0", { city: { ownerId: p2.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(plain, "1,0", { terrain: "grass", cityState: { name: "Test State", type: "culture" } });
        // Two armies, so that losing one does not end the card by itself -
        // finishActiveCard clears movedThisCard, which would hide the very flag
        // under test.
        p2.armies = [{ id: "b1", position: "0,0" }, { id: "b2", position: null }];
        plain = Game.applyAction(plain, { type: "PLAY_MILITARY_ATTACK", payload: {
          playerId: p2.id, unitId: "b1", fromKey: "0,0", toKey: "1,0", targetType: "citystate"
        } });
        plain = Game.applyAction(plain, { type: "COMBAT_ROLL", payload: { playerId: p2.id, side: "attacker" } });
        plain = Game.applyAction(plain, { type: "COMBAT_ROLL", payload: { playerId: p2.id, side: "defender", hostOverride: true } });
        plain = Game.applyAction(plain, { type: "COMBAT_PASS", payload: { playerId: p2.id, side: "attacker" } });
        plain = Game.applyAction(plain, { type: "COMBAT_PASS", payload: { playerId: plain.players[1].id, side: "defender", hostOverride: true } });
        const lost = plain.players[0].armies.find((u) => u.id === "b1");
        assert("Iron Working's defeated army stays on the card",
          lost.position === null && lost.movedThisCard === true);
        assert("and no redeploy was ever offered",
          !(plain.activeCard || {}).defeatedArmyIds);
      }

      {
        // Terra p10: both sides roll, then the attacker bids everything they
        // mean to bid before the defender may answer. A token is +1 or a fresh
        // die, decided after seeing the roll.
        let sawDefenderSpend = false, sawTieToDefender = false, badSpend = 0, badTie = 0;
        let badOrder = 0, rerollChangedDie = false, plusLeftDieAlone = true;
        for (let i = 0; i < 400 && !(sawDefenderSpend && sawTieToDefender && rerollChangedDie); i++) {
          const st = rulesState();
          const me = st.players[0], foe = st.players[1];
          st.turn.index = st.turn.order.indexOf(me.id);
          me.cardPlayed = false;
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          activate(st, "1,0", { terrain: "grass", control: { ownerId: foe.id, fortified: false, district: null } });
          me.armies = [{ id: "a1", position: "0,0" }];
          me.trade.military = Game.CFG.maxTrade;
          foe.trade.military = Game.CFG.maxTrade;
          const d = Game.findDefender(st, "1,0", me.id);
          let out = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
            playerId: me.id, unitId: "a1", toKey: "1,0", fromKey: "0,0",
            attackPower: Game.getSlotValue(me, "military", st), defensePower: d.power,
            defenderParts: d.parts, defenderLabel: d.label, defenderOwnerId: d.ownerId
          } });
          if (!out.combat) continue;
          // Nothing rolls itself any more.
          assertOnce("the dice wait until they are thrown", out.combat.rolled === false);
          // One die at a time: the attacker throws, then the defender answers.
          out = Game.applyAction(out, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "attacker" } });
          if (!out.combat) continue;
          assertOnce("the attacker's die alone does not open the bidding", out.combat.rolled === false);
          out = Game.applyAction(out, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "defender", hostOverride: true } });
          if (!out.combat) continue;

          // the defender may not jump the queue
          const foeBefore = out.players.find((p) => p.id === foe.id).trade.military;
          const jumped = Game.applyAction(out, { type: "COMBAT_SPEND", payload: {
            playerId: foe.id, side: "defender", mode: "plus" } });
          if (jumped.players.find((p) => p.id === foe.id).trade.military !== foeBefore) badOrder++;

          // attacker bids: one +1 and one reroll
          const dieBefore = out.combat.atkRoll;
          out = Game.applyAction(out, { type: "COMBAT_SPEND", payload: { playerId: me.id, side: "attacker", mode: "plus" } });
          if (out.combat.atkRoll !== dieBefore) plusLeftDieAlone = false;
          const beforeReroll = out.combat.atkRoll;
          out = Game.applyAction(out, { type: "COMBAT_SPEND", payload: { playerId: me.id, side: "attacker", mode: "reroll" } });
          if (out.combat.atkRoll !== beforeReroll) rerollChangedDie = true;
          out = Game.applyAction(out, { type: "COMBAT_PASS", payload: { playerId: me.id, side: "attacker" } });

          // defender answers
          if (out.combat && out.combat.turn === "defender") {
            out = Game.applyAction(out, { type: "COMBAT_SPEND", payload: { playerId: foe.id, side: "defender", mode: "plus" } });
            out = Game.applyAction(out, { type: "COMBAT_PASS", payload: { playerId: foe.id, side: "defender" } });
          }
          const c = out.lastCombat;
          if (!c) continue;
          if (c.defTrade > 0) {
            sawDefenderSpend = true;
            const spender = out.players.find((p) => p.id === foe.id);
            if (spender.trade.military !== Game.CFG.maxTrade - c.defTrade) badSpend++;
          }
          if (c.atkTotal === c.defTotal) { sawTieToDefender = true; if (c.win !== false) badTie++; }
        }
        assert("the defender can answer with trade tokens", sawDefenderSpend);
        assert("defender's spend leaves their military card", badSpend === 0);
        assert("a tie goes to the defender", badTie === 0);
        assert("the defender cannot bid before the attacker is done", badOrder === 0);
        assert("a token spent as +1 leaves the die alone", plusLeftDieAlone);
        assert("a token spent as a reroll replaces the die", rerollChangedDie);
      }

      {
        // Every focus card carries the text printed on it.
        let missing = [];
        Game.FOCUS_TYPES.forEach((t) => {
          for (let tier = 1; tier <= 4; tier++) {
            const def = (data.CARD_DEFS[t] || {})[tier];
            if (!def || !def.effectText || def.effectText.length < 20) missing.push(t + "-" + tier);
          }
        });
        assert("all 24 focus cards carry printed effect text", missing.length === 0, missing.join(","));
        assert("every focus type states what a trade token buys",
          Game.FOCUS_TYPES.every((t) => (Game.FOCUS_TRADE_DESC[t] || "").length > 10));
      }


      // --- Second rules pass: units, barbarians, the dial, the wheel ---------
      {
        // The economy card moves every caravan, not one (p8 card text).
        const st0 = rulesState();
        const me = st0.players[0];
        st0.turn.index = st0.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.cardTiers.economy = 3;
        Game.syncUnitCounts(st0, me);
        activate(st0, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st0, "1,0"); activate(st0, "0,1");
        me.caravans.forEach((u) => { u.position = "0,0"; });
        assert("economy III fields two caravans", me.caravans.length === 2);
        let st1 = Game.applyAction(st0, { type: "PLAY_ECONOMY", payload: { playerId: me.id, unitId: me.caravans[0].id, toKey: "1,0", tradeSpent: 0 } });
        assert("the card stays open after the first caravan", !!st1.activeCard && !st1.players[0].cardPlayed);
        st1 = Game.applyAction(st1, { type: "PLAY_ECONOMY", payload: { playerId: me.id, unitId: st1.players[0].caravans[1].id, toKey: "0,1", tradeSpent: 0 } });
        assert("the card resets once every caravan has moved", !st1.activeCard && st1.players[0].cardPlayed);
        assert("a played card returns to slot 1", st1.players[0].focusRow[0] === "economy");
      }

      {
        // A different card may not be started while one is still open.
        const st0 = rulesState();
        const me = st0.players[0];
        st0.turn.index = st0.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.cardTiers.economy = 3;
        Game.syncUnitCounts(st0, me);
        activate(st0, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st0, "1,0");
        me.caravans.forEach((u) => { u.position = "0,0"; });
        const open = Game.applyAction(st0, { type: "PLAY_ECONOMY", payload: { playerId: me.id, unitId: me.caravans[0].id, toKey: "1,0", tradeSpent: 0 } });
        const tried = Game.applyAction(open, { type: "PLAY_SCIENCE", payload: { playerId: me.id, amount: 3, tradeSpent: 0 } });
        assert("another card is refused while one is open", tried.players[0].tech === open.players[0].tech);
        const done = Game.applyAction(open, { type: "END_FOCUS_CARD", payload: { playerId: me.id } });
        assert("END_FOCUS_CARD spends the card early", !done.activeCard && done.players[0].cardPlayed);
      }

      {
        // p9: a caravan goes back on its economy card, and only one caravan may
        // reach the same city-state in a turn.
        const st0 = rulesState();
        const me = st0.players[0];
        st0.turn.index = st0.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.cardTiers.economy = 3;
        Game.syncUnitCounts(st0, me);
        activate(st0, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st0, "1,0", { cityState: { name: "Carthage", type: "military", diplomacyCards: 2 } });
        me.caravans.forEach((u) => { u.position = "0,0"; });
        const one = Game.applyAction(st0, { type: "PLAY_ECONOMY", payload: { playerId: me.id, unitId: me.caravans[0].id, toKey: "1,0", tradeSpent: 0 } });
        assert("a traded caravan sits on the economy card", one.players[0].caravans[0].position === null);
        const after = one.players[0].trade.military;
        const two = Game.applyAction(one, { type: "PLAY_ECONOMY", payload: { playerId: me.id, unitId: one.players[0].caravans[1].id, toKey: "1,0", tradeSpent: 0 } });
        assert("a second caravan cannot trade at the same city-state", two.players[0].trade.military === after);
      }

      {
        // Multiplayer sends the whole state object, so a card left open has to
        // survive a JSON round-trip along with each figure's moved flag.
        const st0 = rulesState();
        const me = st0.players[0];
        st0.turn.index = st0.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.cardTiers.economy = 3;
        Game.syncUnitCounts(st0, me);
        activate(st0, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st0, "1,0");
        me.caravans.forEach((u) => { u.position = "0,0"; });
        const open = Game.applyAction(st0, { type: "PLAY_ECONOMY", payload: { playerId: me.id, unitId: me.caravans[0].id, toKey: "1,0", tradeSpent: 0 } });
        const wire = JSON.parse(JSON.stringify(open));
        assert("an open card survives the trip to a client",
          !!wire.activeCard && wire.activeCard.cardType === "economy" && wire.activeCard.playerId === me.id);
        assert("the moved flag survives with it", wire.players[0].caravans[0].movedThisCard === true);
        // And a client acting on that state closes the card the same way.
        const closed = Game.applyAction(wire, { type: "END_FOCUS_CARD", payload: { playerId: me.id } });
        assert("a client can close the card", !closed.activeCard && closed.players[0].cardPlayed);
      }

      {
        // The physical tech dial, base p8. Its printed tabs — not evenly
        // guessed thirds — are II at 3/6, III at 10/14, IV at 19/24.
        assert("tech-level spaces match the printed dial",
          JSON.stringify(Game.TECH_LEVEL_SPACES) === JSON.stringify({ 3: 2, 6: 2, 10: 3, 14: 3, 19: 4, 24: 4 }));
        const st0 = rulesState();
        const me = st0.players[0];
        me.tech = 0;
        Game.advanceTech(st0, me, 6);
        assert("both printed level-II tabs grant an opportunity",
          st0.pendingChoices.filter((c) => c.kind === "science_upgrade" && c.techLevel === 2).length === 2);
        const lvl2 = st0.pendingChoices.find((c) => c.kind === "science_upgrade");
        assert("reaching a level offers a card of exactly that level", !!lvl2 && lvl2.techLevel === 2);
        const took = Game.applyAction(st0, { type: "RESOLVE_PENDING_CHOICE", payload: { playerId: me.id, choiceId: lvl2.id, optionId: "culture" } });
        assert("the card lands on the level reached", took.players[0].cardTiers.culture === 2);
        const secondII = took.pendingChoices.find((c) => c.kind === "science_upgrade" && c.techLevel === 2);
        assert("later same-level prompts refresh after a card is taken",
          !!secondII && !secondII.options.some((o) => o.id === "culture" || o.id === "unique_culture"));
        const skipped = Game.applyAction(took, { type: "RESOLVE_PENDING_CHOICE", payload: {
          playerId: me.id, choiceId: secondII.id, dismiss: true
        } });
        assert("the player may decline an optional tech card",
          !skipped.pendingChoices.some((c) => c.id === secondII.id));

        const st1 = rulesState();
        st1.players[0].tech = 0;
        Game.advanceTech(st1, st1.players[0], 16);
        assert("crossing four printed tabs grants all four opportunities",
          st1.pendingChoices.filter((c) => c.kind === "science_upgrade").length === 4 &&
          st1.pendingChoices.map((c) => c.techLevel).join(",") === "2,2,3,3");

        const st2 = rulesState();
        st2.players[0].tech = 22;
        Game.advanceTech(st2, st2.players[0], 4);
        assert("past space 24 the arrow goes to 15", st2.players[0].tech === 15);
      }

      {
        // Safe turn undo: reversible choices may go back to the start of this
        // turn. Public information (dice and explored land) closes that door.
        let st = rulesState();
        const me = st.players[0];
        st.turn.index = st.turn.order.indexOf(me.id);
        const originalRow = me.focusRow.join(",");
        st = Game.applyAction(st, { type: "PLAY_SCIENCE", payload: {
          playerId: me.id, amount: 2, tradeSpent: 0
        } });
        assert("a resolved card can be undone before hidden information appears",
          Game.getUndoStatus(st, me.id).canUndo);
        st = Game.applyAction(st, { type: "UNDO_TURN", payload: { playerId: me.id } });
        assert("undo restores the start of the turn exactly",
          st.players[0].tech === 0 && !st.players[0].cardPlayed && st.players[0].focusRow.join(",") === originalRow);
        assert("the restored turn has no second undo until another action",
          !Game.getUndoStatus(st, me.id).canUndo);

        const actor = st.players[0];
        activate(st, "0,0", { city: { ownerId: actor.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { control: { ownerId: st.players[1].id, fortified: false, district: null } });
        actor.armies = [{ id: "undo-army", position: "0,0" }];
        st = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
          playerId: actor.id, unitId: "undo-army", fromKey: "0,0", toKey: "1,0", targetType: "control"
        } });
        assert("an attack can be cancelled before either die is rolled", !!st.combat && Game.getUndoStatus(st, actor.id).canUndo);
        st = Game.applyAction(st, { type: "CANCEL_COMBAT", payload: { playerId: actor.id } });
        assert("cancelling before the roll leaves no combat and spends no card",
          !st.combat && !st.players[0].cardPlayed && st.players[0].armies[0].position === "0,0");
        st = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
          playerId: actor.id, unitId: "undo-army", fromKey: "0,0", toKey: "1,0", targetType: "control"
        } });
        st = Game.applyAction(st, { type: "COMBAT_ROLL", payload: { playerId: actor.id, side: "attacker" } });
        assert("the first combat die locks turn undo", !Game.getUndoStatus(st, actor.id).canUndo && /die/.test(Game.getUndoStatus(st, actor.id).reason));
        const rolled = st.combat.atkRoll;
        st = Game.applyAction(st, { type: "UNDO_TURN", payload: { playerId: actor.id } });
        assert("undo cannot erase a public die result", st.combat && st.combat.atkRoll === rolled);

        let explored = rulesState();
        const explorer = explored.players[0];
        explored.turn.index = explored.turn.order.indexOf(explorer.id);
        explored.tileStack = explored.setup.tileStack.slice();
        explored.tileDeck = explored.tileStack.slice();
        explorer.armies = [{ id: "explorer", position: "0,0" }];
        explored = Game.applyAction(explored, { type: "ABANDON_EXPLORATION", payload: {
          playerId: explorer.id, fromKey: "0,0"
        } });
        assert("resolving exploration locks turn undo", !Game.getUndoStatus(explored, explorer.id).canUndo && /exploration/.test(Game.getUndoStatus(explored, explorer.id).reason));
      }

      {
        // Final setup must leave every figure printed on its focus card.
        const st = Game.createState(players(2));
        st.players.forEach((p) => {
          Game.syncUnitCounts(st, p);
          p.armies.forEach((u) => { u.position = "0,0"; });
          p.caravans.forEach((u) => { u.position = "0,0"; });
        });
        Game.finalizeSetup(st);
        assert("final setup keeps armies off the capital",
          st.players.every((p) => p.armies.every((u) => u.position === null)));
        assert("final setup keeps caravans on their economy cards",
          st.players.every((p) => p.caravans.every((u) => u.position === null)));
      }

      {
        // The Terra dial, read off the printed face: six spaces, no blanks, and
        // the wonder pyramid sharing a space with spawning and with government.
        assert("the dial has six spaces", Game.EVENTS.length === 6);
        assert("no space is blank", Game.EVENTS.every((sec) => Array.isArray(sec) && sec.length));
        assert("the dial starts on barbarians appearing", Game.EVENTS[0][0] === "barbarian_return");
        assert("the wonder icon shares the starting space", Game.EVENTS[0].indexOf("wonder_tokens") === 1);
        assert("the wonder icon also shares the government space",
          Game.EVENTS[3][0] === "gov_change" && Game.EVENTS[3][1] === "wonder_tokens");
        assert("the expansion dial has no trade icon", Game.EVENT_NAMES.indexOf("trade") < 0);
        assert("every icon on the dial has a label",
          Game.EVENT_NAMES.every((e) => !!Game.EVENT_LABELS[e]));

        // A fresh game sits on the starting space without having resolved it.
        const fresh = rulesState();
        assert("the pointer starts on the first space", fresh.eventWheel.position === 0);
        assert("setup places no trade token on a wonder",
          Object.values(fresh.wonderDecks).every((d) => !d.token));

        // One full revolution, in printed order.
        const order = [];
        const seen = rulesState();
        for (let i = 0; i < 6; i++) {
          seen.eventWheel.position = (seen.eventWheel.position + 1) % 6;
          seen.eventWheel.events[seen.eventWheel.position].forEach((e) => order.push(e));
        }
        assert("the dial turns spawn -> wonder -> move -> district -> gov -> wonder -> move -> district",
          order.join(",") === "barbarian_move,district_event,gov_change,wonder_tokens," +
            "barbarian_move,district_event,barbarian_return,wonder_tokens");
      }

      {
        // Terra p14: the wonder icon marks a faceup wonder, and the second mark
        // takes it out of the game rather than discounting it further.
        const st0 = rulesState();
        const me = st0.players[0];
        const deckType = Object.keys(st0.wonderDecks)[0];
        const deck = st0.wonderDecks[deckType];
        const first = deck.revealed;
        const base = Game.getWonderCost(first, me);

        Game.resolveEvent(st0, "wonder_tokens");
        assert("the wonder icon puts a trade token on the faceup wonder", deck.token === 1);
        assert("a marked wonder costs exactly 1 less",
          Game.getWonderCost(first, me, st0) === base - 1);

        Game.resolveEvent(st0, "wonder_tokens");
        assert("a second token removes the wonder from the game",
          deck.revealed !== first && (deck.removed || []).indexOf(first) >= 0);
        assert("the replacement starts unmarked", deck.token === 0);
        assert("a removed wonder is out of the deck", deck.deck.indexOf(first) < 0);
      }

      {
        // Mysticism moves the control token which was underneath the district.
        // It must not offer an adjacent, unrelated token as the source.
        let st0 = rulesState();
        const me = st0.players[0];
        me.leaderId = "aztec";
        activate(st0, "0,0", {
          city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null }
        });
        activate(st0, "1,0", {
          control: { ownerId: me.id, fortified: true, district: null }
        });
        activate(st0, "1,-1");
        activate(st0, "0,1", {
          control: { ownerId: me.id, fortified: false, district: null }
        });

        st0 = Game.applyAction(st0, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: me.id, hexKey: "1,0", district: "campus", tradeSpent: 0
        } });
        const relocation = (st0.pendingChoices || []).find((choice) =>
          choice.kind === "mysticism_control_destination");
        assert("Mysticism offers the replaced token's destination directly",
          relocation && !st0.pendingChoices.some((choice) =>
            choice.kind === "mysticism_control_source") &&
          relocation.carriedControl && relocation.carriedControl.fortified === true,
          JSON.stringify(st0.pendingChoices));
        assert("a Mysticism district is placed on its unreinforced side",
          st0.map.hexes["1,0"].control.district === "campus" &&
          st0.map.hexes["1,0"].control.fortified === false);

        st0 = Game.applyAction(st0, { type: "RESOLVE_PENDING_CHOICE", payload: {
          playerId: me.id, choiceId: relocation.id, hexKey: "1,-1"
        } });
        assert("Mysticism relocates that same physical control token beside the district",
          st0.map.hexes["1,-1"].control &&
          st0.map.hexes["1,-1"].control.ownerId === me.id &&
          st0.map.hexes["1,-1"].control.fortified === true &&
          st0.map.hexes["0,1"].control && !st0.map.hexes["0,1"].control.fortified);
        assert("Mysticism completes its focus-card transaction after relocation",
          me.id === st0.players[0].id && st0.players[0].cardPlayed === true && !st0.cardResolution);
      }

      {
        // Radio's fifth-slot city replacement is printed as a mandatory
        // choice when a legal city exists; it is never a host-skippable prompt.
        let st0 = rulesState();
        const me = st0.players[0];
        const rival = st0.players[1];
        me.leaderId = "america";
        me.uniqueTaken = true;
        me.cardTiers.culture = 4;
        me.cardLevels.culture = 4;
        me.focusRow = ["growth", "science", "economy", "military", "industry", "culture"];
        activate(st0, "0,0", {
          city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null }
        });
        ["1,0", "0,1", "-1,1"].forEach((hexKey) => activate(st0, hexKey));
        activate(st0, "3,0", {
          city: { ownerId: rival.id, isCapital: false, developed: false, hasWonder: false, wonder: null }
        });

        st0 = Game.applyAction(st0, { type: "PLAY_CULTURE", payload: {
          playerId: me.id, hexKeys: ["1,0", "0,1", "-1,1"], tradeSpent: 0
        } });
        const seizure = (st0.pendingChoices || []).find((choice) => choice.kind === "seize_city");
        assert("Radio requires its owner to choose a legal fifth-slot rival city",
          seizure && seizure.playerId === me.id && seizure.optional !== true &&
          seizure.hexKeys.includes("3,0"), JSON.stringify(st0.pendingChoices));
      }

      {
        // Industrialization replaces Nationalism; it keeps slot-5 production
        // at 5 and adds districts instead of inheriting Nationalism's printed 7.
        const st0 = rulesState();
        const me = st0.players[0];
        me.leaderId = "japan";
        me.uniqueTaken = true;
        me.cardTiers.industry = 3;
        me.cardLevels.industry = 3;
        me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        activate(st0, "0,0", {
          control: { ownerId: me.id, fortified: false, district: "campus" }
        });
        activate(st0, "1,0", {
          control: { ownerId: me.id, fortified: true, district: "industrial" }
        });
        const wonderName = Game.ALL_WONDERS[0].name;
        const japan = Game.calculateWonderProduction(st0, me, wonderName, {});
        assert("Industrialization uses slot 5 plus one production per district",
          japan.ok && japan.production.base === 5 &&
          japan.production.districtBonus === 2 && japan.production.total === 7,
          JSON.stringify(japan.production));

        const standard = rulesState();
        const builder = standard.players[0];
        builder.cardTiers.industry = 3;
        builder.cardLevels.industry = 3;
        builder.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        const nationalism = Game.calculateWonderProduction(standard, builder, wonderName, {});
        assert("standard Nationalism still produces 7 in the fifth slot",
          nationalism.ok && nationalism.production.base === 7 &&
          nationalism.production.districtBonus === 0);
      }

      {
        // Petra errata: a barbarian that would enter one of the owner's cities
        // or reinforced markers walks in the opposite direction instead.
        const st0 = rulesState();
        const owner = st0.players[0];
        Object.values(st0.map.hexes).forEach((hex) => {
          hex.barbarian = false; hex.barbarianId = null;
        });
        activate(st0, "0,0", { barbarian: true });
        st0.map.hexes["0,0"].barbarianId = "P";
        activate(st0, "1,-1", {
          control: { ownerId: owner.id, fortified: true, district: null }
        });
        activate(st0, "-1,1");
        activate(st0, "0,2", {
          city: { ownerId: owner.id, isCapital: false, developed: false, hasWonder: true,
            wonder: { name: "Petra", type: "military", era: "ancient" } }
        });
        const originalRandom = Math.random;
        Math.random = () => 0; // direction-token face 1: north-east
        try { Game.resolveEvent(st0, "barbarian_move"); }
        finally { Math.random = originalRandom; }
        assert("Petra sends a barbarian in the opposite direction",
          st0.map.hexes["-1,1"].barbarian === true &&
          st0.map.hexes["0,0"].barbarian === false);
        assert("Petra prevents the reinforced marker from being battered",
          st0.map.hexes["1,-1"].control && st0.map.hexes["1,-1"].control.fortified === true);
      }

      {
        // Cristo Redentor says build OR capture. Capturing it through any city
        // replacement must queue its city choice and must exclude every army,
        // including one belonging to the new owner.
        let st0 = rulesState();
        const me = st0.players[0];
        const rival = st0.players[1];
        activate(st0, "0,0", {
          city: { ownerId: rival.id, isCapital: false, developed: false, hasWonder: true,
            wonder: { name: "Cristo Redentor", type: "culture", era: "modern" } }
        });
        activate(st0, "1,0", {
          city: { ownerId: rival.id, isCapital: false, developed: false, hasWonder: false, wonder: null }
        });
        activate(st0, "2,0", {
          city: { ownerId: rival.id, isCapital: false, developed: false, hasWonder: false, wonder: null }
        });
        me.armies.push({ id: "cristo-guard", position: "2,0" });
        st0.pendingChoices = [{
          id: "capture-cristo", kind: "seize_city", playerId: me.id,
          source: "test", hexKeys: ["0,0"]
        }];
        st0 = Game.applyAction(st0, { type: "RESOLVE_PENDING_CHOICE", payload: {
          playerId: me.id, choiceId: "capture-cristo", hexKey: "0,0"
        } });
        const followUp = (st0.pendingChoices || []).find((choice) =>
          choice.source === "Cristo Redentor");
        assert("capturing Cristo Redentor triggers its city takeover",
          followUp && followUp.hexKeys.includes("1,0"), JSON.stringify(st0.pendingChoices));
        assert("Cristo Redentor excludes a city containing any army",
          followUp && !followUp.hexKeys.includes("2,0"));
      }

      {
        // Statue of Liberty applies before effect-based replacement as well as
        // combat, and unused plain control tokens never copy rival districts.
        let st0 = rulesState();
        const me = st0.players[0];
        const rival = st0.players[1];
        activate(st0, "-2,0", {
          city: { ownerId: me.id, isCapital: false, developed: false, hasWonder: true,
            wonder: { name: "Statue of Liberty", type: "military", era: "modern" } }
        });
        activate(st0, "0,0", {
          city: { ownerId: rival.id, isCapital: false, developed: false, hasWonder: false, wonder: null }
        });
        activate(st0, "1,0", {
          control: { ownerId: rival.id, fortified: true, district: "campus" }
        });
        activate(st0, "0,1", {
          control: { ownerId: rival.id, fortified: false, district: null }
        });
        st0.pendingChoices = [{
          id: "liberty-city", kind: "seize_city", playerId: me.id,
          source: "Radio", hexKeys: ["0,0"]
        }];
        st0 = Game.applyAction(st0, { type: "RESOLVE_PENDING_CHOICE", payload: {
          playerId: me.id, choiceId: "liberty-city", hexKey: "0,0"
        } });
        assert("Statue of Liberty fires on a non-combat city replacement",
          st0.map.hexes["1,0"].control.ownerId === me.id &&
          st0.map.hexes["0,1"].control.ownerId === me.id);
        assert("Statue of Liberty replaces districts with plain unreinforced control",
          st0.map.hexes["1,0"].control.district === null &&
          st0.map.hexes["1,0"].control.fortified === false);
      }

      {
        // Stonehenge triggers from generic placement effects and "1 or more"
        // means every adjacent hill is independently available, not just one.
        let st0 = rulesState();
        const me = st0.players[0];
        activate(st0, "3,0", {
          city: { ownerId: me.id, isCapital: false, developed: false, hasWonder: true,
            wonder: { name: "Stonehenge", type: "culture", era: "ancient" } }
        });
        activate(st0, "0,0", { terrain: "hill" });
        activate(st0, "1,0", { terrain: "hill" });
        activate(st0, "-1,0", { terrain: "hill" });
        st0.pendingChoices = [{
          id: "gardens-hill", kind: "place_control", playerId: me.id,
          source: "Hanging Gardens", hexKeys: ["0,0"], optional: true
        }];
        st0 = Game.applyAction(st0, { type: "RESOLVE_PENDING_CHOICE", payload: {
          playerId: me.id, choiceId: "gardens-hill", hexKey: "0,0"
        } });
        let links = (st0.pendingChoices || []).filter((choice) => choice.source === "Stonehenge");
        assert("Stonehenge triggers from a Hanging Gardens control placement",
          links.some((choice) => choice.hexKeys.includes("1,0")) &&
          links.some((choice) => choice.hexKeys.includes("-1,0")), JSON.stringify(links));
        for (const target of ["1,0", "-1,0"]) {
          const link = (st0.pendingChoices || []).find((choice) =>
            choice.source === "Stonehenge" && choice.hexKeys.includes(target));
          st0 = Game.applyAction(st0, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: link.id, hexKey: target
          } });
        }
        assert("Stonehenge may place on more than one hill beside the triggering space",
          st0.map.hexes["1,0"].control.ownerId === me.id &&
          st0.map.hexes["-1,0"].control.ownerId === me.id);
        // The chain is driven from a real placement and both spilled tokens are
        // asserted on the board, including the "1 or MORE adjacent hills" part.
        // Not yet covered: "does not trigger on moved or replaced tokens".
        proves("wonder.culture.stonehenge");
      }

      {
        // Great Zimbabwe has four physical spaces. If a multi-token reward
        // overflows it, the remaining token still has to reach a focus card.
        let st0 = rulesState();
        const me = st0.players[0];
        activate(st0, "0,0", {
          city: { ownerId: me.id, isCapital: false, developed: false, hasWonder: true,
            wonder: { name: "Great Zimbabwe", type: "economy", era: "medieval" } }
        });
        me.zimbabwe = 3;
        st0.pendingChoices = [{
          id: "zimbabwe-overflow", kind: "trade_any", playerId: me.id,
          source: "test reward", amount: 2,
          options: [{ id: "zimbabwe", label: "Great Zimbabwe" }]
        }];
        st0 = Game.applyAction(st0, { type: "RESOLVE_PENDING_CHOICE", payload: {
          playerId: me.id, choiceId: "zimbabwe-overflow", optionId: "zimbabwe"
        } });
        const overflow = (st0.pendingChoices || []).find((choice) =>
          choice.kind === "trade_any" && choice.amount === 1);
        assert("Great Zimbabwe fills only its fourth space", st0.players[0].zimbabwe === 4);
        assert("Great Zimbabwe reroutes an overflowing trade token instead of deleting it",
          overflow && overflow.options.every((option) => option.id !== "zimbabwe"));
      }

      {
        // Antananarivo is a friendly city for district/wonder effects, so the
