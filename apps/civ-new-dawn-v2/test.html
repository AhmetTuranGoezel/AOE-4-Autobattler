        // central friendly-space test must also feed Forbidden City.
        let st0 = rulesState();
        const ending = st0.players[0];
        const owner = st0.players[1];
        ending.cardPlayed = true;
        owner.diplomacy.push({ fromCityState: "Antananarivo", type: "culture" });
        activate(st0, "-2,0", {
          city: { ownerId: owner.id, isCapital: false, developed: false, hasWonder: true,
            wonder: { name: "Forbidden City", type: "culture", era: "medieval" } }
        });
        activate(st0, "0,0", {
          cityState: { name: "Antananarivo", type: "culture" }
        });
        activate(st0, "1,0", {
          control: { ownerId: ending.id, fortified: false, district: null }
        });
        st0 = Game.applyAction(st0, { type: "END_TURN", payload: { playerId: ending.id } });
        const forbidden = (st0.pendingChoices || []).find((choice) => choice.source === "Forbidden City");
        assert("Forbidden City recognizes Antananarivo as a friendly adjacent space",
          forbidden && forbidden.hexKeys.includes("1,0"), JSON.stringify(st0.pendingChoices));
      }

      {
        // Barbarians, p12. One roll steers all of them, and a reinforced marker
        // turns the raid back without the barbarian disappearing.
        let lost = 0;
        for (let i = 0; i < 30; i++) {
          const st0 = rulesState();
          Object.values(st0.map.hexes).forEach((h) => { h.barbarian = false; h.barbarianId = null; });
          activate(st0, "0,0", { barbarian: true });
          st0.map.hexes["0,0"].barbarianId = "X";
          Game.hexNeighborKeys(0, 0).forEach((k) => {
            if (st0.map.hexes[k]) activate(st0, k, { control: { ownerId: st0.players[1].id, fortified: true, district: null } });
          });
          Game.resolveEvent(st0, "barbarian_move");
          if (Object.values(st0.map.hexes).filter((h) => h.barbarian).length !== 1) lost++;
        }
        assert("a barbarian is never lost to a reinforced marker", lost === 0);

        const st1 = rulesState();
        Object.values(st1.map.hexes).forEach((h) => {
          h.barbarian = false; h.barbarianId = null; h.barbarianHome = null;
        });
        activate(st1, "2,0");
        st1.map.hexes["2,0"].barbarianHome = "K";
        Game.resolveEvent(st1, "barbarian_return");
        assert("a defeated barbarian returns to its printed space",
          st1.map.hexes["2,0"].barbarian === true && st1.map.hexes["2,0"].barbarianId === "K");
      }

      // ── Reported from a real game: industry trade, the Sanitation sequence,
      //    and the undo that could not escape it ──────────────────────────────
      //
      // All three had one shape: a value the player could see disagreed with
      // the value a subsystem acted on. The engine assertions below pin the
      // arithmetic and the sequencing so the wizard has one thing to render.
      {
        // FOCUS_SLOTS is [1,1,2,3,4,5]: six positions, printed slots 1..5. A
        // card in the fifth ARRAY position is printed slot 4.
        const industryAt = (trade) => {
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.focusRow = ["growth", "science", "economy", "culture", "industry", "military"];
          me.trade.industry = trade;
          Object.keys(st.map.hexes).forEach((k) => activate(st, k));
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          const deck = st.wonderDecks.military;
          deck.deck = ["Terracotta Army"].concat(deck.deck.filter((n) => n !== "Terracotta Army"));
          deck.revealed = "Terracotta Army";
          deck.token = 0;
          return { st, me };
        };
        const { st: iSt, me: iMe } = industryAt(3);
        assert("industry sits in printed slot 4", Game.getSlotValue(iMe, "industry", iSt) === 4,
          Game.getSlotValue(iMe, "industry", iSt));
        assert("the card really holds 3 trade tokens (the storage cap)",
          iMe.trade.industry === 3 && Game.CFG.maxTrade === 3);
        // Each industry trade token spent on a wonder is +1 production. The
        // wizard once previewed slot + a STALE selection carried over from the
        // previously clicked card, so a card holding 3 read as though 2 were
        // already committed.
        [0, 1, 2, 3].forEach((spend) => {
          const preview = Game.calculateWonderProduction(iSt, iMe, "Terracotta Army", { tradeSpent: spend });
          assert(`industry slot 4 + ${spend} trade = ${4 + spend} production`,
            preview.ok && preview.production.total === 4 + spend,
            preview.ok ? preview.production.total : preview.message);
          assert(`and the breakdown attributes ${spend} of it to trade`,
            preview.ok && preview.production.base === 4 && preview.production.trade === spend);
        });
        // Affordability is derived from whatever the card actually costs, not
        // from a number written here: the printed costs are audited separately
        // and this test is about the production ARITHMETIC. Hard-coding 7 made
        // these fail the moment Terracotta Army was corrected to 8.
        // Pick a wonder that slot 4 plus at most 3 trade can actually reach, so
        // the affordability boundary is testable whatever the printed costs are.
        const reachable = Game.ALL_WONDERS
          .map((w) => ({ name: w.name, cost: Game.calculateWonderCost(w.name, iMe, iSt).finalCost }))
          .filter((w) => w.cost > 4 && w.cost <= 7)
          .sort((a, b) => a.cost - b.cost)[0];
        assert("a wonder exists that 4 + up to 3 trade can buy", !!reachable,
          JSON.stringify(Game.ALL_WONDERS.map((w) => w.cost).sort((a, b) => a - b).slice(0, 4)));
        if (reachable) {
          const need = reachable.cost - 4;
          const under = Game.calculateWonderProduction(iSt, iMe, reachable.name, { tradeSpent: need - 1 });
          assert("one trade short of the cost is not affordable",
            under.ok && !under.affordable && under.shortfall === 1,
            JSON.stringify({ wonder: reachable.name, cost: reachable.cost, shortfall: under.shortfall }));
          const exact = Game.calculateWonderProduction(iSt, iMe, reachable.name, { tradeSpent: need });
          assert("spending exactly enough affords it", exact.ok && exact.affordable,
            JSON.stringify({ wonder: reachable.name, cost: reachable.cost, total: exact.ok && exact.production.total }));
        }
        assert("spending more trade than the card holds is refused",
          !Game.calculateWonderProduction(industryAt(2).st, industryAt(2).me, "Terracotta Army", { tradeSpent: 3 }).ok);

        // The FINAL payment, not just the preview. Slot 4 plus 3 trade is 7
        // production, so this needs a wonder that 7 actually buys - picked from
        // the data rather than named, so an audited cost change cannot turn a
        // payment test into a failure about affordability.
        const { st: bSt, me: bMe } = industryAt(3);
        const affordable = Game.ALL_WONDERS
          .filter((w) => Game.calculateWonderCost(w.name, bMe, bSt).finalCost <= 7)
          .sort((a, b) => Game.calculateWonderCost(a.name, bMe, bSt).finalCost -
            Game.calculateWonderCost(b.name, bMe, bSt).finalCost)[0];
        assert("some wonder is buildable with 7 production", !!affordable);
        if (affordable) {
          const deck = bSt.wonderDecks[affordable.type];
          deck.deck = [affordable.name].concat(deck.deck.filter((n) => n !== affordable.name));
          deck.revealed = affordable.name;
          deck.token = 0;
          const built = Game.applyAction(bSt, { type: "PLAY_INDUSTRY_WONDER", payload: {
            playerId: bMe.id, hexKey: "0,0", wonderName: affordable.name, tradeSpent: 3 } });
          assert("the wonder is actually built with all 3 tokens",
            built.map.hexes["0,0"].city.wonder &&
            built.map.hexes["0,0"].city.wonder.name === affordable.name,
            { wonder: affordable.name, cost: Game.calculateWonderCost(affordable.name, bMe, bSt).finalCost });
          assert("and all 3 industry trade tokens were really removed",
            Game.getPlayer(built, bMe.id).trade.industry === 0,
            Game.getPlayer(built, bMe.id).trade.industry);
        }

        // A world wonder needs a friendly city WITHOUT a wonder. Maturity is
        // not part of that test and must never become one.
        const { st: pSt, me: pMe } = industryAt(3);
        activate(pSt, "2,0", { city: { ownerId: pMe.id, isCapital: false, developed: false, hasWonder: false, wonder: null } });
        activate(pSt, "4,0", { city: { ownerId: pMe.id, isCapital: false, developed: false, hasWonder: true,
          wonder: { name: "Petra", era: "ancient", type: "military", cost: 7, effect: "" } } });
        activate(pSt, "6,0", { city: { ownerId: pSt.players[1].id, isCapital: false, developed: false, hasWonder: false, wonder: null } });
        const sites = Game.validWonderHexes(pSt, pMe.id);
        assert("a friendly city that is NOT mature can take a world wonder",
          sites.has("2,0") && pSt.map.hexes["2,0"].city.developed === false);
        assert("a mature friendly city can too", sites.has("0,0"));
        assert("a city that already holds a wonder cannot take another", !sites.has("4,0"));
        assert("a rival city is never a wonder site", !sites.has("6,0"));

        // Industry's OTHER trade rule — the Industrial Zone's exactly-3 city
        // option — must not share a cap or a selection with wonder production.
        const { st: zSt, me: zMe } = industryAt(3);
        activate(zSt, "1,0", { control: { ownerId: zMe.id, fortified: false, district: "industrial" } });
        assert("the Industrial Zone city option needs exactly 3 industry trade",
          Game.industrialZoneCityOption(zSt, zMe.id).ok);
        zMe.trade.industry = 2;
        assert("and is refused at 2", !Game.industrialZoneCityOption(zSt, zMe.id).ok);
        zMe.trade.industry = 3;
        assert("while wonder production still accepts a partial 1-token spend",
          Game.calculateWonderProduction(zSt, zMe, "Terracotta Army", { tradeSpent: 1 }).production.total === 5);
      }

      {
        // Sanitation (standard growth III) prints a SEQUENCE: place a district,
        // then reinforce up to this slot's number. Its reinforcement is a card
        // effect and owes nothing to trade — it works with an empty growth card.
        const sanitation = (trade, spareTokens) => {
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          me.cardTiers.growth = 3;
          me.cardLevels.growth = 3;
          me.focusRow = ["science", "economy", "culture", "growth", "industry", "military"];
          me.trade.growth = trade;
          Object.keys(st.map.hexes).forEach((k) => activate(st, k));
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          activate(st, "1,0");
          ["0,1", "-1,1", "-1,0", "0,-1"].slice(0, spareTokens).forEach((k) =>
            activate(st, k, { control: { ownerId: me.id, fortified: false, district: null } }));
          return { st, me };
        };
        const profile = Game.growthCardProfile(sanitation(0, 0).me);
        assert("growth III is Sanitation", profile.name === "Sanitation" && profile.standard);
        assert("Sanitation is sequential, never district-OR-reinforce", profile.sequential === true);

        // Zero growth trade: the printed reinforcement still happens.
        let zSt = sanitation(0, 3).st;
        const zMe = zSt.players[0];
        assert("growth resolves in printed slot 3", Game.getSlotValue(zMe, "growth", zSt) === 3);
        zSt = Game.applyAction(zSt, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: zMe.id, hexKey: "1,0", district: "campus", tradeSpent: 0 } });
        assert("the district is placed", zSt.map.hexes["1,0"].control &&
          zSt.map.hexes["1,0"].control.district === "campus");
        assert("a reinforcement step follows instead of resetting the card",
          zSt.cardResolution && zSt.cardResolution.step === "growth_reinforce");
        assert("the growth card is NOT reset yet", Game.getPlayer(zSt, zMe.id).cardPlayed === false);
        assert("the card's own allowance is the slot number, 3",
          zSt.cardResolution.reinforceBase === 3, zSt.cardResolution.reinforceBase);
        assert("and the trade allowance is a separate, honest 0",
          zSt.cardResolution.tradeBudget === 0, zSt.cardResolution.tradeBudget);
        assert("the district just placed is itself a legal reinforcement target",
          Game.validReinforceHexes(zSt, zMe.id).has("1,0"));
        // "Up to": stopping under the maximum is legal.
        zSt = Game.applyAction(zSt, { type: "PLAY_GROWTH_REINFORCE", payload: {
          playerId: zMe.id, hexKeys: ["1,0", "0,1"], tradeSpent: 0 } });
        assert("reinforcing 2 of an allowed 3 is accepted", zSt.cardResolution === null);
        assert("including the brand-new district", zSt.map.hexes["1,0"].control.fortified === true);
        assert("the card is spent once the sequence closes", Game.getPlayer(zSt, zMe.id).cardPlayed === true);
        assert("and no trade was taken from an empty card", Game.getPlayer(zSt, zMe.id).trade.growth === 0);

        // Reinforcing nothing at all is also a legal exit.
        let nSt = sanitation(0, 3).st;
        const nMe = nSt.players[0];
        nSt = Game.applyAction(nSt, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: nMe.id, hexKey: "1,0", district: "campus", tradeSpent: 0 } });
        nSt = Game.applyAction(nSt, { type: "END_FOCUS_CARD", payload: {
          playerId: nMe.id, cardType: "growth", tradeSpent: 0 } });
        assert("END_FOCUS_CARD closes an open growth sequence", nSt.cardResolution === null);
        assert("the district survives that exit", !!nSt.map.hexes["1,0"].control);

        // Fewer legal targets than the maximum must not demand impossible clicks.
        let fSt = sanitation(0, 0).st;
        const fMe = fSt.players[0];
        fSt = Game.applyAction(fSt, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: fMe.id, hexKey: "1,0", district: "campus", tradeSpent: 0 } });
        const only = Game.validReinforceHexes(fSt, fMe.id);
        assert("allowance 3 with a single marker on the board", only.size === 1, only.size);
        if (fSt.cardResolution) {
          fSt = Game.applyAction(fSt, { type: "PLAY_GROWTH_REINFORCE", payload: {
            playerId: fMe.id, hexKeys: ["1,0"], tradeSpent: 0 } });
        }
        assert("reinforcing the one that exists finishes the card",
          fSt.cardResolution === null && Game.getPlayer(fSt, fMe.id).cardPlayed === true);

        // With trade: the two allowances stay apart, and trade is charged only
        // for markers beyond the printed free ones.
        let tSt = sanitation(2, 4).st;
        const tMe = tSt.players[0];
        tSt = Game.applyAction(tSt, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: tMe.id, hexKey: "1,0", district: "campus", tradeSpent: 2 } });
        assert("card allowance 3 and trade allowance 2 are recorded separately",
          tSt.cardResolution.reinforceBase === 3 && tSt.cardResolution.tradeBudget === 2);
        assert("trade is not taken up front", Game.getPlayer(tSt, tMe.id).trade.growth === 2);
        // applyAction mutates and returns the same state, so each branch needs
        // its own run of the sequence rather than a second call on tSt.
        const within = Game.applyAction(tSt, { type: "PLAY_GROWTH_REINFORCE", payload: {
          playerId: tMe.id, hexKeys: ["1,0", "0,1", "-1,1"], tradeSpent: 2 } });
        assert("3 reinforcements use only the printed allowance, costing no trade",
          Game.getPlayer(within, tMe.id).trade.growth === 2,
          Game.getPlayer(within, tMe.id).trade.growth);
        let bSt2 = sanitation(2, 4).st;
        const bMe2 = bSt2.players[0];
        bSt2 = Game.applyAction(bSt2, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: bMe2.id, hexKey: "1,0", district: "campus", tradeSpent: 2 } });
        const beyond = Game.applyAction(bSt2, { type: "PLAY_GROWTH_REINFORCE", payload: {
          playerId: bMe2.id, hexKeys: ["1,0", "0,1", "-1,1", "-1,0", "0,-1"], tradeSpent: 2 } });
        assert("going past it charges exactly the 2 extra trade",
          Game.getPlayer(beyond, bMe2.id).trade.growth === 0,
          Game.getPlayer(beyond, bMe2.id).trade.growth);
        assert("and all five markers really are reinforced",
          ["1,0", "0,1", "-1,1", "-1,0", "0,-1"].every((k) => beyond.map.hexes[k].control.fortified));
        // Both printed paragraphs are driven and the board asserted after each:
        // the district is placed, the "then reinforce up to this slot's number"
        // step runs as its own allowance, stopping under the maximum is legal,
        // the new district is itself a legal target, and trade is charged only
        // for reinforcements beyond the printed ones.
        proves("standard.growth.sanitation");
      }

      {
        // A half-resolved card blocks every other action "until it finishes".
        // Undo therefore has to be reachable from inside one, or a step that
        // cannot complete is a dead match. The checkpoint predates the card,
        // so restoring it clears the resolution with everything else.
        //
        // applyAction mutates the state it is given, so each scenario builds
        // its own board rather than branching off a shared one.
        const armedSanitation = () => {
          const st = rulesState();
          const p = st.players[0];
          p.cardPlayed = false;
          p.cardTiers.growth = 3;
          p.cardLevels.growth = 3;
          p.focusRow = ["science", "economy", "culture", "growth", "industry", "military"];
          p.trade.growth = 2;
          Object.keys(st.map.hexes).forEach((k) => activate(st, k));
          activate(st, "0,0", { city: { ownerId: p.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          activate(st, "1,0");
          ["0,1", "-1,1"].forEach((k) => activate(st, k, { control: { ownerId: p.id, fortified: false, district: null } }));
          // Arm the checkpoint the way the start of a real turn does.
          return { st: Game.applyAction(st, { type: "END_FOCUS_CARD", payload: { playerId: "nobody" } }), me: p };
        };
        const { st: armed, me } = armedSanitation();
        const mid = Game.applyAction(armed, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: me.id, hexKey: "1,0", district: "campus", tradeSpent: 2 } });
        assert("mid-sequence, a reinforcement step is open",
          mid.cardResolution && mid.cardResolution.step === "growth_reinforce");
        const ctx = { actorId: me.id };
        assert("an unrelated focus action is correctly refused mid-sequence",
          Game.getActionPermission(mid, { type: "PLAY_SCIENCE", payload: {} }, ctx).code === "card_resolution_pending");
        assert("but UNDO_TURN is not refused by that guard",
          Game.getActionPermission(mid, { type: "UNDO_TURN", payload: {} }, ctx).ok,
          Game.getActionPermission(mid, { type: "UNDO_TURN", payload: {} }, ctx).code);
        assert("and undo reports itself available", Game.getUndoStatus(mid, me.id).canUndo,
          Game.getUndoStatus(mid, me.id).reason);
        const back = Game.applyAction(mid, { type: "UNDO_TURN", payload: { playerId: me.id } });
        assert("undo clears cardResolution, not just the board", !back.cardResolution);
        assert("undo takes the district back off the map", !back.map.hexes["1,0"].control);
        assert("undo restores the growth trade", Game.getPlayer(back, me.id).trade.growth === 2);
        assert("undo restores the unplayed card", Game.getPlayer(back, me.id).cardPlayed === false);
        assert("no pending choice survives the undo", (back.pendingChoices || []).length === 0);
        assert("and ordinary play is immediately possible again",
          Game.getActionPermission(back, { type: "PLAY_SCIENCE", payload: {} }, ctx).ok);

        // Undo before anything is placed leaves an ordinary, playable turn.
        const early = armedSanitation();
        assert("undo before the district still leaves the card playable",
          Game.getActionPermission(
            Game.applyAction(early.st, { type: "UNDO_TURN", payload: { playerId: early.me.id } }),
            { type: "PLAY_GROWTH_DISTRICT", payload: {} }, { actorId: early.me.id }
          ).code !== "card_resolution_pending");

        // A finished card is undoable too.
        const fin = armedSanitation();
        const done = Game.applyAction(
          Game.applyAction(fin.st, { type: "PLAY_GROWTH_DISTRICT", payload: {
            playerId: fin.me.id, hexKey: "1,0", district: "campus", tradeSpent: 0 } }),
          { type: "PLAY_GROWTH_REINFORCE", payload: { playerId: fin.me.id, hexKeys: ["0,1"], tradeSpent: 0 } });
        assert("the whole sequence completed", !done.cardResolution &&
          Game.getPlayer(done, fin.me.id).cardPlayed === true);
        const rolled = Game.applyAction(done, { type: "UNDO_TURN", payload: { playerId: fin.me.id } });
        assert("a completed growth card is still undoable",
          !rolled.map.hexes["1,0"].control && Game.getPlayer(rolled, fin.me.id).cardPlayed === false);

        // An open sequence always has an exit — no focus card may soft-lock.
        const esc = armedSanitation();
        let escape = Game.applyAction(esc.st, { type: "PLAY_GROWTH_DISTRICT", payload: {
          playerId: esc.me.id, hexKey: "1,0", district: "campus", tradeSpent: 0 } });
        assert("the escape scenario really is mid-sequence", !!escape.cardResolution);
        let guard = 0;
        while (escape.cardResolution && guard++ < 5) {
          escape = Game.applyAction(escape, { type: "END_FOCUS_CARD", payload: {
            playerId: esc.me.id, cardType: "growth", tradeSpent: 0 } });
        }
        assert("END_FOCUS_CARD always terminates an open sequence", !escape.cardResolution, guard);
        assert("after which the turn can be ended",

        assert("Amundsen: a rim site exists on an open board",
          Game.amundsenSites(openBoard.st, openBoard.me.id).length > 0);
        assert("Amundsen: the build is permitted when it can be resolved",
          Game.getActionPermission(openBoard.st,
            { type: "PLAY_INDUSTRY_WONDER", payload: { hexKey: "0,0", ...pay } },
            { actorId: openBoard.me.id }).ok);

        const closedBoard = amundsenBoard(false);
        assert("Amundsen: no rim site means no rim site",
          Game.amundsenSites(closedBoard.st, closedBoard.me.id).length === 0);
        const refusal = Game.getActionPermission(closedBoard.st,
          { type: "PLAY_INDUSTRY_WONDER", payload: { hexKey: "0,0", ...pay } },
          { actorId: closedBoard.me.id });
        assert("Amundsen: the build is REFUSED when it cannot be resolved",
          !refusal.ok && refusal.code === "amundsen_no_rim_city", JSON.stringify(refusal));

        // Nothing irreversible may happen on the impossible board.
        const before = {
          trade: closedBoard.me.trade.industry,
          mercury: closedBoard.me.resources.mercury,
          revealed: closedBoard.st.wonderDecks.science.revealed,
          deckLen: closedBoard.st.wonderDecks.science.deck.length
        };
        const tried = Game.tryApplyAction(closedBoard.st,
          { type: "PLAY_INDUSTRY_WONDER", payload: { hexKey: "0,0", ...pay } },
          { actorId: closedBoard.me.id, role: "player" });
        assert("Amundsen: the transaction is refused rather than half-applied",
          tried.accepted === false && tried.code === "amundsen_no_rim_city", JSON.stringify(tried.code));
        assert("Amundsen: no production, no reveal, no placement",
          Game.getPlayer(tried.state, closedBoard.me.id).trade.industry === before.trade &&
          Game.getPlayer(tried.state, closedBoard.me.id).resources.mercury === before.mercury &&
          tried.state.wonderDecks.science.revealed === before.revealed &&
          tried.state.wonderDecks.science.deck.length === before.deckLen &&
          !tried.state.map.hexes["0,0"].city.hasWonder);

        // And the resolvable board still works all the way through.
        const built = Game.applyAction(openBoard.st, { type: "PLAY_INDUSTRY_WONDER",
          payload: { playerId: openBoard.me.id, hexKey: "0,0", ...pay } });
        const site = (built.pendingChoices || []).find((c) => c.kind === "amundsen_site");
        assert("Amundsen: building it asks where its own city goes", !!site);
        if (site) {
          const target = site.hexKeys[0];
          const done = Game.applyAction(built, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: openBoard.me.id, choiceId: site.id, hexKey: target } });
          assert("Amundsen: a city is founded on the rim and holds the wonder",
            done.map.hexes[target].city && done.map.hexes[target].city.wonder &&
            done.map.hexes[target].city.wonder.name === AM, target);
          assert("Amundsen: it no longer sits in the city it was bought from",
            !done.map.hexes["0,0"].city.wonder && !done.map.hexes["0,0"].city.hasWonder);
          assert("Amundsen: the 2 control tokens follow it",
            (done.pendingChoices || []).some((c) => c.source === AM && c.kind === "place_control"));
        }
        // The whole card: it founds its own rim city, the wonder ends up in
        // THAT city and not the one it was bought from, the follow-up tokens
        // are offered, and a board that cannot host it refuses the purchase
        // outright rather than half-applying it.
        proves("wonder.science.amundsen_scott_research_station");
      }

      summary.textContent = `${passed} passed, ${failed} failed`;
    } catch (err) {
      failed++;
      const li = document.createElement("li");
      li.className = "fail";
      li.textContent = `ERROR: ${err.stack || err.message}`;
      results.appendChild(li);
      summary.textContent = `${passed} passed, ${failed} failed`;
    }
    // Handed to tools/coverage-matrix.js. A proof declared while the suite was
    // already red is dropped here rather than at declaration time, because a
    // later failure invalidates an earlier claim just as much.
    window.__CIV_PROOFS__ = {
      passed, failed,
      proofErrors,
      proofs: failed ? [] : PROOFS
    };
  </script>
