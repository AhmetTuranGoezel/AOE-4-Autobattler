          me.caravans = [{ id: "c1", position: "0,0" }, { id: "c2", position: "0,0" }];
          const s1 = act(st, "PLAY_ECONOMY", { playerId: me.id, unitId: "c1",
            toKey: "2,0", tradeSpent: 0 }).state;
          const stopped = act(s1, "END_UNIT_MOVE", { playerId: me.id, unitId: "c1" }).state;
          const second = act(stopped, "PLAY_ECONOMY", { playerId: me.id, unitId: "c2",
            toKey: "1,0", tradeSpent: 0 });
          assert("the second caravan still gets its own move", second.accepted, second.code);
          assert("and moves", second.state.players[0].caravans[1].position === "1,0");
          proves("standard.economy.currency");
        }

        // ── Sumeria: one resource per defeated barbarian, by every route ──
        {
          const { st, me } = currencyBoard("sumeria");
          const out = act(st, "PLAY_ECONOMY", { playerId: me.id, unitId: "c1",
            toKey: "2,0", tradeSpent: 0 });
          assert("Currency resolves for Sumeria", out.accepted, out.code);
          const gains = resourceChoices(out.state);
          assert("defeating a barbarian with Currency pays Sumeria its resource",
            gains.length === 1,
            JSON.stringify((out.state.pendingChoices || []).map((c) => c.kind)));
          assert("Currency still owes no trade token, because the card denies it",
            !out.state.pendingBarbReward);
          const took = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: me.id, choiceId: gains[0].id, optionId: "marble" } });
          assert("and the chosen resource really arrives",
            took.players[0].resources.marble === 1, String(took.players[0].resources.marble));
          assert("exactly once - the offer is gone", resourceChoices(took).length === 0);
        }
        {
          const { st, me } = currencyBoard();
          const out = act(st, "PLAY_ECONOMY", { playerId: me.id, unitId: "c1",
            toKey: "2,0", tradeSpent: 0 });
          assert("a player who is not Sumeria gains nothing from the same defeat",
            resourceChoices(out.state).length === 0);
        }
        {
          // Combat, the route that always worked - it must still pay once, and
          // must still pay the trade token as well ("in addition to").
          const attempt = () => {
            const st = rulesState();
            const me = st.players[0];
            me.leaderId = "sumeria";
            me.cardPlayed = false;
            st.turn.index = st.turn.order.indexOf(me.id);
            activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
              developed: false, hasWonder: false, wonder: null } });
            Object.values(st.map.hexes).forEach((h) => { h.barbarian = false; h.barbarianId = null; });
            activate(st, "1,0", { terrain: "grass", barbarian: true, barbarianId: "B1" });
            me.armies = [{ id: "a1", position: "0,0" }];
            let s = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
              playerId: me.id, unitId: "a1", fromKey: "0,0", toKey: "1,0",
              targetType: "barbarian" } });
            if (!s.combat) return null;
            s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "attacker" } });
            s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: me.id, side: "defender", hostOverride: true } });
            s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: me.id, side: "attacker" } });
            s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: me.id, side: "defender", hostOverride: true } });
            return s.map.hexes["1,0"].barbarian === false ? s : null;
          };
          // The dice decide who wins, so this retries until the attacker does.
          // What is under test is the reward, not the roll.
          let won = null;
          for (let i = 0; i < 400 && !won; i++) won = attempt();
          assert("an army can win a fight against a barbarian", !!won);
          if (won) {
            assert("winning it pays Sumeria one resource, exactly once",
              resourceChoices(won).length === 1,
              JSON.stringify((won.pendingChoices || []).map((c) => c.kind)));
            assert("and the trade token as well - Sumeria gains it IN ADDITION",
              !!won.pendingBarbReward && won.pendingBarbReward.playerId === won.players[0].id);
          }
        }
        {
          // The encampment strike, the third route.
          const st = rulesState();
          const me = st.players[0];
          me.leaderId = "sumeria";
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          activate(st, "1,0", { terrain: "grass",
            control: { ownerId: me.id, fortified: false, district: "encampment" } });
          Object.values(st.map.hexes).forEach((h) => { h.barbarian = false; h.barbarianId = null; });
          activate(st, "2,0", { terrain: "grass", barbarian: true, barbarianId: "B1" });
          Game.resolveEvent(st, "district_event");
          const strike = (st.pendingChoices || []).find((c) => c.kind === "encampment_strike");
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: strike.id, hexKey: "2,0" } });
          assert("an encampment defeating a barbarian pays Sumeria too",
            resourceChoices(out).length === 1,
            JSON.stringify((out.pendingChoices || []).map((c) => c.kind)));
          assert("with the trade token alongside it", !!out.pendingBarbReward);
          proves("civ.sumeria");
        }
      }

      {
        // Base p13: a city is mature while every active land space around it
        // holds its owner's control token. Maturity used to be a cached flag
        // refreshed only by the actions that remembered to ask, so every other
        // way of losing a ring token left the city "mature" for the rest of the
        // game. These drive the losses that had no refresh between them.
        const RING = ["1,0", "-1,0", "0,1", "0,-1", "1,-1", "-1,1"];
        const ringed = () => {
          const st = rulesState();
          const me = st.players[0];
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          RING.forEach((k) => activate(st, k, {
            control: { ownerId: me.id, fortified: false, district: null } }));
          return { st, me };
        };

        {
          const { st, me } = ringed();
          assert("a fully ringed capital is mature",
            Game.countDeveloped(st, me.id) === 1, String(Game.countDeveloped(st, me.id)));
          const scoreWhileMature = Game.computeScore(st, me.id);
          // Exactly what a barbarian raid leaves behind: one marker gone.
          st.map.hexes["0,1"].control = null;
          assert("losing one ring token ends maturity immediately",
            Game.countDeveloped(st, me.id) === 0, String(Game.countDeveloped(st, me.id)));
          // Three points: one for the control token itself, two for the
          // maturity it was holding up. Comparing within one state rather than
          // against a second generated map, whose terrain would differ.
          assert("and the city stops scoring as mature",
            Game.computeScore(st, me.id) === scoreWhileMature - 3,
            scoreWhileMature + " -> " + Game.computeScore(st, me.id));
          st.map.hexes["0,1"].control = { ownerId: me.id, fortified: false, district: null };
          assert("replacing the token makes it mature again",
            Game.countDeveloped(st, me.id) === 1);
        }
        {
          // A rival taking one ring space is the Forbidden City / Eiffel Tower
          // shape: the token is still there, but it is no longer yours.
          const { st, me } = ringed();
          st.map.hexes["1,-1"].control = {
            ownerId: st.players[1].id, fortified: false, district: null };
          assert("a ring space changing hands ends maturity too",
            Game.countDeveloped(st, me.id) === 0, String(Game.countDeveloped(st, me.id)));
        }
        {
          // A barbarian march is the case that had no refresh at all: the raid
          // destroys the marker inside resolveEvent, far from any action that
          // used to call checkDevelopment.
          const { st, me } = ringed();
          const raided = "0,-1";
          st.map.hexes[raided].control = null;
          Game.resolveEvent(st, "barbarian_move");
          assert("maturity is recomputed after an event, not only after an action",
            Game.countDeveloped(st, me.id) === 0, String(Game.countDeveloped(st, me.id)));
          assert("and the mirror the UI reads agrees with the rule",
            st.map.hexes["0,0"].city.developed === false,
            String(st.map.hexes["0,0"].city.developed));
        }
        {
          // The mirror must also be repaired for a state that arrives stale -
          // an old save, or a peer running an older build.
          const { st, me } = ringed();
          st.map.hexes["-1,1"].control = null;
          st.map.hexes["0,0"].city.developed = true;          // a lie from an old save
          // Deliberately an action no reducer handles: the repair lives in the
          // applyAction wrapper, not in any one handler, so even a no-op fixes
          // it. That is what stops the flag drifting again.
          const out = Game.applyAction(st, { type: "NO_SUCH_ACTION", payload: {} });
          assert("a stale developed flag is corrected on the next action",
            out.map.hexes["0,0"].city.developed === false,
            String(out.map.hexes["0,0"].city.developed));
        }
      }

      {
        // Terra p9, the printed district effects, end to end. Four of the five
        // were wrong: three are a CHOICE of one of two options and were fused
        // into a single always-on effect, the "friendly space" test was
        // missing, the counts left out the district's own space, and the
        // industrial zone carried an invented cap of 3.
        //
        // Each district's scenarios are kept together and the proof is claimed
        // once, at the end, so that proves("district.x") stands for every
        // printed option of that card rather than for whichever half happened
        // to be tested last.
        //
        // `setUp` runs with the state already built, so fixtures can name the
        // owning player without referring to a binding that does not exist yet.
        const mk = (kind, setUp) => {
          const st = rulesState();
          const me = st.players[0];
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
          activate(st, "1,0", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: kind } });
          if (setUp) setUp(st, me);
          return { st, me };
        };
        const mine = (id) => ({ ownerId: id, fortified: false, district: null });
        const pick = (st, kind) => (st.pendingChoices || []).find((c) => c.kind === kind);
        const mode = (st) => pick(st, "district_mode");
        // The capital at 0,0 is ringed by these; 1,0 is the district itself.
        const RING = ["1,0", "-1,0", "0,1", "0,-1", "1,-1", "-1,1"];

        // -- Campus ------------------------------------------------------
        {
          // "...one science trade token for each FRIENDLY space with a mountain
          // or natural wonder that is IN OR ADJACENT to your campus."
          const { st, me } = mk("campus", (s2, p2) => {
            s2.map.hexes["1,0"].terrain = "mountain";                            // its own space
            activate(s2, "2,0",  { terrain: "mountain", control: mine(p2.id) }); // friendly mountain
            // A natural wonder SPACE: the token itself was taken when the
            // control marker went down, which is exactly the state a friendly
            // natural wonder space is always in.
            activate(s2, "1,-1", { terrain: "grass", naturalWonderSpace: "Mt Kilimanjaro",
                                   control: mine(p2.id) });                      // friendly wonder
            activate(s2, "2,-1", { terrain: "mountain" });                       // nobody's
          });
          assert("the campus starts with no science trade", me.trade.science === 0);
          Game.resolveEvent(st, "district_event");
          assert("the campus asks nothing: it has one printed effect, not a choice",
            !(st.pendingChoices || []).some((c) => c.districtKind === "campus"));
          assert("it pays for its own space, a friendly mountain and a friendly natural wonder",
            st.players[0].trade.science === 3, String(st.players[0].trade.science));
          const report = (st.districtReport || []).find((r) => r.district === "campus");
          assert("and it names the three spaces that paid",
            !!report && report.paid.slice().sort().join(" ") === "1,-1 1,0 2,0",
            report && report.paid.join(" "));
          assert("a mountain nobody owns pays nothing, however close it sits",
            !!report && report.paid.indexOf("2,-1") === -1 &&
            report.nearMisses.indexOf("2,-1") !== -1, report && JSON.stringify(report));
          proves("district.campus");
        }

        // -- Commercial Hub ----------------------------------------------
        {
          // Option one: "...for each of your MATURE cities", and the tokens go
          // on ANY card in your focus row, so the player picks.
          const { st, me } = mk("trade", (s2, p2) => {
            RING.filter((k) => k !== "1,0").forEach((k) => activate(s2, k, { control: mine(p2.id) }));
          });
          me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          assert("the fixture capital really is mature", Game.countDeveloped(st, me.id) === 1,
            String(Game.countDeveloped(st, me.id)));
          Game.resolveEvent(st, "district_event");
          const m = mode(st);
          assert("the commercial hub offers both printed options",
            !!m && m.options.map((o) => o.id).sort().join(",") === "cities,desert",
            m && m.options.map((o) => o.id).join(","));
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: m.id, optionId: "cities" } });
          const any = pick(out, "trade_any");
          assert("it owes one trade token per mature city", !!any && any.amount === 1,
            any && String(any.amount));
          assert("and the token may go on ANY focus card", !!any && any.options.length >= 6,
            any && String(any.options.length));
          const before = out.players[0].trade.military;
          const paid = Game.applyAction(out, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: any.id, optionId: "military" } });
          assert("the card the player names gains the token",
            paid.players[0].trade.military === before + 1,
            String(paid.players[0].trade.military));
        }
        {
          // Option two: "...on your ECONOMY focus card for each friendly space
          // with a desert that is in or adjacent to" - a fixed card, no prompt.
          const { st, me } = mk("trade", (s2, p2) => {
            s2.map.hexes["1,0"].terrain = "desert";                            // its own space
            activate(s2, "2,0",  { terrain: "desert", control: mine(p2.id) }); // friendly
            activate(s2, "1,-1", { terrain: "desert" });                       // nobody's
          });
          assert("the hub starts with no economy trade", me.trade.economy === 0);
          Game.resolveEvent(st, "district_event");
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: mode(st).id, optionId: "desert" } });
          assert("its own space and the friendly desert each pay one economy trade",
            out.players[0].trade.economy === 2, String(out.players[0].trade.economy));
          assert("so the desert nobody owns paid nothing",
            out.players[0].trade.economy === 2);
          assert("and this option names the card, so nothing is asked",
            !pick(out, "trade_any"));
          proves("district.trade");
        }

        // -- Encampment --------------------------------------------------
        {
          // Terra p9: "Defeat a barbarian OR RIVAL ARMY within two spaces of
          // your encampment." The rival-army half was missing entirely.
          const { st, me } = mk("encampment");
          const foe = st.players[1];
          activate(st, "2,0", { terrain: "grass" });
          foe.armies = [{ id: "e1", position: "2,0" }];
          Game.resolveEvent(st, "district_event");
          const strike = pick(st, "encampment_strike");
          assert("an encampment can strike a rival army", !!strike && strike.hexKeys.includes("2,0"),
            JSON.stringify((st.pendingChoices || []).map((c) => c.kind)));
          const hit = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: strike.id, hexKey: "2,0" } });
          assert("and the army is defeated back onto its card",
            hit.players[1].armies[0].position === null);
          assert("a defeated ARMY pays no barbarian trade token", !hit.pendingBarbReward);
        }
        {
          // "Defeat A barbarian or A rival army" is one piece. A space can hold
          // several figures, and the old code nulled every army the first
          // matching player had standing there - three figures for one district.
          const { st, me } = mk("encampment");
          const foe = st.players[1];
          activate(st, "2,0", { terrain: "grass" });
          foe.armies = [{ id: "e1", position: "2,0" }, { id: "e2", position: "2,0" }];
          Game.resolveEvent(st, "district_event");
          const step = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: pick(st, "encampment_strike").id, hexKey: "2,0" } });
          const which = pick(step, "encampment_pick");
          assert("two armies on one space make the encampment name its target",
            !!which && which.options.length === 2, which && JSON.stringify(which.options));
          const out = Game.applyAction(step, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: which.id, optionId: which.options[0].id } });
          assert("exactly one army is defeated",
            out.players[1].armies.filter((u) => u.position === "2,0").length === 1,
            JSON.stringify(out.players[1].armies));
          assert("and it is the one that was named",
            out.players[1].armies.find((u) => u.id === "e1").position === null);
        }
        {
          // "If a barbarian is defeated, place one trade token on any card in
          // your focus row" - a trade token, not a resource.
          const { st, me } = mk("encampment");
          me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          activate(st, "2,0", { terrain: "grass", barbarian: true, barbarianId: "Z" });
          const resourcesBefore = JSON.stringify(me.resources);
          Game.resolveEvent(st, "district_event");
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: pick(st, "encampment_strike").id, hexKey: "2,0" } });
          assert("an encampment can defeat a barbarian", out.map.hexes["2,0"].barbarian === false);
          assert("and that owes a trade token",
            !!out.pendingBarbReward && out.pendingBarbReward.playerId === me.id);
          const paid = Game.applyAction(out, { type: "ADD_TRADE", payload: {
            playerId: me.id, cardType: "culture" } });
          assert("which goes on any card in the focus row",
            paid.players[0].trade.culture === 1, String(paid.players[0].trade.culture));
          assert("and is a trade token, not a resource",
            JSON.stringify(paid.players[0].resources) === resourcesBefore,
            JSON.stringify(paid.players[0].resources));
        }
        {
          // The second half: "reinforce a control token within two spaces." A
          // district IS a control token, so an unreinforced encampment is
          // within two spaces of itself and may flip its own token. That falls
          // out of the range being inclusive; it is not a special case.
          const { st, me } = mk("encampment");
          Game.resolveEvent(st, "district_event");
          const rf = (st.pendingChoices || []).find((c) =>
            c.kind === "reinforce" && c.source === "encampment");
          assert("an unreinforced encampment is a legal target for its own reinforcement",
            !!rf && rf.hexKeys.includes("1,0"), rf && rf.hexKeys.join(" "));
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: rf.id, hexKey: "1,0" } });
          assert("and reinforcing it flips its own token",
            out.map.hexes["1,0"].control.fortified === true);
          assert("without ceasing to be a district",
            out.map.hexes["1,0"].control.district === "encampment");
        }
        {
          // Terra p9: "resolve EITHER OR BOTH" - so both are offered, neither
          // is compulsory, and declining one leaves the other standing.
          const { st, me } = mk("encampment");
          const foe = st.players[1];
          activate(st, "2,0", { terrain: "grass" });
          foe.armies = [{ id: "e1", position: "2,0" }];
          Game.resolveEvent(st, "district_event");
          const offered = (st.pendingChoices || []).filter((c) => c.source === "encampment");
          assert("both halves are offered at once", offered.length === 2,
            JSON.stringify(offered.map((c) => c.kind)));
          assert("and neither is compulsory", offered.every((c) => c.optional === true));
          const afterSkip = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: pick(st, "encampment_strike").id, dismiss: true } });
          assert("declining the strike spares the army",
            afterSkip.players[1].armies[0].position === "2,0");
          const rf = (afterSkip.pendingChoices || []).find((c) =>
            c.kind === "reinforce" && c.source === "encampment");
          assert("and the reinforcement is still on offer", !!rf);
          const only = Game.applyAction(afterSkip, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: rf.id, hexKey: "1,0" } });
          assert("so one half can be taken without the other",
            only.map.hexes["1,0"].control.fortified === true &&
            only.players[1].armies[0].position === "2,0");
          proves("district.encampment");
        }

        // -- Industrial Zone ---------------------------------------------
        {
          // Option one: "...for each FRIENDLY space with a forest that is IN OR
          // ADJACENT to your industrial zone's space." Four friendly forests,
          // one of them the district's own space, and one unowned forest that
          // must not pay.
          const { st, me } = mk("industrial", (s2, p2) => {
            activate(s2, "1,-1", { terrain: "forest", control: mine(p2.id) });
            activate(s2, "2,0",  { terrain: "forest", control: mine(p2.id) });
            activate(s2, "2,-1", { terrain: "forest", control: mine(p2.id) });
            activate(s2, "1,1",  { terrain: "forest" });          // nobody's: worth nothing
            s2.map.hexes["1,0"].terrain = "forest";               // its own space counts
          });
          Game.resolveEvent(st, "district_event");
          const m = mode(st);
          assert("the industrial zone asks which effect", !!m);
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: m.id, optionId: "forest" } });
          // Three friendly neighbours plus the district's own space is 4. The
          // count is read off the log rather than the card, because base p13
          // caps a focus card at three trade tokens - that cap is real and
          // would hide the difference between the printed count and the old
          // hard-coded Math.min(3, ...), which is the thing under test.
          assert("it counts friendly forests in AND adjacent, with no cap of 3",
            out.log.some((line) => /\+4 industry trade \(industrial zone forests\)/.test(line)),
            JSON.stringify(out.log.slice(-3)));
          assert("and the card itself still stops at three tokens (base p13)",
            out.players[0].trade.industry === 3, String(out.players[0].trade.industry));
        }
        {
          // Option two: "Discard three trade tokens from your industry focus
          // card to build a city..." - three exactly, and not on credit.
          const { st, me } = mk("industrial");
          me.trade.industry = 2;
          Game.resolveEvent(st, "district_event");
          const low = mode(st).options.find((o) => o.id === "city");
          assert("with two industry trade the build option is refused",
            !!low && low.disabled, JSON.stringify(mode(st).options));
        }
        {
          const { st, me } = mk("industrial");
          me.trade.industry = 3;
          Game.resolveEvent(st, "district_event");
          const m = mode(st);
          const cityOpt = m.options.find((o) => o.id === "city");
          assert("with three industry trade the build option is available",
            !!cityOpt && !cityOpt.disabled, JSON.stringify(m.options));
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: m.id, optionId: "city" } });
          assert("it discards exactly three industry trade tokens",
            out.players[0].trade.industry === 0, String(out.players[0].trade.industry));
          const build = pick(out, "build_city");
          assert("and asks where the city goes", !!build && build.hexKeys.length > 0);
          const spot = build.hexKeys[0];
          const built = Game.applyAction(out, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: build.id, hexKey: spot } });
          assert("a city really is built there",
            !!built.map.hexes[spot].city && built.map.hexes[spot].city.ownerId === me.id,
            JSON.stringify(built.map.hexes[spot].city));
          proves("district.industrial");
        }

        // -- Theater Square ----------------------------------------------
        {
          // Option one: "Place one control token in a space within two spaces
          // of this district."
          const { st, me } = mk("theater");
          activate(st, "2,0", { terrain: "grass" });
          Game.resolveEvent(st, "district_event");
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: mode(st).id, optionId: "near" } });
          const spots = pick(out, "place_control");
          assert("the near option reaches spaces within two of the district",
            !!spots && spots.hexKeys.includes("2,0"), spots && spots.hexKeys.join(" "));
          const placed = Game.applyAction(out, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: spots.id, hexKey: "2,0" } });
          const token = placed.map.hexes["2,0"].control;
          assert("and a control token is placed there",
            !!token && token.ownerId === me.id, JSON.stringify(token));
          // A district is a control token, but a control token is not a
          // district: the theater places the plain side of one.
          assert("placing a control token does NOT create a district",
            !!token && !token.district, JSON.stringify(token));
          assert("and the new token is unreinforced", !!token && token.fortified === false);
        }
        {
          // Option two: "Place one control token in a space within two spaces
          // of a friendly city that has a wonder" - missing entirely.
          const { st, me } = mk("theater");
          activate(st, "4,0", { terrain: "grass", city: {
            ownerId: me.id, isCapital: false, developed: false, hasWonder: true, wonder: { name: "Stonehenge" } } });
          activate(st, "5,0", { terrain: "grass" });
          Game.resolveEvent(st, "district_event");
          const m = mode(st);
          assert("the theater square offers both printed options",
            !!m && m.options.map((o) => o.id).sort().join(",") === "near,wonder",
            m && m.options.map((o) => o.id).join(","));
          const out = Game.applyAction(st, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: m.id, optionId: "wonder" } });
          const spots = pick(out, "place_control");
          assert("and the wonder option reaches spaces near the wonder city",
            !!spots && spots.hexKeys.includes("5,0"),
            spots ? spots.hexKeys.join(" ") : "none");
          const placed = Game.applyAction(out, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: me.id, choiceId: spots.id, hexKey: "5,0" } });
          assert("and the token is placed there",
            !!placed.map.hexes["5,0"].control &&
            placed.map.hexes["5,0"].control.ownerId === me.id);
          proves("district.theater");
        }

        // -- The token itself --------------------------------------------
        {
          // Terra p9: one physical token of each district type per player.
          // Board state is the source of truth, so destroying a district
          // returns its type to the supply with no second inventory to drift.
          const { st, me } = mk("encampment");
          const free = Game.availableDistrictTypes(st, me.id);
          assert("the encampment on the board is out of that player's supply",
            free.indexOf("encampment") === -1, free.join(" "));
          assert("and the other four are still available", free.length === 4, free.join(" "));
          st.map.hexes["1,0"].control = null;
          assert("destroying it returns the token to the supply",
            Game.availableDistrictTypes(st, me.id).length === 5);
        }
        {
          // Terra p9: a district goes down on its UNREINFORCED side even when
          // it replaces a reinforced control token of yours.
          const { st, me } = mk("campus", (s2, p2) => {
            activate(s2, "0,1", { terrain: "grass",
              control: { ownerId: p2.id, fortified: true, district: null } });
          });
          me.focusRow = ["growth", "science", "culture", "economy", "military", "industry"];
          me.cardPlayed = false;
          assert("the space really does hold a reinforced token first",
            st.map.hexes["0,1"].control.fortified === true);
          const out = Game.tryApplyAction(st, { type: "PLAY_GROWTH_DISTRICT", payload: {
            playerId: me.id, district: "trade", hexKey: "0,1", tradeSpent: 0
          } }, { actorId: me.id, role: "player" });
          assert("a district can be built over it", out.accepted, out.code);
          if (out.accepted) {
            const token = out.state.map.hexes["0,1"].control;
            assert("the district token is on the space", !!token && token.district === "trade",
              JSON.stringify(token));
            assert("and it lands unreinforced, discarding the flipped side underneath",
              token.fortified === false, JSON.stringify(token));
          }
        }
      }

      {
        // Base p16: "After barbarians move, if a space contains more than one
        // barbarian, roll a die and move one of those barbarians in the rolled
        // direction. Repeat until no space contains more than one barbarian."
        //
        // The old code refused the move instead, so a barbarian whose target
        // space was held by one that could not move just stood still. Set up
        // exactly that: a reinforced marker stops the leader, and the follower
        // must NOT simply stay put.
        const base = rulesState();
        const me = base.players[0];
        for (let q = 0; q <= 8; q++) activate(base, q + ",0", { terrain: "grass" });
        // Ring the lane with land so a pushed barbarian has somewhere to go.
        for (let q = 0; q <= 8; q++) {
          activate(base, q + ",-1", { terrain: "grass" });
          activate(base, q + ",1", { terrain: "grass" });
        }
        activate(base, "4,0", { terrain: "grass", control: { ownerId: me.id, fortified: true, district: null } });
        // Only these two on the board. rulesState() populates the map from the
        // tiles, and a stray setup barbarian marching into the same lane made
        // the outcome depend on where the shuffle had put it.
        Object.values(base.map.hexes).forEach((h) => { h.barbarian = false; h.barbarianId = null; });
        base.map.hexes["2,0"].barbarian = true; base.map.hexes["2,0"].barbarianId = "L";
        base.map.hexes["1,0"].barbarian = true; base.map.hexes["1,0"].barbarianId = "F";

        // Roll until the march goes east (face 2), so the leader at 2,0 is
        // stopped by the reinforced marker at 3,0... and the follower wants 2,0.
        activate(base, "3,0", { terrain: "grass", control: { ownerId: me.id, fortified: true, district: null } });
        let out = null;
        for (let i = 0; i < 500; i++) {
          const attempt = JSON.parse(JSON.stringify(base));
          Game.resolveEvent(attempt, "barbarian_move");
          if (attempt.barbarianMove && attempt.barbarianMove.roll === 2) { out = attempt; break; }
        }
        assert("the march rolled east at least once", !!out);
        if (out) {
          // rulesState() populates the map with setup barbarians too, so this
          // counts by id rather than by "how many are on the board".
          const at = (id) => Object.entries(out.map.hexes)
            .filter(([, h]) => h.barbarian && h.barbarianId === id).map(([k]) => k);
          assert("the leader is still on the board", at("L").length === 1, at("L").join(" "));
          assert("the follower is still on the board", at("F").length === 1, at("F").join(" "));
          assert("and they are not sharing a space", at("L")[0] !== at("F")[0],
            at("L")[0] + " vs " + at("F")[0]);
          // The rule says "move ONE of those barbarians" without saying which,
          // and the push direction is a fresh die - so where either one lands
          // is genuinely random and asserting a space would only pin the roll.
          // What must hold is the rule itself: a pile formed, a roll broke it
          // up, and no space is left holding two.
          assert("the pile was dispersed by a die roll",
            out.log.some((line) => /pushed/.test(line)),
            JSON.stringify(out.log.slice(-4)));
          assert("no space is left holding two barbarians",
            !out.log.some((line) => /stuck together/.test(line)),
            JSON.stringify(out.log.slice(-4)));
          assert("the reinforced marker stopped the advance",
            out.log.some((line) => /battered a reinforced control marker at 3,0/.test(line)),
            JSON.stringify(out.log.slice(-5)));
        }
      }

      {
        // Terra p10: "If an army attacks a space with a barbarian, the barbarian
        // must be the target." The fort was checked first, so a barbarian
        // standing on one was unattackable, the fort's 6 was used instead of the
        // space's difficulty, and the attacker could capture the fort out from
        // under a barbarian that was still standing there.
        const st = rulesState();
        const me = st.players[0];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        // Terra p11: "Fort spaces are treated as forests with a terrain
        // difficulty value of 3."
        activate(st, "1,0", { terrain: "forest", fortress: true, barbarian: true });
        const d = Game.findDefender(st, "1,0", me.id);
        assert("a barbarian on a fort is the target, not the fort", d && d.type === "barbarian", d && d.type);
        assert("and it defends with the space's difficulty, not the fort's 6",
          d && d.power === 3, d && d.power);
        assert("no choice of target is offered", Game.findDefenders(st, "1,0", me.id).length === 1);

        // The bare fort is still a 6 once the barbarian is gone.
        st.map.hexes["1,0"].barbarian = false;
        const bare = Game.findDefender(st, "1,0", me.id);
        assert("an empty fort still defends at 6", bare && bare.type === "fortress" && bare.power === 6);

        // Base p15 says the same for the other static defender.
        const cs = rulesState();
        activate(cs, "1,0", { terrain: "grass", cityState: { name: "Test State", type: "culture" }, barbarian: true });
        const csd = Game.findDefender(cs, "1,0", cs.players[0].id);
        assert("a barbarian on a city-state is the target too",
          csd && csd.type === "barbarian" && csd.power === 1, csd && (csd.type + "/" + csd.power));
      }

      {
        // The user's report was "place 2 control tokens, one lands, card spent".
        // The growth card used to place a district AND buy reinforcements in one
        // packet, silently dropping the illegal keys while charging the card.
        //
        // The card is now resolved as the printed sequence instead: the district
        // is placed and confirmed first, and the reinforcement step follows. So
        // the combined packet is refused outright rather than partly applied,
        // which is a stronger version of the same guarantee.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        me.trade.growth = 2;
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass" });                                        // the district's space
        activate(st, "0,1", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: null } });
        const play = (extra) => Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: Object.assign({ hexKey: "1,0", district: "campus", tradeSpent: 0 }, extra || {})
        }, { actorId: me.id, role: "player" });

        const legacy = play({ reinforceKeys: ["0,1"], tradeSpent: 1 });
        assert("the combined district+reinforce packet is refused",
          !legacy.accepted && legacy.code === "growth_sequence_required", legacy.code);
        assert("and nothing was placed or spent",
          !st.map.hexes["1,0"].control && !st.map.hexes["0,1"].control.fortified &&
          me.trade.growth === 2 && !me.cardPlayed);

        const forged = play({ tradeSpent: 99 });
        assert("a district cannot spend trade it does not have", !forged.accepted, forged.code);
        assert("and that refusal changed nothing either",
          !st.map.hexes["1,0"].control && me.trade.growth === 2);

        // The legal case still works, so the guard cannot pass by refusing all.
        const good = play({});
        assert("a district placement on its own is accepted", good.accepted, good.code);
        assert("the district is placed",
          good.accepted && good.state.map.hexes["1,0"].control.district === "campus");
        assert("and it goes down unreinforced (Terra p9)",
          good.accepted && good.state.map.hexes["1,0"].control.fortified === false);
        // Irrigation (tier I) prints only the placement, so it finishes here.
        assert("a tier I growth card is done once the district is down",
          good.accepted && !good.state.cardResolution);
      }

      {
        // Bug 11: Sanitation (III) and Globalization (IV) do NOT ask "reinforce
        // OR district" - they print both, so the card must keep resolving after
        // the district instead of being reset.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        me.cardTiers.growth = 3;
        assert("tier III growth is Sanitation", Game.getCardName(me, "growth") === "Sanitation");
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass" });
        activate(st, "0,1", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: null } });
        const out = Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: { hexKey: "1,0", district: "campus", tradeSpent: 0 }
        }, { actorId: me.id, role: "player" });
        assert("the district is placed", out.accepted, out.code);
        assert("and the card is still resolving its second printed effect",
          out.accepted && !!out.state.cardResolution &&
          out.state.cardResolution.cardType === "growth",
          JSON.stringify(out.state && out.state.cardResolution));
        assert("so the card is not reset yet",
          out.accepted && out.state.players[0].cardPlayed === false);
        const completed = out.accepted ? Game.tryApplyAction(out.state, {
          type: "PLAY_GROWTH_REINFORCE",
          payload: { hexKeys: ["0,1"], tradeSpent: 0 }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        assert("Sanitation finishes only after its reinforcement step",
          completed.accepted && !completed.state.cardResolution &&
          completed.state.players[0].cardPlayed &&
          completed.state.map.hexes["0,1"].control.fortified,
          completed.code);
      }

      {
        // Districts are physical tokens: one of each type per player, so a type
        // already on the map cannot be placed again by that player.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass", control: { ownerId: me.id, fortified: false, district: "campus" } });
        activate(st, "0,1", { terrain: "grass" });
        const again = Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: { hexKey: "0,1", district: "campus", tradeSpent: 0 }
        }, { actorId: me.id, role: "player" });
        assert("a second district of a type you already placed is refused",
          !again.accepted && again.code === "district_token_unavailable", again.code);
        assert("and the space stays empty", !st.map.hexes["0,1"].control);

        // A type still in hand is unaffected.
        const other = Game.tryApplyAction(st, {
          type: "PLAY_GROWTH_DISTRICT",
          payload: { hexKey: "0,1", district: "theater", tradeSpent: 0 }
        }, { actorId: me.id, role: "player" });
        assert("a district type still in hand can be placed", other.accepted, other.code);
      }

      {
        // Natural wonder tokens: claiming, spending, and conquest.
        //
        // Base rules: placing a control token on a natural wonder space TAKES
        // that token off the space and onto your leader sheet, and an attacker
        // who defeats the control token of the player holding one takes the
        // token from them. Ownership used to be read off the map - the token
        // stayed on the hex and whoever controlled the hex counted as having it
        // - which can express neither rule: the token is not on the board any
        // more, and losing the space is not the same as losing the token.
        //
        // Ownership is now explicit in st.naturalWonders, keyed by name, with
        // the space it came from kept as the token's stable identity.
        const owns = (st, playerId) => Game.getControlledNaturalWonders(st, playerId)
          .map((e) => e.name);

        // (A) A claim through a real Culture placement.
        const claim = () => {
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          // Culture resolves from the fifth place, so any printed terrain is
          // within reach and the fixture does not depend on what the space is.
          me.focusRow = ["science", "growth", "economy", "military", "industry", "culture"];
          // The map is dealt from the printed tiles, so clear whatever it
          // happened to deal: this test is about one named token.
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null;
            h.naturalWonder = null; h.naturalWonderSpace = null;
            if (h.resource === "wonder") h.resource = null;
          });
          st.naturalWonders = {};
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          activate(st, "1,0", { terrain: "grass", resource: "wonder",
            naturalWonder: "Mt Kilimanjaro", naturalWonderSpace: "Mt Kilimanjaro" });
          return { st, me };
        };
        {
          const { st, me } = claim();
          assert("the token starts on its space and nobody owns it",
            st.map.hexes["1,0"].naturalWonder === "Mt Kilimanjaro" &&
            owns(st, me.id).length === 0, JSON.stringify(owns(st, me.id)));
          const out = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
            playerId: me.id, hexKeys: ["1,0"], tradeSpent: 0 } },
            { actorId: me.id, role: "player" });
          assert("a control token can be placed on the natural wonder space",
            out.accepted, out.code);
          assert("and the control token is there",
            out.state.map.hexes["1,0"].control.ownerId === me.id);
          assert("the token is taken off the map",
            out.state.map.hexes["1,0"].naturalWonder === null,
            String(out.state.map.hexes["1,0"].naturalWonder));
          assert("and its space stops advertising a resource",
            out.state.map.hexes["1,0"].resource === null,
            String(out.state.map.hexes["1,0"].resource));
          assert("but the space is still printed as a natural wonder space",
            out.state.map.hexes["1,0"].naturalWonderSpace === "Mt Kilimanjaro");
          assert("the player now owns the token",
            owns(out.state, me.id).join(",") === "Mt Kilimanjaro",
            JSON.stringify(owns(out.state, me.id)));
          assert("and it is recorded as theirs, not as a thing on a hex",
            out.state.naturalWonders["Mt Kilimanjaro"].ownerId === me.id,
            JSON.stringify(out.state.naturalWonders["Mt Kilimanjaro"]));

          // Losing the space is not losing the token: it is on a leader sheet.
          const razed = Game.applyAction(JSON.parse(JSON.stringify(out.state)),
            { type: "NO_SUCH_ACTION", payload: {} });
          razed.map.hexes["1,0"].control = null;
          const after = Game.applyAction(razed, { type: "NO_SUCH_ACTION", payload: {} });
          assert("destroying the control token does not reach the leader sheet",
            owns(after, me.id).join(",") === "Mt Kilimanjaro",
            JSON.stringify(owns(after, me.id)));

          // ...and walking onto the emptied space later gains nobody anything,
          // because there is no token on it to pick up.
          after.map.hexes["1,0"].control =
            { ownerId: after.players[1].id, fortified: false, district: null };
          const late = Game.applyAction(after, { type: "NO_SUCH_ACTION", payload: {} });
          assert("taking the vacated space gains no token",
            owns(late, late.players[1].id).length === 0,
            JSON.stringify(owns(late, late.players[1].id)));
          assert("and the original owner still has it",
            owns(late, me.id).join(",") === "Mt Kilimanjaro");
        }

        // (C) The token keeps its printed resource identity, and spending it
        //     exhausts that token for the turn rather than consuming it.
        {
          const { st, me } = claim();
          const claimed = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
            playerId: me.id, hexKeys: ["1,0"], tradeSpent: 0 } },
            { actorId: me.id, role: "player" }).state;
          const held = Game.getControlledNaturalWonders(claimed, me.id);
          assert("an owned natural wonder exposes its printed resource",
            held.length === 1 && held[0].resource === "oil" && !held[0].usedThisTurn,
            JSON.stringify(held));
          assert("and is still addressed by the space it came from",
            held[0].hexKey === "1,0", held[0].hexKey);

          const player = claimed.players[0];
          player.cardPlayed = false;
          const deck = claimed.wonderDecks.military;
          deck.deck = ["Jebel Barkal"].concat(deck.deck.filter((n) => n !== "Jebel Barkal"));
          deck.revealed = "Jebel Barkal";
          const preview = Game.calculateWonderProduction(claimed, player, "Jebel Barkal", {
            tradeSpent: 0, resources: {}, naturalWonders: ["1,0"] });
          assert("a matching natural wonder contributes production",
            preview.ok && preview.production.naturalWonderResources === 1 && preview.affordable,
            JSON.stringify(preview));
          const byName = Game.calculateWonderProduction(claimed, player, "Jebel Barkal", {
            tradeSpent: 0, resources: {}, naturalWonders: ["Mt Kilimanjaro"] });
          assert("and can equally be named by the token itself",
            byName.ok && byName.production.naturalWonderResources === 1, JSON.stringify(byName));

          const built = Game.tryApplyAction(claimed, { type: "PLAY_INDUSTRY_WONDER", payload: {
            hexKey: "0,0", wonderName: "Jebel Barkal", tradeSpent: 0,
            resources: {}, naturalWonders: ["1,0"] } }, { actorId: me.id, role: "player" });
          assert("natural wonder production builds the eligible world wonder",
            built.accepted && built.state.map.hexes["0,0"].city.wonder.name === "Jebel Barkal",
            built.code);
          const afterUse = Game.getControlledNaturalWonders(built.state, me.id);
          assert("spending it exhausts the token for the turn without consuming it",
            afterUse.length === 1 && afterUse[0].usedThisTurn === true,
            JSON.stringify(afterUse));
          assert("and it is still off the map, where it has been since the claim",
            built.state.map.hexes["1,0"].naturalWonder === null);
          const duplicate = Game.calculateWonderProduction(built.state, built.state.players[0],
            "Jebel Barkal", { naturalWonders: ["1,0"] });
          assert("the same token cannot be spent twice in one turn",
            !duplicate.ok && duplicate.code === "natural_wonder_already_used", duplicate.code);
          built.state.turn.round++;
          assert("and it refreshes on a later turn",
            !Game.getControlledNaturalWonders(built.state, me.id)[0].usedThisTurn);
        }

        // (B) Conquest transfers the token from the defender to the attacker.
        {
          const attempt = () => {
            const { st, me } = claim();
            const claimed = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
              playerId: me.id, hexKeys: ["1,0"], tradeSpent: 0 } },
              { actorId: me.id, role: "player" }).state;
            if (owns(claimed, me.id).length !== 1) return { setupFailed: true };
            // tryApplyAction hands back its own copy of the state, so the rival
            // has to be reached through THAT copy - editing the player object
            // the fixture started with would arm an army nobody can see.
            const foe = claimed.players[1];
            // The rival marches on the space the token came from.
            claimed.turn.index = claimed.turn.order.indexOf(foe.id);
            foe.cardPlayed = false;
            activate(claimed, "2,0", { terrain: "grass" });
            foe.armies = [{ id: "f1", position: "2,0" }];
            let s = Game.applyAction(claimed, { type: "PLAY_MILITARY_ATTACK", payload: {
              playerId: foe.id, unitId: "f1", fromKey: "2,0", toKey: "1,0",
              targetType: "control" } });
            if (!s.combat) return null;
            s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: foe.id, side: "attacker" } });
            s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: foe.id, side: "defender", hostOverride: true } });
            s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: foe.id, side: "attacker" } });
            s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: claimed.players[0].id, side: "defender", hostOverride: true } });
            const control = s.map.hexes["1,0"].control;
            return control && control.ownerId === foe.id ? s : null;
          };
          let won = null;
          for (let i = 0; i < 400 && !won; i++) {
            const r = attempt();
            if (r && r.setupFailed) break;
            won = r;
          }
          assert("a rival can take the natural wonder space by force", !!won);
          if (won) {
            const meId = won.players[0].id, foeId = won.players[1].id;
            assert("the control token on the space changed hands",
              won.map.hexes["1,0"].control.ownerId === foeId,
              JSON.stringify(won.map.hexes["1,0"].control));
            assert("the defender no longer holds the natural wonder token",
              owns(won, meId).length === 0, JSON.stringify(owns(won, meId)));
            assert("the attacker holds it instead",
              owns(won, foeId).join(",") === "Mt Kilimanjaro",
              JSON.stringify(owns(won, foeId)));
            assert("exactly one player owns it - it was moved, not copied",
              won.players.filter((p) => owns(won, p.id).length).length === 1,
              JSON.stringify(won.players.map((p) => [p.id, owns(won, p.id)])));
            assert("and the registry names the new owner",
              won.naturalWonders["Mt Kilimanjaro"].ownerId === foeId,
              JSON.stringify(won.naturalWonders["Mt Kilimanjaro"]));
            // (C) after the transfer.
            const held = Game.getControlledNaturalWonders(won, foeId);
            assert("its printed resource identity survives the transfer",
              held.length === 1 && held[0].resource === "oil" &&
              held[0].name === "Mt Kilimanjaro", JSON.stringify(held));
            assert("and the agenda count follows the token, not the space",
              Game.countNaturalWonders(won, foeId) === 1 &&
              Game.countNaturalWonders(won, meId) === 0);
          }
        }
      }

      {
        // All wonder reducers meet in one calculator, and removing the source
        // immediately restores the price.
        const st = rulesState();
        const me = st.players[0];
        activate(st, "0,0", { city: {
          ownerId: me.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        activate(st, "2,0", { city: {
          ownerId: me.id, isCapital: false, developed: false,
          hasWonder: false, wonder: null
        } });
        // Brussels reduces the cost by one per MATURE city, so both cities have
        // to be genuinely ringed. Declaring `developed: true` on the fixture no
        // longer does anything: maturity is read off the board every time it is
        // asked for, which is the whole point of the rule.
        ["1,0", "-1,0", "0,1", "0,-1", "1,-1", "-1,1",
         "3,0", "2,1", "2,-1", "3,-1", "1,1"].forEach((k) =>
          activate(st, k, { control: { ownerId: me.id, fortified: false, district: null } }));
        assert("both fixture cities really are mature",
          Game.countDeveloped(st, me.id) === 2, String(Game.countDeveloped(st, me.id)));
        me.diplomacy.push(
          { fromCityState: "Brussels", cardId: "brussels" },
          { fromCityState: "Buenos Aires", cardId: "buenos-aires" }
        );
        const reduced = Game.calculateWonderCost("Jebel Barkal", me, st);
        assert("Brussels and Buenos Aires combine in the final wonder cost",
          reduced.baseCost === 7 && reduced.finalCost === 3 &&
          reduced.modifiers.some((m) => m.source === "Brussels") &&
          reduced.modifiers.some((m) => m.source === "Buenos Aires"),
          JSON.stringify(reduced));
        me.diplomacy = me.diplomacy.filter((card) => card.fromCityState !== "Buenos Aires");
        assert("losing Buenos Aires removes its reduction",
          Game.getWonderCost("Jebel Barkal", me, st) === 5);
        me.diplomacy = [];
        assert("losing all reducer cards restores printed cost",
          Game.getWonderCost("Jebel Barkal", me, st) === 7);
        proves("citystate.brussels");

        // "...reduce its cost by 2 IF YOU DO NOT ALREADY HAVE A WONDER OF THAT
        // TYPE." The condition, which the run above only ever satisfied.
        me.diplomacy = [{ fromCityState: "Buenos Aires", cardId: "buenos-aires" }];
        assert("Buenos Aires reduces a type I have no wonder of",
          Game.getWonderCost("Jebel Barkal", me, st) === 5,
          String(Game.getWonderCost("Jebel Barkal", me, st)));
        const typeOf = (name) =>
          (Game.ALL_WONDERS.find((w) => w.name === name) || {}).type;
        assert("(fixture) Terracotta Army is the same type as Jebel Barkal",
          typeOf("Terracotta Army") === typeOf("Jebel Barkal") &&
          !!typeOf("Jebel Barkal"),
          `${typeOf("Terracotta Army")} vs ${typeOf("Jebel Barkal")}`);
        activate(st, "4,0", { city: { ownerId: me.id, isCapital: false,
          developed: false, hasWonder: true,
          wonder: { name: "Terracotta Army", type: typeOf("Terracotta Army") } } });
        assert("but not one I already have a wonder of",
          Game.getWonderCost("Jebel Barkal", me, st) === 7,
          String(Game.getWonderCost("Jebel Barkal", me, st)));
        proves("citystate.buenos_aires");
      }

      {
        // Palenque substitutes an ordinary resource for selected focus-card
        // trade. It consumes the token; Natural Wonders are explicitly excluded.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["science", "growth", "culture", "economy", "military", "industry"];
        me.trade.science = 0;
        me.resources.marble = 1;
        me.diplomacy.push({ fromCityState: "Palenque", cardId: "palenque" });
        const paid = Game.tryApplyAction(st, { type: "PLAY_SCIENCE", payload: {
          tradeSpent: 1, tradeResources: { marble: 1 }
        }}, { actorId: me.id, role: "player" });
        assert("Palenque lets an ordinary resource replace focus trade",
          paid.accepted && paid.state.players[0].tech === 2 &&
          paid.state.players[0].resources.marble === 0,
          paid.code);

        const without = rulesState();
        without.players[0].focusRow = ["science", "growth", "culture", "economy", "military", "industry"];
        without.players[0].resources.marble = 1;
        const refused = Game.tryApplyAction(without, { type: "PLAY_SCIENCE", payload: {
          tradeSpent: 1, tradeResources: { marble: 1 }
        }}, { actorId: without.players[0].id, role: "player" });
        assert("resource-as-trade is rejected without Palenque",
          !refused.accepted && refused.code === "palenque_required" &&
          without.players[0].resources.marble === 1,
          refused.code);

        // "...you may spend RESOURCE TOKENS (NOT NATURAL WONDER TOKENS) as
        // trade tokens on that card." The exclusion was described in a comment
        // and never asserted.
        const nw = rulesState();
        const owner = nw.players[0];
        owner.focusRow = ["science", "growth", "culture", "economy", "military", "industry"];
        owner.trade.science = 0;
        Game.RESOURCES.forEach((r) => { owner.resources[r] = 0; });
        owner.diplomacy.push({ fromCityState: "Palenque", cardId: "palenque" });
        Object.values(nw.map.hexes).forEach((h) => {
          h.naturalWonder = null; h.naturalWonderSpace = null;
          if (h.resource === "wonder") h.resource = null;
        });

        activate(nw, "1,0", { terrain: "grass",
          naturalWonderSpace: "Mt Kilimanjaro",
          control: { ownerId: owner.id, fortified: false, district: null } });
        const settledNw = Game.applyAction(nw, { type: "NO_SUCH_ACTION", payload: {} });
        assert("(fixture) the player holds a natural wonder token",
          Game.getControlledNaturalWonders(settledNw, owner.id).length === 1,
          JSON.stringify(Game.getControlledNaturalWonders(settledNw, owner.id)));
        assert("but its oil cannot be spent as focus trade through Palenque",
          settledNw.players[0].resources.oil === 0,
          String(settledNw.players[0].resources.oil));
        const viaNatural = Game.tryApplyAction(settledNw, { type: "PLAY_SCIENCE",
          payload: { playerId: owner.id, tradeSpent: 1, tradeResources: { oil: 1 } } },
          { actorId: owner.id, role: "player" });
        assert("so the payment is refused", !viaNatural.accepted, viaNatural.code);
        assert("and the token is still on the leader sheet",
          Game.getControlledNaturalWonders(viaNatural.state, owner.id).length === 1);
        proves("citystate.palenque");
      }

      {
        // Drama and Poetry's lower paragraph is part of the same card
        // resolution and remains optional.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        me.cardTiers.culture = 2;
        activate(st, "0,0", { city: {
          ownerId: me.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        activate(st, "1,0");
        activate(st, "2,0");
        const main = Game.tryApplyAction(st, { type: "PLAY_CULTURE", payload: {
          hexKeys: ["1,0"], tradeSpent: 0
        }}, { actorId: me.id, role: "player" });
        const sourceChoice = main.accepted && main.state.pendingChoices.find(
          (choice) => choice.kind === "move_control_source");
        assert("Drama and Poetry continues after its normal Culture placement",
          main.accepted && !!main.state.cardResolution && !!sourceChoice &&
          sourceChoice.optional && sourceChoice.hexKeys.includes("1,0"),
          JSON.stringify(main.state && main.state.pendingChoices));
        const pickedSource = sourceChoice ? Game.tryApplyAction(main.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: sourceChoice.id, hexKey: "1,0" }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const destinationChoice = pickedSource.accepted && pickedSource.state.pendingChoices.find(
          (choice) => choice.kind === "move_control_destination");
        assert("Drama and Poetry offers only an adjacent empty non-water destination",
          pickedSource.accepted && destinationChoice &&
          destinationChoice.hexKeys.includes("2,0") &&
          destinationChoice.hexKeys.every((key) => {
            const hex = pickedSource.state.map.hexes[key];
            return hex && hex.terrain !== "water" && !hex.city && !hex.control &&
              !hex.barbarian && !hex.cityState && !hex.resource && !hex.naturalWonder &&
              Game.getUnitsAt(pickedSource.state, key).length === 0;
          }), JSON.stringify(destinationChoice));
        const moved = destinationChoice ? Game.tryApplyAction(pickedSource.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: destinationChoice.id, hexKey: "2,0" }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        assert("Drama and Poetry moves the token and then finishes the card",
          moved.accepted && !moved.state.map.hexes["1,0"].control &&
          moved.state.map.hexes["2,0"].control.ownerId === me.id &&
          !moved.state.cardResolution && moved.state.players[0].cardPlayed,
          moved.code);

        const skipState = rulesState();
        const skipper = skipState.players[0];
        skipper.focusRow = ["culture", "growth", "science", "economy", "military", "industry"];
        skipper.cardTiers.culture = 2;
        activate(skipState, "0,0", { city: {
          ownerId: skipper.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        activate(skipState, "1,0");
        activate(skipState, "2,0");
        const skipMain = Game.tryApplyAction(skipState, { type: "PLAY_CULTURE", payload: {
          hexKeys: ["1,0"], tradeSpent: 0
        }}, { actorId: skipper.id, role: "player" });
        const skipChoice = skipMain.accepted && skipMain.state.pendingChoices.find(
          (choice) => choice.kind === "move_control_source");
        const skipped = skipChoice ? Game.tryApplyAction(skipMain.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: skipChoice.id, dismiss: true }
        }, { actorId: skipper.id, role: "player" }) : { accepted: false };
        assert("the optional Drama and Poetry movement can be declined cleanly",
          skipped.accepted && !skipped.state.cardResolution && skipped.state.players[0].cardPlayed,
          skipped.code);
      }

      {
        // Apadana must retain the identity of the newly explored tile until its
        // mandatory control-token follow-up has been resolved.
        const st = rulesState();
        const me = st.players[0];
        me.focusRow = ["growth", "culture", "science", "economy", "military", "industry"];
        me.resources.diamonds = 2;
        activate(st, "0,0", { city: {
          ownerId: me.id, isCapital: true, developed: false,
          hasWonder: false, wonder: null
        } });
        const deck = st.wonderDecks.economy;
        deck.deck = ["Apadana"].concat(deck.deck.filter((name) => name !== "Apadana"));
        deck.revealed = "Apadana";
        const built = Game.tryApplyAction(st, { type: "PLAY_INDUSTRY_WONDER", payload: {
          hexKey: "0,0", wonderName: "Apadana", tradeSpent: 0,
          resources: { diamonds: 2 }, naturalWonders: []
        }}, { actorId: me.id, role: "player" });
        const chooseOrigin = built.accepted && built.state.pendingChoices.find(
          (choice) => choice.kind === "apadana_explore");
        assert("building Apadana queues exploration from any tile edge",
          built.accepted && chooseOrigin && chooseOrigin.hexKeys.length > 0,
          JSON.stringify(built.state && built.state.pendingChoices));
        const originKey = chooseOrigin && chooseOrigin.hexKeys[0];
        const selected = chooseOrigin ? Game.tryApplyAction(built.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: chooseOrigin.id, hexKey: originKey }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const begun = selected.accepted ? Game.tryApplyAction(selected.state, {
          type: "BEGIN_EXPLORATION", payload: { fromKey: originKey }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const pending = begun.accepted && begun.state.pendingExploration;
        assert("Apadana reveals one retained tile without requiring a figure",
          begun.accepted && pending && pending.freeRun &&
          pending.followUp === "apadana_control", JSON.stringify(pending));
        const placement = pending && Game.getLegalExplorationPlacements(begun.state, pending)[0];
        const placed = placement ? Game.tryApplyAction(begun.state, {
          type: "PLACE_EXPLORED_TILE", payload: {
            anchorKey: placement.anchorKey,
            rotation: placement.rotation,
            side: placement.side
          }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        const follow = placed.accepted && placed.state.pendingChoices.find(
          (choice) => choice.kind === "place_control" && choice.source === "Apadana");
        assert("Apadana preserves the newly placed tile for its second effect",
          placed.accepted && follow && follow.tileId === pending.tileId &&
          follow.hexKeys.length > 0 && follow.hexKeys.every(
            (key) => placed.state.map.hexes[key].tileId === pending.tileId),
          JSON.stringify(follow));
        const controlKey = follow && follow.hexKeys[0];
        const controlled = follow ? Game.tryApplyAction(placed.state, {
          type: "RESOLVE_PENDING_CHOICE",
          payload: { choiceId: follow.id, hexKey: controlKey }
        }, { actorId: me.id, role: "player" }) : { accepted: false };
        assert("Apadana places the control token on that new tile",
          controlled.accepted &&
          controlled.state.map.hexes[controlKey].tileId === pending.tileId &&
          controlled.state.map.hexes[controlKey].control.ownerId === me.id,
          controlled.code);
        // Both paragraphs: the expedition runs from an edge space on ANY tile,
        // and the control token lands on the tile that was just placed. The
        // final assertion is board state, not a queued prompt.
        proves("wonder.economy.apadana");
      }

      {
        // Reinforcement is another multi-key focus action and must have the
        // same no-partial-success guarantee.
        const st = rulesState();
        const me = st.players[0];
        // Growth on slot 2, so the card allows two reinforcements and it is the
        // SPACE that is illegal. On slot 1 the limit is 1, and the length check
        // fires first with too_many_reinforcements - which passes for the wrong
        // reason and proves nothing about partial application.
        // Terra p8's extended row has TWO slots numbered "1" (FOCUS_SLOTS is
        // [1,1,2,3,4,5]), so index 1 is still slot 1 - growth has to sit at
        // index 2 to be worth two reinforcements.
        me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
        assert("the fixture allows two reinforcements",
          Game.getSlotValue(me, "growth", st) >= 2, "slot " + Game.getSlotValue(me, "growth", st));
        activate(st, "1,0", { control: { ownerId: me.id, fortified: false, district: null } });
        activate(st, "0,1");                       // no control token: illegal
        const rejected = Game.tryApplyAction(st, { type: "PLAY_GROWTH_REINFORCE", payload: {
          hexKeys: ["1,0", "0,1"], tradeSpent: 0
        }}, { actorId: me.id, role: "player" });
        assert("a partially illegal reinforcement batch changes nothing",
          !rejected.accepted && rejected.code === "reinforce_space_invalid" &&
          !st.map.hexes["1,0"].control.fortified && !me.cardPlayed,
          rejected.code);
        // And an all-legal batch of the same size still goes through, so the
        // guard cannot pass by refusing everything.
        activate(st, "0,1", { control: { ownerId: me.id, fortified: false, district: null } });
        const ok = Game.tryApplyAction(st, { type: "PLAY_GROWTH_REINFORCE", payload: {
          hexKeys: ["1,0", "0,1"], tradeSpent: 0
        }}, { actorId: me.id, role: "player" });
        assert("two legal reinforcements are both applied",
          ok.accepted && ok.state.map.hexes["1,0"].control.fortified &&
          ok.state.map.hexes["0,1"].control.fortified, ok.code);
      }

      {
        // The printed bust is Marble; the three silver drops are Mercury.
        const tile = (id) => CivRulesData.TILES.find((entry) => entry.id === id);
        assert("tile resources keep Marble and Mercury identities",
          tile("01").sides.A.cells[0].resource === "mercury" &&
          tile("03").sides.B.cells[4].resource === "marble");
      }

      {
        // Military tokens buy combat value only — never movement.
        const st = rulesState();
        const me = st.players[0];
        const move = Game.getMilitaryMove(me);
        me.trade.military = Game.CFG.maxTrade;
        assert("military move is independent of trade held", Game.getMilitaryMove(me) === move);
      }

      {
        // Defense bonuses, rulebook p11: terrain, +1 per adjacent friendly
        // reinforced token, +1 if the defender is itself reinforced, city
        // terrain doubled, city-state flat 8.
        const defenseOf = (props) => {
          const st = rulesState();
          const atk = st.players[0].id, def = st.players[1].id;
          activate(st, "0,0", typeof props === "function" ? props(def) : props);
          return Game.findDefender(st, "0,0", atk);
        };
        const plain = defenseOf((d) => ({ terrain: "forest", control: { ownerId: d, fortified: false, district: null } }));
        const reinforced = defenseOf((d) => ({ terrain: "forest", control: { ownerId: d, fortified: true, district: null } }));
        assert("plain control marker defends at terrain difficulty", plain.power === 3);
        assert("reinforced control marker adds exactly 1", reinforced.power === plain.power + 1);
        assert("defender reports its owner", !!reinforced.ownerId);
        const city = defenseOf((d) => ({ terrain: "forest", city: { ownerId: d, isCapital: false, developed: false, hasWonder: false, wonder: null } }));
        assert("city doubles terrain difficulty", city.power === 6);
        assert("city-state defends at 8", defenseOf({ terrain: "grass", cityState: { name: "Test", type: "culture" } }).power === 8);
      }

      {
        // Terra p11's worked example has a player attack a rival army, and p16
        // lists "Army or Caravan: defending space's terrain difficulty". The
        // base game's list (p11) stops at cities and control tokens; Terra adds
        // figures to it.
        const st = rulesState();
        const atk = st.players[0].id;
        const other = st.players[1];
        activate(st, "3,0", { terrain: "grass" });
        other.armies = [{ id: "a1", position: "3,0" }];
        const lone = Game.findDefender(st, "3,0", atk);
        assert("a lone army is an attack target", !!lone && lone.type === "army");
        assert("and it defends at the space's terrain difficulty", lone.power === 1);
      }

      {
        // Army and caravan counts come off the military and economy cards.
        const st = rulesState();
        const me = st.players[0];
        // A figure you have not deployed stands on its card, not on the board.
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        Game.syncUnitCounts(st, me);
        const wantArmies = Game.CARD_TIERS.military.armies[Game.getCardTier(me, "military") - 1];
        assert("armies match the military card tier", me.armies.length === wantArmies);
        assert("caravans match the economy card tier",
          me.caravans.length === Game.CARD_TIERS.economy.wagons[Game.getCardTier(me, "economy") - 1]);
        // Base p4 starts each player with a caravan on the Foreign Trade card
        // and puts no army on the map at all. It is not just bookkeeping: a
        // figure standing in a space adds 2 to its defence (Terra p16), so
        // parking new figures on the capital quietly fortified it.
        assert("new figures start on their cards", me.armies.every((u) => u.position === null));
        assert("and so do the caravans", me.caravans.every((u) => u.position === null));
        me.cardTiers.military = 2;
        Game.syncUnitCounts(st, me);
        assert("upgrading the military card adds its army",
          me.armies.length === Game.CARD_TIERS.military.armies[1]);
        me.cardTiers.military = 1;
        Game.syncUnitCounts(st, me);
        assert("dropping back to tier I removes it again", me.armies.length === wantArmies);
        const after = Game.applyAction(st, { type: "RECRUIT_ARMY", payload: { playerId: me.id } });
        assert("there is no recruit action", after.players[0].armies.length === me.armies.length);
      }

      {
        // "combat dice results don't show all the contributing numbers." Every
        // number staked on a fight has to be readable by both players, so the
        // attack total arrives itemised rather than as a bare sum - and the
        // three reasons getLeaderAttackBonus used to add together (the civ
        // ability, the wonders, the pacts) appear as separate lines, because
        // they come and go independently.
        const st = rulesState();
        const me = st.players[0], foe = st.players[1];
        st.turn.index = st.turn.order.indexOf(me.id);
        me.cardPlayed = false;
        me.leaderId = "scythia";                       // +3 on grass or hills
        me.cardTiers.military = 2;                     // Iron Working: +2 vs barbarians
        activate(st, "0,0", { city: { ownerId: me.id, isCapital: true, developed: false, hasWonder: false, wonder: null } });
        activate(st, "1,0", { terrain: "grass", barbarian: { letter: "A" } });
        me.armies = [{ id: "a1", position: "0,0" }];
        const out = Game.applyAction(st, { type: "PLAY_MILITARY_ATTACK", payload: {
          playerId: me.id, unitId: "a1", fromKey: "0,0", toKey: "1,0", targetType: "barbarian"
        } });
        const parts = (out.combat && out.combat.atkParts) || [];
        const labels = parts.map((p) => p.label).join(" | ");
        assert("the attack arrives itemised, not as one number", parts.length >= 3);
        assert("the parts add up to the attack total",
          parts.reduce((n, p) => n + p.value, 0) === out.combat.atkBase);
        assert("the military card is one of the numbers",
          parts.some((p) => p.label === "military card" && p.value === Game.getSlotValue(me, "military", out)));
        assert("Iron Working's +2 says what earned it",
          parts.some((p) => /vs barbarian/.test(p.label) && p.value === 2), labels);
        assert("the civ ability is its own line",
          parts.some((p) => /Scythia/.test(p.label) && p.value === 3), labels);
        // leaderBonus must still be exactly what getLeaderAttackBonus gave, or
        // every existing reader of it silently changes meaning.
        assert("leaderBonus still totals the leader-category parts",
          out.combat.leaderBonus === parts.filter((p) => p.category === "leader")
            .reduce((n, p) => n + p.value, 0) &&
          out.combat.leaderBonus === Game.getLeaderAttackBonus(out, me.id, "1,0"));
        // And the breakdown has to reach the other seat, or only one player can
        // check the sum.
        const seen = Game.projectState(out, foe.id);
        assert("the breakdown reaches the other player",
          !!seen.combat && (seen.combat.atkParts || []).length === parts.length);

        // The numbers must outlive the fight. lastCombat is what the result
        // panel reads once combat is cleared, and it used to drop the parts -
