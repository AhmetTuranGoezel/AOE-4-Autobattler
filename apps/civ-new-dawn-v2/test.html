          atTier(b.me, u.type, u.tier);
          b.me.focusRow = ["economy", "science", "growth", "military", "industry", "culture"];
          assert("Shipbuilding moves four spaces",
            Game.getEconomyMove(b.me, b.st) === 4, String(Game.getEconomyMove(b.me, b.st)));
          const spots = Game.shipbuildingWaterSpaces

        // ── Zulu: Scorched Earth ─────────────────────────────────────────
        {
          // "ONCE PER TURN, after you win an attack against a control token,
          // you may DISCARD IT INSTEAD OF REPLACING IT to move (and attack
          // with) the attacking army a second time."
          const u = uniqueOf("zulu");
          const win = (leaderId) => {
            for (let i = 0; i < 400; i++) {
              const b = uniqBoard(leaderId, { setUp: (s2, p2) => {
                const foe = s2.players[1];
                activate(s2, "1,0", { terrain: "grass",
                  control: { ownerId: foe.id, fortified: false, district: null } });
                p2.armies = [{ id: "a1", position: "0,0" }];
              } });
              atTier(b.me, u.type, u.tier);
              b.me.focusRow = ["military", "science", "growth", "economy", "industry", "culture"];
              let s = Game.applyAction(b.st, { type: "PLAY_MILITARY_ATTACK",
                payload: { playerId: b.me.id, unitId: "a1", fromKey: "0,0",
                  toKey: "1,0", targetType: "control" } });
              if (!s.combat) continue;
              s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: b.me.id, side: "attacker" } });
              s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: b.me.id, side: "defender", hostOverride: true } });
              s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: b.me.id, side: "attacker" } });
              s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: b.foe.id, side: "defender", hostOverride: true } });
              const took = s.map.hexes["1,0"].control &&
                s.map.hexes["1,0"].control.ownerId === b.me.id;
              if (took) return { b, s };
            }
            return null;
          };
          const zulu = win("zulu");
          assert("a Scorched Earth army can win against a control token", !!zulu);
          const offer = zulu && (zulu.s.pendingChoices || [])
            .find((c) => c.kind === "scorched_earth");
          assert("and is then offered the discard-and-go-again", !!offer,
            zulu && JSON.stringify((zulu.s.pendingChoices || []).map((c) => c.kind)));
          assert("which is optional", !!offer && offer.optional === true);
          if (offer) {
            const again = Game.applyAction(zulu.s, { type: "RESOLVE_PENDING_CHOICE",
              payload: { playerId: zulu.b.me.id, choiceId: offer.id, optionId: "discard" } });
            assert("taking it discards the token rather than replacing it",
              again.map.hexes["1,0"].control === null,
              JSON.stringify(again.map.hexes["1,0"].control));
            assert("and marks the once-per-turn as used",
              again.players[0].scorchedEarthUsedThisTurn === true);

          assert("an ordinary army can win the same fight", !!plain);
          assert("but is offered no second move",
            plain && !(plain.s.pendingChoices || [])
              .some((c) => c.kind === "scorched_earth"),
            plain && JSON.stringify((plain.s.pendingChoices || []).map((c) => c.kind)));
          assert("and simply takes the space",
            plain && plain.s.map.hexes["1,0"].control.ownerId === plain.b.me.id);
          proves("unique.zulu.scorched_earth");
        }

            Game.getCardName(aztec.me, "growth"));
          const out = Game.tryApplyAction(aztec.st, { type: "PLAY_GROWTH_DISTRICT", payload: {
            playerId: aztec.me.id, district: "campus", hexKey: "1,0", tradeSpent: 0 } },
            { actorId: aztec.me.id, role: "player" });
          assert("the district goes down on the space holding your token",
            out.accepted && out.state.map.hexes["1,0"].control.district === "campus",
            out.code);
          const move = (out.state.pendingChoices || [])
            .find((c) => c.kind === "mysticism_control_destination");
          assert("and the replaced token may be moved to an adjacent space",
            !!move, JSON.stringify((out.state.pendingChoices || []).map((c) => c.kind)));
          assert("which is optional, because the card says you may",
            !!move && move.optional === true);
          assert("every offered space touches the district",
            !!move && move.hexKeys.length > 0 &&
            move.hexKeys.every((k) => Game.hexNeighborKeys(1, 0).includes(k)),
            move && move.hexKeys.join(" "));
          const moved = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: aztec.me.id, choiceId: move.id, hexKey: move.hexKeys[0] } });
          assert("moving it puts the token on the chosen space",
            !!moved.map.hexes[move.hexKeys[0]].control &&
            moved.map.hexes[move.hexKeys[0]].control.ownerId === aztec.me.id,
            JSON.stringify(moved.map.hexes[move.hexKeys[0]].control));
          assert("and the district is still a district, not a plain token",
            moved.map.hexes["1,0"].control.district === "campus");

          const bare = board("aztec", false);
          const out2 = Game.tryApplyAction(bare.st, { type: "PLAY_GROWTH_DISTRICT", payload: {
            playerId: bare.me.id, district: "campus", hexKey: "1,0", tradeSpent: 0 } },
            { actorId: bare.me.id, role: "player" });
          assert("placing on an empty space offers no relocation: there was no token",
            out2.accepted && !(out2.state.pendingChoices || [])
              .some((c) => c.kind === "mysticism_control_destination"), out2.code);
          proves("unique.aztec.mysticism");
        }

        // ── Rome: Military Engineering ───────────────────────────────────
        {
          // "Place a district ... Then, for each army ON YOUR MILITARY CARD,
          // you may place that army in a space containing one of your cities.
          // Then reinforce each of your control tokens that is in or adjacent
          // to a space containing a friendly army."
          const b = uniqBoard("rome", { setUp: (s2, p2) => {
            activate(s2, "0,1", { terrain: "grass",
              control: { ownerId: p2.id, fortified: false, district: null } });
            activate(s2, "5,0", { terrain: "grass",
              control: { ownerId: p2.id, fortified: false, district: null } });
          } });
          atTier(b.me, "growth", 2);
          b.me.focusRow = ["growth", "science", "culture", "economy", "military", "industry"];
          b.me.armies = [{ id: "a1", position: null }];
          assert("Military Engineering is the Rome growth card at tier 2",
            Game.getCardName(b.me, "growth") === "Military Engineering",
            Game.getCardName(b.me, "growth"));
          const out = Game.tryApplyAction(b.st, { type: "PLAY_GROWTH_DISTRICT", payload: {
            playerId: b.me.id, district: "campus", hexKey: "1,0", tradeSpent: 0 } },
            { actorId: b.me.id, role: "player" });
          assert("the district is placed", out.accepted &&
            out.state.map.hexes["1,0"].control.district === "campus", out.code);
          const deploy = (out.state.pendingChoices || [])
            .find((c) => c.kind === "military_engineering_army");
          assert("then each army still on the military card is offered a city",
            !!deploy, JSON.stringify((out.state.pendingChoices || []).map((c) => c.kind)));
          assert("which is optional, because the card says you may",
            !!deploy && deploy.optional === true);
          assert("and the offer is a space holding one of your cities",
            !!deploy && deploy.hexKeys.includes("0,0"), deploy && deploy.hexKeys.join(" "));
          const placed = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: deploy.id, hexKey: "0,0" } });
          assert("the army arrives in the city",
            placed.players[0].armies[0].position === "0,0",
            String(placed.players[0].armies[0].position));
          assert("a control token beside that army is reinforced",
            placed.map.hexes["0,1"].control.fortified === true,
            JSON.stringify(placed.map.hexes["0,1"].control));
          assert("and one nowhere near an army is left alone",
            placed.map.hexes["5,0"].control.fortified === false,
            JSON.stringify(placed.map.hexes["5,0"].control));
          proves("unique.rome.military_engineering");
        }

        // ── Poland: Astronomy ────────────────────────────────────────────
        {
          // "Look at UP TO 2 map tiles FROM THE BOTTOM of the map tile stack.
          // You may place 1 as though you are exploring from any edge space of
          // your capital tile. Return any remaining tiles to the top or bottom
          // of the stack in any order. Then, advance your tech dial a number of
          // spaces equal to this slot's number."
          const b = uniqBoard("poland", {});
          atTier(b.me, "science", 2);
          b.me.focusRow = ["science", "growth", "culture", "economy", "military", "industry"];
          assert("Astronomy is the Poland science card at tier 2",
            Game.getCardName(b.me, "science") === "Astronomy",
            Game.getCardName(b.me, "science"));
          // The tile stack is materialised by migrateState on the first action,
          // so take the reading through one rather than off a fresh fixture.
          Game.applyAction(b.st, { type: "NO_SUCH_ACTION", payload: {} });
          const stackBefore = (b.st.tileStack || []).slice();
          assert("there are undrawn tiles to look at", stackBefore.length >= 2,
            String(stackBefore.length));
          const bottomTwo = stackBefore.slice(-2);
          const techBefore = b.me.tech;
          const slot = Game.getSlotValue(b.me, "science", b.st);

          const out = Game.tryApplyAction(b.st, { type: "PLAY_SCIENCE",
            payload: { playerId: b.me.id, tradeSpent: 0 } },
            { actorId: b.me.id, role: "player" });
          assert("resolving Astronomy opens the inspection", out.accepted, out.code);
          const look = (out.state.pendingChoices || [])
            .find((c) => c.kind === "astronomy_tiles");
          assert("and it shows two tiles", !!look && (look.tileIds || []).length === 2,
            look && JSON.stringify(look.tileIds));
          assert("which are the two from the BOTTOM of the stack",
            !!look && JSON.stringify(look.tileIds) === JSON.stringify(bottomTwo),
            JSON.stringify({ offered: look && look.tileIds, bottomTwo }));
          assert("the dial has not moved yet: it advances after the tiles",
            out.state.players[0].tech === techBefore,
            String(out.state.players[0].tech));

          // Decline both and send them back to the top, in the order shown.
          const declineId = `none|top|forward`;
          assert("declining both is one of the printed options",
            look.options.some((o) => o.id === declineId),
            JSON.stringify(look.options.map((o) => o.id)));
          const done = Game.applyAction(out.state, { type: "RESOLVE_PENDING_CHOICE", payload: {
            playerId: b.me.id, choiceId: look.id, optionId: declineId } });
          assert("the stack keeps every tile it had",
            (done.tileStack || []).length === stackBefore.length,
            `${stackBefore.length} -> ${(done.tileStack || []).length}`);
          assert("and the two inspected tiles are now on the top",
            JSON.stringify((done.tileStack || []).slice(0, 2)) === JSON.stringify(bottomTwo),
            JSON.stringify({ top: (done.tileStack || []).slice(0, 2), bottomTwo }));
          assert("then the dial advances by this slot's number",
            done.players[0].tech === techBefore + slot,
            `${techBefore} + ${slot} -> ${done.players[0].tech}`);
          proves("unique.poland.astronomy");
        }
      }

      {
        // Six civilization abilities, each driven to the state it changes and
        // each checked against the same board without the leader, so what is
        // asserted is the ability and not the fixture.
        const civBoard = (leaderId, opts) => {
          const o = opts || {};
          const st = rulesState();
          const me = st.players[0];
          me.leaderId = leaderId || null;
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          Game.RESOURCES.forEach((r) => { me.resources[r] = 0; });
          st.players.forEach((p) => { p.diplomacy = []; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.barbarianHome = null; h.control = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          // Two rows either side, not one. Japan's ability covers spaces
          // adjacent to water OR THE EDGE OF THE MAP, so a space meant to be
          // "inland" needs a full ring of land around it — with a one-row band
          // every space in it touches the edge, and the negative case was
          // testing nothing.
          for (let q = -3; q <= 8; q++) {
            for (let r = -2; r <= 2; r++) activate(st, q + "," + r, { terrain: "grass" });
          }
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          if (o.setUp) o.setUp(st, me);
          return { st, me, foe: st.players[1] };
        };
        const strike = (st, me, toKey, targetType) => Game.applyAction(st,
          { type: "PLAY_MILITARY_ATTACK", payload: { playerId: me.id, unitId: "a1",
            fromKey: "0,0", toKey, targetType } });

        // ── Scythia ──────────────────────────────────────────────────────
        {
          // "When attacking or defending a GRASSLAND OR HILL space, increase
          // your combat value by 3."
          const onTerrain = (terrain) => (s2, p2) => {
            const foe = s2.players[1];
            activate(s2, "1,0", { terrain,
              control: { ownerId: foe.id, fortified: false, district: null } });
            p2.armies = [{ id: "a1", position: "0,0" }];
          };
          const plainGrass = civBoard(null, { setUp: onTerrain("grass") });
          const baseGrass = strike(plainGrass.st, plainGrass.me, "1,0", "control").combat.atkBase;
          const scyGrass = civBoard("scythia", { setUp: onTerrain("grass") });
          const gotGrass = strike(scyGrass.st, scyGrass.me, "1,0", "control").combat;
          assert("Scythia adds 3 attacking a grassland space",
            gotGrass.atkBase === baseGrass + 3, `${baseGrass} -> ${gotGrass.atkBase}`);
          assert("and says so in the breakdown",
            (gotGrass.atkParts || []).some((p) => /scythia/i.test(p.label)),
            JSON.stringify(gotGrass.atkParts));

          const plainDesert = civBoard(null, { setUp: onTerrain("desert") });
          const baseDesert = strike(plainDesert.st, plainDesert.me, "1,0", "control").combat.atkBase;
          const scyDesert = civBoard("scythia", { setUp: onTerrain("desert") });
          assert("but nothing on a desert space",
            strike(scyDesert.st, scyDesert.me, "1,0", "control").combat.atkBase === baseDesert,
            String(baseDesert));

          // Defending on a hill.
          const defend = (leaderId) => {
            const b = civBoard(leaderId, { setUp: (s2, p2) => {
              const foe = s2.players[1];
              activate(s2, "1,0", { terrain: "hill",
                control: { ownerId: p2.id, fortified: false, district: null } });
              foe.armies = [{ id: "a1", position: "2,0" }];
              foe.cardPlayed = false;
            } });
            b.st.turn.index = b.st.turn.order.indexOf(b.foe.id);
            return Game.applyAction(b.st, { type: "PLAY_MILITARY_ATTACK",
              payload: { playerId: b.foe.id, unitId: "a1", fromKey: "2,0",
                toKey: "1,0", targetType: "control" } });
          };
          const plainDef = defend(null).combat.defBase;
          const scyDef = defend("scythia").combat;
          assert("and 3 defending a hill space",
            scyDef.defBase === plainDef + 3, `${plainDef} -> ${scyDef.defBase}`);
          proves("civ.scythia");
        }

        // ── China ────────────────────────────────────────────────────────
        {
          // "When defending, your REINFORCED control tokens increase your
          // combat value by 2 instead of 1."
          const defend = (leaderId, fortified) => {
            const b = civBoard(leaderId, { setUp: (s2, p2) => {
              const foe = s2.players[1];
              activate(s2, "1,0", { terrain: "grass",
                control: { ownerId: p2.id, fortified, district: null } });
              foe.armies = [{ id: "a1", position: "2,0" }];
              foe.cardPlayed = false;
            } });
            b.st.turn.index = b.st.turn.order.indexOf(b.foe.id);
            return Game.applyAction(b.st, { type: "PLAY_MILITARY_ATTACK",
              payload: { playerId: b.foe.id, unitId: "a1", fromKey: "2,0",
                toKey: "1,0", targetType: "control" } });
          };
          const plainReinforced = defend(null, true).combat.defBase;
          const chinaReinforced = defend("china", true).combat.defBase;
          assert("China's reinforced token defends for one more",
            chinaReinforced === plainReinforced + 1,
            `${plainReinforced} -> ${chinaReinforced}`);
          const plainPlain = defend(null, false).combat.defBase;
          const chinaPlain = defend("china", false).combat.defBase;
          assert("but an unreinforced one is unchanged",
            chinaPlain === plainPlain, `${plainPlain} -> ${chinaPlain}`);
          proves("civ.china");
        }

        // ── Egypt ────────────────────────────────────────────────────────
        {
          // "The cost of all world wonders is reduced by 1 for you."
          const plain = civBoard(null);
          const egy = civBoard("egypt");
          const names = Game.ALL_WONDERS.slice(0, 8).map((w) => w.name);
          const differences = names.map((n) =>
            Game.getWonderCost(n, plain.me, plain.st) -
            Game.getWonderCost(n, egy.me, egy.st));
          assert("every wonder costs Egypt exactly one less",
            differences.every((d) => d === 1), JSON.stringify(differences));
          assert("and the reduction is named in the breakdown",
            Game.calculateWonderCost(names[0], egy.me, egy.st).modifiers
              .some((m) => /egypt/i.test(m.source)),
            JSON.stringify(Game.calculateWonderCost(names[0], egy.me, egy.st)));
          // It reaches the build: a wonder Egypt can afford and nobody else can.
          const buy = (board, wonderName, resources) => {
            const player = board.st.players[0];
            player.cardPlayed = false;
            player.focusRow = ["industry", "science", "growth", "economy", "military", "culture"];
            Game.RESOURCES.forEach((r) => { player.resources[r] = 0; });
            Object.entries(resources).forEach(([r, n]) => { player.resources[r] = n; });
            player.trade.industry = 1;
            const deck = board.st.wonderDecks.military;
            deck.deck = [wonderName].concat(deck.deck.filter((n) => n !== wonderName));
            deck.revealed = wonderName;
            return Game.tryApplyAction(board.st, { type: "PLAY_INDUSTRY_WONDER",
              payload: { hexKey: "0,0", wonderName, tradeSpent: 1,
                resources, naturalWonders: [] } },
              { actorId: player.id, role: "player" });
          };
          // Jebel Barkal is printed at 7. Production here is slot 1 + 1 trade +
          // 2 per eligible resource, so two oil make exactly 6: one short for
          // everyone else, and exactly enough once Egypt takes a point off.
          const short = buy(civBoard(null), "Jebel Barkal", { oil: 2 });
          assert("without Egypt that payment is short", !short.accepted, short.code);
          const enough = buy(civBoard("egypt"), "Jebel Barkal", { oil: 2 });
          assert("but it buys the wonder for Egypt", enough.accepted, enough.code);
          assert("and the wonder is in the city",
            enough.accepted &&
            enough.state.map.hexes["0,0"].city.wonder.name === "Jebel Barkal");
          proves("civ.egypt");
        }

        // ── Japan ────────────────────────────────────────────────────────
        {
          // "During your turn, desert and mountain spaces that are adjacent to
          // water or the edge of the map are treated as having a terrain
          // difficulty of 3."
          const setUp = (s2) => {
            activate(s2, "1,0", { terrain: "mountain" });   // beside the water below
            activate(s2, "1,1", { terrain: "water" });
            // 0,-1 has a full ring of land around it on this board, so it is
            // neither coastal nor on the edge.
            activate(s2, "0,-1", { terrain: "mountain" });
          };
          const plain = civBoard(null, { setUp });
          plain.me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          const jap = civBoard("japan", { setUp });
          jap.me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          assert("a coastal mountain is difficulty 5 for anyone else",
            !Game.validControlHexes(plain.st, plain.me.id, 3).has("1,0"));
          assert("Japan treats it as 3, bringing it into reach",
            Game.validControlHexes(jap.st, jap.me.id, 3).has("1,0"),
            [...Game.validControlHexes(jap.st, jap.me.id, 3)].sort().join(" "));
          assert("but an inland mountain is still 5 even for Japan",
            !Game.validControlHexes(jap.st, jap.me.id, 3).has("0,-1"),
            [...Game.validControlHexes(jap.st, jap.me.id, 3)].sort().join(" "));
          proves("civ.japan");
        }

        // ── Zulu ─────────────────────────────────────────────────────────
        {
          // "After you win a combat as the ATTACKER, place 1 trade token on
          // your military focus card, plus 1 ADDITIONAL if you attacked a rival
          // city or city-state."
          const win = (leaderId, targetIsCity) => {
            for (let i = 0; i < 400; i++) {
              const b = civBoard(leaderId, { setUp: (s2, p2) => {
                const foe = s2.players[1];
                if (targetIsCity) {
                  activate(s2, "1,0", { terrain: "grass", city: { ownerId: foe.id,
                    isCapital: false, developed: false, hasWonder: false, wonder: null } });
                } else {
                  activate(s2, "1,0", { terrain: "grass",
                    control: { ownerId: foe.id, fortified: false, district: null } });
                }
                p2.armies = [{ id: "a1", position: "0,0" }];
              } });
              let s = strike(b.st, b.me, "1,0", targetIsCity ? "city" : "control");
              if (!s.combat) continue;
              s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: b.me.id, side: "attacker" } });
              s = Game.applyAction(s, { type: "COMBAT_ROLL", payload: { playerId: b.me.id, side: "defender", hostOverride: true } });
              s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: b.me.id, side: "attacker" } });
              s = Game.applyAction(s, { type: "COMBAT_PASS", payload: { playerId: b.foe.id, side: "defender", hostOverride: true } });
              const took = targetIsCity
                ? (s.map.hexes["1,0"].city && s.map.hexes["1,0"].city.ownerId === b.me.id)
                : (s.map.hexes["1,0"].control &&
                   s.map.hexes["1,0"].control.ownerId === b.me.id);
              if (took) return s;
            }
            return null;
          };
          const plainWin = win(null, false);
          assert("an attack against a token can be won", !!plainWin);
          const zuluToken = win("zulu", false);
          assert("and the Zulu can win the same one", !!zuluToken);
          if (plainWin && zuluToken) {
            assert("winning as attacker pays the Zulu a military trade token",
              zuluToken.players[0].trade.military ===
              plainWin.players[0].trade.military + 1,
              `${plainWin.players[0].trade.military} -> ${zuluToken.players[0].trade.military}`);
          }
          const zuluCity = win("zulu", true);
          assert("a rival city can be taken", !!zuluCity);
          if (zuluCity && zuluToken) {
            assert("and taking a CITY pays one more than taking a token",
              zuluCity.players[0].trade.military >
              zuluToken.players[0].trade.military ||
              zuluCity.players[0].trade.military === Game.CFG.maxTrade,
              `${zuluToken.players[0].trade.military} vs ${zuluCity.players[0].trade.military}`);
          }
          proves("civ.zulu");
        }

        // ── Aztec ────────────────────────────────────────────────────────
        {
          // "After you reset your military focus card, IF YOU WON AT LEAST 1
          // ATTACK THIS TURN, you may swap any 2 cards in your focus row."
          const board = (leaderId, won) => {
            const b = civBoard(leaderId, { setUp: (s2, p2) => {
              p2.armies = [{ id: "a1", position: "0,0" }];
            } });
            b.me.focusRow = ["military", "science", "growth", "economy", "culture", "industry"];
            b.me.wonAttackThisTurn = won;
            return b;
          };
          const swapChoice = (st) => (st.pendingChoices || [])
            .find((c) => /aztec/i.test(c.source || "") || c.kind === "swap_cards");

          const noWin = board("aztec", false);
          const outNoWin = Game.tryApplyAction(noWin.st, { type: "PLAY_MILITARY_MOVE",
            payload: { playerId: noWin.me.id, unitId: "a1", toKey: "1,0", tradeSpent: 0 } },
            { actorId: noWin.me.id, role: "player" });
          assert("the military card resolves", outNoWin.accepted, outNoWin.code);
          assert("with no win this turn the Aztec are offered no swap",
            !swapChoice(outNoWin.state),
            JSON.stringify((outNoWin.state.pendingChoices || []).map((c) => c.kind)));

          const withWin = board("aztec", true);
          const outWin = Game.tryApplyAction(withWin.st, { type: "PLAY_MILITARY_MOVE",
            payload: { playerId: withWin.me.id, unitId: "a1", toKey: "1,0", tradeSpent: 0 } },
            { actorId: withWin.me.id, role: "player" });
          assert("the military card resolves after a win", outWin.accepted, outWin.code);
          const swap = swapChoice(outWin.state);
          assert("having won, the Aztec are offered a swap", !!swap,
            JSON.stringify((outWin.state.pendingChoices || []).map((c) => c.kind)));
          const before = outWin.state.players[0].focusRow.slice();
          const done = Game.applyAction(outWin.state, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: withWin.me.id, choiceId: swap.id,
              optionId: (swap.options || [])[0].id } });
          assert("and taking it really rearranges the row",
            JSON.stringify(done.players[0].focusRow) !== JSON.stringify(before),
            `${before.join(",")} -> ${done.players[0].focusRow.join(",")}`);
          assert("with the same six cards in it",
            done.players[0].focusRow.slice().sort().join(",") ===
            before.slice().sort().join(","));

          const notAztec = board(null, true);
          const outPlain = Game.tryApplyAction(notAztec.st, { type: "PLAY_MILITARY_MOVE",
            payload: { playerId: notAztec.me.id, unitId: "a1", toKey: "1,0", tradeSpent: 0 } },
            { actorId: notAztec.me.id, role: "player" });
          assert("another civilization gets no swap even after winning",
            !swapChoice(outPlain.state));
          proves("civ.aztec");
        }
        // ── France ───────────────────────────────────────────────────────
        {
          // "When resolving your culture focus card, place ADDITIONAL control
          // tokens based on your LATEST-ERA world wonder: Ancient 1 / Medieval
          // 2 / Modern 3."
          const withWonder = (name) => {
            const era = (Game.ALL_WONDERS.find((w) => w.name === name) || {}).era;
            return (s2, p2) => {
              s2.map.hexes["0,0"].city.hasWonder = !!name;
              s2.map.hexes["0,0"].city.wonder = name ? { name, era } : null;
            };
          };
          const markers = (leaderId, wonderName) => {
            const b = civBoard(leaderId, { setUp: withWonder(wonderName) });
            b.me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
            return Game.getCultureMarkers(b.me, 0, b.st);
          };
          const plain = markers(null, null);
          assert("without France a wonder adds no culture markers",
            markers(null, "Stonehenge") === plain, String(plain));
          const ancient = Game.ALL_WONDERS.find((w) => w.era === "ancient").name;
          const medieval = Game.ALL_WONDERS.find((w) => w.era === "medieval").name;
          const modern = Game.ALL_WONDERS.find((w) => w.era === "modern").name;
          assert("France with no wonder places the printed number",
            markers("france", null) === plain, String(markers("france", null)));
          assert("an ancient wonder adds one",
            markers("france", ancient) === plain + 1,
            `${plain} -> ${markers("france", ancient)} (${ancient})`);
          assert("a medieval wonder adds two",
            markers("france", medieval) === plain + 2,
            `${plain} -> ${markers("france", medieval)} (${medieval})`);
          assert("a modern wonder adds three",
            markers("france", modern) === plain + 3,
            `${plain} -> ${markers("france", modern)} (${modern})`);
          // And the extra tokens really go down.
          const board = civBoard("france", { setUp: withWonder(modern) });
          board.me.focusRow = ["culture", "science", "growth", "economy", "military", "industry"];
          const want = Game.getCultureMarkers(board.me, 0, board.st);
          const spots = [...Game.validControlHexes(board.st, board.me.id,
            Game.getSlotValue(board.me, "culture", board.st))].slice(0, want);
          assert("(fixture) there are enough legal spaces", spots.length === want,
            `${spots.length} of ${want}`);

            payload: { playerId: board.me.id, hexKeys: spots, tradeSpent: 0 } },

          assert("France places all of them in one card", out.accepted, out.code);
          assert("and every one is on the board",
            spots.every((k) => out.state.map.hexes[k].control &&
              out.state.map.hexes[k].control.ownerId === board.me.id));
          proves("civ.france");
        }

        // ── Georgia ──────────────────────────────────────────────────────
        {
          // "When resolving a focus card, if you have a diplomacy card from a
          // city-state OF THAT FOCUS CARD'S TYPE, resolve it as though it is 1
          // slot farther to the right."
          const board = (leaderId, cityState) => {
            const b = civBoard(leaderId);
            b.me.focusRow = ["science", "growth", "economy", "military", "industry", "culture"];
            // Science in the second place, so one step right is visible.
            b.me.focusRow = ["growth", "science", "economy", "military", "industry", "culture"];
            // Build the card the way grantCityStateDiplomacy does — it carries
            // the city-state's TYPE, and Georgia is the one ability that reads
            // it. A fixture that leaves it off tests nothing.
            if (cityState) {
              const data = Game.CITY_STATE_DATA[cityState] || {};
              b.me.diplomacy = [{ fromCityState: cityState, name: cityState,
                type: data.type, effectId: data.effectId || null }];
            }
            return b;
          };
          // Seoul is a SCIENCE city-state; Kabul is a military one.
          const plain = board(null, null);
          const baseSlot = Game.getSlotValue(plain.me, "science", plain.st);
          const geoRight = board("georgia", "Seoul");
          assert("Georgia shifts a card whose type matches a held city-state",
            Game.getSlotValue(geoRight.me, "science", geoRight.st) > baseSlot,
            `${baseSlot} -> ${Game.getSlotValue(geoRight.me, "science", geoRight.st)}`);
          const geoWrong = board("georgia", "Kabul");
          assert("but not one whose type does not match",
            Game.getSlotValue(geoWrong.me, "science", geoWrong.st) === baseSlot,
            String(Game.getSlotValue(geoWrong.me, "science", geoWrong.st)));
          const notGeorgia = board(null, "Seoul");
          assert("and another civilization holding the same card gets nothing",
            Game.getSlotValue(notGeorgia.me, "science", notGeorgia.st) === baseSlot,
            String(Game.getSlotValue(notGeorgia.me, "science", notGeorgia.st)));
          // It reaches the dial: science advances by the shifted number.
          const run = (b) => Game.tryApplyAction(b.st, { type: "PLAY_SCIENCE",
            payload: { playerId: b.me.id, tradeSpent: 0 } },
            { actorId: b.me.id, role: "player" });
          const plainRun = run(board(null, null));
          const geoRun = run(board("georgia", "Seoul"));
          assert("so the tech dial moves further for Georgia",
            geoRun.state.players[0].tech > plainRun.state.players[0].tech,
            `${plainRun.state.players[0].tech} vs ${geoRun.state.players[0].tech}`);
          proves("civ.georgia");
        }

        // ── Indonesia ────────────────────────────────────────────────────
        {
          // "Your caravans and armies can move into water."
          const setUp = (s2, p2) => {
            activate(s2, "1,0", { terrain: "water" });
            p2.caravans = [{ id: "c1", position: "0,0" }];
            p2.armies = [{ id: "a1", position: "0,0" }];
          };
          const plain = civBoard(null, { setUp });
          const ind = civBoard("indonesia", { setUp });
          assert("nobody else can move a caravan into water",
            !Game.getReachable(plain.st, "0,0",
              Game.getEconomyMove(plain.me, plain.st), "caravan", plain.me.id).has("1,0"));
          assert("Indonesia's caravans can",
            Game.getReachable(ind.st, "0,0",
              Game.getEconomyMove(ind.me, ind.st), "caravan", ind.me.id).has("1,0"),
            [...Game.getReachable(ind.st, "0,0",
              Game.getEconomyMove(ind.me, ind.st), "caravan", ind.me.id)].sort().join(" "));
          assert("and so can its armies",
            Game.getReachable(ind.st, "0,0",
              Game.getMilitaryMove(ind.me, ind.st), "army", ind.me.id).has("1,0"));
          assert("while nobody else's armies can",
            !Game.getReachable(plain.st, "0,0",
              Game.getMilitaryMove(plain.me, plain.st), "army", plain.me.id).has("1,0"));
          const moved = Game.tryApplyAction(ind.st, { type: "PLAY_ECONOMY",
            payload: { playerId: ind.me.id, unitId: "c1", toKey: "1,0", tradeSpent: 0 } },
            { actorId: ind.me.id, role: "player" });
          assert("and the caravan really sails", moved.accepted, moved.code);
          assert("ending on the water space",
            moved.state.players[0].caravans[0].position === "1,0",
            String(moved.state.players[0].caravans[0].position));
          proves("civ.indonesia");
        }

        // ── Nubia ────────────────────────────────────────────────────────
        {
          // "After you reset your growth focus card, resolve the effect of ANY
          // 1 of your districts." One, chosen — not all of them.
          const setUp = (s2, p2) => {
            s2.map.hexes["1,0"].control =
              { ownerId: p2.id, fortified: false, district: "campus" };
            activate(s2, "2,0", { terrain: "mountain",
              control: { ownerId: p2.id, fortified: false, district: null } });
            s2.map.hexes["0,1"].control =
              { ownerId: p2.id, fortified: false, district: "trade" };
          };
          const run = (leaderId) => {
            const b = civBoard(leaderId, { setUp });
            b.me.focusRow = ["growth", "science", "economy", "military", "industry", "culture"];
            b.me.cardPlayed = false;
            const out = Game.tryApplyAction(b.st, { type: "PLAY_GROWTH_DISTRICT",
              payload: { playerId: b.me.id, district: "encampment",
                hexKey: "0,-1", tradeSpent: 0 } },
              { actorId: b.me.id, role: "player" });
            return { b, out };
          };
          const plain = run(null);
          assert("the growth card resolves for anyone", plain.out.accepted, plain.out.code);
          const plainAsk = (plain.out.state.pendingChoices || [])
            .find((c) => c.kind === "district_order");
          assert("and offers no district resolution afterwards", !plainAsk,
            JSON.stringify((plain.out.state.pendingChoices || []).map((c) => c.kind)));

          const nub = run("nubia");
          assert("the growth card resolves for Nubia", nub.out.accepted, nub.out.code);
          const ask = (nub.out.state.pendingChoices || [])
            .find((c) => c.kind === "district_order");
          assert("Nubia is asked which ONE district to resolve", !!ask,
            JSON.stringify((nub.out.state.pendingChoices || []).map((c) => c.kind)));
          assert("and it is exactly one, not all of them",
            ask.remaining === 1, String(ask.remaining));
          const before = nub.out.state.players[0].trade.science;
          const done = Game.applyAction(nub.out.state, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: nub.b.me.id, choiceId: ask.id, optionId: "campus" } });
          assert("choosing the campus pays its science trade",
            done.players[0].trade.science > before,
            `${before} -> ${done.players[0].trade.science}`);
          assert("and no second district is offered",
            !(done.pendingChoices || []).some((c) => c.kind === "district_order"),
            JSON.stringify((done.pendingChoices || []).map((c) => c.kind)));
          proves("civ.nubia");
        }

        // ── Ottoman ──────────────────────────────────────────────────────
        {
          // "At the start of your turn, you may choose another player. Give
          // that player the Ibrahim card. When attacking or defending against
          // the player with the Ibrahim card, increase your combat value by 2."
          const b = civBoard("ottoman", { setUp: (s2, p2) => {
            const foe = s2.players[1];
            s2.map.hexes["1,0"].control =
              { ownerId: foe.id, fortified: false, district: null };
            p2.armies = [{ id: "a1", position: "0,0" }];
          } });
          const started = Game.applyAction(b.st, { type: "NO_SUCH_ACTION", payload: {} });
          Game.resolveEvent(started, "wonder_tokens");   // harmless; keeps state live
          // Reach a start of turn the ordinary way.
          let s2 = b.st;
          const give = (state) => (state.pendingChoices || [])
            .find((c) => c.kind === "give_ibrahim" || /ibrahim/i.test(c.source || ""));
          for (let i = 0; i < 4 && !give(s2); i++) {
            const cur = Game.currentPlayer(s2).id;
            s2 = Game.applyAction(s2, { type: "PLAY_SCIENCE",
              payload: { playerId: cur, tradeSpent: 0 } });
            for (let k = 0; k < 10; k++) {
              const open = (s2.pendingChoices || []).find((c) => !give({ pendingChoices: [c] }));
              if (!open) break;
              const payload = { playerId: open.playerId, choiceId: open.id };
              if (open.options && open.options.length) payload.optionId = open.options[0].id;
              else if (open.hexKeys && open.hexKeys.length) payload.hexKey = open.hexKeys[0];
              else if (open.optional) payload.dismiss = true;
              else break;
              const next = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE", payload });
              if (next === s2) break;
              s2 = next;
            }
            s2 = Game.applyAction(s2, { type: "END_TURN", payload: { playerId: cur } });
          }
          const offer = give(s2);
          assert("the Ottoman are offered Ibrahim at the start of their turn", !!offer,
            JSON.stringify((s2.pendingChoices || []).map((c) => c.kind)));
          assert("and it is optional, because the card says you may",
            !!offer && offer.optional === true);
          const handed = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: b.me.id, choiceId: offer.id,
              optionId: (offer.options || [])[0].id } });
          const holder = (offer.options || [])[0].id;
          assert("giving it records the holder",
            handed.ibrahimHolder === holder,
            `${handed.ibrahimHolder} vs ${holder}`);
          assert("who is somebody else",
            handed.ibrahimHolder !== b.me.id);
          assert("and the Ottoman get +2 against that player",
            Game.getLeaderAttackBonus(handed, b.me.id, "1,0") >= 2,
            String(Game.getLeaderAttackBonus(handed, b.me.id, "1,0")));
          proves("civ.ottoman");
        }

        // ── Poland ───────────────────────────────────────────────────────
        {
          // "At the start of your FIRST turn, choose another player. Take 1
          // diplomacy card of your choice from that player. You can have any
          // number of diplomacy cards from the chosen player."
          const b = civBoard("poland");
          const pick = (state) => (state.pendingChoices || [])
            .find((c) => /poland/i.test(c.source || "") || c.kind === "poland_target");
          Game.finalizeSetup ? null : null;
          // The offer belongs to the first turn, which the fixture is already in;
          // queue it the way the engine does when a turn starts.
          let s2 = b.st;
          for (let i = 0; i < 3 && !pick(s2); i++) {
            const cur = Game.currentPlayer(s2).id;
            s2 = Game.applyAction(s2, { type: "PLAY_SCIENCE",
              payload: { playerId: cur, tradeSpent: 0 } });
            for (let k = 0; k < 10; k++) {
              const open = (s2.pendingChoices || []).find((c) => !pick({ pendingChoices: [c] }));
              if (!open) break;
              const payload = { playerId: open.playerId, choiceId: open.id };
              if (open.options && open.options.length) payload.optionId = open.options[0].id;
              else if (open.hexKeys && open.hexKeys.length) payload.hexKey = open.hexKeys[0];
              else if (open.optional) payload.dismiss = true;
              else break;
              const next = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE", payload });
              if (next === s2) break;
              s2 = next;
            }
            s2 = Game.applyAction(s2, { type: "END_TURN", payload: { playerId: cur } });
          }
          const choose = pick(s2);
          assert("Poland is asked to choose a player", !!choose,
            JSON.stringify((s2.pendingChoices || []).map((c) => c.kind + "/" + c.source)));
          const chosen = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: b.me.id, choiceId: choose.id,
              optionId: (choose.options || [])[0].id } });
          const take = (chosen.pendingChoices || [])
            .find((c) => c.kind === "take_diplomacy" && c.playerId === b.me.id);
          assert("then which of that player's cards to take", !!take,
            JSON.stringify((chosen.pendingChoices || []).map((c) => c.kind)));
          const took = Game.applyAction(chosen, { type: "RESOLVE_PENDING_CHOICE",
            payload: { playerId: b.me.id, choiceId: take.id,
              optionId: (take.options || [])[0].id } });
          const target = (choose.options || [])[0].id;
          assert("and Poland holds a card from exactly that player",
            (took.players[0].diplomacy || []).some((d) => d.fromId === target),
            JSON.stringify(took.players[0].diplomacy));
          proves("civ.poland");
        }
      }

      {
        // The twelve city-state diplomacy cards. Each is driven with the card
        // and without it, so what is asserted is the card's doing.
        const csBoard = (opts) => {
          const o = opts || {};
          const st = rulesState();
          const me = st.players[0];
          me.cardPlayed = false;
          st.turn.index = st.turn.order.indexOf(me.id);
          st.players.forEach((p) => { p.diplomacy = []; });
          Game.FOCUS_TYPES.forEach((t) => { me.trade[t] = 0; });
          Game.RESOURCES.forEach((r) => { me.resources[r] = 0; });
          Object.values(st.map.hexes).forEach((h) => {
            h.barbarian = false; h.barbarianId = null; h.barbarianToken = null;
            h.barbarianHome = null; h.control = null; h.cityState = null;
            h.resource = null; h.naturalWonder = null; h.naturalWonderSpace = null;
          });
          st.naturalWonders = {};
          for (let q = -3; q <= 8; q++) {
            activate(st, q + ",0", { terrain: "grass" });
            activate(st, q + ",1", { terrain: "grass" });
            activate(st, q + ",-1", { terrain: "grass" });
          }
          activate(st, "0,0", { city: { ownerId: me.id, isCapital: true,
            developed: false, hasWonder: false, wonder: null } });
          if (o.setUp) o.setUp(st, me);
          return { st, me, foe: st.players[1] };
        };
        // Same shape the engine grants: the type matters to Georgia and the
        // effectId to anything that keys off it.
        const envoy = (player, name) => {
          const data = Game.CITY_STATE_DATA[name] || {};
          player.diplomacy = (player.diplomacy || []).concat([{
            fromCityState: name, name, cardId: name.toLowerCase(),
            type: data.type, effectId: data.effectId || null
          }]);
        };
        const attackWith = (st, me, toKey, targetType) => Game.applyAction(st,
          { type: "PLAY_MILITARY_ATTACK", payload: { playerId: me.id, unitId: "a1",
            fromKey: "0,0", toKey, targetType } });
        // Base p6: a turn is choose a card, resolve it, reset it. There is no
        // passing, and END_TURN is refused until a card has been played — so
        // reaching the NEXT start of turn means actually taking this one.
        // Science is the card that needs nothing on the board.
        const takeTurn = (st, exceptChoiceKind) => {
          let s2 = st;
          const cur = Game.currentPlayer(s2).id;
          s2 = Game.applyAction(s2, { type: "PLAY_SCIENCE",
            payload: { playerId: cur, tradeSpent: 0 } });
          for (let i = 0; i < 12; i++) {
            const open = (s2.pendingChoices || [])
              .find((c) => c.kind !== exceptChoiceKind);
            if (!open) break;
            const payload = { playerId: open.playerId, choiceId: open.id };
            if (open.options && open.options.length) payload.optionId = open.options[0].id;
            else if (open.hexKeys && open.hexKeys.length) payload.hexKey = open.hexKeys[0];
            else if (open.optional) payload.dismiss = true;
            else break;
            const next = Game.applyAction(s2, { type: "RESOLVE_PENDING_CHOICE", payload });
            if (next === s2) break;
            s2 = next;
          }
          return Game.applyAction(s2, { type: "END_TURN", payload: { playerId: cur } });
        };

        // ── Carthage ─────────────────────────────────────────────────────

          // "+1 for each city-state token and friendly city within 2 spaces of

          // Carthage itself.

            p2.armies = [{ id: "a1", position: "0,0" }];

              cityState: { name: "Valletta", type: "culture", diplomacyCards: 2 } });

          assert("the plain attack opens", !!plainOut.combat);

          envoy(carth.me, "Carthage");
          const out = attackWith(carth.st, carth.me, "1,0", "control");
          assert("Carthage adds support from nearby cities and city-states",
            out.combat.atkBase > base, `${base} -> ${out.combat.atkBase}`);
          assert("and says so in the breakdown",
            (out.combat.atkParts || []).some((p) => /carthage/i.test(p.label)),
            JSON.stringify(out.combat.atkParts));

        // ── Kabul ────────────────────────────────────────────────────────

        // ── Mohenjo Daro ─────────────────────────────────────────────────
        {

          const setUp = (s2) => { activate(s2, "1,0", { terrain: "hill" }); };

          const out = Game.tryApplyAction(moh.st, { type: "PLAY_CULTURE",
