<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civ: New Dawn</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/peerjs-1.5.4.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- LOBBY -->
    <div id="lobby" class="panel-lobby">
      <h1>Civ: New Dawn</h1>
      <div class="lobby-form">
        <label>Name <input type="text" id="inp-name" value="Player" maxlength="16"></label>
        <label>Color
          <!-- Terra Incognita seats five. These are the five printed component
               colours; ui.js rebuilds this list from CivCardArt.colors at boot
               so it can never fall behind the components again - purple was
               missing here while the engine, the seat table and every purple
               asset already existed, so the fifth player simply could not be
               chosen. -->
          <select id="inp-color">
            <option value="#169eae">Blue</option>
            <option value="#d94747">Red</option>
            <option value="#e88b24">Orange</option>
            <option value="#76a94f">Green</option>
            <option value="#8b62b5">Purple</option>
          </select>
        </label>
        <div class="lobby-actions">
          <button id="btn-local">Local Solo</button>
          <button id="btn-create">Create Room</button>
          <div class="join-row">
            <input type="text" id="inp-join" placeholder="Room code">
            <button id="btn-join">Join</button>
          </div>
        </div>
        <div id="lobby-status"></div>
      </div>
    </div>

    <!-- GAME -->
    <div id="conn-banner" class="hidden" role="status" aria-live="polite">
      <span id="conn-message">Connection lost...</span>
      <button id="btn-net-retry" class="sm ghost hidden">Retry now</button>
      <button id="btn-host-takeover" class="sm hidden">Take over host</button>
    </div>
    <div id="game" class="panel-game hidden">
      <header id="header">
        <span id="hdr-title">Civ: New Dawn</span>
        <span id="hdr-room"></span>
        <span id="net-status" class="net-status local" role="status" aria-live="polite">Local</span>
        <span id="hdr-round"></span>
        <span id="hdr-turn"></span>
        <button id="btn-undo" class="sm ghost" disabled title="Nothing to undo yet">Undo Turn</button>
        <button id="btn-civ" class="sm">Civilization</button>
        <button id="btn-wonders" class="sm">Wonders</button>
        <button id="btn-players" class="sm">Players</button>
        <button id="btn-diplomacy" class="sm">Diplomacy</button>
        <button id="btn-drawer" class="sm">Log</button>
        <button id="btn-new-game" class="sm ghost">New Game</button>
      </header>

      <div id="layout">
        <aside id="left-panel">
          <section id="players"></section>
          <section id="presence-strip" class="hidden"></section>
          <section id="my-stats"></section>
        </aside>

        <main id="map-container">
          <div id="map"></div>
          <div id="map-tooltip" class="hidden"></div>
          <div id="table-strip"></div>
          <section id="wizard"></section>
          <div id="board-chip" class="hidden"></div>
          <section id="event-wheel"></section>
          <div id="combat-stage" class="hidden"></div>
        </main>
      </div>

      <div id="drawer" class="hidden">
        <div class="drawer-body">
          <button class="detail-close" id="drawer-close" aria-label="Close">&times;</button>
          <section id="host-tools"></section>
          <section id="game-log"></section>
          <div id="chat-row"><input id="chat-input" placeholder="Chat..." maxlength="100"><button id="chat-send">Send</button></div>
        </div>
      </div>

      <footer id="focus-bar">
        <div id="focus-row"></div>
      </footer>
      <div id="reference" class="ref-overlay hidden"><div id="reference-body" class="ref-body"></div></div>
      <div id="toast" class="hidden"></div>
      <div id="action-toast" class="hidden"></div>
      <div id="announce" class="announce"></div>
    </div>
  </div>

  <script src="session-store.js"></script>
  <script src="net.js"></script>
  <script src="rules-data.js"></script>
  <script src="assets/art-data.js"></script>
  <script src="card-art.js"></script>
  <script src="tile-art.js"></script>
  <script src="game.js"></script>
  <script src="ui.js"></script>
</body>
</html>
