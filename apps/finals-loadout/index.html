<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Finals Loadout Saver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #11131b;
      --panel: rgba(19, 20, 28, 0.9);
      --panel-soft: rgba(28, 30, 40, 0.84);
      --text: #f5f7fb;
      --muted: #a6adbd;
      --faint: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.22);
      --gold: #f5c542;
      --gold-strong: #ffcc29;
      --danger: #ff7f7f;
      --card-w: 140px;
      --card-h: 184px;
      --name-h: 39px;
      --radius: 8px;
      --slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-width: 320px;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 0%, rgba(245, 197, 66, 0.14), transparent 27%),
        radial-gradient(circle at 76% 10%, rgba(151, 160, 181, 0.14), transparent 30%),
        linear-gradient(180deg, #10121a 0%, #151722 46%, #191827 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(118deg, rgba(245, 197, 66, 0.18) 0 10%, transparent 10% 48%, rgba(255, 255, 255, 0.06) 48% 49%, transparent 49%),
        radial-gradient(circle at 50% 52%, rgba(255, 255, 255, 0.08), transparent 34%),
        linear-gradient(160deg, #1d1f2c, #0f1016 62%, #181724);
      opacity: 0.72;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(11, 12, 18, 0.2), rgba(11, 12, 18, 0.72)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 140px);
      mix-blend-mode: normal;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .back-link {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(245, 197, 66, 0.34);
      border-radius: 999px;
      background: rgba(9, 10, 14, 0.84);
      color: var(--gold);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .back-link:hover {
      border-color: var(--gold);
      box-shadow: 0 0 28px rgba(245, 197, 66, 0.15);
      transform: translateY(-1px);
    }

    .app-shell {
      width: min(1880px, calc(100% - 24px));
      margin: 0 auto;
      padding: 70px 0 58px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 0.9fr) minmax(300px, 1.1fr) minmax(360px, 1.35fr);
      gap: 18px;
      align-items: center;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(11, 12, 18, 0.76);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
    }

    .brand-kicker {
      display: block;
      margin-bottom: 4px;
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(1.42rem, 2vw, 2.12rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    .class-toggle {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.045);
    }

    .class-button {
      min-height: 45px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: rgba(245, 247, 251, 0.72);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .class-button:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .class-button.is-active {
      border-color: rgba(245, 197, 66, 0.74);
      background: linear-gradient(180deg, rgba(245, 197, 66, 0.24), rgba(245, 197, 66, 0.08));
      color: var(--gold);
      box-shadow: 0 0 22px rgba(245, 197, 66, 0.16);
    }

    .build-actions {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }

    .build-name {
      width: 100%;
      min-height: 45px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      background: rgba(4, 5, 8, 0.68);
      color: var(--text);
      padding: 0 13px;
      font-weight: 800;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .build-name:focus {
      border-color: rgba(245, 197, 66, 0.72);
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.12);
    }

    .build-name::placeholder {
      color: rgba(245, 247, 251, 0.38);
    }

    .action-button {
      min-height: 45px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, opacity 0.16s ease;
    }

    .action-button:hover:not(:disabled) {
      border-color: rgba(255, 255, 255, 0.26);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .action-button.is-primary {
      border-color: rgba(245, 197, 66, 0.8);
      background: linear-gradient(180deg, var(--gold-strong), #d69716);
      color: #111115;
      box-shadow: 0 12px 28px rgba(245, 197, 66, 0.17);
    }

    .status-strip,
    .share-panel,
    .import-bar {
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 5, 8, 0.56);
      backdrop-filter: blur(14px);
    }

    .status-strip {
      min-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease, min-height 0.18s ease, padding 0.18s ease;
    }

    .status-strip.has-message {
      min-height: 36px;
      padding: 9px 12px;
      opacity: 1;
      transform: translateY(0);
    }

    .status-strip span {
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .import-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
    }

    .import-bar[hidden],
    .share-panel[hidden] {
      display: none;
    }

    .import-title {
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .import-meta {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .mini-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .mini-button {
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.06);
      padding: 0 10px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mini-button.is-gold {
      border-color: rgba(245, 197, 66, 0.72);
      background: rgba(245, 197, 66, 0.18);
      color: var(--gold);
    }

    .share-panel {
      padding: 10px;
    }

    .share-link {
      display: block;
      width: 100%;
      min-height: 58px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      padding: 9px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      outline: none;
    }

    .share-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .arena {
      position: relative;
      min-height: 360px;
      margin-top: 14px;
      padding: 26px 48px 36px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(15, 15, 22, 0.32), rgba(12, 12, 18, 0.9)),
        radial-gradient(circle at 22% 100%, rgba(245, 197, 66, 0.26), transparent 30%),
        radial-gradient(circle at 82% 28%, rgba(255, 255, 255, 0.08), transparent 24%),
        linear-gradient(145deg, #23232e 0%, #13131b 55%, #1a1822 100%);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.42);
      overflow: hidden;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(102deg, transparent 0 36%, rgba(245, 197, 66, 0.18) 36% 38%, transparent 38% 60%, rgba(255, 255, 255, 0.05) 60% 61%, transparent 61%),
        radial-gradient(circle at 46% 50%, rgba(255, 255, 255, 0.09), transparent 18%);
      opacity: 0.46;
    }

    .arena::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(12, 12, 17, 0.04), rgba(12, 12, 17, 0.84));
    }

    .picker-ribbon,
    .loadout-board {
      position: relative;
      z-index: 1;
    }

    .picker-ribbon {
      max-height: 272px;
      margin-bottom: 44px;
      opacity: 1;
      transform: translateY(0);
      will-change: max-height, opacity, transform, margin-bottom;
      transition:
        max-height 0.42s var(--slide-ease),
        opacity 0.28s ease,
        transform 0.42s var(--slide-ease),
        margin-bottom 0.42s var(--slide-ease);
    }

    .picker-ribbon.is-hidden {
      max-height: 0;
      margin-bottom: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-18px);
    }

    .picker-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 32px;
      margin-bottom: 12px;
    }

    .picker-title {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .picker-title span {
      color: var(--gold);
    }

    .close-picker {
      min-width: 34px;
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
    }

    .picker-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 4px 18px;
      overscroll-behavior-inline: contain;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 255, 255, 0.46) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
      border-radius: 12px;
      transition: background 0.16s ease, box-shadow 0.16s ease;
    }

    .loadout-board {
      margin-top: auto;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 8px;
      overscroll-behavior-inline: contain;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 255, 255, 0.42) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
      border-radius: 12px;
      transition: background 0.16s ease, box-shadow 0.16s ease;
    }

    .loadout-row {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      min-width: max-content;
    }

    .loadout-section {
      flex: 0 0 auto;
    }

    .loadout-section.is-reserve {
      margin-left: 4px;
    }

    .section-title {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-bottom: 9px;
      color: var(--text);
      font-size: clamp(1.08rem, 1.7vw, 1.52rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .section-title::after {
      content: "";
      display: block;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
    }

    .slot-track {
      display: flex;
      gap: 10px;
      padding: 5px 2px;
    }

    .item-card {
      position: relative;
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: var(--card-h);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      background: rgba(16, 16, 22, 0.9);
      color: var(--text);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      outline: none;
      transform: translateZ(0);
      transition: transform 0.2s var(--slide-ease), border-color 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease, opacity 0.16s ease;
      animation: cardIn 0.34s var(--slide-ease) backwards;
      animation-delay: calc(var(--order, 0) * 38ms);
    }

    .item-card:hover,
    .item-card:focus-visible {
      border-color: rgba(245, 197, 66, 0.82);
      box-shadow: 0 0 0 2px rgba(245, 197, 66, 0.22), 0 24px 44px rgba(0, 0, 0, 0.36);
      transform: translateY(-3px) scale(1.018);
      z-index: 4;
    }

    .item-card.is-selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(245, 197, 66, 0.32), 0 20px 48px rgba(0, 0, 0, 0.38);
    }

    .item-card.is-disabled {
      cursor: default;
      filter: grayscale(0.85) brightness(0.68);
      opacity: 0.48;
    }

    .item-card.is-disabled:hover,
    .item-card.is-disabled:focus-visible {
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      transform: none;
    }

    .item-card.is-empty {
      border-style: dashed;
      background: rgba(255, 255, 255, 0.045);
    }

    .item-card.is-pulse {
      animation: cardIn 0.34s var(--slide-ease) backwards, pickPulse 0.42s ease;
    }

    .card-visual {
      position: relative;
      height: calc(var(--card-h) - var(--name-h));
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.18), transparent 34%),
        linear-gradient(180deg, #bacbd4, #737b86);
    }

    .card-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 58%, rgba(0, 0, 0, 0.34)),
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.18), transparent 42%);
    }

    .item-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .image-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 14px;
      background:
        radial-gradient(circle at 50% 36%, rgba(245, 197, 66, 0.18), transparent 36%),
        linear-gradient(180deg, #454b58, #22242c);
      color: rgba(255, 255, 255, 0.78);
      text-align: center;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .image-fallback[hidden] {
      display: none;
    }

    .empty-mark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(245, 247, 251, 0.54);
      font-size: 2rem;
      font-weight: 900;
    }

    .card-name {
      position: relative;
      z-index: 1;
      height: var(--name-h);
      display: grid;
      place-items: center;
      padding: 0 8px;
      background: rgba(14, 13, 19, 0.96);
      color: var(--text);
      text-align: center;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      line-height: 1.02;
    }

    .card-name span {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .check-badge,
    .note-btn,
    .alt-button {
      position: absolute;
      z-index: 3;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
    }

    .check-badge {
      top: 7px;
      right: 7px;
      width: 28px;
      height: 28px;
      background: rgba(38, 39, 48, 0.92);
      color: var(--gold);
      font-size: 1rem;
      opacity: 0;
      transform: translateY(-4px) scale(0.88);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .is-selected .check-badge {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .note-btn {
      top: 7px;
      left: 7px;
      width: 28px;
      height: 28px;
      background: rgba(17, 18, 24, 0.72);
      color: rgba(255, 255, 255, 0.86);
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .note-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .note-btn:hover,
    .note-btn:focus-visible,
    .note-btn.has-note {
      background: rgba(245, 197, 66, 0.94);
      color: #111115;
      outline: none;
      transform: translateY(-1px);
    }

    .note-popover {
      position: absolute;
      left: 7px;
      right: 7px;
      top: 41px;
      z-index: 5;
      max-height: 76px;
      overflow: hidden;
      border: 1px solid rgba(245, 197, 66, 0.34);
      border-radius: 8px;
      background: rgba(8, 9, 13, 0.9);
      color: var(--text);
      padding: 8px 9px;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.25;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-5px);
      transition: opacity 0.16s ease, transform 0.16s ease;
      backdrop-filter: blur(12px);
    }

    .note-btn:hover + .note-popover,
    .note-btn:focus-visible + .note-popover {
      opacity: 1;
      transform: translateY(0);
    }

    .alt-button {
      right: 7px;
      bottom: 7px;
      min-width: 30px;
      height: 26px;
      padding: 0 7px;
      border: 1px solid rgba(245, 197, 66, 0.28);
      background: rgba(17, 18, 24, 0.72);
      color: var(--gold);
      cursor: pointer;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }

    .item-card:hover .alt-button,
    .alt-button:focus-visible,
    .alt-button.has-alts {
      border-color: rgba(245, 197, 66, 0.72);
      background: rgba(245, 197, 66, 0.93);
      color: #111115;
      outline: none;
    }

    .alt-strip {
      position: absolute;
      left: 7px;
      right: 42px;
      bottom: 7px;
      z-index: 3;
      display: flex;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }

    .alt-chip {
      flex: 0 1 auto;
      max-width: 62px;
      min-height: 23px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(8, 9, 13, 0.72);
      color: var(--text);
      padding: 0 7px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.62rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .alt-chip:hover,
    .alt-chip:focus-visible {
      border-color: rgba(245, 197, 66, 0.7);
      outline: none;
    }

    .saved-panel {
      margin-top: 14px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(11, 12, 18, 0.78);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
    }

    .saved-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .saved-head h2 {
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .saved-head span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .saved-rail {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
      overscroll-behavior-inline: contain;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 255, 255, 0.42) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
      border-radius: 12px;
      transition: background 0.16s ease, box-shadow 0.16s ease;
    }

    .picker-strip:hover,
    .picker-strip:focus-within,
    .saved-rail:hover,
    .saved-rail:focus-within {
      background: rgba(255, 255, 255, 0.025);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 30px rgba(255, 255, 255, 0.055);
      cursor: ew-resize;
    }

    .saved-card {
      position: relative;
      flex: 0 0 250px;
      min-height: 112px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      background:
        linear-gradient(135deg, rgba(245, 197, 66, 0.11), transparent 48%),
        rgba(255, 255, 255, 0.045);
      padding: 13px 42px 13px 13px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease;
    }

    .saved-card:hover,
    .saved-card:focus-visible {
      border-color: rgba(245, 197, 66, 0.72);
      background:
        linear-gradient(135deg, rgba(245, 197, 66, 0.16), transparent 48%),
        rgba(255, 255, 255, 0.06);
      outline: none;
      transform: translateY(-2px);
    }

    .saved-card-title {
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .saved-card-meta {
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 800;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .saved-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .saved-badge {
      border: 1px solid rgba(245, 197, 66, 0.28);
      border-radius: 999px;
      color: var(--gold);
      padding: 3px 7px;
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .delete-build {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      color: rgba(255, 255, 255, 0.76);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
    }

    .delete-build:hover,
    .delete-build:focus-visible {
      border-color: rgba(255, 127, 127, 0.72);
      color: var(--danger);
      outline: none;
    }

    .empty-saved {
      flex: 0 0 auto;
      color: rgba(245, 247, 251, 0.48);
      padding: 20px 4px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(10px);
      opacity: 1;
      transition: opacity 0.16s ease;
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .note-modal {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 70;
      width: min(460px, calc(100% - 28px));
      border: 1px solid rgba(245, 197, 66, 0.28);
      border-radius: 16px;
      background: rgba(14, 15, 20, 0.96);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.56);
      transform: translate(-50%, -50%);
      overflow: hidden;
    }

    .note-modal[hidden] {
      display: none;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-title {
      min-width: 0;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.055);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
    }

    .note-textarea {
      display: block;
      width: calc(100% - 28px);
      min-height: 138px;
      margin: 14px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.32);
      color: var(--text);
      outline: none;
      padding: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .note-textarea:focus {
      border-color: rgba(245, 197, 66, 0.72);
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.1);
    }

    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .char-count {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pickPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(245, 197, 66, 0.42), 0 18px 34px rgba(0, 0, 0, 0.28);
      }
      100% {
        box-shadow: 0 0 0 18px rgba(245, 197, 66, 0), 0 18px 34px rgba(0, 0, 0, 0.28);
      }
    }

    @media (max-width: 1160px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .build-actions {
        grid-template-columns: minmax(180px, 1fr) repeat(3, auto);
      }
    }

    @media (max-width: 760px) {
      :root {
        --card-w: 136px;
        --card-h: 184px;
        --name-h: 39px;
      }

      .app-shell {
        width: min(100% - 12px, 1880px);
        padding-top: 62px;
      }

      .topbar {
        padding: 12px;
        border-radius: 15px;
      }

      .class-toggle {
        overflow-x: auto;
      }

      .class-button {
        min-width: 104px;
      }

      .build-actions {
        grid-template-columns: 1fr 1fr;
      }

      .build-name {
        grid-column: 1 / -1;
      }

      .action-button {
        min-height: 42px;
      }

      .arena {
        min-height: 390px;
        padding: 18px 12px 24px;
        border-radius: 15px;
      }

      .picker-ribbon {
        margin-bottom: 28px;
      }

      .loadout-row {
        gap: 26px;
      }

      .slot-track {
        gap: 8px;
      }

      .section-title {
        font-size: 1.08rem;
      }

      .card-name {
        font-size: 0.74rem;
      }

      .saved-card {
        flex-basis: 220px;
      }

      .import-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .mini-actions {
        justify-content: stretch;
      }

      .mini-button {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" href="../../index.html">Hub</a>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-kicker">The Finals</span>
        <h1>Loadout Saver</h1>
      </div>
      <nav id="classToggle" class="class-toggle" aria-label="Class selector"></nav>
      <div class="build-actions">
        <input id="buildNameInput" class="build-name" type="text" maxlength="60" autocomplete="off" placeholder="Build name">
        <button id="saveButton" class="action-button is-primary" type="button">Save</button>
        <button id="shareButton" class="action-button" type="button">Share</button>
        <button id="resetButton" class="action-button" type="button">Reset</button>
      </div>
    </header>

    <div id="statusStrip" class="status-strip" aria-live="polite"></div>
    <div id="sharedBanner" class="import-bar" hidden></div>
    <div id="shareOutput" class="share-panel" hidden></div>

    <section class="arena" aria-label="Loadout builder">
      <div id="pickerRibbon" class="picker-ribbon is-hidden"></div>
      <div id="loadoutBoard" class="loadout-board"></div>
    </section>

    <section class="saved-panel" aria-label="Saved builds">
      <div class="saved-head">
        <h2>Saved Builds</h2>
        <span id="savedCount">0 builds</span>
      </div>
      <div id="savedBuilds" class="saved-rail"></div>
    </section>
  </main>

  <div id="modalOverlay" class="modal-overlay" hidden></div>
  <section id="noteModal" class="note-modal" aria-modal="true" role="dialog" hidden></section>

  <script>
    const STORAGE_KEY = 'finals-loadouts';
    const STORAGE_VERSION = 2;
    const SHARE_HASH_PREFIX = '#shared=';
    const MAX_NOTE_LENGTH = 220;
    const MAX_ALTERNATIVES = 3;
    const MAX_RESERVE_ALTERNATIVES = MAX_ALTERNATIVES;
    const RAIL_GLIDE_MS = 360;
    const RAIL_LINE_PX = 42;
    const WIKI_FILE_BASE = 'https://www.thefinals.wiki/wiki/Special:Redirect/file/';

    const CLASS_META = {
      light: { label: 'Light', short: 'LGT' },
      medium: { label: 'Medium', short: 'MED' },
      heavy: { label: 'Heavy', short: 'HVY' }
    };

    const WIKI_IMAGE_FILENAMES = {
      'Cloaking Device': 'Cloaking Device Rank 1.png',
      'Evasive Dash': 'Evasive Dash Rank 1.png',
      'Grappling Hook': 'Grappling Hook Rank 1.png',
      '93R': '93R Rank 1.png',
      'V9S': 'V9S Rank 1.png',
      'M11': 'M11 Rank 1.png',
      'XP-54': 'XP-54 Rank 1.png',
      'M26 Matter': 'M26 Matter Rank 1.png',
      'SH1900': 'SH1900 Rank 1.png',
      'ARN-220': 'ARN-220 Rank 1.png',
      'LH1': 'LH1 Rank 1.png',
      'SR-84': 'SR-84 Rank 1.png',
      'Dagger': 'Dagger Rank 1.png',
      'Recurve Bow': 'Recurve Bow Rank 1.png',
      'Sword': 'Sword Rank 1.png',
      'Throwing Knives': 'Throwing Knives Rank 1.png',
      'Breach Charge': 'Breach Charge Rank 1.png',

      'Glitch Grenade': 'Glitch Grenade Rank 1.png',
      'Gravity Vortex': 'Gravity Vortex Rank 1.png',
      'H+ Infuser': 'HPlus Infuser Rank 1.png',
      'Nullifier': 'Nullifier Rank 1.png',
      'Sonar Grenade': 'Sonar Grenade Rank 1.png',
      'Thermal Bore': 'Thermal Bore Rank 1.png',
      'Thermal Vision': 'Thermal Vision Maintenance.png',
      'Tracking Dart': 'Tracking Dart Rank 1.png',
      'Vanishing Bomb': 'Vanishing Bomb Rank 1.png',
      'Dematerializer': 'Dematerializer Rank 1.png',
      'Guardian Turret': 'Guardian Turret Card.png',
      'Healing Beam': 'Healing Beam Card.png',
      'Recon Senses': 'Recon Senses Maintenance.png',
      'Shockwave': 'Shockwave Card.png',
      'R .357': 'R .357 Rank 1.png',
      'P90': 'P90 Rank 1.png',
      'Cerberus 12GA': 'Cerberus 12GA Rank 1.png',
      'Model 1887': 'Model 1887 Rank 1.png',
      'AKM': 'AKM Rank 1.png',
      'FCAR': 'FCAR Rank 1.png',
      'FAMAS': 'FAMAS Rank 1.png',

      'Pike-556': 'Pike-556 Rank 1.png',

      'APS Turret': 'APS Turret Rank 1.png',
      'Breach Drill': 'Breach Drill Rank 1.png',
      'Data Reshaper': 'Data Reshaper Rank 1.png',
      'Defibrillator': 'Defibrillator  Rank 1.png',
      'Explosive Mine': 'Explosive Mine Rank 1.png',
      'Gas Mine': 'Gas Mine Rank 1.png',
      'Glitch Trap': 'Glitch Trap Rank 1.png',
      'Hover Pad': 'Hover Pad Rank 1.png',
      'Jump Pad': 'Jump Pad Rank 1.png',
      'Proximity Sensor': 'Motion Sensor Rank 1.png',
      'Zipline': 'Zipline Rank 1.png',
      "Charge 'N' Slam": 'Charge_N_Slam Rank 1.png',
      'Goo Gun': 'Goo Gun Card.png',
      'Mesh Shield': 'Mesh Shield Rank 1.png',
      'Winch Claw': 'Winch Claw Rank 1.png',
      '.50 Akimbo': '.50 Akimbo Rank 1.png',
      'BFR Titan': 'BFR Titan Rank 1.png',
      'KS-23': 'KS-23 Rank 1.png',
      'SA1216': 'SA1216 Rank 1.png',
      'ShAK-50': 'ShAK-50 Rank 1.png',
      'Lewis Gun': 'Lewis Gun Rank 1.png',
      'M60': 'M60 Rank 1.png',
      'M134 Minigun': 'M134 Minigun Rank 1.png',
      'MGL32': 'MGL32 Rank 1.png',
      'Flamethrower': 'Flamethrower Rank 1.png',
      'Sledgehammer': 'Sledgehammer Rank 1.png',
      'Spear': 'Spear Rank 1.png',
      'Anti-Gravity Cube': 'Anti-Gravity Cube Rank 1.png',
      'Barricade': 'Barricade  Rank 1.png',
      'C4': 'C4 Rank 1.png',
      'Dome Shield': 'Dome Shield Rank 1.png',
      'Healing Emitter': 'Healing Emitter Rank 1.png',
      'Lockbolt': 'Lockbolt Rank 1.png',
      'Pyro Mine': 'Pyro Mine Rank 1.png',
      'RPG-7': 'RPG-7 Rank 1.png',
      'Flashbang': 'Flashbang  Rank 1.png',
      'Frag Grenade': 'Frag Grenade Rank 1.png',
      'Gas Grenade': 'Gas Grenade Rank 1.png',
      'Goo Grenade': 'Goo Grenade Rank 1.png',
      'Pyro Grenade': 'Pyro Grenade Rank 1.png',
      'Smoke Grenade': 'Smoke Grenade Rank 1.png'
    };

    const RAW_GAME_DATA = {
      sharedGadgets: [
        'Flashbang',
        'Frag Grenade',
        'Gas Grenade',
        'Goo Grenade',
        'Pyro Grenade',
        'Smoke Grenade'
      ],
      classes: {
        light: {
          specializations: ['Cloaking Device', 'Evasive Dash', 'Grappling Hook'],
          weapons: ['93R', 'V9S', 'M11', 'XP-54', 'M26 Matter', 'SH1900', 'ARN-220', 'LH1', 'SR-84', 'Dagger', 'Recurve Bow', 'Sword', 'Throwing Knives'],
          gadgets: ['Breach Charge', 'Gateway', 'Glitch Grenade', 'Gravity Vortex', 'H+ Infuser', 'Nullifier', 'Sonar Grenade', 'Thermal Bore', 'Thermal Vision', 'Tracking Dart', 'Vanishing Bomb']
        },
        medium: {
          specializations: ['Dematerializer', 'Guardian Turret', 'Healing Beam', 'Recon Senses', 'Shockwave'],
          weapons: ['R .357', 'P90', 'Cerberus 12GA', 'Model 1887', 'AKM', 'FCAR', 'FAMAS', 'CB-01 Repeater', 'Chimera-XB', 'Pike-556', 'CL-40', 'Dual Blades', 'Riot Shield'],
          gadgets: ['APS Turret', 'Breach Drill', 'Data Reshaper', 'Defibrillator', 'Explosive Mine', 'Gas Mine', 'Glitch Trap', 'Hover Pad', 'Jump Pad', 'Proximity Sensor', 'Zipline']
        },
        heavy: {
          specializations: ["Charge 'N' Slam", 'Goo Gun', 'Mesh Shield', 'Winch Claw'],
          weapons: ['.50 Akimbo', 'BFR Titan', 'KS-23', 'SA1216', 'ShAK-50', 'Lewis Gun', 'M60', 'M134 Minigun', 'MGL32', 'Flamethrower', 'Sledgehammer', 'Spear'],
          gadgets: ['Anti-Gravity Cube', 'Barricade', 'C4', 'Dome Shield', 'Explosive Mine', 'Healing Emitter', 'Lockbolt', 'Proximity Sensor', 'Pyro Mine', 'RPG-7']
        }
      }
    };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function truncateText(value, limit) {
      const normalized = String(value || '').trim().replace(/\s+/g, ' ');
      return normalized.length > limit ? `${normalized.slice(0, Math.max(0, limit - 3))}...` : normalized;
    }

    function normalizeNoteValue(value) {
      if (typeof value !== 'string') {
        return '';
      }
      return value.replace(/\r\n/g, '\n').slice(0, MAX_NOTE_LENGTH);
    }

    function getImageFilename(name) {
      return WIKI_IMAGE_FILENAMES[name] || `${name} Rank 1.png`;
    }

    function buildImageUrl(filename) {
      return WIKI_FILE_BASE + encodeURIComponent(filename.replace(/ /g, '_'));
    }

    function makeItem(name, type, classKey) {
      const imageFilename = getImageFilename(name);
      return {
        name,
        type,
        className: classKey ? CLASS_META[classKey].label : null,
        imageFilename,
        imageUrl: buildImageUrl(imageFilename)
      };
    }

    function buildGameData() {
      const classes = {};
      const catalog = {};

      Object.entries(RAW_GAME_DATA.classes).forEach(([classKey, classData]) => {
        classes[classKey] = {
          specializations: classData.specializations.map((name) => makeItem(name, 'specialization', classKey)),
          weapons: classData.weapons.map((name) => makeItem(name, 'weapon', classKey)),
          gadgets: classData.gadgets.map((name) => makeItem(name, 'gadget', classKey))
        };
      });

      const sharedGadgets = RAW_GAME_DATA.sharedGadgets.map((name) => makeItem(name, 'gadget', null));

      Object.values(classes).forEach((classData) => {
        ['specializations', 'weapons', 'gadgets'].forEach((group) => {
          classData[group].forEach((item) => {
            catalog[item.name] = item;
          });
        });
      });

      sharedGadgets.forEach((item) => {
        catalog[item.name] = item;
      });

      return { classes, sharedGadgets, catalog };
    }

    const GAME_DATA = buildGameData();

    function createReserveEntry(primary = null, alternatives = []) {
      return {
        primary,
        alternatives: Array.isArray(alternatives) ? alternatives.slice(0, MAX_RESERVE_ALTERNATIVES) : []
      };
    }

    function createSlotAlternatives(source = {}) {
      const mainGadgets = Array.isArray(source.mainGadgets) ? source.mainGadgets : [];
      return {
        specialization: Array.isArray(source.specialization) ? source.specialization.slice(0, MAX_ALTERNATIVES) : [],
        mainWeapon: Array.isArray(source.mainWeapon) ? source.mainWeapon.slice(0, MAX_ALTERNATIVES) : [],
        mainGadgets: Array.from({ length: 3 }, (_, index) => (
          Array.isArray(mainGadgets[index]) ? mainGadgets[index].slice(0, MAX_ALTERNATIVES) : []
        ))
      };
    }

    function createBlankBuild(classKey) {
      return {
        id: null,
        name: '',
        className: CLASS_META[classKey].label,
        specialization: null,
        mainWeapon: null,
        mainGadgets: [null, null, null],
        slotAlternatives: createSlotAlternatives(),
        reserve: Array.from({ length: 4 }, () => createReserveEntry()),
        savedAt: null
      };
    }

    function cloneReserveEntry(entry) {
      return createReserveEntry(entry && entry.primary ? entry.primary : null, entry && Array.isArray(entry.alternatives) ? entry.alternatives : []);
    }

    function cloneSlotAlternatives(slotAlternatives) {
      return createSlotAlternatives(slotAlternatives);
    }

    function cloneBuild(build) {
      const reserve = Array.isArray(build.reserve) ? build.reserve.slice(0, 4).map(cloneReserveEntry) : [];
      while (reserve.length < 4) {
        reserve.push(createReserveEntry());
      }

      return {
        id: build.id || null,
        name: typeof build.name === 'string' ? build.name : '',
        className: build.className || 'Light',
        specialization: build.specialization || null,
        mainWeapon: build.mainWeapon || null,
        mainGadgets: Array.isArray(build.mainGadgets) ? build.mainGadgets.slice(0, 3).concat([null, null, null]).slice(0, 3) : [null, null, null],
        slotAlternatives: cloneSlotAlternatives(build.slotAlternatives),
        reserve,
        savedAt: build.savedAt || null
      };
    }

    function getClassKeyFromLabel(label) {
      const normalized = typeof label === 'string' ? label.toLowerCase() : '';
      return Object.prototype.hasOwnProperty.call(CLASS_META, normalized) ? normalized : 'light';
    }

    function getClassPools(classKey) {
      const classData = GAME_DATA.classes[classKey];
      return {
        specializations: classData.specializations,
        weapons: classData.weapons,
        gadgets: classData.gadgets,
        sharedGadgets: GAME_DATA.sharedGadgets,
        allGadgets: [...classData.gadgets, ...GAME_DATA.sharedGadgets],
        reserve: [...classData.weapons, ...classData.gadgets, ...GAME_DATA.sharedGadgets]
      };
    }

    function getItemByName(name) {
      return name ? GAME_DATA.catalog[name] || null : null;
    }

    function normalizeItemNotes(rawNotes) {
      const notes = {};
      if (!rawNotes || typeof rawNotes !== 'object') {
        return notes;
      }

      Object.entries(rawNotes).forEach(([itemName, value]) => {
        if (!getItemByName(itemName)) {
          return;
        }
        const normalized = normalizeNoteValue(value);
        if (normalized.trim()) {
          notes[itemName] = normalized;
        }
      });

      return notes;
    }

    function normalizeAlternativeList(values, allowedNames, primary = null) {
      const alternatives = [];
      if (!Array.isArray(values)) {
        return alternatives;
      }

      values.forEach((itemName) => {
        if (
          typeof itemName === 'string' &&
          allowedNames.has(itemName) &&
          itemName !== primary &&
          !alternatives.includes(itemName) &&
          alternatives.length < MAX_ALTERNATIVES
        ) {
          alternatives.push(itemName);
        }
      });

      return alternatives;
    }

    function normalizeSlotAlternatives(rawAlternatives, allowedNames, build) {
      if (!rawAlternatives || typeof rawAlternatives !== 'object') {
        return createSlotAlternatives();
      }

      return {
        specialization: normalizeAlternativeList(rawAlternatives.specialization, allowedNames.specializations, build.specialization),
        mainWeapon: normalizeAlternativeList(rawAlternatives.mainWeapon, allowedNames.weapons, build.mainWeapon),
        mainGadgets: Array.from({ length: 3 }, (_, index) => (
          normalizeAlternativeList(
            Array.isArray(rawAlternatives.mainGadgets) ? rawAlternatives.mainGadgets[index] : [],
            allowedNames.mainGadgets,
            build.mainGadgets[index]
          )
        ))
      };
    }

    function normalizeReserveEntry(entry, allowedNames) {
      if (typeof entry === 'string') {
        return createReserveEntry(allowedNames.has(entry) ? entry : null, []);
      }

      if (!entry || typeof entry !== 'object') {
        return createReserveEntry();
      }

      const primary = typeof entry.primary === 'string' && allowedNames.has(entry.primary) ? entry.primary : null;
      const alternatives = [];
      if (Array.isArray(entry.alternatives)) {
        entry.alternatives.forEach((itemName) => {
          if (
            typeof itemName === 'string' &&
            allowedNames.has(itemName) &&
            itemName !== primary &&
            !alternatives.includes(itemName) &&
            alternatives.length < MAX_RESERVE_ALTERNATIVES
          ) {
            alternatives.push(itemName);
          }
        });
      }

      return createReserveEntry(primary, alternatives);
    }

    function ensureSlotAlternatives(build) {
      if (!build.slotAlternatives) {
        build.slotAlternatives = createSlotAlternatives();
      }
      if (!Array.isArray(build.slotAlternatives.mainGadgets) || build.slotAlternatives.mainGadgets.length < 3) {
        build.slotAlternatives = createSlotAlternatives(build.slotAlternatives);
      }
      return build.slotAlternatives;
    }

    function getAlternativeList(build, area, index = 0) {
      if (area === 'reserve') {
        return build.reserve[index].alternatives;
      }

      const alternatives = ensureSlotAlternatives(build);
      if (area === 'specialization') {
        return alternatives.specialization;
      }
      if (area === 'mainWeapon') {
        return alternatives.mainWeapon;
      }
      if (area === 'mainGadget') {
        return alternatives.mainGadgets[index];
      }
      return [];
    }

    function getPrimaryValue(build, area, index = 0) {
      if (area === 'specialization') {
        return build.specialization;
      }
      if (area === 'mainWeapon') {
        return build.mainWeapon;
      }
      if (area === 'mainGadget') {
        return build.mainGadgets[index];
      }
      if (area === 'reserve') {
        return build.reserve[index].primary;
      }
      return null;
    }

    function setPrimaryValue(build, area, itemName, index = 0) {
      if (area === 'specialization') {
        build.specialization = itemName;
      }
      if (area === 'mainWeapon') {
        build.mainWeapon = itemName;
      }
      if (area === 'mainGadget') {
        build.mainGadgets[index] = itemName;
      }
      if (area === 'reserve') {
        build.reserve[index].primary = itemName;
      }
      const alternatives = getAlternativeList(build, area, index);
      alternatives.splice(0, alternatives.length, ...alternatives.filter((name) => name !== itemName));
    }

    function collectAllSelectedItemNames(build) {
      const names = [];
      if (build.specialization) {
        names.push(build.specialization);
      }
      if (build.mainWeapon) {
        names.push(build.mainWeapon);
      }
      build.mainGadgets.forEach((itemName) => {
        if (itemName) {
          names.push(itemName);
        }
      });
      const slotAlternatives = ensureSlotAlternatives(build);
      slotAlternatives.specialization.forEach((itemName) => {
        if (itemName) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainWeapon.forEach((itemName) => {
        if (itemName) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainGadgets.forEach((alternatives) => {
        alternatives.forEach((itemName) => {
          if (itemName) {
            names.push(itemName);
          }
        });
      });
      build.reserve.forEach((entry) => {
        if (entry.primary) {
          names.push(entry.primary);
        }
        entry.alternatives.forEach((itemName) => {
          if (itemName) {
            names.push(itemName);
          }
        });
      });
      return names;
    }

    function normalizeLoadedBuild(raw) {
      if (!raw || typeof raw !== 'object') {
        return null;
      }

      const classKey = getClassKeyFromLabel(raw.className);
      const pools = getClassPools(classKey);
      const allowedSpecializations = new Set(pools.specializations.map((item) => item.name));
      const allowedWeapons = new Set(pools.weapons.map((item) => item.name));
      const allowedMainGadgets = new Set(pools.allGadgets.map((item) => item.name));
      const allowedReserve = new Set(pools.reserve.map((item) => item.name));
      const build = createBlankBuild(classKey);

      build.id = raw.id || null;
      build.name = typeof raw.name === 'string' ? raw.name.slice(0, 60) : '';
      build.savedAt = typeof raw.savedAt === 'string' ? raw.savedAt : null;

      if (typeof raw.specialization === 'string' && allowedSpecializations.has(raw.specialization)) {
        build.specialization = raw.specialization;
      }

      if (typeof raw.mainWeapon === 'string' && allowedWeapons.has(raw.mainWeapon)) {
        build.mainWeapon = raw.mainWeapon;
      }

      if (Array.isArray(raw.mainGadgets)) {
        build.mainGadgets = raw.mainGadgets.slice(0, 3).map((itemName) => allowedMainGadgets.has(itemName) ? itemName : null);
        while (build.mainGadgets.length < 3) {
          build.mainGadgets.push(null);
        }
      }

      if (Array.isArray(raw.reserve)) {
        build.reserve = raw.reserve.slice(0, 4).map((entry) => normalizeReserveEntry(entry, allowedReserve));
        while (build.reserve.length < 4) {
          build.reserve.push(createReserveEntry());
        }
      }

      build.slotAlternatives = normalizeSlotAlternatives(raw.slotAlternatives, {
        specializations: allowedSpecializations,
        weapons: allowedWeapons,
        mainGadgets: allowedMainGadgets
      }, build);

      const selected = collectAllSelectedItemNames(build);
      if (new Set(selected).size !== selected.length) {
        return null;
      }

      return build;
    }

    function createStorageEnvelope(builds, itemNotes) {
      return {
        version: STORAGE_VERSION,
        builds,
        itemNotes
      };
    }

    function normalizeStorageEnvelope(raw) {
      if (Array.isArray(raw)) {
        return {
          envelope: createStorageEnvelope(raw.map(normalizeLoadedBuild).filter(Boolean), {}),
          migrated: true
        };
      }

      if (!raw || typeof raw !== 'object') {
        return {
          envelope: createStorageEnvelope([], {}),
          migrated: false
        };
      }

      return {
        envelope: createStorageEnvelope(
          Array.isArray(raw.builds) ? raw.builds.map(normalizeLoadedBuild).filter(Boolean) : [],
          normalizeItemNotes(raw.itemNotes)
        ),
        migrated: raw.version !== STORAGE_VERSION
      };
    }

    function loadStorageEnvelope() {
      try {
        return normalizeStorageEnvelope(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'));
      } catch (error) {
        return {
          envelope: createStorageEnvelope([], {}),
          migrated: false
        };
      }
    }

    function encodeSharedEnvelope(envelope) {
      const bytes = new TextEncoder().encode(JSON.stringify(envelope));
      let binary = '';
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function decodeSharedEnvelope(encoded) {
      const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - (base64.length % 4 || 4)) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return normalizeStorageEnvelope(JSON.parse(new TextDecoder().decode(bytes))).envelope;
    }

    function readSharedEnvelopeFromHash() {
      if (!window.location.hash.startsWith(SHARE_HASH_PREFIX)) {
        return null;
      }
      try {
        return decodeSharedEnvelope(window.location.hash.slice(SHARE_HASH_PREFIX.length));
      } catch (error) {
        return null;
      }
    }

    function clearSharedHash() {
      history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);
    }

    const storageLoad = loadStorageEnvelope();
    const state = {
      activeClass: 'light',
      currentBuild: createBlankBuild('light'),
      activeSlot: null,
      savedBuilds: storageLoad.envelope.builds,
      itemNotes: storageLoad.envelope.itemNotes,
      pendingSharedLibrary: readSharedEnvelopeFromHash(),
      pulseKey: '',
      toast: '',
      toastTimer: null,
      shareLink: '',
      noteEditorItem: ''
    };

    const elements = {
      classToggle: document.getElementById('classToggle'),
      buildNameInput: document.getElementById('buildNameInput'),
      saveButton: document.getElementById('saveButton'),
      shareButton: document.getElementById('shareButton'),
      resetButton: document.getElementById('resetButton'),
      statusStrip: document.getElementById('statusStrip'),
      sharedBanner: document.getElementById('sharedBanner'),
      shareOutput: document.getElementById('shareOutput'),
      pickerRibbon: document.getElementById('pickerRibbon'),
      loadoutBoard: document.getElementById('loadoutBoard'),
      savedCount: document.getElementById('savedCount'),
      savedBuilds: document.getElementById('savedBuilds'),
      modalOverlay: document.getElementById('modalOverlay'),
      noteModal: document.getElementById('noteModal')
    };

    const railGlideState = new WeakMap();
    let pickerClearTimer = null;

    function clampNumber(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function prefersReducedMotion() {
      return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    function easeOutCubic(progress) {
      return 1 - Math.pow(1 - progress, 3);
    }

    function getRailWheelDelta(event, rail) {
      let delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      if (event.deltaMode === 1) {
        delta *= RAIL_LINE_PX;
      } else if (event.deltaMode === 2) {
        delta *= rail.clientWidth * 0.9;
      }
      return delta;
    }

    function stepRailGlide(rail, timestamp) {
      const glide = railGlideState.get(rail);
      if (!glide) {
        return;
      }

      const progress = clampNumber((timestamp - glide.startedAt) / RAIL_GLIDE_MS, 0, 1);
      const eased = easeOutCubic(progress);
      rail.scrollLeft = glide.startLeft + ((glide.targetLeft - glide.startLeft) * eased);

      if (progress < 1) {
        glide.rafId = requestAnimationFrame((nextTimestamp) => stepRailGlide(rail, nextTimestamp));
        return;
      }

      rail.scrollLeft = glide.targetLeft;
      railGlideState.delete(rail);
    }

    function glideRailBy(rail, delta) {
      const maxScrollLeft = Math.max(0, rail.scrollWidth - rail.clientWidth);
      const existingGlide = railGlideState.get(rail);
      const originLeft = existingGlide ? existingGlide.targetLeft : rail.scrollLeft;
      const targetLeft = clampNumber(originLeft + delta, 0, maxScrollLeft);

      if (targetLeft === originLeft) {
        return;
      }

      if (prefersReducedMotion()) {
        rail.scrollLeft = targetLeft;
        return;
      }

      if (existingGlide && existingGlide.rafId) {
        cancelAnimationFrame(existingGlide.rafId);
      }

      railGlideState.set(rail, {
        startLeft: rail.scrollLeft,
        targetLeft,
        startedAt: performance.now(),
        rafId: requestAnimationFrame((timestamp) => stepRailGlide(rail, timestamp))
      });
    }

    function buildShareLink() {
      const baseUrl = window.location.href.split('#')[0];
      return `${baseUrl}${SHARE_HASH_PREFIX}${encodeSharedEnvelope(createStorageEnvelope(state.savedBuilds, state.itemNotes))}`;
    }

    function persistEnvelope() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(createStorageEnvelope(state.savedBuilds, state.itemNotes)));
      if (state.shareLink) {
        state.shareLink = buildShareLink();
        renderShareOutput();
      }

      renderStatus();

    function getNotePreview(itemName) {
      return truncateText(state.itemNotes[itemName] || 'Add item note', 108);
    }

    function getCurrentClassKey() {
      return getClassKeyFromLabel(state.currentBuild.className);
    }

    function getPickerTitle() {
      if (!state.activeSlot) {
        return '';
      }

      if (state.activeSlot.mode === 'alternatives') {
        const { area, index } = state.activeSlot;
        if (area === 'specialization') {
          return '<span>Specialization</span> Alternatives';
        }
        if (area === 'mainWeapon') {
          return '<span>Weapon</span> Alternatives';
        }
        if (area === 'mainGadget') {
          return `Gadget ${index + 1} <span>Alternatives</span>`;
        }
        return `Reserve ${index + 1} <span>Alternatives</span>`;
      }

      const { area, index } = state.activeSlot;
      if (area === 'specialization') {
        return '<span>Specialization</span>';
      }
      if (area === 'mainWeapon') {
        return '<span>Weapon</span>';
      }
      if (area === 'mainGadget') {
        return `Gadget <span>${index + 1}</span>`;
      }
      return `Reserve <span>${index + 1}</span>`;
    }

    function getPickerItems() {
      if (!state.activeSlot) {
        return [];
      }

      const pools = getClassPools(state.activeClass);
      if (state.activeSlot.mode === 'alternatives') {
        switch (state.activeSlot.area) {
          case 'specialization':
            return pools.specializations;
          case 'mainWeapon':
            return pools.weapons;
          case 'mainGadget':
            return pools.allGadgets;
          case 'reserve':
            return pools.reserve;
          default:
            return [];
        }
      }

      switch (state.activeSlot.area) {
        case 'specialization':
          return pools.specializations;
        case 'mainWeapon':
          return pools.weapons;
        case 'mainGadget':
          return pools.allGadgets;
        case 'reserve':
          return pools.reserve;
        default:
          return [];
      }
    }

    function collectBlockingNames() {
      if (!state.activeSlot) {
        return new Set(collectAllSelectedItemNames(state.currentBuild));
      }

      const names = [];
      const slot = state.activeSlot;
      const build = state.currentBuild;

      if (build.specialization && !(slot.mode === 'single' && slot.area === 'specialization')) {
        names.push(build.specialization);
      }

      if (build.mainWeapon && !(slot.mode === 'single' && slot.area === 'mainWeapon')) {
        names.push(build.mainWeapon);
      }

      build.mainGadgets.forEach((itemName, index) => {
        if (itemName && !(slot.mode === 'single' && slot.area === 'mainGadget' && slot.index === index)) {
          names.push(itemName);
        }
      });

      const slotAlternatives = ensureSlotAlternatives(build);
      slotAlternatives.specialization.forEach((itemName) => {
        if (itemName && !(slot.mode === 'alternatives' && slot.area === 'specialization')) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainWeapon.forEach((itemName) => {
        if (itemName && !(slot.mode === 'alternatives' && slot.area === 'mainWeapon')) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainGadgets.forEach((alternatives, index) => {
        alternatives.forEach((itemName) => {
          if (itemName && !(slot.mode === 'alternatives' && slot.area === 'mainGadget' && slot.index === index)) {
            names.push(itemName);
          }
        });
      });

      build.reserve.forEach((entry, index) => {
        if (entry.primary && !(slot.mode === 'single' && slot.area === 'reserve' && slot.index === index)) {
          names.push(entry.primary);
        }
        entry.alternatives.forEach((itemName) => {
          if (itemName && !(slot.mode === 'alternatives' && slot.area === 'reserve' && slot.index === index)) {
            names.push(itemName);
          }
        });
      });

      return new Set(names);
    }

    function getCurrentSlotValue() {
      if (!state.activeSlot || state.activeSlot.mode !== 'single') {
        return null;
      }

      const { area, index } = state.activeSlot;
      if (area === 'specialization') {
        return state.currentBuild.specialization;
      }
      if (area === 'mainWeapon') {
        return state.currentBuild.mainWeapon;
      }
      if (area === 'mainGadget') {
        return state.currentBuild.mainGadgets[index];
      }
      if (area === 'reserve') {
        return state.currentBuild.reserve[index].primary;
      }
      return null;
    }

    function findSlotHoldingItem(build, itemName) {
      if (build.specialization === itemName) return { area: 'specialization', index: 0 };
      if (build.mainWeapon === itemName) return { area: 'mainWeapon', index: 0 };
      for (let i = 0; i < build.mainGadgets.length; i++) {
        if (build.mainGadgets[i] === itemName) return { area: 'mainGadget', index: i };
      }
      for (let i = 0; i < build.reserve.length; i++) {
        if (build.reserve[i].primary === itemName) return { area: 'reserve', index: i };
      }
      return null;
    }

    function getPickerItemState(itemName) {
      if (!state.activeSlot) {
        return { selected: false, disabled: false };
      }

      if (state.activeSlot.mode === 'alternatives') {
        const alternatives = getAlternativeList(state.currentBuild, state.activeSlot.area, state.activeSlot.index);
        const selected = alternatives.includes(itemName);
        const blocked = collectBlockingNames().has(itemName);
        const full = alternatives.length >= MAX_ALTERNATIVES;
        return {
          selected,
          disabled: !selected && (blocked || full)
        };
      }

      const selected = getCurrentSlotValue() === itemName;
      return {
        selected,
        disabled: !selected && collectBlockingNames().has(itemName)
      };
    }

    function isBuildComplete(build = state.currentBuild) {
      return Boolean(
        build.name.trim() &&
        build.specialization &&
        build.mainWeapon &&
        build.mainGadgets.every(Boolean) &&
        build.reserve.every((entry) => entry.primary)
      );
    }

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return `build-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function renderItemMedia(item) {
      if (!item) {
        return '<div class="empty-mark">+</div>';
      }

      return `
        <img class="item-img" src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
        <div class="image-fallback" hidden>${escapeHtml(item.name)}</div>
      `;
    }

    function renderNoteTool(itemName) {
      if (!itemName) {
        return '';
      }

      const hasNote = Boolean((state.itemNotes[itemName] || '').trim());
      return `
        <button class="note-btn ${hasNote ? 'has-note' : ''}" type="button" data-note-item="${escapeHtml(itemName)}" aria-label="Edit note for ${escapeHtml(itemName)}">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3.5h8.8L19 7.7V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V5a1.5 1.5 0 0 1 1.5-1.5Zm8 1.9V8.5h3.1L14 5.4ZM8 11h8v1.7H8V11Zm0 3.2h8v1.7H8v-1.7Zm0 3.2h5.7V19H8v-1.6Z"/>
          </svg>
        </button>
        <div class="note-popover" role="tooltip">${escapeHtml(getNotePreview(itemName))}</div>
      `;
    }

    function renderCard({ itemName, emptyLabel, type, selected = false, disabled = false, slotAttrs = '', order = 0, pulseKey = '', altTarget = null }) {
      const item = getItemByName(itemName);
      const cardName = item ? item.name : emptyLabel;
      const isPulse = pulseKey && pulseKey === state.pulseKey;
      const altControls = altTarget ? renderAltControls(altTarget) : '';

      return `
        <article
          class="item-card ${item ? '' : 'is-empty'} ${selected ? 'is-selected' : ''} ${disabled ? 'is-disabled' : ''} ${isPulse ? 'is-pulse' : ''}"
          style="--order: ${order};"

          tabindex="0"

          ${slotAttrs}
        >
          <div class="card-visual">

            ${renderNoteTool(itemName)}
            <span class="check-badge" aria-hidden="true">&#10003;</span>
            ${altControls}
          </div>
          <div class="card-name"><span>${escapeHtml(cardName)}</span></div>
        </article>
      `;
    }

    function renderAltControls(target) {
      const alternatives = getAlternativeList(state.currentBuild, target.area, target.index);
      const chips = alternatives.slice(0, MAX_ALTERNATIVES).map((itemName) => `
        <button class="alt-chip" type="button" data-promote-alt-area="${escapeHtml(target.area)}" data-promote-alt-index="${target.index}" data-alt-name="${escapeHtml(itemName)}" title="Promote ${escapeHtml(itemName)}">${escapeHtml(itemName)}</button>
      `).join('');
      const label = target.area === 'reserve' ? `reserve ${target.index + 1}` : 'slot';
      return `
        <div class="alt-strip">${chips}</div>
        <button class="alt-button ${alternatives.length ? 'has-alts' : ''}" type="button" data-alt-area="${escapeHtml(target.area)}" data-alt-index="${target.index}" aria-label="Manage ${label} alternatives">ALT</button>

    }

    function renderPickerRibbon() {
      if (!state.activeSlot) {
        elements.pickerRibbon.className = 'picker-ribbon is-hidden';

          if (!state.activeSlot && elements.pickerRibbon.classList.contains('is-hidden')) {
            elements.pickerRibbon.innerHTML = '';

        return;

      clearTimeout(pickerClearTimer);
      elements.pickerRibbon.className = 'picker-ribbon';
      elements.pickerRibbon.innerHTML = `
        <div class="picker-topline">

              emptyLabel: item.name,

            });

      `;
    }
