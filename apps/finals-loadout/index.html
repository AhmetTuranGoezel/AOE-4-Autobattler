    function renderClassToggle() {
      elements.classToggle.innerHTML = Object.entries(CLASS_META).map(([classKey, meta]) => `
        <button class="class-button ${state.activeClass === classKey ? 'is-active' : ''}" type="button" data-class="${classKey}">
          ${escapeHtml(meta.label)}
        </button>
      `).join('');
    }

    function renderControls() {
      if (document.activeElement !== elements.buildNameInput) {
        elements.buildNameInput.value = state.currentBuild.name;
      }
      elements.saveButton.disabled = !isBuildComplete();
      elements.saveButton.title = elements.saveButton.disabled ? 'Fill the build name and every slot first' : 'Save build';
    }

    function renderStatus() {
      elements.statusStrip.classList.toggle('has-message', Boolean(state.toast));
      elements.statusStrip.innerHTML = state.toast ? `<span>${escapeHtml(state.toast)}</span>` : '';
    }

    function renderSharedBanner() {
      if (!state.pendingSharedLibrary) {
        elements.sharedBanner.hidden = true;
        elements.sharedBanner.innerHTML = '';
        return;
      }

      const buildCount = state.pendingSharedLibrary.builds.length;
      const noteCount = Object.keys(state.pendingSharedLibrary.itemNotes).length;
      elements.sharedBanner.hidden = false;
      elements.sharedBanner.innerHTML = `
        <div>
          <div class="import-title">Shared library found</div>
          <div class="import-meta">${buildCount} builds / ${noteCount} notes</div>
        </div>
        <div class="mini-actions">
          <button class="mini-button is-gold" type="button" data-import-shared>Import</button>
          <button class="mini-button" type="button" data-dismiss-shared>Dismiss</button>
        </div>
      `;
    }

    function renderShareOutput() {
      elements.shareOutput.hidden = !state.shareLink;
      elements.shareOutput.innerHTML = state.shareLink ? `
        <textarea class="share-link" readonly>${escapeHtml(state.shareLink)}</textarea>
        <div class="share-note">Includes saved builds and item notes</div>
      ` : '';
    }

    function buildHasNotes(build) {
      return collectAllSelectedItemNames(build).some((itemName) => Boolean((state.itemNotes[itemName] || '').trim()));
    }

    function buildHasAlternatives(build) {
      const slotAlternatives = ensureSlotAlternatives(build);
      return (
        slotAlternatives.specialization.length > 0 ||
        slotAlternatives.mainWeapon.length > 0 ||
        slotAlternatives.mainGadgets.some((alternatives) => alternatives.length > 0) ||
        build.reserve.some((entry) => entry.alternatives.length > 0)
      );
    }

    function renderSavedBuilds() {
      elements.savedCount.textContent = `${state.savedBuilds.length} ${state.savedBuilds.length === 1 ? 'build' : 'builds'}`;

      if (!state.savedBuilds.length) {
        elements.savedBuilds.innerHTML = '<div class="empty-saved">No saved builds yet</div>';
        return;
      }

      elements.savedBuilds.innerHTML = state.savedBuilds.map((build) => {
        const badges = [
          buildHasAlternatives(build) ? '<span class="saved-badge">Alt</span>' : '',
          buildHasNotes(build) ? '<span class="saved-badge">Notes</span>' : ''
        ].join('');
        return `
          <article class="saved-card" role="button" tabindex="0" data-load-build="${escapeHtml(build.id)}">
            <button class="delete-build" type="button" data-delete-build="${escapeHtml(build.id)}" aria-label="Delete ${escapeHtml(build.name)}">x</button>
            <div class="saved-card-title">${escapeHtml(build.name || 'Untitled')}</div>
            <div class="saved-card-meta">${escapeHtml(build.className)} / ${escapeHtml(build.specialization || 'No spec')}</div>
            <div class="saved-card-meta">${escapeHtml(build.mainWeapon || 'No weapon')}</div>
            <div class="saved-badges">${badges}</div>
          </article>
        `;
      }).join('');
    }

    function renderNoteModal() {
      const itemName = state.noteEditorItem;
      elements.modalOverlay.hidden = !itemName;
      elements.noteModal.hidden = !itemName;

      if (!itemName) {
        elements.noteModal.innerHTML = '';
        return;
      }

      const value = state.itemNotes[itemName] || '';
      elements.noteModal.innerHTML = `
        <div class="modal-head">
          <div class="modal-title">${escapeHtml(itemName)}</div>
          <button class="modal-close" type="button" data-close-note aria-label="Close note editor">x</button>
        </div>
        <textarea id="noteTextarea" class="note-textarea" maxlength="${MAX_NOTE_LENGTH}" placeholder="Personal item note">${escapeHtml(value)}</textarea>
        <div class="modal-foot">
          <span id="noteCharCount" class="char-count">${value.length}/${MAX_NOTE_LENGTH}</span>
          <div class="mini-actions">
            <button class="mini-button" type="button" data-clear-note title="Clear this item note everywhere">Clear Item Note</button>
            <button class="mini-button is-gold" type="button" data-close-note>Done</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const textarea = document.getElementById('noteTextarea');
        if (textarea) {
          textarea.focus();
          textarea.selectionStart = textarea.value.length;
          textarea.selectionEnd = textarea.value.length;
        }
      }, 0);
    }

    function render() {
      renderClassToggle();
      renderControls();
      renderStatus();
      renderSharedBanner();
      renderShareOutput();
      renderPickerRibbon();
      renderLoadoutBoard();
      renderSavedBuilds();
      renderNoteModal();
    }

    function openSlot(area, index = 0) {
      state.activeSlot = { mode: 'single', area, index };
      renderPickerRibbon();
    }

    function openAlternatives(area, index = 0) {
      state.activeSlot = { mode: 'alternatives', area, index };
      renderPickerRibbon();
    }

    function setPulse(key) {
      state.pulseKey = key;
      setTimeout(() => {
        if (state.pulseKey === key) {
          state.pulseKey = '';
          renderLoadoutBoard();
        }
      }, 420);
    }

    function selectPickerItem(itemName) {
      if (!state.activeSlot) {
        return;
      }

      const itemState = getPickerItemState(itemName);
      const slot = state.activeSlot;

      if (itemState.disabled) {
        if (slot.mode === 'single') {
          const occupied = findSlotHoldingItem(state.currentBuild, itemName);
          if (occupied && occupied.area === slot.area && occupied.index !== slot.index) {
            const currentValue = getCurrentSlotValue();
            setPrimaryValue(state.currentBuild, slot.area, itemName, slot.index);
            setPrimaryValue(state.currentBuild, occupied.area, currentValue || '', occupied.index);
            setPulse(slot.area === 'mainGadget' || slot.area === 'reserve' ? `${slot.area}-${slot.index}` : slot.area);
            state.activeSlot = null;
            render();
            return;
          }
        }
        showToast('Already used');
        return;
      }

      if (slot.mode === 'alternatives') {
        const alternatives = getAlternativeList(state.currentBuild, slot.area, slot.index);
        if (alternatives.includes(itemName)) {
          alternatives.splice(alternatives.indexOf(itemName), 1);
        } else if (alternatives.length < MAX_ALTERNATIVES) {
          alternatives.push(itemName);
        }
        persistEnvelope();
        render();
        return;
      }

      setPrimaryValue(state.currentBuild, slot.area, itemName, slot.index);
      setPulse(slot.area === 'mainGadget' || slot.area === 'reserve' ? `${slot.area}-${slot.index}` : slot.area);

      state.activeSlot = null;
      render();
    }

    function saveBuild() {
      if (!isBuildComplete()) {
        showToast('Complete every slot first');
        return;
      }

      const saved = cloneBuild(state.currentBuild);
      saved.id = saved.id || createId();
      saved.name = saved.name.trim().slice(0, 60);
      saved.savedAt = new Date().toISOString();

      const existingIndex = state.savedBuilds.findIndex((build) => build.id === saved.id);
      if (existingIndex >= 0) {
        state.savedBuilds.splice(existingIndex, 1, saved);
      } else {
        state.savedBuilds.unshift(saved);
      }

      state.currentBuild = cloneBuild(saved);
      persistEnvelope();
      showToast('Saved');
      render();
    }

    function resetCurrentBuild() {
      state.currentBuild = createBlankBuild(state.activeClass);
      state.activeSlot = null;
      state.shareLink = '';
      state.pulseKey = '';
      showToast('Cleared');
      render();
    }

    function loadBuild(id) {
      const build = state.savedBuilds.find((saved) => saved.id === id);
      if (!build) {
        return;
      }
      state.currentBuild = cloneBuild(build);
      state.activeClass = getClassKeyFromLabel(build.className);
      state.activeSlot = null;
      state.shareLink = '';
      showToast('Loaded');
      render();
    }

    function deleteBuild(id) {
      state.savedBuilds = state.savedBuilds.filter((build) => build.id !== id);
      if (state.currentBuild.id === id) {
        state.currentBuild = createBlankBuild(state.activeClass);
      }
      persistEnvelope();
      showToast('Deleted');
      render();
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (error) {
        copied = false;
      }

      textarea.remove();
      return copied;
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          return fallbackCopyText(text);
        }
      }

      return fallbackCopyText(text);
    }

    async function shareLibrary() {
      const link = buildShareLink();
      state.shareLink = link;
      renderShareOutput();
      const copied = await copyTextToClipboard(link);
      showToast(copied ? 'Share link copied' : 'Share link ready');
    }

    function importSharedLibrary() {
      if (!state.pendingSharedLibrary) {
        return;
      }
      state.savedBuilds = state.pendingSharedLibrary.builds;
      state.itemNotes = state.pendingSharedLibrary.itemNotes;
      state.pendingSharedLibrary = null;
      state.currentBuild = createBlankBuild(state.activeClass);
      state.activeSlot = null;
      persistEnvelope();
      clearSharedHash();
      showToast('Imported');
      render();
    }

    function openNoteEditor(itemName) {
      if (!getItemByName(itemName)) {
        return;
      }
      state.noteEditorItem = itemName;
      renderNoteModal();
    }

    function closeNoteEditor() {
      state.noteEditorItem = '';
      render();
    }

    function saveActiveNote(value) {
      const itemName = state.noteEditorItem;
      if (!itemName) {
        return;
      }

      const normalized = normalizeNoteValue(value);
      if (normalized.trim()) {
        state.itemNotes[itemName] = normalized;
      } else {
        delete state.itemNotes[itemName];
      }

      persistEnvelope();
      const count = document.getElementById('noteCharCount');
      if (count) {
        count.textContent = `${normalized.length}/${MAX_NOTE_LENGTH}`;
      }
    }

    function clearActiveNote() {
      if (!state.noteEditorItem) {
        return;
      }
      delete state.itemNotes[state.noteEditorItem];
      persistEnvelope();
      showToast('Cleared item note');
      renderNoteModal();
      renderSavedBuilds();
    }

    function promoteAlternative(area, index, itemName) {
      const alternatives = getAlternativeList(state.currentBuild, area, index);
      if (!alternatives.includes(itemName)) {
        return;
      }
      const previous = getPrimaryValue(state.currentBuild, area, index);
      setPrimaryValue(state.currentBuild, area, itemName, index);
      const refreshedAlternatives = getAlternativeList(state.currentBuild, area, index);
      if (previous && !refreshedAlternatives.includes(previous)) {
        refreshedAlternatives.unshift(previous);
      }
      refreshedAlternatives.splice(MAX_ALTERNATIVES);
      persistEnvelope();
      setPulse(area === 'mainGadget' || area === 'reserve' ? `${area}-${index}` : area);
      render();
    }

    elements.classToggle.addEventListener('click', (event) => {
      const button = event.target.closest('[data-class]');
      if (!button) {
        return;
      }
      const classKey = button.dataset.class;
      if (!CLASS_META[classKey] || state.activeClass === classKey) {
        return;
      }
      state.activeClass = classKey;
      state.currentBuild = createBlankBuild(classKey);
      state.activeSlot = null;
      state.shareLink = '';
      showToast(`${CLASS_META[classKey].label} selected`);
      render();
    });

    elements.buildNameInput.addEventListener('input', () => {
      state.currentBuild.name = elements.buildNameInput.value.slice(0, 60);
      renderControls();
    });

    elements.saveButton.addEventListener('click', saveBuild);
    elements.shareButton.addEventListener('click', shareLibrary);
    elements.resetButton.addEventListener('click', resetCurrentBuild);

    document.addEventListener('click', (event) => {
      const noteButton = event.target.closest('[data-note-item]');
      if (noteButton) {
        event.preventDefault();
        event.stopPropagation();
        openNoteEditor(noteButton.dataset.noteItem);
        return;
      }

      const altButton = event.target.closest('[data-alt-area]');
      if (altButton) {
        event.preventDefault();
        event.stopPropagation();
        openAlternatives(altButton.dataset.altArea, Number(altButton.dataset.altIndex || 0));
        return;
      }

      const promoteAltButton = event.target.closest('[data-promote-alt-area]');
      if (promoteAltButton) {
        event.preventDefault();
        event.stopPropagation();
        promoteAlternative(
          promoteAltButton.dataset.promoteAltArea,
          Number(promoteAltButton.dataset.promoteAltIndex || 0),
          promoteAltButton.dataset.altName
        );
        return;
      }

      if (event.target.closest('[data-close-picker]')) {
        state.activeSlot = null;
        renderPickerRibbon();
        return;
      }

      if (event.target.closest('[data-import-shared]')) {
        importSharedLibrary();
        return;
      }

      if (event.target.closest('[data-dismiss-shared]')) {
        state.pendingSharedLibrary = null;
        clearSharedHash();
        renderSharedBanner();
        return;
      }

      if (event.target.closest('[data-close-note]') || event.target === elements.modalOverlay) {
        closeNoteEditor();
        return;
      }

      if (event.target.closest('[data-clear-note]')) {
        clearActiveNote();
        return;
      }

      const pickerCard = event.target.closest('[data-picker-item]');
      if (pickerCard) {
        if (pickerCard.getAttribute('aria-disabled') === 'true') {
          showToast('Already used');
          return;
        }
        selectPickerItem(pickerCard.dataset.pickerItem);
        return;
      }

      const slotCard = event.target.closest('[data-slot-area]');
      if (slotCard) {
        openSlot(slotCard.dataset.slotArea, Number(slotCard.dataset.slotIndex || 0));
        return;
      }

      const savedDelete = event.target.closest('[data-delete-build]');
      if (savedDelete) {
        event.preventDefault();
        event.stopPropagation();
        deleteBuild(savedDelete.dataset.deleteBuild);
        return;
      }

      const savedCard = event.target.closest('[data-load-build]');
      if (savedCard) {
        loadBuild(savedCard.dataset.loadBuild);
      }
    });

    document.addEventListener('input', (event) => {
      if (event.target.id === 'noteTextarea') {
        saveActiveNote(event.target.value);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (state.noteEditorItem) {
          closeNoteEditor();
        } else if (state.activeSlot) {
          state.activeSlot = null;
          renderPickerRibbon();
        }
        return;
      }

      if (event.key !== 'Enter' && event.key !== ' ') {
        return;
      }

      const keyboardTarget = event.target.closest('[role="button"]');
      if (!keyboardTarget || event.target.closest('button')) {
        return;
      }

      event.preventDefault();
      keyboardTarget.click();
    });

    document.addEventListener('wheel', (event) => {
      const rail = event.target.closest('.picker-strip, .saved-rail');
      if (!rail) {
        return;
      }

      event.preventDefault();

      if (rail.scrollWidth <= rail.clientWidth) {
        return;
      }

      const delta = getRailWheelDelta(event, rail);
      if (!delta) {
        return;
      }

      glideRailBy(rail, delta);
    }, { passive: false });

    window.addEventListener('hashchange', () => {
      state.pendingSharedLibrary = readSharedEnvelopeFromHash();
      renderSharedBanner();
    });

    if (storageLoad.migrated) {
      persistEnvelope();
    }

    render();
  </script>
</body>
</html>
