      elements.weaponStatsPinned.innerHTML = pinnedWeapons.length
        ? pinnedWeapons.map((weapon) => `
            <span class="stats-pin-chip" style="border-color:${weapon.color};">

    function syncWeaponStatsHighlights() {
      document.querySelectorAll('[data-stats-name]').forEach((line) => {
        const name = line.getAttribute('data-stats-name');
        line.classList.toggle('is-hovered', name === state.weaponStats.hoverName);
        line.classList.toggle('is-pinned', state.weaponStats.pinnedNames.has(name));
        line.classList.toggle('is-dimmed', state.weaponStats.pinnedNames.size > 0 && !state.weaponStats.pinnedNames.has(name));
      });
      document.querySelectorAll('[data-weapon-pin]').forEach((button) => {
        const name = button.dataset.weaponPin;
        button.classList.toggle('is-hovered', name === state.weaponStats.hoverName);
        button.classList.toggle('is-pinned', state.weaponStats.pinnedNames.has(name));
      });

      const cursor = elements.weaponStatsPlot.querySelector('[data-stats-cursor]');
      if (cursor) {
        const width = Math.max(1, elements.weaponStatsPlot.clientWidth || 1);
        const viewBoxWidth = Number(elements.weaponStatsPlot.querySelector('svg')?.viewBox?.baseVal?.width) || width;
        const cursorX = state.weaponStats.hoverName
          ? (state.weaponStats.hoverRange / WEAPON_MAX_RANGE) * viewBoxWidth
          : -10;
        cursor.setAttribute('x1', cursorX);
        cursor.setAttribute('x2', cursorX);
      }
    }

    function setWeaponHover(name, rangeMeters) {
      state.weaponStats.hoverName = name || '';
      state.weaponStats.hoverRange = clampNumber(rangeMeters || 0, 0, WEAPON_MAX_RANGE);
      syncWeaponStatsHighlights();
      renderWeaponStatsInfo();
    }

    function findClosestWeaponAtPoint(y, rangeMeters, chartHeight) {
      const lists = [
        { weapons: state.weaponStats.plottedWeapons.filter((weapon) => state.weaponStats.pinnedNames.has(weapon.name)), threshold: 95 },
        { weapons: state.weaponStats.plottedWeapons.filter((weapon) => !state.weaponStats.pinnedNames.has(weapon.name)), threshold: 28 }
      ];

      for (const list of lists) {
        let closest = null;
        let closestDiff = Infinity;
        list.weapons.forEach((weapon) => {
          const value = getWeaponMetricValue(weapon, rangeMeters);
          const clampedValue = Number.isFinite(value) ? Math.min(value, state.weaponStats.maxY) : state.weaponStats.maxY;
          const pixelY = chartHeight - ((clampedValue / state.weaponStats.maxY) * chartHeight);
          const diff = Math.abs(y - pixelY);
          if (diff < list.threshold && diff < closestDiff) {
            closest = weapon;
            closestDiff = diff;
          }
        });
        if (closest) {
          return closest;
        }
      }

      return null;
    }

    function getWeaponPointerTarget(event) {
      if (!state.weaponStats.plottedWeapons.length) {
        return null;
      }
      const rect = elements.weaponStatsPlot.getBoundingClientRect();
      if (rect.width <= 0 || rect.height <= 0) {
        return null;
      }

      const x = clampNumber(event.clientX - rect.left, 0, rect.width);
      const y = clampNumber(event.clientY - rect.top, 0, rect.height);
      const rangeMeters = (x / rect.width) * WEAPON_MAX_RANGE;
      const weapon = findClosestWeaponAtPoint(y, rangeMeters, rect.height);
      return { weapon, rangeMeters };
    }

    function handleWeaponStatsPointerMove(event) {
      const target = getWeaponPointerTarget(event);
      if (!target || !target.weapon) {
        setWeaponHover('', target?.rangeMeters || 0);
        return;
      }
      setWeaponHover(target.weapon.name, target.rangeMeters);
    }

    function toggleWeaponPin(name) {
      if (!getWeaponByName(name)) {
        return;
      }
      if (state.weaponStats.pinnedNames.has(name)) {
        state.weaponStats.pinnedNames.delete(name);
      } else {
        state.weaponStats.pinnedNames.add(name);
      }
      renderWeaponStatsLegend();
      renderWeaponStatsPlot();
      renderWeaponStatsPinned();
      renderWeaponStatsInfo();
    }

    function renderWeaponStats() {
      if (!elements.weaponStatsEmpty) {
        return;
      }

      syncWeaponStatsControls();
      renderWeaponStatsSourceStatus();

      if (state.weaponStats.loadState === 'idle') {
        renderWeaponStatsEmpty('Weapon stat data has not been loaded yet');
        return;
      }
      if (state.weaponStats.loadState === 'loading') {
        renderWeaponStatsEmpty('Loading weapon stat data');
        return;
      }
      if (state.weaponStats.loadState === 'disabled' && !state.weaponStats.weapons.length) {
        renderWeaponStatsEmpty('Live weapon data is gated off. Enable WEAPON_STATS_CONFIG.liveEnabled after source permission is confirmed');
        return;
      }
      if (!state.weaponStats.weapons.length) {
        renderWeaponStatsEmpty('No weapon stat rows are available');
        return;
      }

      state.weaponStats.plottedWeapons = getFilteredWeaponStats();
      state.weaponStats.pinnedNames.forEach((name) => {
        if (!getWeaponByName(name)) {
          state.weaponStats.pinnedNames.delete(name);
        }
      });

      if (!state.weaponStats.plottedWeapons.length) {
        renderWeaponStatsEmpty('No weapons match the selected class filter');
        return;
      }

      elements.weaponStatsEmpty.hidden = true;
      elements.weaponStatsContent.hidden = false;
      state.weaponStats.maxY = getWeaponChartMaxY(state.weaponStats.plottedWeapons);
      renderWeaponStatsLegend();
      renderWeaponStatsPlot();
      renderWeaponStatsInfo();
      renderWeaponStatsPinned();
    }

    function buildShareLink() {
      const baseUrl = window.location.href.split('#')[0];
      return `${baseUrl}${SHARE_HASH_PREFIX}${encodeSharedEnvelope(createStorageEnvelope(state.savedBuilds, state.itemNotes))}`;
    }

    function persistEnvelope() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(createStorageEnvelope(state.savedBuilds, state.itemNotes)));
      if (state.shareLink) {
        state.shareLink = buildShareLink();
        renderShareOutput();
      }
    }

    function showToast(message) {
      state.toast = message;
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        state.toast = '';
        renderStatus();
      }, 2600);
      renderStatus();
    }

    function getNotePreview(itemName) {
      return truncateText(state.itemNotes[itemName] || 'Add item note', 108);
    }

    function getCurrentClassKey() {
      return getClassKeyFromLabel(state.currentBuild.className);
    }

    function getPickerTitle() {
      if (!state.activeSlot) {
        return '';
      }

      if (state.activeSlot.mode === 'alternatives') {
        const { area, index } = state.activeSlot;
        if (area === 'specialization') {
          return '<span>Specialization</span> Alternatives';
        }
        if (area === 'mainWeapon') {
          return '<span>Weapon</span> Alternatives';
        }
        if (area === 'mainGadget') {
          return `Gadget ${index + 1} <span>Alternatives</span>`;
        }
        return `Reserve ${index + 1} <span>Alternatives</span>`;
      }

      const { area, index } = state.activeSlot;
      if (area === 'specialization') {
        return '<span>Specialization</span>';
      }
      if (area === 'mainWeapon') {
        return '<span>Weapon</span>';
      }
      if (area === 'mainGadget') {
        return `Gadget <span>${index + 1}</span>`;
      }
      return `Reserve <span>${index + 1}</span>`;
    }

    function getPickerItems() {
      if (!state.activeSlot) {
        return [];
      }

      const pools = getClassPools(state.activeClass);
      if (state.activeSlot.mode === 'alternatives') {
        switch (state.activeSlot.area) {
          case 'specialization':
            return pools.specializations;
          case 'mainWeapon':
            return pools.weapons;
          case 'mainGadget':
            return pools.allGadgets;
          case 'reserve':
            return pools.reserve;
          default:
            return [];
        }
      }

      switch (state.activeSlot.area) {
        case 'specialization':
          return pools.specializations;
        case 'mainWeapon':
          return pools.weapons;
        case 'mainGadget':
          return pools.allGadgets;
        case 'reserve':
          return pools.reserve;
        default:
          return [];
      }
    }

    function collectBlockingNames() {
      if (!state.activeSlot) {
        return new Set(collectAllSelectedItemNames(state.currentBuild));
      }

      const names = [];
      const slot = state.activeSlot;
      const build = state.currentBuild;

      if (build.specialization && !(slot.mode === 'single' && slot.area === 'specialization')) {
        names.push(build.specialization);
      }

      if (build.mainWeapon && !(slot.mode === 'single' && slot.area === 'mainWeapon')) {
        names.push(build.mainWeapon);
      }

      build.mainGadgets.forEach((itemName, index) => {
        if (itemName && !(slot.mode === 'single' && slot.area === 'mainGadget' && slot.index === index)) {
          names.push(itemName);
        }
      });

      const slotAlternatives = ensureSlotAlternatives(build);
      slotAlternatives.specialization.forEach((itemName) => {
        if (itemName && !(slot.mode === 'alternatives' && slot.area === 'specialization')) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainWeapon.forEach((itemName) => {
        if (itemName && !(slot.mode === 'alternatives' && slot.area === 'mainWeapon')) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainGadgets.forEach((alternatives, index) => {
        alternatives.forEach((itemName) => {
          if (itemName && !(slot.mode === 'alternatives' && slot.area === 'mainGadget' && slot.index === index)) {
            names.push(itemName);
          }
        });
      });

      build.reserve.forEach((entry, index) => {
        if (entry.primary && !(slot.mode === 'single' && slot.area === 'reserve' && slot.index === index)) {
          names.push(entry.primary);
        }
        entry.alternatives.forEach((itemName) => {
          if (itemName && !(slot.mode === 'alternatives' && slot.area === 'reserve' && slot.index === index)) {
            names.push(itemName);
          }
        });
      });

      return new Set(names);
    }

    function getCurrentSlotValue() {
      if (!state.activeSlot || state.activeSlot.mode !== 'single') {
        return null;
      }

      const { area, index } = state.activeSlot;
      if (area === 'specialization') {
        return state.currentBuild.specialization;
      }
      if (area === 'mainWeapon') {
        return state.currentBuild.mainWeapon;
      }
      if (area === 'mainGadget') {
        return state.currentBuild.mainGadgets[index];
      }
      if (area === 'reserve') {
        return state.currentBuild.reserve[index].primary;
      }
      return null;
    }

    function findSlotHoldingItem(build, itemName) {
      if (build.specialization === itemName) return { area: 'specialization', index: 0 };
      if (build.mainWeapon === itemName) return { area: 'mainWeapon', index: 0 };
      for (let i = 0; i < build.mainGadgets.length; i++) {
        if (build.mainGadgets[i] === itemName) return { area: 'mainGadget', index: i };
      }
      for (let i = 0; i < build.reserve.length; i++) {
        if (build.reserve[i].primary === itemName) return { area: 'reserve', index: i };
      }
      return null;
    }

    function getSwappableOccupiedSlot(itemName) {
      if (!state.activeSlot || state.activeSlot.mode !== 'single') {
        return null;
      }

      const occupied = findSlotHoldingItem(state.currentBuild, itemName);
      if (
        occupied &&
        occupied.area === state.activeSlot.area &&
        occupied.index !== state.activeSlot.index
      ) {
        return occupied;
      }

      return null;
    }

    function getPickerItemState(itemName) {
      if (!state.activeSlot) {
        return { selected: false, disabled: false };
      }

      if (state.activeSlot.mode === 'alternatives') {
        const alternatives = getAlternativeList(state.currentBuild, state.activeSlot.area, state.activeSlot.index);
        const selected = alternatives.includes(itemName);
        const blocked = collectBlockingNames().has(itemName);
        const full = alternatives.length >= MAX_ALTERNATIVES;
        return {
          selected,
          disabled: !selected && (blocked || full)
        };
      }

      const selected = getCurrentSlotValue() === itemName;
      const blocked = collectBlockingNames().has(itemName);
      return {
        selected,
        disabled: !selected && blocked && !getSwappableOccupiedSlot(itemName)
      };
    }

    function isBuildComplete(build = state.currentBuild) {
      return Boolean(
        build.name.trim() &&
        build.specialization &&
        build.mainWeapon &&
        build.mainGadgets.every(Boolean) &&
        build.reserve.every((entry) => entry.primary)
      );
    }

    function createId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return `build-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function renderItemMedia(item) {
      if (!item) {
        return '<div class="empty-mark">+</div>';
      }

      return `
        <img class="item-img" src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
        <div class="image-fallback" hidden>${escapeHtml(item.name)}</div>
      `;
    }

    function renderNoteTool(itemName) {
      if (!itemName) {
        return '';
      }

      const hasNote = Boolean((state.itemNotes[itemName] || '').trim());
      return `
        <button class="note-btn ${hasNote ? 'has-note' : ''}" type="button" data-note-item="${escapeHtml(itemName)}" aria-label="Edit note for ${escapeHtml(itemName)}">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3.5h8.8L19 7.7V20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20V5a1.5 1.5 0 0 1 1.5-1.5Zm8 1.9V8.5h3.1L14 5.4ZM8 11h8v1.7H8V11Zm0 3.2h8v1.7H8v-1.7Zm0 3.2h5.7V19H8v-1.6Z"/>
          </svg>
        </button>
        <div class="note-popover" role="tooltip">${escapeHtml(getNotePreview(itemName))}</div>
      `;
    }

    function renderCard({ itemName, emptyLabel, type, selected = false, disabled = false, slotAttrs = '', order = 0, pulseKey = '', altTarget = null }) {
      const item = getItemByName(itemName);
      const cardName = item ? item.name : emptyLabel;
      const isPulse = pulseKey && pulseKey === state.pulseKey;
      const altControls = altTarget ? renderAltControls(altTarget) : '';

      return `
        <article
          class="item-card ${item ? '' : 'is-empty'} ${selected ? 'is-selected' : ''} ${disabled ? 'is-disabled' : ''} ${isPulse ? 'is-pulse' : ''}"
          style="--order: ${order};"
          role="button"
          tabindex="0"
          aria-disabled="${disabled ? 'true' : 'false'}"
          ${slotAttrs}
        >
          <div class="card-visual">
            ${renderItemMedia(item)}
            ${renderNoteTool(itemName)}
            <span class="check-badge" aria-hidden="true">&#10003;</span>
            ${altControls}
          </div>
          <div class="card-name"><span>${escapeHtml(cardName)}</span></div>
        </article>
      `;
    }

    function renderAltControls(target) {
      const alternatives = getAlternativeList(state.currentBuild, target.area, target.index);
      const chips = alternatives.slice(0, MAX_ALTERNATIVES).map((itemName) => `
        <button class="alt-chip" type="button" data-promote-alt-area="${escapeHtml(target.area)}" data-promote-alt-index="${target.index}" data-alt-name="${escapeHtml(itemName)}" title="Promote ${escapeHtml(itemName)}">${escapeHtml(itemName)}</button>
      `).join('');
      const label = target.area === 'reserve' ? `reserve ${target.index + 1}` : 'slot';
      return `
        <div class="alt-strip">${chips}</div>
        <button class="alt-button ${alternatives.length ? 'has-alts' : ''}" type="button" data-alt-area="${escapeHtml(target.area)}" data-alt-index="${target.index}" aria-label="Manage ${label} alternatives">ALT</button>
      `;
    }

    function renderPickerRibbon() {
      if (!state.activeSlot) {
        elements.pickerRibbon.className = 'picker-ribbon is-hidden';
        clearTimeout(pickerClearTimer);
        pickerClearTimer = setTimeout(() => {
          if (!state.activeSlot && elements.pickerRibbon.classList.contains('is-hidden')) {
            elements.pickerRibbon.innerHTML = '';
          }
        }, 430);
        return;
      }

      clearTimeout(pickerClearTimer);
      elements.pickerRibbon.className = 'picker-ribbon';
      elements.pickerRibbon.innerHTML = `
        <div class="picker-topline">
          <div class="picker-title">${getPickerTitle()}</div>
          <button class="close-picker" type="button" data-close-picker aria-label="Close picker">x</button>
        </div>
        <div class="picker-strip">
          ${getPickerItems().map((item, index) => {
            const itemState = getPickerItemState(item.name);
            return renderCard({
              itemName: item.name,
              emptyLabel: item.name,
              selected: itemState.selected,
              disabled: itemState.disabled,
              slotAttrs: `data-picker-item="${escapeHtml(item.name)}"`,
              order: index
            });
          }).join('')}
        </div>
      `;
    }

    function renderLoadoutBoard() {
      let order = 0;
      const build = state.currentBuild;
      const sections = [
        {
          title: 'Specialization',
          cards: [
            renderCard({
              itemName: build.specialization,
              emptyLabel: 'Select',
              type: 'specialization',
              slotAttrs: 'data-slot-area="specialization"',
              pulseKey: 'specialization',
              order: order++,
              altTarget: { area: 'specialization', index: 0 }
            })
          ]
        },
        {
          title: 'Weapon',
          cards: [
            renderCard({
              itemName: build.mainWeapon,
              emptyLabel: 'Select',
              type: 'weapon',
              slotAttrs: 'data-slot-area="mainWeapon"',
              pulseKey: 'mainWeapon',
              order: order++,
              altTarget: { area: 'mainWeapon', index: 0 }
            })
          ]
        },
        {
          title: 'Gadgets',
          cards: build.mainGadgets.map((itemName, index) => renderCard({
            itemName,
            emptyLabel: 'Select',
            type: 'gadget',
            slotAttrs: `data-slot-area="mainGadget" data-slot-index="${index}"`,
            pulseKey: `mainGadget-${index}`,
            order: order++,
            altTarget: { area: 'mainGadget', index }
          }))
        },
        {
          title: 'Reserve',
          className: 'is-reserve',
          cards: build.reserve.map((entry, index) => renderCard({
            itemName: entry.primary,
            emptyLabel: 'Select',
            slotAttrs: `data-slot-area="reserve" data-slot-index="${index}"`,
            pulseKey: `reserve-${index}`,
            order: order++,
            altTarget: { area: 'reserve', index }
          }))
        }
      ];

      elements.loadoutBoard.innerHTML = `
        <div class="loadout-row">
          ${sections.map((section) => `
            <section class="loadout-section ${section.className || ''}">
              <div class="section-title">${escapeHtml(section.title)}</div>
              <div class="slot-track">${section.cards.join('')}</div>
            </section>
          `).join('')}
        </div>
      `;
    }

    function renderClassToggle() {
      elements.classToggle.innerHTML = Object.entries(CLASS_META).map(([classKey, meta]) => `
        <button class="class-button ${state.activeClass === classKey ? 'is-active' : ''}" type="button" data-class="${classKey}">
          ${escapeHtml(meta.label)}
        </button>
      `).join('');
    }

    function renderControls() {
      if (document.activeElement !== elements.buildNameInput) {
        elements.buildNameInput.value = state.currentBuild.name;
      }
      elements.saveButton.disabled = !isBuildComplete();
      elements.saveButton.title = elements.saveButton.disabled ? 'Fill the build name and every slot first' : 'Save build';
    }

    function renderStatus() {
      elements.statusStrip.classList.toggle('has-message', Boolean(state.toast));
      elements.statusStrip.innerHTML = state.toast ? `<span>${escapeHtml(state.toast)}</span>` : '';
    }

    function renderSharedBanner() {
      if (!state.pendingSharedLibrary) {
        elements.sharedBanner.hidden = true;
        elements.sharedBanner.innerHTML = '';
        return;
      }

      const buildCount = state.pendingSharedLibrary.builds.length;
      const noteCount = Object.keys(state.pendingSharedLibrary.itemNotes).length;
      elements.sharedBanner.hidden = false;
      elements.sharedBanner.innerHTML = `
        <div>
          <div class="import-title">Shared library found</div>
          <div class="import-meta">${buildCount} builds / ${noteCount} notes</div>
        </div>
        <div class="mini-actions">
          <button class="mini-button is-gold" type="button" data-import-shared>Import</button>
          <button class="mini-button" type="button" data-dismiss-shared>Dismiss</button>
        </div>
      `;
    }

    function renderShareOutput() {
      elements.shareOutput.hidden = !state.shareLink;
      elements.shareOutput.innerHTML = state.shareLink ? `
        <textarea class="share-link" readonly>${escapeHtml(state.shareLink)}</textarea>
        <div class="share-note">Includes saved builds and item notes</div>
      ` : '';
    }

    function buildHasNotes(build) {
      return collectAllSelectedItemNames(build).some((itemName) => Boolean((state.itemNotes[itemName] || '').trim()));
    }

    function buildHasAlternatives(build) {
      const slotAlternatives = ensureSlotAlternatives(build);
      return (
        slotAlternatives.specialization.length > 0 ||
        slotAlternatives.mainWeapon.length > 0 ||
        slotAlternatives.mainGadgets.some((alternatives) => alternatives.length > 0) ||
        build.reserve.some((entry) => entry.alternatives.length > 0)
      );
    }

    function renderSavedBuilds() {
      elements.savedCount.textContent = `${state.savedBuilds.length} ${state.savedBuilds.length === 1 ? 'build' : 'builds'}`;

      if (!state.savedBuilds.length) {
        elements.savedBuilds.innerHTML = '<div class="empty-saved">No saved builds yet</div>';
        return;
      }

      elements.savedBuilds.innerHTML = state.savedBuilds.map((build) => {
        const badges = [
          buildHasAlternatives(build) ? '<span class="saved-badge">Alt</span>' : '',
          buildHasNotes(build) ? '<span class="saved-badge">Notes</span>' : ''
        ].join('');
        return `
          <article class="saved-card" role="button" tabindex="0" data-load-build="${escapeHtml(build.id)}">
            <div class="saved-card-actions">
              <button class="saved-action duplicate-build" type="button" data-duplicate-build="${escapeHtml(build.id)}" aria-label="Duplicate ${escapeHtml(build.name)}">Copy</button>
              <button class="saved-action delete-build" type="button" data-delete-build="${escapeHtml(build.id)}" aria-label="Delete ${escapeHtml(build.name)}">x</button>
            </div>
            <div class="saved-card-title">${escapeHtml(build.name || 'Untitled')}</div>
            <div class="saved-card-meta">${escapeHtml(build.className)} / ${escapeHtml(build.specialization || 'No spec')}</div>
            <div class="saved-card-meta">${escapeHtml(build.mainWeapon || 'No weapon')}</div>
            <div class="saved-badges">${badges}</div>
          </article>
        `;
      }).join('');
    }

    function renderNoteModal() {
      const itemName = state.noteEditorItem;
      elements.modalOverlay.hidden = !itemName;
      elements.noteModal.hidden = !itemName;

      if (!itemName) {
        elements.noteModal.innerHTML = '';
        return;
      }

      const value = state.itemNotes[itemName] || '';
      elements.noteModal.innerHTML = `
        <div class="modal-head">
          <div class="modal-title">${escapeHtml(itemName)}</div>
          <button class="modal-close" type="button" data-close-note aria-label="Close note editor">x</button>
        </div>
        <textarea id="noteTextarea" class="note-textarea" maxlength="${MAX_NOTE_LENGTH}" placeholder="Personal item note">${escapeHtml(value)}</textarea>
        <div class="modal-foot">
          <span id="noteCharCount" class="char-count">${value.length}/${MAX_NOTE_LENGTH}</span>
          <div class="mini-actions">
            <button class="mini-button" type="button" data-clear-note title="Clear this item note everywhere">Clear Item Note</button>
            <button class="mini-button is-gold" type="button" data-close-note>Done</button>
          </div>
        </div>
      `;

      setTimeout(() => {
        const textarea = document.getElementById('noteTextarea');
        if (textarea) {
          textarea.focus();
          textarea.selectionStart = textarea.value.length;
          textarea.selectionEnd = textarea.value.length;
        }
      }, 0);
    }

    function render() {
      renderAppView();
      renderClassToggle();
      renderControls();
      renderStatus();
      renderSharedBanner();
      renderShareOutput();
      renderPickerRibbon();
      renderLoadoutBoard();
      renderSavedBuilds();
      renderNoteModal();
      if (state.activeView === 'stats') {
        renderWeaponStats();
      }
    }

    function openSlot(area, index = 0) {
      state.activeSlot = { mode: 'single', area, index };
      renderPickerRibbon();
    }

    function openAlternatives(area, index = 0) {
      state.activeSlot = { mode: 'alternatives', area, index };
      renderPickerRibbon();
    }

    function setPulse(key) {
      state.pulseKey = key;
      setTimeout(() => {
        if (state.pulseKey === key) {
          state.pulseKey = '';
          renderLoadoutBoard();
        }
      }, 420);
    }

    function selectPickerItem(itemName) {
      if (!state.activeSlot) {
        return;
      }

      const itemState = getPickerItemState(itemName);
      const slot = state.activeSlot;
      const swappableSlot = getSwappableOccupiedSlot(itemName);

      if (swappableSlot) {
        const currentValue = getPrimaryValue(state.currentBuild, slot.area, slot.index);
        setPrimaryValue(state.currentBuild, slot.area, itemName, slot.index);
        setPrimaryValue(state.currentBuild, swappableSlot.area, currentValue, swappableSlot.index);
        setPulse(slot.area === 'mainGadget' || slot.area === 'reserve' ? `${slot.area}-${slot.index}` : slot.area);
        state.activeSlot = null;
        render();
        return;
      }

      if (itemState.disabled) {
        showToast('Already used');
        return;
      }

      if (slot.mode === 'alternatives') {
        const alternatives = getAlternativeList(state.currentBuild, slot.area, slot.index);
        if (alternatives.includes(itemName)) {
          alternatives.splice(alternatives.indexOf(itemName), 1);
        } else if (alternatives.length < MAX_ALTERNATIVES) {
          alternatives.push(itemName);
        }
        persistEnvelope();
        render();
        return;
      }

      setPrimaryValue(state.currentBuild, slot.area, itemName, slot.index);
      setPulse(slot.area === 'mainGadget' || slot.area === 'reserve' ? `${slot.area}-${slot.index}` : slot.area);

      state.activeSlot = null;
      render();
    }

    function saveBuild() {
      if (!isBuildComplete()) {
        showToast('Complete every slot first');
        return;
      }

      const saved = cloneBuild(state.currentBuild);
      saved.id = saved.id || createId();
      saved.name = saved.name.trim().slice(0, 60);
      saved.savedAt = new Date().toISOString();

      const existingIndex = state.savedBuilds.findIndex((build) => build.id === saved.id);
      if (existingIndex >= 0) {
        state.savedBuilds.splice(existingIndex, 1, saved);
      } else {
        state.savedBuilds.unshift(saved);
      }

      state.currentBuild = cloneBuild(saved);
      persistEnvelope();
      showToast('Saved');
      render();
    }

    function resetCurrentBuild() {
      state.currentBuild = createBlankBuild(state.activeClass);
      state.activeSlot = null;
      state.shareLink = '';
      state.pulseKey = '';
      showToast('Cleared');
      render();
    }

    function loadBuild(id) {
      const build = state.savedBuilds.find((saved) => saved.id === id);
      if (!build) {
        return;
      }
      state.currentBuild = cloneBuild(build);
      state.activeClass = getClassKeyFromLabel(build.className);
      state.activeSlot = null;
      state.shareLink = '';
      showToast('Loaded');
      render();
    }

    function getDuplicateBuildName(name) {
      const baseName = String(name || 'Untitled').trim() || 'Untitled';
      const existingNames = new Set(state.savedBuilds.map((build) => build.name));

      for (let copyNumber = 1; copyNumber < 1000; copyNumber++) {
        const suffix = copyNumber === 1 ? ' Copy' : ` Copy ${copyNumber}`;
        const trimmedBase = baseName.slice(0, Math.max(1, 60 - suffix.length)).trim();
        const candidate = `${trimmedBase}${suffix}`.slice(0, 60);
        if (!existingNames.has(candidate)) {
          return candidate;
        }
      }

      return `${baseName.slice(0, 49).trim()} Copy`;
    }

    function duplicateBuild(id) {
      const sourceIndex = state.savedBuilds.findIndex((saved) => saved.id === id);
      if (sourceIndex < 0) {
        return;
      }

      const duplicated = cloneBuild(state.savedBuilds[sourceIndex]);
      duplicated.id = createId();
      duplicated.name = getDuplicateBuildName(duplicated.name);
      duplicated.savedAt = new Date().toISOString();

      state.savedBuilds.splice(sourceIndex + 1, 0, duplicated);
      state.currentBuild = cloneBuild(duplicated);
      state.activeClass = getClassKeyFromLabel(duplicated.className);
      state.activeSlot = null;
      state.shareLink = '';
      persistEnvelope();
      showToast('Duplicated');
      render();
    }

    function deleteBuild(id) {
      state.savedBuilds = state.savedBuilds.filter((build) => build.id !== id);
      if (state.currentBuild.id === id) {
        state.currentBuild = createBlankBuild(state.activeClass);
      }
      persistEnvelope();
      showToast('Deleted');
      render();
    }

    function fallbackCopyText(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (error) {
        copied = false;
      }

      textarea.remove();
      return copied;
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          return fallbackCopyText(text);
        }
      }

      return fallbackCopyText(text);
    }

    async function shareLibrary() {
      const link = buildShareLink();
      state.shareLink = link;
      renderShareOutput();
      const copied = await copyTextToClipboard(link);
      showToast(copied ? 'Share link copied' : 'Share link ready');
    }

    function importSharedLibrary() {
      if (!state.pendingSharedLibrary) {
        return;
      }
      state.savedBuilds = state.pendingSharedLibrary.builds;
      state.itemNotes = state.pendingSharedLibrary.itemNotes;
      state.pendingSharedLibrary = null;
      state.currentBuild = createBlankBuild(state.activeClass);
      state.activeSlot = null;
      persistEnvelope();
      clearSharedHash();
      showToast('Imported');
      render();
    }

    function openNoteEditor(itemName) {
      if (!getItemByName(itemName)) {
        return;
      }
      state.noteEditorItem = itemName;
      renderNoteModal();
    }

    function closeNoteEditor() {
      state.noteEditorItem = '';
      render();
    }

    function saveActiveNote(value) {
      const itemName = state.noteEditorItem;
      if (!itemName) {
        return;
      }

      const normalized = normalizeNoteValue(value);
      if (normalized.trim()) {
        state.itemNotes[itemName] = normalized;
      } else {
        delete state.itemNotes[itemName];
      }

      persistEnvelope();
      const count = document.getElementById('noteCharCount');
      if (count) {
        count.textContent = `${normalized.length}/${MAX_NOTE_LENGTH}`;
      }
    }

    function clearActiveNote() {
      if (!state.noteEditorItem) {
        return;
      }
      delete state.itemNotes[state.noteEditorItem];
      persistEnvelope();
      showToast('Cleared item note');
      renderNoteModal();
      renderSavedBuilds();
    }

    function promoteAlternative(area, index, itemName) {
      const alternatives = getAlternativeList(state.currentBuild, area, index);
      if (!alternatives.includes(itemName)) {
        return;
      }
      const previous = getPrimaryValue(state.currentBuild, area, index);
      setPrimaryValue(state.currentBuild, area, itemName, index);
      const refreshedAlternatives = getAlternativeList(state.currentBuild, area, index);
      if (previous && !refreshedAlternatives.includes(previous)) {
        refreshedAlternatives.unshift(previous);
      }
      refreshedAlternatives.splice(MAX_ALTERNATIVES);
      persistEnvelope();
      setPulse(area === 'mainGadget' || area === 'reserve' ? `${area}-${index}` : area);
      render();
    }

    elements.classToggle.addEventListener('click', (event) => {
      const button = event.target.closest('[data-class]');
      if (!button) {
        return;
      }
      const classKey = button.dataset.class;
      if (!CLASS_META[classKey] || state.activeClass === classKey) {
        return;
      }
      state.activeClass = classKey;
      state.currentBuild = createBlankBuild(classKey);
      state.activeSlot = null;
      state.shareLink = '';
      showToast(`${CLASS_META[classKey].label} selected`);
      render();
    });

    elements.buildNameInput.addEventListener('input', () => {
      state.currentBuild.name = elements.buildNameInput.value.slice(0, 60);
      renderControls();
    });

    elements.saveButton.addEventListener('click', saveBuild);
    elements.shareButton.addEventListener('click', shareLibrary);
    elements.resetButton.addEventListener('click', resetCurrentBuild);

    document.addEventListener('click', (event) => {
      const appTab = event.target.closest('[data-app-view]');
      if (appTab) {
        switchAppView(appTab.dataset.appView);
        return;
      }

      const statsClassButton = event.target.closest('[data-stats-class]');
      if (statsClassButton) {
        state.weaponStats.classFilter = statsClassButton.dataset.statsClass;
        state.weaponStats.hoverName = '';
        renderWeaponStats();
        return;
      }

      const statsTargetButton = event.target.closest('[data-stats-target]');
      if (statsTargetButton) {
        state.weaponStats.targetClass = statsTargetButton.dataset.statsTarget;
        state.weaponStats.hoverName = '';
        renderWeaponStats();
        return;
      }

      const statsHitButton = event.target.closest('[data-stats-hit]');
      if (statsHitButton) {
        state.weaponStats.hitMode = statsHitButton.dataset.statsHit;
        state.weaponStats.hoverName = '';
        renderWeaponStats();
        return;
      }

      const statsMetricButton = event.target.closest('[data-stats-metric]');
      if (statsMetricButton) {
        state.weaponStats.metric = statsMetricButton.dataset.statsMetric;
        state.weaponStats.hoverName = '';
        renderWeaponStats();
        return;
      }

      const weaponPinButton = event.target.closest('[data-weapon-pin]');
      if (weaponPinButton) {
        toggleWeaponPin(weaponPinButton.dataset.weaponPin);
        return;
      }

      const weaponUnpinButton = event.target.closest('[data-weapon-unpin]');
      if (weaponUnpinButton) {
        state.weaponStats.pinnedNames.delete(weaponUnpinButton.dataset.weaponUnpin);
        renderWeaponStats();
        return;
      }

      const noteButton = event.target.closest('[data-note-item]');
      if (noteButton) {
        event.preventDefault();
        event.stopPropagation();
        openNoteEditor(noteButton.dataset.noteItem);
        return;
      }

      const altButton = event.target.closest('[data-alt-area]');
      if (altButton) {
        event.preventDefault();
        event.stopPropagation();
        openAlternatives(altButton.dataset.altArea, Number(altButton.dataset.altIndex || 0));
        return;
      }

      const promoteAltButton = event.target.closest('[data-promote-alt-area]');
      if (promoteAltButton) {
        event.preventDefault();
        event.stopPropagation();
        promoteAlternative(
          promoteAltButton.dataset.promoteAltArea,
          Number(promoteAltButton.dataset.promoteAltIndex || 0),
          promoteAltButton.dataset.altName
        );
        return;
      }

      if (event.target.closest('[data-close-picker]')) {
        state.activeSlot = null;
        renderPickerRibbon();
        return;
      }

      if (event.target.closest('[data-import-shared]')) {
        importSharedLibrary();
        return;
      }

      if (event.target.closest('[data-dismiss-shared]')) {
        state.pendingSharedLibrary = null;
        clearSharedHash();
        renderSharedBanner();
        return;
      }

      if (event.target.closest('[data-close-note]') || event.target === elements.modalOverlay) {
        closeNoteEditor();
        return;
      }

      if (event.target.closest('[data-clear-note]')) {
        clearActiveNote();
        return;
      }

      const pickerCard = event.target.closest('[data-picker-item]');
      if (pickerCard) {
        selectPickerItem(pickerCard.dataset.pickerItem);
        return;
      }

      const slotCard = event.target.closest('[data-slot-area]');
      if (slotCard) {
        openSlot(slotCard.dataset.slotArea, Number(slotCard.dataset.slotIndex || 0));
        return;
      }

      const savedDuplicate = event.target.closest('[data-duplicate-build]');
      if (savedDuplicate) {
        event.preventDefault();
        event.stopPropagation();
        duplicateBuild(savedDuplicate.dataset.duplicateBuild);
        return;
      }

      const savedDelete = event.target.closest('[data-delete-build]');
      if (savedDelete) {
        event.preventDefault();
        event.stopPropagation();
        deleteBuild(savedDelete.dataset.deleteBuild);
        return;
      }

      const savedCard = event.target.closest('[data-load-build]');
      if (savedCard) {
        loadBuild(savedCard.dataset.loadBuild);
      }
    });

    document.addEventListener('input', (event) => {
      if (event.target === elements.headshotRange) {
        state.weaponStats.headshotPct = Number(event.target.value) || 0;
        state.weaponStats.hoverName = '';
        renderWeaponStats();
        return;
      }

      if (event.target.id === 'noteTextarea') {
        saveActiveNote(event.target.value);
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        if (state.noteEditorItem) {
          closeNoteEditor();
        } else if (state.activeSlot) {
          state.activeSlot = null;
          renderPickerRibbon();
        }
        return;
      }

      if (event.key !== 'Enter' && event.key !== ' ') {
        return;
      }

      const keyboardTarget = event.target.closest('[role="button"]');
      if (!keyboardTarget || event.target.closest('button')) {
        return;
      }

      event.preventDefault();
      keyboardTarget.click();
    });

    document.addEventListener('wheel', (event) => {
      const rail = event.target.closest('.picker-strip, .saved-rail');
      if (!rail) {
        return;
      }

      event.preventDefault();

      if (rail.scrollWidth <= rail.clientWidth) {
        return;
      }

      const delta = getRailWheelDelta(event, rail);
      if (!delta) {
        return;
      }

      glideRailBy(rail, delta);
    }, { passive: false });

    elements.weaponStatsPlot.addEventListener('pointermove', handleWeaponStatsPointerMove);
    elements.weaponStatsPlot.addEventListener('pointerleave', () => setWeaponHover('', 0));
    elements.weaponStatsPlot.addEventListener('click', (event) => {
      const target = getWeaponPointerTarget(event);
      if (target?.weapon) {
        toggleWeaponPin(target.weapon.name);
      }
    });

    window.addEventListener('hashchange', () => {
      state.pendingSharedLibrary = readSharedEnvelopeFromHash();
      renderSharedBanner();
    });

    window.addEventListener('resize', () => {
      if (state.activeView === 'stats' && !elements.statsView.hidden) {
        renderWeaponStats();
      }
    });

    if (storageLoad.migrated) {
      persistEnvelope();
    }

    render();
  </script>
</body>
</html>
