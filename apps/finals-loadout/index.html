<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Finals Loadout Saver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #11131b;
      --panel: rgba(19, 20, 28, 0.9);
      --panel-soft: rgba(28, 30, 40, 0.84);
      --text: #f5f7fb;
      --muted: #a6adbd;
      --faint: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.22);
      --gold: #f5c542;
      --gold-strong: #ffcc29;
      --danger: #ff7f7f;
      --card-w: 140px;
      --card-h: 184px;
      --name-h: 39px;
      --radius: 8px;
      --slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-width: 320px;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 0%, rgba(245, 197, 66, 0.14), transparent 27%),
        radial-gradient(circle at 76% 10%, rgba(151, 160, 181, 0.14), transparent 30%),
        linear-gradient(180deg, #10121a 0%, #151722 46%, #191827 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(118deg, rgba(245, 197, 66, 0.18) 0 10%, transparent 10% 48%, rgba(255, 255, 255, 0.06) 48% 49%, transparent 49%),
        radial-gradient(circle at 50% 52%, rgba(255, 255, 255, 0.08), transparent 34%),
        linear-gradient(160deg, #1d1f2c, #0f1016 62%, #181724);
      opacity: 0.72;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(11, 12, 18, 0.2), rgba(11, 12, 18, 0.72)),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 140px);
      mix-blend-mode: normal;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .back-link {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(245, 197, 66, 0.34);
      border-radius: 999px;
      background: rgba(9, 10, 14, 0.84);
      color: var(--gold);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      backdrop-filter: blur(14px);
      transition: border-color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }

    .back-link:hover {
      border-color: var(--gold);
      box-shadow: 0 0 28px rgba(245, 197, 66, 0.15);
      transform: translateY(-1px);
    }

    .app-shell {
      width: min(1880px, calc(100% - 24px));
      margin: 0 auto;
      padding: 70px 0 58px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 0.9fr) minmax(300px, 1.1fr) minmax(360px, 1.35fr);
      gap: 18px;
      align-items: center;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(11, 12, 18, 0.76);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(18px);
    }

    .brand-kicker {
      display: block;
      margin-bottom: 4px;
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(1.42rem, 2vw, 2.12rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    .class-toggle {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.045);
    }

    .class-button {
      min-height: 45px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: rgba(245, 247, 251, 0.72);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .class-button:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .class-button.is-active {
      border-color: rgba(245, 197, 66, 0.74);
      background: linear-gradient(180deg, rgba(245, 197, 66, 0.24), rgba(245, 197, 66, 0.08));
      color: var(--gold);
      box-shadow: 0 0 22px rgba(245, 197, 66, 0.16);
    }

    .app-tabs {
      display: inline-flex;
      gap: 6px;
      margin-top: 12px;
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(11, 12, 18, 0.72);
      backdrop-filter: blur(14px);
    }

    .app-tab {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: rgba(245, 247, 251, 0.72);
      cursor: pointer;
      padding: 0 16px;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .app-tab:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .app-tab.is-active {
      border-color: rgba(245, 197, 66, 0.74);
      background: rgba(245, 197, 66, 0.16);
      color: var(--gold);
    }

    .view-panel[hidden] {
      display: none;
    }

    .build-actions {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
    }

    .build-name {
      width: 100%;
      min-height: 45px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      background: rgba(4, 5, 8, 0.68);
      color: var(--text);
      padding: 0 13px;
      font-weight: 800;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .build-name:focus {
      border-color: rgba(245, 197, 66, 0.72);
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.12);
    }

    .build-name::placeholder {
      color: rgba(245, 247, 251, 0.38);
    }

    .action-button {
      min-height: 45px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, opacity 0.16s ease;
    }

    .action-button:hover:not(:disabled) {
      border-color: rgba(255, 255, 255, 0.26);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .action-button.is-primary {
      border-color: rgba(245, 197, 66, 0.8);
      background: linear-gradient(180deg, var(--gold-strong), #d69716);
      color: #111115;
      box-shadow: 0 12px 28px rgba(245, 197, 66, 0.17);
    }

    .status-strip,
    .share-panel,
    .import-bar {
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 5, 8, 0.56);
      backdrop-filter: blur(14px);
    }

    .status-strip {
      min-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.18s ease, transform 0.18s ease, min-height 0.18s ease, padding 0.18s ease;
    }

    .status-strip.has-message {
      min-height: 36px;
      padding: 9px 12px;
      opacity: 1;
      transform: translateY(0);
    }

    .status-strip span {
      color: var(--gold);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .import-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
    }

    .import-bar[hidden],
    .share-panel[hidden] {
      display: none;
    }

    .import-title {
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .import-meta {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .mini-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .mini-button {
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.06);
      padding: 0 10px;
      color: var(--text);
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .mini-button.is-gold {
      border-color: rgba(245, 197, 66, 0.72);
      background: rgba(245, 197, 66, 0.18);
      color: var(--gold);
    }

    .share-panel {
      padding: 10px;
    }

    .share-link {
      display: block;
      width: 100%;
      min-height: 58px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      padding: 9px 10px;
      font-size: 0.76rem;
      font-weight: 700;
      outline: none;
    }

    .share-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .arena {
      position: relative;
      min-height: 360px;
      margin-top: 14px;
      padding: 26px 48px 36px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(15, 15, 22, 0.32), rgba(12, 12, 18, 0.9)),
        radial-gradient(circle at 22% 100%, rgba(245, 197, 66, 0.26), transparent 30%),
        radial-gradient(circle at 82% 28%, rgba(255, 255, 255, 0.08), transparent 24%),
        linear-gradient(145deg, #23232e 0%, #13131b 55%, #1a1822 100%);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.42);
      overflow: hidden;
    }

    .arena::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(102deg, transparent 0 36%, rgba(245, 197, 66, 0.18) 36% 38%, transparent 38% 60%, rgba(255, 255, 255, 0.05) 60% 61%, transparent 61%),
        radial-gradient(circle at 46% 50%, rgba(255, 255, 255, 0.09), transparent 18%);
      opacity: 0.46;
    }

    .arena::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(12, 12, 17, 0.04), rgba(12, 12, 17, 0.84));
    }

    .picker-ribbon,
    .loadout-board {
      position: relative;
      z-index: 1;
    }

    .picker-ribbon {
      max-height: 272px;
      margin-bottom: 44px;
      opacity: 1;
      transform: translateY(0);
      will-change: max-height, opacity, transform, margin-bottom;
      transition:
        max-height 0.42s var(--slide-ease),
        opacity 0.28s ease,
        transform 0.42s var(--slide-ease),
        margin-bottom 0.42s var(--slide-ease);
    }

    .picker-ribbon.is-hidden {
      max-height: 0;
      margin-bottom: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-18px);
    }

    .picker-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 32px;
      margin-bottom: 12px;
    }

    .picker-title {
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .picker-title span {
      color: var(--gold);
    }

    .close-picker {
      min-width: 34px;
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
    }

    .picker-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 4px 18px;
      overscroll-behavior-inline: contain;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 255, 255, 0.46) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
      border-radius: 12px;
      transition: background 0.16s ease, box-shadow 0.16s ease;
    }

    .loadout-board {
      margin-top: auto;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 8px;
      overscroll-behavior-inline: contain;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 255, 255, 0.42) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
      border-radius: 12px;
      transition: background 0.16s ease, box-shadow 0.16s ease;
    }

    .loadout-row {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      min-width: max-content;
    }

    .loadout-section {
      flex: 0 0 auto;
    }

    .loadout-section.is-reserve {
      margin-left: 4px;
    }

    .section-title {
      display: grid;
      grid-template-columns: 1fr;
      gap: 5px;
      margin-bottom: 9px;
      color: var(--text);
      font-size: clamp(1.08rem, 1.7vw, 1.52rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .section-title::after {
      content: "";
      display: block;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
    }

    .slot-track {
      display: flex;
      gap: 10px;
      padding: 5px 2px;
    }

    .item-card {
      position: relative;
      flex: 0 0 var(--card-w);
      width: var(--card-w);
      height: var(--card-h);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      background: rgba(16, 16, 22, 0.9);
      color: var(--text);
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      outline: none;
      transform: translateZ(0);
      transition: transform 0.2s var(--slide-ease), border-color 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease, opacity 0.16s ease;
      animation: cardIn 0.34s var(--slide-ease) backwards;
      animation-delay: calc(var(--order, 0) * 38ms);
    }

    .item-card:hover,
    .item-card:focus-visible {
      border-color: rgba(245, 197, 66, 0.82);
      box-shadow: 0 0 0 2px rgba(245, 197, 66, 0.22), 0 24px 44px rgba(0, 0, 0, 0.36);
      transform: translateY(-3px) scale(1.018);
      z-index: 4;
    }

    .item-card.is-selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(245, 197, 66, 0.32), 0 20px 48px rgba(0, 0, 0, 0.38);
    }

    .item-card.is-disabled {
      cursor: default;
      filter: grayscale(0.85) brightness(0.68);
      opacity: 0.48;
    }

    .item-card.is-disabled:hover,
    .item-card.is-disabled:focus-visible {
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      transform: none;
    }

    .item-card.is-empty {
      border-style: dashed;
      background: rgba(255, 255, 255, 0.045);
    }

    .item-card.is-pulse {
      animation: cardIn 0.34s var(--slide-ease) backwards, pickPulse 0.42s ease;
    }

    .card-visual {
      position: relative;
      height: calc(var(--card-h) - var(--name-h));
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.18), transparent 34%),
        linear-gradient(180deg, #bacbd4, #737b86);
    }

    .card-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, transparent 58%, rgba(0, 0, 0, 0.34)),
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.18), transparent 42%);
    }

    .item-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .image-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 14px;
      background:
        radial-gradient(circle at 50% 36%, rgba(245, 197, 66, 0.18), transparent 36%),
        linear-gradient(180deg, #454b58, #22242c);
      color: rgba(255, 255, 255, 0.78);
      text-align: center;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .image-fallback[hidden] {
      display: none;
    }

    .empty-mark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: rgba(245, 247, 251, 0.54);
      font-size: 2rem;
      font-weight: 900;
    }

    .card-name {
      position: relative;
      z-index: 1;
      height: var(--name-h);
      display: grid;
      place-items: center;
      padding: 0 8px;
      background: rgba(14, 13, 19, 0.96);
      color: var(--text);
      text-align: center;
      font-size: 0.86rem;
      font-weight: 900;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      line-height: 1.02;
    }

    .card-name span {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .check-badge,
    .note-btn,
    .alt-button {
      position: absolute;
      z-index: 3;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.24);
    }

    .check-badge {
      top: 7px;
      right: 7px;
      width: 28px;
      height: 28px;
      background: rgba(38, 39, 48, 0.92);
      color: var(--gold);
      font-size: 1rem;
      opacity: 0;
      transform: translateY(-4px) scale(0.88);
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .is-selected .check-badge {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .note-btn {
      top: 7px;
      left: 7px;
      width: 28px;
      height: 28px;
      background: rgba(17, 18, 24, 0.72);
      color: rgba(255, 255, 255, 0.86);
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, transform 0.16s ease;
    }

    .note-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .note-btn:hover,
    .note-btn:focus-visible,
    .note-btn.has-note {
      background: rgba(245, 197, 66, 0.94);
      color: #111115;
      outline: none;
      transform: translateY(-1px);
    }

    .note-popover {
      position: absolute;
      left: 7px;
      right: 7px;
      top: 41px;
      z-index: 5;
      max-height: 76px;
      overflow: hidden;
      border: 1px solid rgba(245, 197, 66, 0.34);
      border-radius: 8px;
      background: rgba(8, 9, 13, 0.9);
      color: var(--text);
      padding: 8px 9px;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.25;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-5px);
      transition: opacity 0.16s ease, transform 0.16s ease;
      backdrop-filter: blur(12px);
    }

    .note-btn:hover + .note-popover,
    .note-btn:focus-visible + .note-popover {
      opacity: 1;
      transform: translateY(0);
    }

    .alt-button {
      right: 7px;
      bottom: 7px;
      min-width: 30px;
      height: 26px;
      padding: 0 7px;
      border: 1px solid rgba(245, 197, 66, 0.28);
      background: rgba(17, 18, 24, 0.72);
      color: var(--gold);
      cursor: pointer;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
    }

    .item-card:hover .alt-button,
    .alt-button:focus-visible,
    .alt-button.has-alts {
      border-color: rgba(245, 197, 66, 0.72);
      background: rgba(245, 197, 66, 0.93);
      color: #111115;
      outline: none;
    }

    .alt-strip {
      position: absolute;
      left: 7px;
      right: 42px;
      bottom: 7px;
      z-index: 3;
      display: flex;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }

    .alt-chip {
      flex: 0 1 auto;
      max-width: 62px;
      min-height: 23px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(8, 9, 13, 0.72);
      color: var(--text);
      padding: 0 7px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.62rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .alt-chip:hover,
    .alt-chip:focus-visible {
      border-color: rgba(245, 197, 66, 0.7);
      outline: none;
    }

    .saved-panel {
      margin-top: 14px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(11, 12, 18, 0.78);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
    }

    .saved-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .saved-head h2 {
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .saved-head span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .saved-rail {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
      overscroll-behavior-inline: contain;
      scroll-behavior: smooth;
      scrollbar-color: rgba(255, 255, 255, 0.42) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
      border-radius: 12px;
      transition: background 0.16s ease, box-shadow 0.16s ease;
    }

    .picker-strip:hover,
    .picker-strip:focus-within,
    .saved-rail:hover,
    .saved-rail:focus-within {
      background: rgba(255, 255, 255, 0.025);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.2),
        0 0 30px rgba(255, 255, 255, 0.055);
      cursor: ew-resize;
    }

    .saved-card {
      position: relative;
      flex: 0 0 250px;
      min-height: 112px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      background:
        linear-gradient(135deg, rgba(245, 197, 66, 0.11), transparent 48%),
        rgba(255, 255, 255, 0.045);
      padding: 13px 86px 13px 13px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.16s ease, transform 0.16s ease, background 0.16s ease;
    }

    .saved-card:hover,
    .saved-card:focus-visible {
      border-color: rgba(245, 197, 66, 0.72);
      background:
        linear-gradient(135deg, rgba(245, 197, 66, 0.16), transparent 48%),
        rgba(255, 255, 255, 0.06);
      outline: none;
      transform: translateY(-2px);
    }

    .saved-card-title {
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: -0.035em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .saved-card-meta {
      color: var(--muted);
      font-size: 0.73rem;
      font-weight: 800;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .saved-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .saved-badge {
      border: 1px solid rgba(245, 197, 66, 0.28);
      border-radius: 999px;
      color: var(--gold);
      padding: 3px 7px;
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .saved-card-actions {
      position: absolute;
      top: 9px;
      right: 9px;
      display: flex;
      gap: 6px;
    }

    .saved-action {
      min-width: 28px;
      width: 28px;
      height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.28);
      color: rgba(255, 255, 255, 0.76);
      cursor: pointer;
      font-weight: 900;
    }

    .duplicate-build {
      width: auto;
      padding: 0 8px;
      color: var(--gold);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .delete-build {
      font-size: 1rem;
    }

    .duplicate-build:hover,
    .duplicate-build:focus-visible {
      border-color: rgba(245, 197, 66, 0.72);
      color: var(--gold-strong);
      outline: none;
    }

    .delete-build:hover,
    .delete-build:focus-visible {
      border-color: rgba(255, 127, 127, 0.72);
      color: var(--danger);
      outline: none;
    }

    .empty-saved {
      flex: 0 0 auto;
      color: rgba(245, 247, 251, 0.48);
      padding: 20px 4px;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stats-panel {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(11, 12, 18, 0.78);
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(18px);
    }

    .stats-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .stats-head h2 {
      margin-bottom: 6px;
      font-size: 0.94rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .stats-source,
    .stats-status {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .stats-source a {
      color: var(--gold);
      text-decoration: none;
    }

    .stats-controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .stats-control {
      min-width: 0;
    }

    .stats-label {
      display: block;
      margin-bottom: 7px;
      color: rgba(245, 247, 251, 0.72);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stats-toggle-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .stats-toggle {
      min-height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      color: rgba(245, 247, 251, 0.75);
      cursor: pointer;
      padding: 0 10px;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .stats-toggle.is-active {
      border-color: rgba(245, 197, 66, 0.72);
      background: rgba(245, 197, 66, 0.16);
      color: var(--gold);
    }

    .stats-range {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .stats-range[hidden] {
      display: none;
    }

    .stats-range input {
      width: 100%;
      accent-color: var(--gold);
    }

    .stats-range span {
      min-width: 42px;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 900;
    }

    .stats-empty {
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 1px dashed rgba(245, 197, 66, 0.26);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      color: rgba(245, 247, 251, 0.68);
      padding: 24px;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .stats-content[hidden] {
      display: none;
    }

    .stats-layout {
      display: grid;
      grid-template-columns: minmax(190px, 0.75fr) minmax(420px, 2.4fr) minmax(210px, 0.9fr);
      gap: 12px;
      align-items: stretch;
    }

    .stats-legend,
    .stats-info,
    .stats-chart-wrap,
    .stats-pinned {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      background: rgba(4, 5, 8, 0.42);
    }

    .stats-legend,
    .stats-info {
      min-height: 390px;
      max-height: 420px;
      overflow-y: auto;
      padding: 10px;
      scrollbar-color: rgba(255, 255, 255, 0.42) rgba(255, 255, 255, 0.08);
      scrollbar-width: thin;
    }

    .stats-chart-wrap {
      position: relative;
      min-height: 420px;
      padding: 38px 18px 38px 46px;
    }

    .stats-chart-title {
      position: absolute;
      top: 11px;
      left: 46px;
      right: 18px;
      color: rgba(245, 247, 251, 0.68);
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .stats-plot {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 330px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.015)),
        rgba(0, 0, 0, 0.18);
      border-radius: 8px;
      overflow: hidden;
      cursor: crosshair;
    }

    .stats-plot svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .stats-grid-line {
      stroke: rgba(255, 255, 255, 0.09);
      stroke-width: 1;
    }

    .stats-line {
      fill: none;
      stroke-width: 2;
      opacity: 0.78;
      transition: opacity 0.16s ease, stroke-width 0.16s ease, filter 0.16s ease;
    }

    .stats-line.is-dimmed {
      opacity: 0.12;
    }

    .stats-line.is-pinned,
    .stats-line.is-hovered {
      opacity: 1;
      stroke-width: 4;
      filter: drop-shadow(0 0 5px rgba(245, 197, 66, 0.35));
    }

    .stats-cursor {
      stroke: rgba(245, 197, 66, 0.58);
      stroke-width: 1;
      stroke-dasharray: 5 5;
      pointer-events: none;
    }

    .stats-axis-x,
    .stats-axis-y {
      position: absolute;
      color: rgba(245, 247, 251, 0.42);
      font-size: 0.68rem;
      font-weight: 800;
    }

    .stats-axis-x {
      left: 46px;
      right: 18px;
      bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .stats-axis-y {
      left: 9px;
      top: 38px;
      bottom: 38px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      width: 32px;
    }

    .stats-legend-item {
      width: 100%;
      min-height: 33px;
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 5px 7px;
      text-align: left;
    }

    .stats-legend-item:hover,
    .stats-legend-item.is-hovered,
    .stats-legend-item.is-pinned {
      border-color: rgba(245, 197, 66, 0.34);
      background: rgba(245, 197, 66, 0.08);
    }

    .stats-dot {
      width: 11px;
      height: 11px;
      border-radius: 999px;
    }

    .stats-legend-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .stats-legend-class {
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 900;
    }

    .stats-info-title {
      margin-bottom: 10px;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stats-info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: rgba(245, 247, 251, 0.82);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .stats-info-row span:first-child {
      color: var(--muted);
    }

    .stats-info-row span:last-child {
      text-align: right;
    }

    .stats-pinned {
      margin-top: 12px;
      padding: 10px;
    }

    .stats-pinned-title {
      margin-bottom: 8px;
      color: rgba(245, 247, 251, 0.72);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stats-pinned-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .stats-pin-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      padding: 0 8px;
      font-size: 0.68rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .stats-pin-chip button {
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.76);
      cursor: pointer;
      font-weight: 900;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.62);
      backdrop-filter: blur(10px);
      opacity: 1;
      transition: opacity 0.16s ease;
    }

    .modal-overlay[hidden] {
      display: none;
    }

    .note-modal {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 70;
      width: min(460px, calc(100% - 28px));
      border: 1px solid rgba(245, 197, 66, 0.28);
      border-radius: 16px;
      background: rgba(14, 15, 20, 0.96);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.56);
      transform: translate(-50%, -50%);
      overflow: hidden;
    }

    .note-modal[hidden] {
      display: none;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .modal-title {
      min-width: 0;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.055);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 900;
    }

    .note-textarea {
      display: block;
      width: calc(100% - 28px);
      min-height: 138px;
      margin: 14px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.32);
      color: var(--text);
      outline: none;
      padding: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .note-textarea:focus {
      border-color: rgba(245, 197, 66, 0.72);
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.1);
    }

    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 14px 14px;
    }

    .char-count {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 800;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pickPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(245, 197, 66, 0.42), 0 18px 34px rgba(0, 0, 0, 0.28);
      }
      100% {
        box-shadow: 0 0 0 18px rgba(245, 197, 66, 0), 0 18px 34px rgba(0, 0, 0, 0.28);
      }
    }

    @media (max-width: 1160px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .build-actions {
        grid-template-columns: minmax(180px, 1fr) repeat(3, auto);
      }

      .stats-controls,
      .stats-layout {
        grid-template-columns: 1fr;
      }

      .stats-legend,
      .stats-info {
        min-height: auto;
        max-height: 240px;
      }

      .stats-chart-wrap {
        min-height: 380px;
      }
    }

    @media (max-width: 760px) {
      :root {
        --card-w: 136px;
        --card-h: 184px;
        --name-h: 39px;
      }

      .app-shell {
        width: min(100% - 12px, 1880px);
        padding-top: 62px;
      }

      .topbar {
        padding: 12px;
        border-radius: 15px;
      }

      .app-tabs {
        width: 100%;
      }

      .app-tab {
        flex: 1;
      }

      .class-toggle {
        overflow-x: auto;
      }

      .class-button {
        min-width: 104px;
      }

      .build-actions {
        grid-template-columns: 1fr 1fr;
      }

      .build-name {
        grid-column: 1 / -1;
      }

      .action-button {
        min-height: 42px;
      }

      .arena {
        min-height: 390px;
        padding: 18px 12px 24px;
        border-radius: 15px;
      }

      .stats-panel {
        padding: 12px;
        border-radius: 15px;
      }

      .stats-head {
        flex-direction: column;
      }

      .stats-controls {
        grid-template-columns: 1fr;
      }

      .stats-chart-wrap {
        min-height: 340px;
        padding-left: 40px;
      }

      .stats-chart-title,
      .stats-axis-x {
        left: 40px;
      }

      .picker-ribbon {
        margin-bottom: 28px;
      }

      .loadout-row {
        gap: 26px;
      }

      .slot-track {
        gap: 8px;
      }

      .section-title {
        font-size: 1.08rem;
      }

      .card-name {
        font-size: 0.74rem;
      }

      .saved-card {
        flex-basis: 220px;
      }

      .import-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .mini-actions {
        justify-content: stretch;
      }

      .mini-button {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" href="../../index.html">Hub</a>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-kicker">The Finals</span>
        <h1>Loadout Saver</h1>
      </div>
      <nav id="classToggle" class="class-toggle" aria-label="Class selector"></nav>
      <div class="build-actions">
        <input id="buildNameInput" class="build-name" type="text" maxlength="60" autocomplete="off" placeholder="Build name">
        <button id="saveButton" class="action-button is-primary" type="button">Save</button>
        <button id="shareButton" class="action-button" type="button">Share</button>
        <button id="resetButton" class="action-button" type="button">Reset</button>
      </div>
    </header>

    <nav id="appTabs" class="app-tabs" aria-label="App sections">
      <button class="app-tab is-active" type="button" data-app-view="loadout">Loadout</button>
      <button class="app-tab" type="button" data-app-view="stats">Stats</button>
    </nav>

    <div id="loadoutView" class="view-panel">
      <div id="statusStrip" class="status-strip" aria-live="polite"></div>
      <div id="sharedBanner" class="import-bar" hidden></div>
      <div id="shareOutput" class="share-panel" hidden></div>

      <section class="arena" aria-label="Loadout builder">
        <div id="pickerRibbon" class="picker-ribbon is-hidden"></div>
        <div id="loadoutBoard" class="loadout-board"></div>
      </section>

      <section class="saved-panel" aria-label="Saved builds">
        <div class="saved-head">
          <h2>Saved Builds</h2>
          <span id="savedCount">0 builds</span>
        </div>
        <div id="savedBuilds" class="saved-rail"></div>
      </section>
    </div>

    <section id="statsView" class="view-panel stats-panel" aria-label="Weapon stats" hidden>
      <div class="stats-head">
        <div>
          <h2>Weapon Stats</h2>
          <div id="weaponStatsSource" class="stats-source"></div>
        </div>
        <div id="weaponStatsStatus" class="stats-status"></div>
      </div>

      <div class="stats-controls" aria-label="Weapon stats controls">
        <div class="stats-control">
          <span class="stats-label">Class</span>
          <div class="stats-toggle-group">
            <button class="stats-toggle is-active" type="button" data-stats-class="ALL">All</button>
            <button class="stats-toggle" type="button" data-stats-class="LIGHT">Light</button>
            <button class="stats-toggle" type="button" data-stats-class="MEDIUM">Medium</button>
            <button class="stats-toggle" type="button" data-stats-class="HEAVY">Heavy</button>
          </div>
        </div>
        <div class="stats-control">
          <span class="stats-label">Target HP</span>
          <div class="stats-toggle-group">
            <button class="stats-toggle" type="button" data-stats-target="Light">Light</button>
            <button class="stats-toggle is-active" type="button" data-stats-target="Medium">Medium</button>
            <button class="stats-toggle" type="button" data-stats-target="Heavy">Heavy</button>
          </div>
        </div>
        <div class="stats-control">
          <span class="stats-label">Hit Mode</span>
          <div class="stats-toggle-group">
            <button class="stats-toggle is-active" type="button" data-stats-hit="Body">Body</button>

  <script>
    const STORAGE_KEY = 'finals-loadouts';
    const STORAGE_VERSION = 2;
    const SHARE_HASH_PREFIX = '#shared=';
    const MAX_NOTE_LENGTH = 220;
    const MAX_ALTERNATIVES = 3;
    const MAX_RESERVE_ALTERNATIVES = MAX_ALTERNATIVES;
    const RAIL_GLIDE_MS = 360;

    };

    const RAW_GAME_DATA = {
      sharedGadgets: [
        'Flashbang',
        'Frag Grenade',
        'Gas Grenade',
        'Goo Grenade',
        'Pyro Grenade',
        'Smoke Grenade'
      ],
      classes: {
        light: {
          specializations: ['Cloaking Device', 'Evasive Dash', 'Grappling Hook'],
          weapons: ['93R', 'V9S', 'M11', 'XP-54', 'M26 Matter', 'SH1900', 'ARN-220', 'LH1', 'SR-84', 'Dagger', 'Recurve Bow', 'Sword', 'Throwing Knives'],
          gadgets: ['Breach Charge', 'Gateway', 'Glitch Grenade', 'Gravity Vortex', 'H+ Infuser', 'Nullifier', 'Sonar Grenade', 'Thermal Bore', 'Thermal Vision', 'Tracking Dart', 'Vanishing Bomb']
        },
        medium: {
          specializations: ['Dematerializer', 'Guardian Turret', 'Healing Beam', 'Recon Senses', 'Shockwave'],
          weapons: ['R .357', 'P90', 'Cerberus 12GA', 'Model 1887', 'AKM', 'FCAR', 'FAMAS', 'CB-01 Repeater', 'Chimera-XB', 'Pike-556', 'CL-40', 'Dual Blades', 'Riot Shield'],
          gadgets: ['APS Turret', 'Breach Drill', 'Data Reshaper', 'Defibrillator', 'Explosive Mine', 'Gas Mine', 'Glitch Trap', 'Hover Pad', 'Jump Pad', 'Proximity Sensor', 'Zipline']
        },
        heavy: {
          specializations: ["Charge 'N' Slam", 'Goo Gun', 'Mesh Shield', 'Winch Claw'],
          weapons: ['.50 Akimbo', 'BFR Titan', 'KS-23', 'SA1216', 'ShAK-50', 'Lewis Gun', 'M60', 'M134 Minigun', 'MGL32', 'Flamethrower', 'Sledgehammer', 'Spear'],
          gadgets: ['Anti-Gravity Cube', 'Barricade', 'C4', 'Dome Shield', 'Explosive Mine', 'Healing Emitter', 'Lockbolt', 'Proximity Sensor', 'Pyro Mine', 'RPG-7']
        }
      }
    };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function truncateText(value, limit) {
      const normalized = String(value || '').trim().replace(/\s+/g, ' ');
      return normalized.length > limit ? `${normalized.slice(0, Math.max(0, limit - 3))}...` : normalized;
    }

    function normalizeNoteValue(value) {
      if (typeof value !== 'string') {
        return '';
      }
      return value.replace(/\r\n/g, '\n').slice(0, MAX_NOTE_LENGTH);
    }

    function getImageFilename(name) {
      return WIKI_IMAGE_FILENAMES[name] || `${name} Rank 1.png`;
    }

    function buildImageUrl(filename) {
      return WIKI_FILE_BASE + encodeURIComponent(filename.replace(/ /g, '_'));
    }

    function makeItem(name, type, classKey) {
      const imageFilename = getImageFilename(name);
      return {
        name,
        type,
        className: classKey ? CLASS_META[classKey].label : null,
        imageFilename,
        imageUrl: buildImageUrl(imageFilename)
      };
    }

    function buildGameData() {
      const classes = {};
      const catalog = {};

      Object.entries(RAW_GAME_DATA.classes).forEach(([classKey, classData]) => {
        classes[classKey] = {
          specializations: classData.specializations.map((name) => makeItem(name, 'specialization', classKey)),
          weapons: classData.weapons.map((name) => makeItem(name, 'weapon', classKey)),
          gadgets: classData.gadgets.map((name) => makeItem(name, 'gadget', classKey))
        };
      });

      const sharedGadgets = RAW_GAME_DATA.sharedGadgets.map((name) => makeItem(name, 'gadget', null));

      Object.values(classes).forEach((classData) => {
        ['specializations', 'weapons', 'gadgets'].forEach((group) => {
          classData[group].forEach((item) => {
            catalog[item.name] = item;
          });
        });
      });

      sharedGadgets.forEach((item) => {
        catalog[item.name] = item;
      });

      return { classes, sharedGadgets, catalog };
    }

    const GAME_DATA = buildGameData();

    function createReserveEntry(primary = null, alternatives = []) {
      return {
        primary,
        alternatives: Array.isArray(alternatives) ? alternatives.slice(0, MAX_RESERVE_ALTERNATIVES) : []
      };
    }

    function createSlotAlternatives(source = {}) {
      const mainGadgets = Array.isArray(source.mainGadgets) ? source.mainGadgets : [];
      return {
        specialization: Array.isArray(source.specialization) ? source.specialization.slice(0, MAX_ALTERNATIVES) : [],
        mainWeapon: Array.isArray(source.mainWeapon) ? source.mainWeapon.slice(0, MAX_ALTERNATIVES) : [],
        mainGadgets: Array.from({ length: 3 }, (_, index) => (
          Array.isArray(mainGadgets[index]) ? mainGadgets[index].slice(0, MAX_ALTERNATIVES) : []
        ))
      };
    }

    function createBlankBuild(classKey) {
      return {
        id: null,
        name: '',
        className: CLASS_META[classKey].label,
        specialization: null,
        mainWeapon: null,
        mainGadgets: [null, null, null],
        slotAlternatives: createSlotAlternatives(),
        reserve: Array.from({ length: 4 }, () => createReserveEntry()),
        savedAt: null
      };
    }

    function cloneReserveEntry(entry) {
      return createReserveEntry(entry && entry.primary ? entry.primary : null, entry && Array.isArray(entry.alternatives) ? entry.alternatives : []);
    }

    function cloneSlotAlternatives(slotAlternatives) {
      return createSlotAlternatives(slotAlternatives);
    }

    function cloneBuild(build) {
      const reserve = Array.isArray(build.reserve) ? build.reserve.slice(0, 4).map(cloneReserveEntry) : [];
      while (reserve.length < 4) {
        reserve.push(createReserveEntry());
      }

      return {
        id: build.id || null,
        name: typeof build.name === 'string' ? build.name : '',
        className: build.className || 'Light',
        specialization: build.specialization || null,
        mainWeapon: build.mainWeapon || null,
        mainGadgets: Array.isArray(build.mainGadgets) ? build.mainGadgets.slice(0, 3).concat([null, null, null]).slice(0, 3) : [null, null, null],
        slotAlternatives: cloneSlotAlternatives(build.slotAlternatives),
        reserve,
        savedAt: build.savedAt || null
      };
    }

    function getClassKeyFromLabel(label) {
      const normalized = typeof label === 'string' ? label.toLowerCase() : '';
      return Object.prototype.hasOwnProperty.call(CLASS_META, normalized) ? normalized : 'light';
    }

    function getClassPools(classKey) {
      const classData = GAME_DATA.classes[classKey];
      return {
        specializations: classData.specializations,
        weapons: classData.weapons,
        gadgets: classData.gadgets,
        sharedGadgets: GAME_DATA.sharedGadgets,
        allGadgets: [...classData.gadgets, ...GAME_DATA.sharedGadgets],
        reserve: [...classData.weapons, ...classData.gadgets, ...GAME_DATA.sharedGadgets]
      };
    }

    function getItemByName(name) {
      return name ? GAME_DATA.catalog[name] || null : null;
    }

    function normalizeItemNotes(rawNotes) {
      const notes = {};
      if (!rawNotes || typeof rawNotes !== 'object') {
        return notes;
      }

      Object.entries(rawNotes).forEach(([itemName, value]) => {
        if (!getItemByName(itemName)) {
          return;
        }
        const normalized = normalizeNoteValue(value);
        if (normalized.trim()) {
          notes[itemName] = normalized;
        }
      });

      return notes;
    }

    function normalizeAlternativeList(values, allowedNames, primary = null) {
      const alternatives = [];
      if (!Array.isArray(values)) {
        return alternatives;
      }

      values.forEach((itemName) => {
        if (
          typeof itemName === 'string' &&
          allowedNames.has(itemName) &&
          itemName !== primary &&
          !alternatives.includes(itemName) &&
          alternatives.length < MAX_ALTERNATIVES
        ) {
          alternatives.push(itemName);
        }
      });

      return alternatives;
    }

    function normalizeSlotAlternatives(rawAlternatives, allowedNames, build) {
      if (!rawAlternatives || typeof rawAlternatives !== 'object') {
        return createSlotAlternatives();
      }

      return {
        specialization: normalizeAlternativeList(rawAlternatives.specialization, allowedNames.specializations, build.specialization),
        mainWeapon: normalizeAlternativeList(rawAlternatives.mainWeapon, allowedNames.weapons, build.mainWeapon),
        mainGadgets: Array.from({ length: 3 }, (_, index) => (
          normalizeAlternativeList(
            Array.isArray(rawAlternatives.mainGadgets) ? rawAlternatives.mainGadgets[index] : [],
            allowedNames.mainGadgets,
            build.mainGadgets[index]
          )
        ))
      };
    }

    function normalizeReserveEntry(entry, allowedNames) {
      if (typeof entry === 'string') {
        return createReserveEntry(allowedNames.has(entry) ? entry : null, []);
      }

      if (!entry || typeof entry !== 'object') {
        return createReserveEntry();
      }

      const primary = typeof entry.primary === 'string' && allowedNames.has(entry.primary) ? entry.primary : null;
      const alternatives = [];
      if (Array.isArray(entry.alternatives)) {
        entry.alternatives.forEach((itemName) => {
          if (
            typeof itemName === 'string' &&
            allowedNames.has(itemName) &&
            itemName !== primary &&
            !alternatives.includes(itemName) &&
            alternatives.length < MAX_RESERVE_ALTERNATIVES
          ) {
            alternatives.push(itemName);
          }
        });
      }

      return createReserveEntry(primary, alternatives);
    }

    function ensureSlotAlternatives(build) {
      if (!build.slotAlternatives) {
        build.slotAlternatives = createSlotAlternatives();
      }
      if (!Array.isArray(build.slotAlternatives.mainGadgets) || build.slotAlternatives.mainGadgets.length < 3) {
        build.slotAlternatives = createSlotAlternatives(build.slotAlternatives);
      }
      return build.slotAlternatives;
    }

    function getAlternativeList(build, area, index = 0) {
      if (area === 'reserve') {
        return build.reserve[index].alternatives;
      }

      const alternatives = ensureSlotAlternatives(build);
      if (area === 'specialization') {
        return alternatives.specialization;
      }
      if (area === 'mainWeapon') {
        return alternatives.mainWeapon;
      }
      if (area === 'mainGadget') {
        return alternatives.mainGadgets[index];
      }
      return [];
    }

    function getPrimaryValue(build, area, index = 0) {
      if (area === 'specialization') {
        return build.specialization;
      }
      if (area === 'mainWeapon') {
        return build.mainWeapon;
      }
      if (area === 'mainGadget') {
        return build.mainGadgets[index];
      }
      if (area === 'reserve') {
        return build.reserve[index].primary;
      }
      return null;
    }

    function setPrimaryValue(build, area, itemName, index = 0) {
      if (area === 'specialization') {
        build.specialization = itemName;
      }
      if (area === 'mainWeapon') {
        build.mainWeapon = itemName;
      }
      if (area === 'mainGadget') {
        build.mainGadgets[index] = itemName;
      }
      if (area === 'reserve') {
        build.reserve[index].primary = itemName;
      }
      const alternatives = getAlternativeList(build, area, index);
      alternatives.splice(0, alternatives.length, ...alternatives.filter((name) => name !== itemName));
    }

    function collectAllSelectedItemNames(build) {
      const names = [];
      if (build.specialization) {
        names.push(build.specialization);
      }
      if (build.mainWeapon) {
        names.push(build.mainWeapon);
      }
      build.mainGadgets.forEach((itemName) => {
        if (itemName) {
          names.push(itemName);
        }
      });
      const slotAlternatives = ensureSlotAlternatives(build);
      slotAlternatives.specialization.forEach((itemName) => {
        if (itemName) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainWeapon.forEach((itemName) => {
        if (itemName) {
          names.push(itemName);
        }
      });
      slotAlternatives.mainGadgets.forEach((alternatives) => {
        alternatives.forEach((itemName) => {
          if (itemName) {
            names.push(itemName);
          }
        });
      });
      build.reserve.forEach((entry) => {
        if (entry.primary) {
          names.push(entry.primary);
        }
        entry.alternatives.forEach((itemName) => {
          if (itemName) {
            names.push(itemName);
          }
        });
      });
      return names;
    }

    function normalizeLoadedBuild(raw) {
      if (!raw || typeof raw !== 'object') {
        return null;
      }

      const classKey = getClassKeyFromLabel(raw.className);
      const pools = getClassPools(classKey);
      const allowedSpecializations = new Set(pools.specializations.map((item) => item.name));
      const allowedWeapons = new Set(pools.weapons.map((item) => item.name));
      const allowedMainGadgets = new Set(pools.allGadgets.map((item) => item.name));
      const allowedReserve = new Set(pools.reserve.map((item) => item.name));
      const build = createBlankBuild(classKey);

      build.id = raw.id || null;
      build.name = typeof raw.name === 'string' ? raw.name.slice(0, 60) : '';
      build.savedAt = typeof raw.savedAt === 'string' ? raw.savedAt : null;

      if (typeof raw.specialization === 'string' && allowedSpecializations.has(raw.specialization)) {
        build.specialization = raw.specialization;
      }

      if (typeof raw.mainWeapon === 'string' && allowedWeapons.has(raw.mainWeapon)) {
        build.mainWeapon = raw.mainWeapon;
      }

      if (Array.isArray(raw.mainGadgets)) {
        build.mainGadgets = raw.mainGadgets.slice(0, 3).map((itemName) => allowedMainGadgets.has(itemName) ? itemName : null);
        while (build.mainGadgets.length < 3) {
          build.mainGadgets.push(null);
        }
      }

      if (Array.isArray(raw.reserve)) {
        build.reserve = raw.reserve.slice(0, 4).map((entry) => normalizeReserveEntry(entry, allowedReserve));
        while (build.reserve.length < 4) {
          build.reserve.push(createReserveEntry());
        }
      }

      build.slotAlternatives = normalizeSlotAlternatives(raw.slotAlternatives, {
        specializations: allowedSpecializations,
        weapons: allowedWeapons,
        mainGadgets: allowedMainGadgets
      }, build);

      const selected = collectAllSelectedItemNames(build);
      if (new Set(selected).size !== selected.length) {
        return null;
      }

      return build;
    }

    function createStorageEnvelope(builds, itemNotes) {
      return {
        version: STORAGE_VERSION,
        builds,
        itemNotes
      };
    }

    function normalizeStorageEnvelope(raw) {
      if (Array.isArray(raw)) {
        return {
          envelope: createStorageEnvelope(raw.map(normalizeLoadedBuild).filter(Boolean), {}),
          migrated: true
        };
      }

      if (!raw || typeof raw !== 'object') {
        return {
          envelope: createStorageEnvelope([], {}),
          migrated: false
        };
      }

      return {
        envelope: createStorageEnvelope(
          Array.isArray(raw.builds) ? raw.builds.map(normalizeLoadedBuild).filter(Boolean) : [],
          normalizeItemNotes(raw.itemNotes)
        ),
        migrated: raw.version !== STORAGE_VERSION
      };
    }

    function loadStorageEnvelope() {
      try {
        return normalizeStorageEnvelope(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'));
      } catch (error) {
        return {
          envelope: createStorageEnvelope([], {}),
          migrated: false
        };
      }
    }

    function encodeSharedEnvelope(envelope) {
      const bytes = new TextEncoder().encode(JSON.stringify(envelope));
      let binary = '';
      bytes.forEach((byte) => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function decodeSharedEnvelope(encoded) {
      const base64 = encoded.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - (base64.length % 4 || 4)) % 4);
      const binary = atob(padded);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      return normalizeStorageEnvelope(JSON.parse(new TextDecoder().decode(bytes))).envelope;
    }

    function readSharedEnvelopeFromHash() {
      if (!window.location.hash.startsWith(SHARE_HASH_PREFIX)) {
        return null;
      }
      try {
        return decodeSharedEnvelope(window.location.hash.slice(SHARE_HASH_PREFIX.length));
      } catch (error) {
        return null;
      }
    }

    function clearSharedHash() {
      history.replaceState(null, '', `${window.location.pathname}${window.location.search}`);
    }

    const storageLoad = loadStorageEnvelope();
    const state = {
      activeView: 'loadout',

    const railGlideState = new WeakMap();
    let pickerClearTimer = null;

    function clampNumber(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function prefersReducedMotion() {
      return Boolean(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    function easeOutCubic(progress) {
      return 1 - Math.pow(1 - progress, 3);
    }

    function getRailWheelDelta(event, rail) {
      let delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      if (event.deltaMode === 1) {
        delta *= RAIL_LINE_PX;
      } else if (event.deltaMode === 2) {
        delta *= rail.clientWidth * 0.9;
      }
      return delta;
    }

    function stepRailGlide(rail, timestamp) {
      const glide = railGlideState.get(rail);
      if (!glide) {
        return;
      }

      const progress = clampNumber((timestamp - glide.startedAt) / RAIL_GLIDE_MS, 0, 1);
      const eased = easeOutCubic(progress);
      rail.scrollLeft = glide.startLeft + ((glide.targetLeft - glide.startLeft) * eased);

      if (progress < 1) {
        glide.rafId = requestAnimationFrame((nextTimestamp) => stepRailGlide(rail, nextTimestamp));
        return;
      }

      rail.scrollLeft = glide.targetLeft;
      railGlideState.delete(rail);
    }

    function glideRailBy(rail, delta) {
      const maxScrollLeft = Math.max(0, rail.scrollWidth - rail.clientWidth);
      const existingGlide = railGlideState.get(rail);
      const originLeft = existingGlide ? existingGlide.targetLeft : rail.scrollLeft;
      const targetLeft = clampNumber(originLeft + delta, 0, maxScrollLeft);

      if (targetLeft === originLeft) {
        return;
      }

      if (prefersReducedMotion()) {
        rail.scrollLeft = targetLeft;
        return;
      }

      if (existingGlide && existingGlide.rafId) {
        cancelAnimationFrame(existingGlide.rafId);
      }

      railGlideState.set(rail, {
        startLeft: rail.scrollLeft,
        targetLeft,
        startedAt: performance.now(),
        rafId: requestAnimationFrame((timestamp) => stepRailGlide(rail, timestamp))
      });
    }

    function parseCsvRows(csvText) {
      const rows = [];
      let row = [];
      let field = '';
      let inQuotes = false;

      for (let index = 0; index < csvText.length; index++) {
        const char = csvText[index];
        const nextChar = csvText[index + 1];

        if (inQuotes) {
          if (char === '"' && nextChar === '"') {
            field += '"';
            index++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === '"') {
          inQuotes = true;
        } else if (char === ',') {
          row.push(field);
          field = '';
        } else if (char === '\n') {
          row.push(field);
          if (row.some((value) => value.trim())) {
            rows.push(row);
          }
          row = [];
          field = '';
        } else if (char !== '\r') {
          field += char;
        }
      }

      row.push(field);
      if (row.some((value) => value.trim())) {
        rows.push(row);
      }

      return rows;
    }

    function parseCsvObjects(csvText) {
      const rows = parseCsvRows(csvText);
      if (!rows.length) {
        return [];
      }

      const headers = rows[0].map((header) => header.trim());
      return rows.slice(1).map((row) => {
        const entry = {};
        headers.forEach((header, index) => {
          entry[header] = row[index] ?? '';
        });
        return entry;
      });
    }

    function parseWeaponNumber(value, fallback = 0) {
      if (typeof value === 'number') {
        return Number.isFinite(value) ? value : fallback;
      }
      const parsed = parseFloat(String(value ?? '').trim());
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function parseMagazineSize(value) {
      if (value === Infinity) {
        return Infinity;
      }
      const text = String(value ?? '').trim();
      if (!text || /^n\/a$/i.test(text)) {
        return Infinity;
      }
      const parsed = parseFloat(text);
      return Number.isFinite(parsed) && parsed > 0 ? parsed : Infinity;
    }

    function getWeaponColor(name, className) {
      const classHue = { LIGHT: 48, MEDIUM: 186, HEAVY: 352 }[className] ?? 48;
      let hash = 0;
      for (let index = 0; index < name.length; index++) {
        hash = ((hash << 5) - hash) + name.charCodeAt(index);
        hash |= 0;
      }
      const hue = (classHue + Math.abs(hash % 44) - 22 + 360) % 360;
      return `hsl(${hue}, 82%, 62%)`;
    }

    function normalizeWeaponStatRow(row) {
      const name = String(row.Name || row.name || '').trim();
      const className = String(row.Class || row.className || row.class || '').trim().toUpperCase();
      if (!name || !['LIGHT', 'MEDIUM', 'HEAVY'].includes(className)) {
        return null;
      }

      return {
        name,
        className,
        bodyDamage: parseWeaponNumber(row['Body Damage'] ?? row.bodyDamage),
        headDamage: parseWeaponNumber(row['Head Damage'] ?? row.headDamage),
        rpm: parseWeaponNumber(row.RPM ?? row.rpm),
        burstCount: Math.max(1, parseWeaponNumber(row['Burst Count'] ?? row.burstCount, 1) || 1),
        burstDelay: parseWeaponNumber(row['Burst Delay'] ?? row.burstDelay),
        minDropoff: parseWeaponNumber(row['Min Dropoff'] ?? row.minDropoff),
        maxDropoff: parseWeaponNumber(row['Max Dropoff'] ?? row.maxDropoff),
        dropoffModifier: parseWeaponNumber(row['Dropoff Modifier'] ?? row.dropoffModifier, 1) || 1,
        magazineSize: parseMagazineSize(row['Magazine Size'] ?? row.magazineSize),
        emptyReload: parseWeaponNumber(row['Empty Reload'] ?? row.emptyReload),
        tacticalReload: parseWeaponNumber(row['Tactical Reload'] ?? row.tacticalReload),
        notes: String(row.Notes || row.notes || '').trim(),
        version: String(row.Version || row.version || '').trim(),
        color: getWeaponColor(name, className)
      };
    }

    function normalizeWeaponStatRows(rows) {
      return rows
        .map(normalizeWeaponStatRow)
        .filter(Boolean)
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    async function loadWeaponStats() {
      if (state.weaponStats.loadState !== 'idle') {
        renderWeaponStats();
        return;
      }

      if (!WEAPON_STATS_CONFIG.liveEnabled) {
        state.weaponStats.weapons = normalizeWeaponStatRows(WEAPON_STATS_CONFIG.fallbackRows);
        state.weaponStats.loadState = state.weaponStats.weapons.length ? 'fallback' : 'disabled';
        state.weaponStats.source = 'disabled';
        renderWeaponStats();
        return;
      }

      state.weaponStats.loadState = 'loading';
      state.weaponStats.source = 'live';
      state.weaponStats.error = '';
      renderWeaponStats();

      try {
        const response = await fetch(WEAPON_STATS_CONFIG.csvUrl, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const csvText = await response.text();
        const weapons = normalizeWeaponStatRows(parseCsvObjects(csvText));
        if (!weapons.length) {
          throw new Error('No weapon rows found');
        }
        state.weaponStats.weapons = weapons;
        state.weaponStats.loadState = 'loaded';
        state.weaponStats.lastLoadedAt = new Date();
        state.weaponStats.version = weapons.find((weapon) => weapon.version)?.version || '';
      } catch (error) {
        const fallbackWeapons = normalizeWeaponStatRows(WEAPON_STATS_CONFIG.fallbackRows);
        state.weaponStats.weapons = fallbackWeapons;
        state.weaponStats.loadState = fallbackWeapons.length ? 'fallback-error' : 'error';
        state.weaponStats.source = fallbackWeapons.length ? 'fallback' : 'live';
        state.weaponStats.error = error?.message || 'Unable to load weapon data';
      }

      renderWeaponStats();
    }

    function getFilteredWeaponStats() {
      const classFilter = state.weaponStats.classFilter;
      return state.weaponStats.weapons.filter((weapon) => (
        classFilter === 'ALL' || weapon.className === classFilter
      ));

    function getWeaponDamage(weapon, rangeMeters) {
      const headshotRatio = state.weaponStats.hitMode === 'Mixed'
        ? state.weaponStats.headshotPct / 100
        : state.weaponStats.hitMode === 'Head' ? 1 : 0;
      const baseDamage = (weapon.headDamage * headshotRatio) + (weapon.bodyDamage * (1 - headshotRatio));

      if (weapon.maxDropoff <= weapon.minDropoff || weapon.dropoffModifier >= 1) {
        return baseDamage;
      }
      if (rangeMeters <= weapon.minDropoff) {
        return baseDamage;
      }
      if (rangeMeters >= weapon.maxDropoff) {
        return baseDamage * weapon.dropoffModifier;
      }

      const dropProgress = (rangeMeters - weapon.minDropoff) / (weapon.maxDropoff - weapon.minDropoff);
      return baseDamage * (1 - ((1 - weapon.dropoffModifier) * dropProgress));
    }

    function getShotsToKill(weapon, rangeMeters) {
      const targetHp = WEAPON_HEALTH_VALUES[state.weaponStats.targetClass];
      const damage = getWeaponDamage(weapon, rangeMeters);
      return damage > 0 ? Math.ceil(targetHp / damage) : Infinity;
    }

    function calculateWeaponTTK(weapon, rangeMeters) {
      const shotsToKill = getShotsToKill(weapon, rangeMeters);
      if (!Number.isFinite(shotsToKill) || shotsToKill <= 0 || weapon.rpm <= 0) {
        return Infinity;
      }
      if (shotsToKill === 1) {
        return 0;
      }

      const shotInterval = 60 / weapon.rpm;
      let elapsed = 0;
      for (let firedShots = 1; firedShots < shotsToKill; firedShots++) {
        const nextShotStartsNewBurst = weapon.burstCount > 1 && weapon.burstDelay > 0 && firedShots % weapon.burstCount === 0;
        elapsed += nextShotStartsNewBurst ? weapon.burstDelay : shotInterval;
      }

      if (Number.isFinite(weapon.magazineSize) && weapon.magazineSize > 0 && shotsToKill > weapon.magazineSize) {
        const reloads = Math.floor((shotsToKill - 1) / weapon.magazineSize);
        elapsed += reloads * (weapon.emptyReload || weapon.tacticalReload || 2.5);
      }

      return elapsed;
    }

    function calculateWeaponDPS(weapon, rangeMeters) {
      const damage = getWeaponDamage(weapon, rangeMeters);
      if (damage <= 0 || weapon.rpm <= 0) {
        return 0;
      }

      if (weapon.burstCount > 1 && weapon.burstDelay > 0) {
        const shotInterval = 60 / weapon.rpm;
        const burstTime = ((weapon.burstCount - 1) * shotInterval) + weapon.burstDelay;
        return burstTime > 0 ? (damage * weapon.burstCount) / burstTime : 0;
      }

      return damage * (weapon.rpm / 60);
    }

    function getWeaponMetricValue(weapon, rangeMeters) {
      return state.weaponStats.metric === 'TTK'
        ? calculateWeaponTTK(weapon, rangeMeters)
        : calculateWeaponDPS(weapon, rangeMeters);
    }

    function getWeaponChartRanges() {
      return Array.from({ length: 51 }, (_, index) => index * 2);
    }

    function getWeaponChartMaxY(weapons) {
      let maxValue = 0;
      const ranges = getWeaponChartRanges();
      weapons.forEach((weapon) => {
        ranges.forEach((rangeMeters) => {
          const value = getWeaponMetricValue(weapon, rangeMeters);
          if (Number.isFinite(value)) {
            maxValue = Math.max(maxValue, value);
          }
        });
      });

      if (state.weaponStats.metric === 'TTK') {
        return Math.max(0.5, Math.min(5, Math.ceil(maxValue * 1.18 * 2) / 2));
      }
      return Math.max(100, Math.ceil(maxValue * 1.12 / 100) * 100);
    }

    function formatWeaponMetricValue(value) {
      if (!Number.isFinite(value)) {
        return 'N/A';
      }
      return state.weaponStats.metric === 'TTK' ? `${value.toFixed(3)}s` : String(Math.round(value));
    }

    function renderWeaponStatsSourceStatus() {
      if (state.weaponStats.loadState === 'loaded') {
        const version = state.weaponStats.version ? ` / Version ${escapeHtml(state.weaponStats.version)}` : '';
        const loadedAt = state.weaponStats.lastLoadedAt
          ? ` / Loaded ${state.weaponStats.lastLoadedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
          : '';
        elements.weaponStatsSource.innerHTML = `Weapon data from <a href="${WEAPON_STATS_CONFIG.sourcePageUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(WEAPON_STATS_CONFIG.sourceName)}</a>${version}${loadedAt}`;
        elements.weaponStatsStatus.textContent = `${state.weaponStats.weapons.length} weapons`;
        return;
      }

      if (state.weaponStats.loadState === 'loading') {
        elements.weaponStatsSource.textContent = 'Loading weapon data';
        elements.weaponStatsStatus.textContent = '';
        return;
      }

      if (state.weaponStats.loadState === 'error') {
        elements.weaponStatsSource.textContent = `Live weapon data unavailable: ${state.weaponStats.error}`;
        elements.weaponStatsStatus.textContent = '';
        return;
      }

      if (state.weaponStats.loadState === 'fallback-error') {
        elements.weaponStatsSource.textContent = `Using fallback data after live fetch failed: ${state.weaponStats.error}`;
        elements.weaponStatsStatus.textContent = `${state.weaponStats.weapons.length} weapons`;
        return;
      }

      if (state.weaponStats.loadState === 'fallback') {
        elements.weaponStatsSource.textContent = 'Using local fallback weapon data';
        elements.weaponStatsStatus.textContent = `${state.weaponStats.weapons.length} weapons`;
        return;
      }

      elements.weaponStatsSource.textContent = 'Live weapon data is disabled until source permission is confirmed';
      elements.weaponStatsStatus.textContent = '';
    }

    function renderWeaponStatsEmpty(message) {
      elements.weaponStatsContent.hidden = true;
      elements.weaponStatsEmpty.hidden = false;
      elements.weaponStatsEmpty.textContent = message;
    }

    function renderWeaponStatsLegend() {
      const anyPinned = state.weaponStats.pinnedNames.size > 0;
      elements.weaponStatsLegend.innerHTML = state.weaponStats.plottedWeapons.map((weapon) => {
        const isPinned = state.weaponStats.pinnedNames.has(weapon.name);
        const isHovered = state.weaponStats.hoverName === weapon.name;
        return `
          <button class="stats-legend-item ${isPinned ? 'is-pinned' : ''} ${isHovered ? 'is-hovered' : ''}" type="button" data-weapon-pin="${escapeHtml(weapon.name)}" style="${anyPinned && !isPinned ? 'opacity: 0.42;' : ''}">
            <span class="stats-dot" style="background:${weapon.color};"></span>
            <span class="stats-legend-name">${escapeHtml(weapon.name)}</span>
            <span class="stats-legend-class">${escapeHtml(weapon.className.slice(0, 3))}</span>
          </button>
        `;
      }).join('');
    }

    function renderWeaponStatsPlot() {
      const plot = elements.weaponStatsPlot;
      const width = Math.max(320, Math.round(plot.clientWidth || 760));
      const height = Math.max(250, Math.round(plot.clientHeight || 330));
      const maxY = state.weaponStats.maxY;
      const anyPinned = state.weaponStats.pinnedNames.size > 0;
      const ranges = getWeaponChartRanges();
      const gridLines = [];

      for (let index = 0; index <= 4; index++) {
        const x = (width * index) / 4;
        const y = (height * index) / 4;
        gridLines.push(`<line class="stats-grid-line" x1="${x}" x2="${x}" y1="0" y2="${height}"></line>`);
        gridLines.push(`<line class="stats-grid-line" x1="0" x2="${width}" y1="${y}" y2="${y}"></line>`);
      }

      const lines = state.weaponStats.plottedWeapons.map((weapon) => {
        const points = ranges.map((rangeMeters) => {
          const value = getWeaponMetricValue(weapon, rangeMeters);
          const clampedValue = Number.isFinite(value) ? Math.min(value, maxY) : maxY;
          const x = (rangeMeters / WEAPON_MAX_RANGE) * width;
          const y = height - ((clampedValue / maxY) * height);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
        const isPinned = state.weaponStats.pinnedNames.has(weapon.name);
        const isHovered = state.weaponStats.hoverName === weapon.name;
        const classes = [
          'stats-line',
          anyPinned && !isPinned ? 'is-dimmed' : '',
          isPinned ? 'is-pinned' : '',
          isHovered ? 'is-hovered' : ''
        ].filter(Boolean).join(' ');
        return `<polyline class="${classes}" data-stats-name="${escapeHtml(weapon.name)}" points="${points}" stroke="${weapon.color}"></polyline>`;
      }).join('');

      const cursorX = state.weaponStats.hoverName
        ? (state.weaponStats.hoverRange / WEAPON_MAX_RANGE) * width
        : -10;

      plot.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
          ${gridLines.join('')}
          ${lines}
          <line class="stats-cursor" data-stats-cursor x1="${cursorX}" x2="${cursorX}" y1="0" y2="${height}"></line>
        </svg>
      `;

      elements.weaponStatsYLabels.innerHTML = Array.from({ length: 5 }, (_, index) => {
        const value = maxY - ((maxY * index) / 4);
        return `<span>${state.weaponStats.metric === 'TTK' ? `${value.toFixed(1)}s` : Math.round(value)}</span>`;
      }).join('');

      const targetHp = WEAPON_HEALTH_VALUES[state.weaponStats.targetClass];
      elements.weaponStatsChartTitle.textContent = state.weaponStats.metric === 'TTK'
        ? `TTK vs range / ${state.weaponStats.hitMode} / ${state.weaponStats.targetClass} ${targetHp} HP`
        : `DPS vs range / ${state.weaponStats.hitMode}`;
    }

    function getWeaponByName(name) {
      return state.weaponStats.weapons.find((weapon) => weapon.name === name) || null;
    }

    function renderWeaponStatsInfo() {
      const weapon = getWeaponByName(state.weaponStats.hoverName);
      if (!weapon) {
        const pinnedCount = state.weaponStats.pinnedNames.size;
        elements.weaponStatsInfo.innerHTML = `
          <div class="stats-info-title">Live Stats</div>
          <div class="stats-info-row"><span>Pinned</span><span>${pinnedCount}</span></div>
          <div class="stats-info-row"><span>Metric</span><span>${escapeHtml(state.weaponStats.metric)}</span></div>
          <div class="stats-info-row"><span>Hit Mode</span><span>${escapeHtml(state.weaponStats.hitMode)}</span></div>
        `;
        return;
      }

      const range = state.weaponStats.hoverRange;
      const metricValue = getWeaponMetricValue(weapon, range);
      const damage = getWeaponDamage(weapon, range);
      const shots = getShotsToKill(weapon, range);

      elements.weaponStatsInfo.innerHTML = `
        <div class="stats-info-title">${escapeHtml(weapon.name)}</div>
        <div class="stats-info-row"><span>Class</span><span>${escapeHtml(weapon.className)}</span></div>
        <div class="stats-info-row"><span>Range</span><span>${range.toFixed(1)}m</span></div>
        <div class="stats-info-row"><span>${escapeHtml(state.weaponStats.metric)}</span><span>${formatWeaponMetricValue(metricValue)}</span></div>
        <div class="stats-info-row"><span>Damage</span><span>${damage.toFixed(1)}</span></div>
        <div class="stats-info-row"><span>Shots</span><span>${Number.isFinite(shots) ? shots : 'N/A'}</span></div>
        <div class="stats-info-row"><span>RPM</span><span>${weapon.rpm || 'N/A'}</span></div>
        <div class="stats-info-row"><span>Dropoff</span><span>${weapon.minDropoff}m - ${weapon.maxDropoff}m</span></div>
        <div class="stats-info-row"><span>Magazine</span><span>${Number.isFinite(weapon.magazineSize) ? weapon.magazineSize : 'N/A'}</span></div>
      `;
    }

    function renderWeaponStatsPinned() {
      const pinnedWeapons = Array.from(state.weaponStats.pinnedNames)
        .map(getWeaponByName)
